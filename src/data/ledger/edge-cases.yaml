items:
  - id: E-LED-01
    group: Categories
    title: Parent already holds bookings
    when: old bookings on a parent, or from another client
    then: |
      - edit page: *12 bookings sit on Food itself* + fix + Undo
      - no auto-migration · clients enforce the rule
    status: known-issue
    risk: medium
  - id: E-LED-02
    group: Categories
    title: Move changes fixed/variable?
    when: sub inheriting *Fixed* moves under *Variable*
    then: inherited value written first → stays *Fixed* · unset → inherits new parent
    risk: medium
    tests:
      - file: test/features/category/domain/service/category_move_rules_test.dart
        name: an inherited value is written onto the row when the new parent differs
  - id: E-LED-03
    group: Categories
    title: Income category named like a bucket
    when: income category "Transport"
    then: not used for scans · lines never land on income (fixed 2026-10-16)
    status: fixed
    risk: medium
  - id: E-LED-04
    group: Categories
    title: Web handover interrupted
    when: web handover or delete-with-bookings stops
    then: several requests by design · steps idempotent · fix-it notice shows
    status: by-design
    risk: medium
  - id: E-LED-05
    group: Categories
    title: Web palette drift
    when: color picked on the web
    then: the app's 15×5 palette · app colors open selected · a new book's starter colours and the budget default are the app's too · before 2026-11-12 the retired 8×5 Material palette, app colors opened as custom
    status: fixed
    risk: low
  - id: E-LED-06
    group: Categories
    title: Web delete keeps goal/loan links
    when: linked booking deleted on the web
    then: link not cleared like the app does · open
    status: known-issue
    risk: medium
  - id: E-LED-10
    group: Accounts
    title: "Web: balance without date"
    when: old account has balance, no date
    then: web form can't save until a date is added
    status: known-issue
    risk: low
  - id: E-LED-11
    group: Accounts
    title: Balances before they load
    when: list opens before balances computed
    then: no amount, not zeros
    risk: low
    tests:
      - file: test/features/account/ui/pages/account_list_page_test.dart
        name: no amount shows before the balances have loaded
  - id: E-LED-12
    group: Accounts
    title: Delete an account with bookings
    when: Accounts → *Cash* (≈60 bookings) → ⋮ → *Delete*
    then: |
      - *Still in use* → *Hide instead* / *Cancel* before any confirm
      - a booking landing between the check and the delete → the same dialog
      - before 2026-11-03 *Delete this account?* → OK → *Cannot delete account … delete those bookings first* (iOS round, IOS-6-5)
    status: fixed
    risk: medium
    related: [R-LED-42, D-LED-5]
    tests:
      - file: test/features/account/ui/pages/account_save_page_test.dart
        name: an account with bookings offers hiding before any delete confirm
      - file: test/features/account/ui/pages/account_save_page_test.dart
        name: a booking that lands between the count and the delete shows the in-use dialog
  - id: E-LED-13
    group: Accounts
    title: Starting balance without a date
    when: new account → type a starting balance
    then: |
      - date set to today · *Save* off while one of the two is missing
      - before 2026-11-03 *No date · This field is required* in red with *Save* still on (iOS round, IOS-6-6)
    status: fixed
    risk: low
    related: [R-LED-40]
    tests:
      - file: test/features/account/domain/account_draft_test.dart
        name: clearing the balance clears its date, so the form stays valid
  - id: E-LED-14
    group: Accounts
    title: Account type sheet cut off
    when: account form → *Type*
    then: |
      - the sheet grows to its content (up to 80 % of the screen) · *Loan* and its hint visible without scrolling · same for every pick-one sheet
      - before 2026-11-03 Loan's *Counts against net worth* sat below the fold (iOS round, IOS-6-7)
    status: fixed
    risk: low
    tests:
      - file: test/shared/ui/common/select_bottom_sheet_test.dart
        name: sizes to its content, so a list taller than half the screen needs no scroll
  - id: E-LED-15
    group: Categories
    title: List totals without a period
    when: "*Categories* list · *Food & Drink −$3,264*"
    then: caption *All time* above the list · whole units stay · edit page keeps cents · IOS-16-1
    status: fixed
    risk: low
    tests:
      - file: test/features/category/ui/pages/category_list_page_test.dart
        name: the expense tab lists expense parents
  - id: E-LED-16
    group: Categories
    title: A starter sub-category named like the book
    when: setup › preview · *Personal & Shopping › Book* · in an app whose noun is *book*
    then: renamed *Books & Media* · *Bücher & Medien* · *本・メディア* · not *Books*, which Education already uses (names are unique per type) · AND-1-6
    status: fixed
    risk: low
    tests:
      - file: test/features/onboarding/domain/service/category_generation_service_test.dart
        name: no two starter categories of one type share a name, in any locale
  - id: E-LED-17
    group: Accounts
    title: Credit card balance typed in setup
    when: "*Personalize* › credit card › *Amount owed* 300"
    then: |
      - fixed 2026-11-11 · stored as **−300** · total goes down
      - was: +300 · the debt raised the total
      - books set up before keep the wrong sign → fix on the account page
    status: fixed
    risk: high
    tests:
      - file: test/features/onboarding/use_cases/onboarding_personalize_use_case_test.dart
        name: the amount owed on a credit card is stored as a negative balance
  - id: E-LED-18
    group: Accounts
    title: Future-dated booking, app open over midnight
    when: booking dated tomorrow · app stays open or in the background past midnight
    then: |
      - fixed 2026-11-11 · balances reload on the new day
      - was: yesterday's total until a tab switch
    status: fixed
    risk: medium
    tests:
      - file: test/app/lifecycle/day_change_announcer_test.dart
        name: a resume after midnight announces a booking change once, so balances reload
  - id: E-LED-19
    group: Categories
    title: Flat categories, seven scanner hints
    when: flat category set · Categories opened · every scanner bucket missing
    then: |
      - fixed 2026-11-11 · **one** hint at a time
      - dismiss or *Create* → the next bucket's hint
      - was: seven cards above the list
    status: fixed
    risk: low
    tests:
      - file: test/features/category/ui/widget/scanner_coverage_hints_test.dart
        name: a book that misses every bucket shows one hint, not a stack
  - id: E-LED-20
    group: Accounts
    title: Credit card in *Set starting balances*
    when: Home's starting-balances dialog (now the checklist item) · Card 500, meaning 500 owed
    then: |
      - fixed 2026-11-11 · the card row says *Card · amount owed* and stores −500 · total goes down by 500
      - the dialog types on the app keypad, one row per account, like setup
      - was: stored +500, total up by 500 · setup's own accounts page already did it right (F-20)
    status: fixed
    risk: high
    tests:
      - file: test/features/home/bloc/setup_balance_cubit_test.dart
        name: stores 500 owed as a balance of -500
      - file: test/features/home/ui/widgets/onboarding_cards_test.dart
        name: a credit card row asks what is owed and shows a stored debt unsigned

  - id: E-LED-21
    group: On the web
    title: Accounts or categories fail to load
    when: "`/accounts`, `/categories` or a category's page opens while the read fails"
    then: "*Couldn't load* with *Try again* · before 2026-11-12 *No accounts found*, an empty category list, or *category not found*"
    status: fixed
    risk: medium
    tests:
      - file: src/app/(main)/accounts/page.test.tsx
        repo: web
        name: says the load failed and offers a retry, never "No accounts found."
  - id: E-LED-22
    group: Categories
    title: "Same subcategory name under another parent"
    when: "subcategory named like one under another parent, same type"
    then: "refused as a duplicate, as the server does · fixed 2026-11-12 · before, saved on the phone and never synced (bug hunt 8)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/category/ui/pages/category_sub_save_page_test.dart
        name: "a name another parent's subcategory already has is refused"
  - id: E-LED-23
    group: Accounts
    title: "Error repeated on every edit"
    when: "account form · delete refused (account still used) or save failed · then any field edited"
    then: "the error shows once; editing is an ordinary edit, Save and the discard prompt follow the changes · fixed 2026-11-16 · before, the error came back on each keystroke and the form always read as changed (bug hunt 56)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/account/bloc/account_save_bloc_test.dart
        name: "an edit after a failed delete is an ordinary edit again, compared with the opened draft"
  - id: E-LED-24
    group: Categories
    title: "Error repeated on every edit"
    when: "category form · delete refused (category has bookings) or save failed · then any field edited"
    then: "the error shows once; editing is an ordinary edit, Save and the discard prompt follow the changes · fixed 2026-11-16 · before, the error came back on each keystroke (bug hunt 58) · the booking form has the same bug until the multi-currency merge (bug hunt 57)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/category/bloc/category_save_bloc_test.dart
        name: "an edit after a failed delete is an ordinary edit again, compared with the opened draft"
  - id: E-LED-25
    group: Accounts
    title: "Duplicate account name with a stored space"
    when: "an account saved as `Cash ` (trailing space) · a new account named `cash`"
    then: "refused as a duplicate · fixed 2026-11-17 · before, the two accounts read the same (bug hunt 66)"
    status: fixed
    risk: low
    tests:
      - file: test/features/account/ui/pages/account_save_page_test.dart
        name: "a name another account was stored with, padded with a space, is refused too"
  - id: E-LED-26
    group: Categories
    title: "Subcategory of the only parent could not be deleted"
    when: "a book with one parent category · deleting one of its subcategories"
    then: "deleted, the parent stays · only the very last category is kept · fixed 2026-11-17 · before, *cannot delete the last category* (bug hunt 67)"
    status: fixed
    risk: low
    tests:
      - file: test/features/category/domain/service/category_delete_rule_test.dart
        name: "a subcategory of the only parent can be deleted: the parent stays"
  - id: E-LED-27
    group: Categories
    title: "Recents row cut at the sheet gutter"
    when: "category picker › *Recents* (or *Favorites*) longer than the sheet"
    then: "the chip row is clipped at the sheet's inner padding (*Pet Foc*), not at the screen edge · open · the list's viewport clips it; a fix moves the sheet padding into the lists (device test B-U3)"
    status: known-issue
    risk: low
