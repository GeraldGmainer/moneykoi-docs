items:
  - id: E-LED-01
    group: Categories
    title: Parent already holds bookings
    when: old bookings on a parent, or from another client
    then: |
      - edit page: *12 bookings sit on Food itself* + fix + Undo
      - no auto-migration · clients enforce the rule
    status: known-issue
    risk: medium
  - id: E-LED-02
    group: Categories
    title: Move changes fixed/variable?
    when: sub inheriting *Fixed* moves under *Variable*
    then: inherited value written first → stays *Fixed* · unset → inherits new parent
    risk: medium
    tests:
      - file: test/features/category/domain/service/category_move_rules_test.dart
        name: an inherited value is written onto the row when the new parent differs
  - id: E-LED-03
    group: Categories
    title: Income category named like a bucket
    when: income category "Transport"
    then: not used for scans · lines never land on income (fixed 2026-10-16)
    status: fixed
    risk: medium
  - id: E-LED-04
    group: Categories
    title: Web handover interrupted
    when: web handover or delete-with-bookings stops
    then: several requests by design · steps idempotent · fix-it notice shows
    status: by-design
    risk: medium
  - id: E-LED-05
    group: Categories
    title: Web palette drift
    when: color picked on the web
    then: old 8×5 palette · app colors open as custom
    status: known-issue
    risk: low
  - id: E-LED-06
    group: Categories
    title: Web delete keeps goal/loan links
    when: linked booking deleted on the web
    then: link not cleared like the app does · open
    status: known-issue
    risk: medium
  - id: E-LED-10
    group: Accounts
    title: "Web: balance without date"
    when: old account has balance, no date
    then: web form can't save until a date is added
    status: known-issue
    risk: low
  - id: E-LED-11
    group: Accounts
    title: Balances before they load
    when: list opens before balances computed
    then: no amount, not zeros
    risk: low
    tests:
      - file: test/features/account/ui/pages/account_list_page_test.dart
        name: no amount shows before the balances have loaded
