# Source: app CATEGORY_AI_CONTEXT.md, 02_FEATURES §0; web CATEGORIES_WEB, ACCOUNTS_WEB.
items:
  # Categories
  - id: R-LED-01
    group: Categories
    title: Two levels · only leaves booked
    text: |
      - parent with subs = container · nothing books onto it
      - bookings, rules, planned payments → a sub
      - a budget may cap a parent · only leaves can be favorites
    source: CATEGORY §1, §6a
    tests:
      - file: test/features/category/domain/category_entity_test.dart
        name: parent with subcategories cannot be favorited
  - id: R-LED-02
    group: Categories
    title: First sub takes over
    text: |
      - first sub → asks to move bookings, rules, planned payments, favorite, quick tiles, widgets
      - *Cancel* aborts · Undo puts all back
      - budgets stay on the parent
    source: CATEGORY §6a
    tests:
      - file: test/features/category/domain/service/category_handover_service_test.dart
        name: hand-over moves bookings, rules, planned payments and the favorite
      - file: test/features/category/ui/pages/category_sub_save_page_test.dart
        name: confirming saves the sub, then hands the parent entries over to it
  - id: R-LED-03
    group: Categories
    title: "Delete: three guards"
    text: |
      - has subs → move or delete them first
      - still used → *Hide instead* or *Delete with bookings…* (count, total, no undo)
      - last category → never
      - rules, planned payments, budgets go along, listed
    source: CATEGORY §6
    tests:
      - file: test/features/category/domain/service/category_delete_rule_test.dart
        name: throws categoryHasChildren when category has subcategories
      - file: test/features/category/domain/service/category_delete_rule_test.dart
        name: throws cannotDeleteLastCategory when only one category exists
  - id: R-LED-04
    group: Categories
    title: Deleted with a category = gone
    text: not trashed · couldn't restore without the category
    source: CATEGORY §6 (D14)
    related: [E-BKG-10]
  - id: R-LED-05
    group: Categories
    title: "*Move to…* keeps the side"
    text: |
      - only categories without subs
      - targets: top-level, same type, visible · sub may go top-level
      - handover runs first · Undo
    source: CATEGORY §6b
    tests:
      - file: test/features/category/domain/service/category_move_rules_test.dart
        name: hidden categories and the other type are never offered
  - id: R-LED-06
    group: Categories
    title: Unique per type · 20 chars
    text: same name ok under income + expense
    source: CATEGORY, category_parent_save_page tests
    tests:
      - file: test/features/category/ui/pages/category_parent_save_page_test.dart
        name: the same name is fine under the other type
  - id: R-LED-07
    group: Categories
    title: Hide = new entries only
    text: gone from pickers · keeps bookings · still counts everywhere
    source: CATEGORY §7, ACCOUNTS_WEB §4.6
  - id: R-LED-08
    group: Categories
    title: The picker
    text: |
      - income/expense toggle · favorites + 10 recent as chips
      - grouped or flat · relevance or A–Z, remembered
      - search: flat + ranked
    source: CATEGORY §7
    tests:
      - file: test/features/booking/bloc/category_picker_cubit_test.dart
        name: an expense-only picker offers no income favorite or recent

  # Fixed or variable
  - id: R-LED-10
    group: Fixed or variable
    title: Fixed/variable = the category's
    text: |
      - *Fixed costs* / *Variable costs* · income: *Fixed* / *Variable income*
      - not set = default · sub inherits unless it overrides
      - unset booking: rule-made → fixed, else variable
      - Analytics, Budget Book, Home read the same rule
    source: CATEGORY §3a
    tests:
      - file: test/features/category/domain/category_entity_test.dart
        name: an unclassified sub inherits its parent
  - id: R-LED-11
    group: Fixed or variable
    title: Starter sets come classified
    text: |
      - fixed: Housing, Savings, Education · salary, child benefit
      - variable: Food, Shopping, Leisure, Transport, Health, Pets
      - renamed or new → unset
    source: CATEGORY §3a

  # Scanner hints
  - id: R-LED-20
    group: Scanner-coverage hints
    title: Warns before a scan would fail
    text: |
      - hint per receipt bucket with no expense category
      - *Create "…"* pre-filled · dismiss = 7 days per book
      - owners + admins only
    source: CATEGORY §8a
    tests:
      - file: test/features/category/domain/service/scanner_category_coverage_service_test.dart
        name: matches as loosely as scan time does, so a near miss is not flagged
      - file: test/features/category/domain/service/scanner_coverage_snooze_test.dart
        name: snoozing hides a bucket for the snooze duration and no longer
    related: [R-SCN-03]

  # Money signs
  - id: R-LED-30
    group: Money signs & colour
    title: Sign by what the figure is
    text: |
      - **movement** (one booking, payment) → + / −
      - **labelled total** (*Income*, *Spent*) → none
      - **net or change** → signed · zero bare
      - **level** (balance, net worth, target) → none
    source: CLAUDE.md, CATEGORY "Which amounts take a sign"
  - id: R-LED-31
    group: Money signs & colour
    title: Expenses never tinted
    text: |
      - tint the exception: income green, adverse red
      - expense color → chips, icons, bars · never money text
      - sign + color never contradict
    source: CLAUDE.md
    tests:
      - file: test/features/category/ui/widget/category_widgets_test.dart
        name: an expense category shows what was spent in full decimals and untinted

  # Accounts
  - id: R-LED-40
    group: Accounts
    title: Account types · assets vs debts
    text: |
      - name (20) · type · icon · color · hide
      - starting balance **with its date**, both or neither
      - credit cards + loans = liabilities
    source: 02_FEATURES, ACCOUNTS_WEB §1
    tests:
      - file: test/features/account/account_balance_anchor_test.dart
        name: a balance without a date flags the date row
  - id: R-LED-41
    group: Accounts
    title: Balances never summed on screen
    text: |
      - server: triggers · phone: starting balance + synced bookings
      - same number · a level, no sign
    source: CLAUDE.md, ACCOUNTS_WEB §7
    tests:
      - file: test/features/account/use_cases/get_balances_by_account_use_case_test.dart
        name: adds each account opening balance to its booking net
      - file: test/features/account/ui/pages/account_list_page_test.dart
        name: each account shows its current balance as a plain level
  - id: R-LED-42
    group: Accounts
    title: Delete only unused accounts
    text: |
      - in use (either side of a transfer) → refused
      - last account → refused · *Hide* instead
    source: AccountDeleteRule, ACCOUNTS_WEB §4.5
    tests:
      - file: test/features/account/domain/account_delete_rule_test.dart
        name: throws TranslatedWarning(accountStillUsed) when account is referenced by a booking
      - file: test/features/account/domain/account_delete_rule_test.dart
        name: throws TranslatedWarning(cannotDeleteLastAccount) when only one account exists
  - id: R-LED-43
    group: Accounts
    title: Account names unique per book
    source: account_save_page tests
    text: pickers are keyed on names
    tests:
      - file: test/features/account/ui/pages/account_save_page_test.dart
        name: a name another account already has is refused
  - id: R-LED-44
    group: Accounts
    title: "Structure: owner + admin"
    text: "members: read-only + hint"
    source: FAMILY_ACCOUNTS §2
    related: [R-BOOK-10]
