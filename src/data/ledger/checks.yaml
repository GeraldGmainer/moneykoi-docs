# Derived from the context docs, not from an earlier checklist.
groups:
  - id: categories
    title: Categories
    items:
      - id: C-LED-001
        text: First sub on a used category → dialog · *Cancel* saves nothing · *Move* → all follow, widget too · Undo reverts
      - id: C-LED-002
        text: Delete used category → *Hide instead* + Undo · *Delete with bookings* names count + total · no trash
      - id: C-LED-003
        text: "*Move to…* → same type, visible, top-level + *None* · Undo"
      - id: C-LED-004
        text: No Snacks category → hint · *Create* pre-filled · dismiss → gone 7 days
      - id: C-LED-005
        text: Fixed on a parent → sub *Same as parent* · Analytics + Budget Book filter agree
      - id: C-LED-012
        text: Old booking on a parent that has subs → quick booking never picks that parent · hide all its subs → parent gone from the pickers
  - id: accounts
    title: Accounts
    items:
      - id: C-LED-010
        text: New account + balance + date → shown as a level · balance without date refused
      - id: C-LED-011
        text: Delete account used by a transfer → refused · last → refused · Hide → only pickers
  - id: release-2-1-findings
    title: 2.1 · device round 2026-11-11
    items:
      - id: C-LED-013
        text: "Booking dated tomorrow → leave the app on Home overnight → open → total and account include it · home-screen widget too"
      - id: C-LED-014
        text: "*Personalize* → credit card, owed 300 → Home total drops by 300 · card shows −300"
      - id: C-LED-015
        text: "Web › Accounts → *Cash & bank*, *Savings & investments*, *Credit & loans*, a subtotal each · credit subtotal = what is owed · a hidden account last in its group · an empty group not shown"
