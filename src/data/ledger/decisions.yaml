items:
  - id: D-LED-1
    question: Enforce "never book a parent" on the server?
    status: decided
    answer: No · clients only (D10) · fix-it notice repairs others
  - id: D-LED-4
    question: A parent whose subs are all hidden — bookable?
    status: decided
    date: 2026-10-27
    answer: No · still has subs · pickers drop it, except budgets and while editing a booking already on it
    related: [R-LED-01, R-LED-07]
  - id: D-LED-2
    question: Category balances from the server column?
    status: decided
    answer: No · computed from bookings · column not mapped
  - id: D-LED-3
    question: Delete with bookings → trash them?
    status: decided
    answer: No · gone for good (D14)
  - id: D-LED-5
    question: Delete an account that bookings still use?
    status: decided
    date: 2026-11-03
    answer: Checked before any confirm · offer *Hide instead* · no *delete with bookings* for accounts (not decided) · unused → destructive confirm
    related: [R-LED-42, E-LED-12]
  - id: D-LED-6
    question: Accounts and Home balance — count future-dated bookings?
    status: decided
    date: 2026-11-06
    answer: |
      - **no · today's balance** · future-dated rows stay in Forecast · same date rule as the balance check · build: 2.0.1
      - before: after counting 8,500 € Accounts showed 8,463 € · source: Android emulator round, AND-17-1
