items:
  - id: J-LED-01
    group: Categories
    title: Adds a first subcategory
    from: a category with bookings
    steps:
      - "*Add subcategory*"
      - move bookings, rules, planned?
      - "*Move* · or *Cancel*, nothing saved"
    result: parent = container · numbers unchanged
    tests:
      - file: test/features/category/ui/pages/category_sub_save_page_test.dart
        name: cancelling the required dialog writes nothing and stays on the page
    checks: [C-LED-001]
  - id: J-LED-02
    group: Categories
    title: Deletes a category in use
    from: edit page ⋮ → *Delete*
    steps:
      - "*Hide instead* + Undo · or *Delete with bookings…*"
      - "2nd dialog: count, total, balances change"
    result: hidden · or gone with bookings, rules, budgets
    checks: [C-LED-002]
  - id: J-LED-03
    group: Categories
    title: Moves a category
    from: edit page ⋮ → *Move to…*
    steps:
      - top-level, same type · or *None*
    result: moved at once · Undo
    checks: [C-LED-003]
  - id: J-LED-04
    group: Categories
    title: Fixes a scanner gap
    from: Categories → Expense tab
    steps:
      - hint *No category for Snacks*
      - '*Create "Snacks"* · or dismiss 7 days'
    result: next scan files snacks there
    checks: [C-LED-004]
  - id: J-LED-10
    group: Accounts
    title: Adds an account with a starting balance
    from: Accounts → +
    steps:
      - name, type, icon, color
      - starting balance + date
      - "*Save* · Undo"
    result: account + current balance
    tests:
      - file: test/features/account/ui/pages/account_save_page_test.dart
        name: naming it and saving creates it, closes the page and offers undo
    checks: [C-LED-010]
  - id: J-LED-11
    group: Accounts
    title: Retires an account that has bookings
    from: Accounts → account → ⋮ → *Delete*
    steps:
      - "*Still in use · Cash holds 60 bookings*"
      - "*Hide instead*"
    result: "*Account hidden · Undo* · gone from the pickers, history kept · an unused account gets a red *Delete* confirm instead"
    tests:
      - file: test/features/account/ui/pages/account_save_page_test.dart
        name: an account with bookings offers hiding before any delete confirm
      - file: test/features/account/ui/pages/account_save_page_test.dart
        name: cancelling the in-use dialog keeps the account as it is
    risk: low
