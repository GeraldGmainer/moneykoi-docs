# Source: BOOK_AI_CONTEXT.md, FAMILY_ACCOUNTS_AI_CONTEXT.md, OFFLINE_TIER_AI_CONTEXT.md §9–§10,
# MONETIZATION §9b, BOOKS_WEB_AI_CONTEXT.md §5.
items:
  # Books
  - id: J-BOOK-01
    group: Your books
    title: Creates another book
    from: Cloud account
    steps:
      - Book page → *New book*
      - name + currency
      - private or shared
      - starter set or empty
    result: new book opens + confirmation
    tests:
      - file: test/features/book/ui/pages/create_book_page_test.dart
        name: a created book lands home with a confirmation
      - file: test/features/book/use_cases/book_use_cases_test.dart
        name: creating a book seeds it before switching into it
    checks: [C-BOOK-010]
  - id: J-BOOK-02
    group: Your books
    title: Switches books
    from: two or more books
    steps:
      - Home avatar → switcher · or drawer chip
      - double-tap avatar → previous book
    result: other book re-pulled · nothing wiped
    tests:
      - file: test/features/book/domain/service/previous_book_selector_test.dart
        name: with exactly two books it is always the other one, whatever was remembered
      - file: test/features/book/bloc/book_flow_blocs_test.dart
        name: switching to another book records where it went
    checks: [C-BOOK-010, C-BOOK-019]
  - id: J-BOOK-03
    group: Your books
    title: Changes the book currency
    from: owner
    steps:
      - Settings → currency
      - "confirm · shared: everyone sees it"
    result: relabelled, not converted · partners rebuild on sync
    tests:
      - file: test/features/book/data/data_sources/book_remote_source_test.dart
        name: updateBookCurrency patches the currency and reads the row back
    checks: [C-BOOK-015]
  - id: J-BOOK-04
    group: Your books
    title: Deletes a book
    from: owner with another owned book
    steps:
      - Book page → card menu → *Delete*
    result: lands in the server's pick · or stays
    tests:
      - file: test/features/book/data/data_sources/book_remote_source_test.dart
        name: deleteBook returns the server fallback, which may be null

  # Sharing
  - id: J-BOOK-10
    group: Sharing
    title: Shares a book and invites
    from: owner or admin
    steps:
      - share pitch, or invite straight away
      - email + role
      - email sent · or copy link
    result: pending invite · 7 days
    tests:
      - file: test/features/book/data/data_sources/book_remote_source_test.dart
        name: createInvite sends the tenant, email and role and returns the token
    checks: [C-BOOK-011]
  - id: J-BOOK-11
    group: Sharing
    title: Accepts an invite, has the app
    from: invite email
    steps:
      - link → web `/invite`
      - sign in → *Join*
      - "*Open in the Money Koi app*"
    result: book list · joined book not auto-picked
    checks: [C-BOOK-012]
  - id: J-BOOK-12
    group: Sharing
    title: Invited partner, no app yet
    from: invite link
    steps:
      - install
      - sign in · free account required
      - "no setup steps · *Setting things up… the invitation opens next*"
      - "*Join* → the shared book opens"
    result: shared book · every feature · the private book behind it is never mentioned
    note: the private book gets the Quick Start set, unseen · the Home checklist ticks from the shared book
    checks: [C-BOOK-033]
  - id: J-BOOK-13
    group: Sharing
    title: Invited partner with a local book
    from: Local Free or Pro + invite
    steps:
      - "*Join {book}* · names book + inviter"
      - sign in
      - shared book syncs
    result: shared = Cloud · own book stays local
    status: waiting
    note: |
      - open on every phone since 2026-10-21 (T-MON-20) · developer mode only 2026-10-16 → 2026-10-21
      - how an https invite reaches the app: open (Q-BOOK-1)
      - with a Cloud account the own book uploads too
    tests:
      - file: test/features/book/ui/widgets/book_deep_link_listener_test.dart
        name: opens the Join page with the invite
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: a join into an account without Cloud moves the book under it without a push, and opens the invite
      - file: test/features/cloud_tier/join_book_page_test.dart
        name: names the book and who invited, and says joining is free
    checks: [C-BOOK-001, C-BOOK-005]
    related: [Q-BOOK-1]
  - id: J-BOOK-14
    group: Sharing
    title: Invite opened while signed out
    from: invite, account signed out
    steps:
      - "*Sign in to join*"
      - sign in
    result: invite opens once
    tests:
      - file: test/features/book/ui/pages/accept_invite_page_test.dart
        name: offers sign-in instead of a join that would fail, and keeps the invite for after it
      - file: test/features/book/ui/service/invite_after_sign_in_test.dart
        name: a kept invite opens once the user is in, then is forgotten
  - id: J-BOOK-15
    group: Sharing
    title: Pastes an invite link in the app
    from: account, Book page
    steps:
      - "*Join* → paste the link"
    result: accept page
    tests:
      - file: test/features/book/service/book_link_builder_test.dart
        name: extracts the token from a valid HTTPS invite URI

  # Members
  - id: J-BOOK-20
    group: Members
    title: Changes a role or removes a member
    from: "owner: roles · owner/admin: remove"
    steps:
      - Book page → member → role / remove
    result: applied at once · removed phone drops the book
    tests:
      - file: test/features/book/bloc/book_management_bloc_test.dart
        name: a role change is applied optimistically, re-sorted, and flagged once
      - file: test/features/book/bloc/book_management_bloc_test.dart
        name: a removed member disappears at once, before the refresh lands
    checks: [C-BOOK-014, C-BOOK-016]
  - id: J-BOOK-21
    group: Members
    title: Leaves a book
    from: member or admin
    steps:
      - card menu → *Leave*
    result: server's fallback book · left book leaves the phone
    tests:
      - file: test/features/book/use_cases/book_use_cases_test.dart
        name: leaving lands in the server fallback book
    checks: [C-BOOK-017]
  - id: J-BOOK-22
    group: Members
    title: Stops sharing
    from: owner of a shared book
    steps:
      - card menu → *Stop sharing*
    result: others removed · private again
    tests:
      - file: test/features/book/use_cases/book_use_cases_test.dart
        name: dissolving stays in the (now private) book
    checks: [C-BOOK-017]
    related: [E-BOOK-13]

  # When a book stops syncing
  - id: J-BOOK-30
    group: When a book stops syncing
    title: Owner's plan ends · member view
    from: member of a Cloud book
    steps:
      - owner's Cloud ends
      - "*{book} no longer syncs*"
      - grey cloud-slash + → *Export*
    result: readable · reopens on renewal
    tests:
      - file: test/features/cloud_tier/book_level_cloud_test.dart
        name: the shared book syncs while its owner pays; the own book stays local
    checks: [C-BOOK-003, C-BOOK-006]
    related: [J-MON-52]
  - id: J-BOOK-31
    group: When a book stops syncing
    title: The owner deletes the book
    from: member
    steps:
      - "*{book} was deleted*"
      - Settings → *Books that stopped syncing*
      - "*Export* · *Remove from this phone*"
    result: read-only copy until removed
    tests:
      - file: test/features/cloud_tier/lapse_review_page_test.dart
        name: a book deleted on the server waits among the lost ones, to export or remove
      - file: test/features/cloud_tier/cloud_status_notices_test.dart
        name: a deleted book is told once, and forgotten once it is removed from the phone
    checks: [C-BOOK-004]
  - id: J-BOOK-32
    group: When a book stops syncing
    title: The owner deletes the account
    from: owner of shared books
    steps:
      - confirm names shared books + members
      - deleted for everyone
      - "members: read-only + *Export*, then *Remove*"
    result: shared books gone
    checks: [C-BOOK-004]
    related: [J-ACC-40]
