items:
  - id: T-BOOK-01
    title: How does an invite reach a local book?
    owner: gerald
    detail: |
      - local book, no account
      - try: email link · chat link · paste → which opens *Join {book}*?
      - answers Q-BOOK-1 · the Join page is open to all since 2026-10-21 (T-MON-20), so this is live
  - id: T-BOOK-02
    title: Close the invite role hole
    owner: ai
    waitsFor: [Q-BOOK-2]
    detail: Only after Q-BOOK-2 is decided
    prompt: |
      New migration in moneykoi-supabase: create_book_invite accepts only 'member' and 'admin' as p_role; accept_book_invite never changes the role of an existing owner and never grants 'owner'. Add a manual check under supabase/tests/manual/. Hand Gerald the deploy step; do not run the supabase CLI.
  - id: T-BOOK-03
    title: Web book-switch issues
    owner: ai
    detail: |
      From `BOOKS_WEB_AI_CONTEXT.md` §8, review-2026-09:
      - 2: create/leave/delete/accept don't clear the old book
      - 3: `tenant_member` fallback in accounts, shopping, recurring
      - 7: writes right after a switch → previous book
      - no prompt written yet
  - id: T-BOOK-04
    title: Deploy the offline-book flag
    owner: gerald
    detail: |
      - order: migration first, then the app · the web reads `tenant.is_offline` and, since 2026-10-28, falls back to listing every book on a server without the column, so it may ship before or after
      - `moneykoi-supabase`: commit `20261027120000_offline_books.sql` and push `develop` (dev), `main` with the app release that ships offline books (prod)
      - then `psql "$DEV_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/manual/offline_books.sql` (prod: `$PROD_DATABASE_URL`)
      - `moneykoi-web`: deploy the build that hides `is_offline` books after the migration is on that project
      - until the server has the RPC, *Keep offline* leaves a plain empty book the web lists, and *Move to cloud* uploads a kept book as a new one (E-BOOK-41)
    related: [E-BOOK-41, D-BOOK-5]

