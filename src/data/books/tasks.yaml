items:
  - id: T-BOOK-01
    title: How does an invite reach a local book?
    owner: gerald
    detail: |
      - local book, no account
      - try: email link · chat link · paste → which opens *Join {book}*?
      - answers Q-BOOK-1 · the Join page is open to all since 2026-10-21 (T-MON-20), so this is live
  - id: T-BOOK-02
    title: Close the invite role hole
    owner: ai
    waitsFor: [Q-BOOK-2]
    detail: Only after Q-BOOK-2 is decided
    prompt: |
      New migration in moneykoi-supabase: create_book_invite accepts only 'member' and 'admin' as p_role; accept_book_invite never changes the role of an existing owner and never grants 'owner'. Add a manual check under supabase/tests/manual/. Hand Gerald the deploy step; do not run the supabase CLI.
  - id: T-BOOK-03
    title: Web book-switch issues
    owner: ai
    status: done
    detail: |
      - **done 2026-11-02** · `BOOKS_WEB_AI_CONTEXT.md` §4.3, §4.4, §8 · E-BOOK-30, E-BOOK-32
      - 2: new book, leave, delete, join run the full switch · leaving or deleting a book that isn't open stays put
      - 3: already fixed 2026-10-03 for accounts, shopping, recurring · the last private resolver copy (investments) removed
      - 7: requests in flight for the old book cancelled on switch · the write check (2026-10-03) pinned end to end · `/add` picks the new book's account
    related: [E-BOOK-30, E-BOOK-32]
  - id: T-BOOK-04
    title: Deploy the offline-book flag
    owner: gerald
    detail: |
      - order: migration first, then the app · the web reads `tenant.is_offline` and, since 2026-10-28, falls back to listing every book on a server without the column, so it may ship before or after
      - `moneykoi-supabase`: commit `20261027120000_offline_books.sql` and push `develop` (dev), `main` with the app release that ships offline books (prod)
      - then `psql "$DEV_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/manual/offline_books.sql` (prod: `$PROD_DATABASE_URL`)
      - `moneykoi-web`: deploy the build that hides `is_offline` books after the migration is on that project
      - until the server has the RPC, *Keep offline* leaves a plain empty book the web lists, and *Move to cloud* uploads a kept book as a new one (E-BOOK-41)
    related: [E-BOOK-41, D-BOOK-5]
  - id: T-BOOK-05
    title: Deploy the App Link fix and recheck in Play
    owner: gerald
    detail: |
      - 1 · deploy `moneykoi-web` (only `public/.well-known/assetlinks.json` matters) · then the first command must list `95:48:05:6E…` for `com.psyren.moneykoi`
      - 2 · Play Console › Grow users › Deep links › *Filter domains* → `my.moneykoi.com` → recheck · Google re-reads within a day
      - 3 · phones verify again on the next app install or update · one phone now: the second command over adb
      - a new signing key (Play key upgrade, a new upload key) needs its fingerprint in the file: `BOOKS_WEB_AI_CONTEXT.md` §4.8
    command: |
      curl -s "https://digitalassetlinks.googleapis.com/v1/statements:list?source.web.site=https://my.moneykoi.com&relation=delegate_permission/common.handle_all_urls" | grep -c 95:48:05:6E
      adb shell pm verify-app-links --re-verify com.psyren.moneykoi && adb shell pm get-app-links com.psyren.moneykoi
    related: [E-BOOK-47]
