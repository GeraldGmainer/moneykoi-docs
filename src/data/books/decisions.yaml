# BOOKS_WEB_AI_CONTEXT.md §8. Q-BOOK-1 was found while building this site.
items:
  - id: Q-BOOK-1
    question: How does an invite reach *Join {book}* on a local book?
    status: open
    answer: |
      - Join opens when an invite link reaches the app
      - but `/invite` opens the browser · app claims only `/open/book`, `/open/family`, legacy scheme
      - paste is on the Book page, hidden for local books
      - test on a device before the claim opens (D5)
    related: [J-BOOK-13, C-BOOK-001, D5]
  - id: Q-BOOK-2
    question: Close the invite role hole on the server?
    status: decided
    date: 2026-11-12
    answer: |
      - **close fully** · invites only as member or admin
      - accepting never changes an owner · never grants owner
      - migration written (T-BOOK-02) · Gerald pushes it
    related: [E-BOOK-14]
  - id: D-BOOK-1
    question: Manage books offline?
    status: decided
    answer: No · online only · reading works offline
  - id: D-BOOK-2
    question: Ownership transfer?
    status: decided
    answer: None · owner dissolves or deletes instead
  - id: D-BOOK-3
    question: Who are shared books for?
    status: decided
    answer: Households, not businesses
  - id: D-BOOK-4
    question: Export a non-active book?
    status: decided
    answer: No · may be stale · hint *switch to this book* · never auto-switch
  - id: D-BOOK-5
    question: Offline books — where do they live, who gets them, what about a kept book's server row?
    status: decided
    answer: |
      - 2026-10-27: Cloud accounts only (Pro without an account is phase 2) · phone only, no server row, not on the web, not on another phone
      - count toward the 3 created books · promotion one-way, needs Cloud · labels *Offline book* / *Cloud book*
      - a kept book (join or restore) that stays offline keeps its empty server row — the last own book cannot be deleted, so the row is flagged (`set_book_offline`, 2026-10-27): hidden on the web, not Cloud, reused by *Move to cloud*
    related: [R-BOOK-60, R-BOOK-61, E-BOOK-41, T-BOOK-04]
  - id: D-BOOK-6
    question: Offline books — the four open points after the review
    status: decided
    answer: |
      - 2026-10-28 · *Keep offline* after a partial upload: explain with a snack, keep asking
      - a book that owes its upload: badge *Upload pending*, not *Cloud book*
      - a book kept on another phone at the limit: the limit message names it
      - phase 2 (Pro without an account, several offline books): after the Nov 8 paywall release
    related: [E-BOOK-45, E-BOOK-46, R-BOOK-60]
  - id: D-BOOK-7
    question: Make a book switch near-instant?
    status: open
    answer: |
      - today: after a switch, Home, Budget Book and Analytics show skeletons until the new book's figures load · that waits for the server call and the realtime restart (5–8 s on the simulator)
      - option A: announce the switch on the phone first, then tell the server and restart realtime → figures in well under a second · reorders a tested sequence
      - option B: keep it as it is · always correct, slow on a slow network
      - source: iOS simulator round, IOS-20-1
    related: [E-BOOK-25]
