# Source: FAMILY_ACCOUNTS_AI_CONTEXT.md §1–§2, BOOK_AI_CONTEXT.md §1, OFFLINE_TIER §7, §9,
# BOOKS_WEB_AI_CONTEXT.md §8. Q-BOOK-1 was found while building this site.
items:
  - id: Q-BOOK-1
    question: How does an invite reach *Join {book}* on a phone with a local book?
    status: open
    answer: |
      The Join page opens when an invite link arrives in the app. But `https://my.moneykoi.app/invite` deliberately opens the browser (the app claims only `/open/book`, `/open/family` and the legacy `com.psyren.moneykoi://invite` scheme), and the paste-a-link flow sits on the Book page, which a local book hides. Check on a device which way in actually works before the claim opens to everyone (D5).
    related: [J-BOOK-13, C-BOOK-001, D5]
  - id: Q-BOOK-2
    question: Close the invite role hole on the server?
    status: open
    answer: Review-2026-09 #4 lists it as open. No decision recorded.
    related: [E-BOOK-14]
  - id: D-BOOK-1
    question: Book management offline?
    status: decided
    answer: Online only — create, share, invite, roles, remove, leave, dissolve, delete need a connection. Reads work offline.
  - id: D-BOOK-2
    question: Ownership transfer?
    status: decided
    answer: None. The owner is fixed; an owner who wants out dissolves or deletes the book.
  - id: D-BOOK-3
    question: Scope of shared books
    status: decided
    answer: Households, not businesses — naming, copy and roles target families.
  - id: D-BOOK-4
    question: Export a book that is not the active one?
    status: decided
    answer: No — its rows on the phone may be stale. The item shows a "switch to this book" hint; never switch behind the user's back.
