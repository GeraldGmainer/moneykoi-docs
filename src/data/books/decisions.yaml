items:
  - id: Q-BOOK-1
    question: How does an invite reach *Join {book}* on a local book?
    status: open
    answer: |
      - Join opens when an invite link reaches the app
      - but `/invite` opens the browser · app claims only `/open/book`, `/open/family`, legacy scheme
      - paste is on the Book page, hidden for local books
      - test on a device before the claim opens (D5)
    related: [J-BOOK-13, C-BOOK-001, D5]
