# Source: BOOK_AI_CONTEXT.md, FAMILY_ACCOUNTS_AI_CONTEXT.md §5–§6, BOOKS_WEB_AI_CONTEXT.md §8,
# OFFLINE_FIRST_AI_CONTEXT.md §7, §9.
items:
  # Membership
  - id: E-BOOK-01
    group: Membership
    title: First sign-in as a member
    when: shared book opens before the membership row arrives
    then: no structure edits until the role is known · used to offer rules the server refused
    status: fixed
    risk: high
    tests:
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: an active book whose row has not synced offers no structure writes
  - id: E-BOOK-02
    group: Membership
    title: Book just created or joined
    when: new book active, its row not pulled yet
    then: not taken as revoked · no switch away
    status: fixed
    risk: medium
    tests:
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: a book just created or joined is not taken for a revoked one before its pull lands
  - id: E-BOOK-03
    group: Membership
    title: Removed member stays gone
    when: owner removes someone · screen re-reads before the server change
    then: stays gone · member actions never write the local copy
    risk: medium
    tests:
      - file: test/features/book/bloc/book_management_bloc_test.dart
        name: a removed member disappears at once, before the refresh lands
  - id: E-BOOK-04
    group: Membership
    title: Switcher hidden after late sync
    when: first sync turns the book Cloud after the drawer built
    then: switcher appears without restart (B9)
    status: fixed
    risk: low

  # Invites
  - id: E-BOOK-10
    group: Invites
    title: Invite email hangs
    when: email function never answers
    then: after 10 s → link to copy · invite exists already
    risk: medium
  - id: E-BOOK-11
    group: Invites
    title: Wrong account opens the invite
    when: web signed in with another email
    then: warns *wrong account* before joining · offers another sign-in
    risk: low
  - id: E-BOOK-12
    group: Invites
    title: Expired, revoked or used
    when: opened after 7 days, after revoke, or twice
    then: "expired/revoked: said before sign-in · already member = success"
    risk: low
    tests:
      - file: test/features/cloud_tier/join_book_page_test.dart
        name: an invite that can no longer be joined says so and offers no sign-in
  - id: E-BOOK-13
    group: Invites
    title: Invite survives *Stop sharing*
    when: owner dissolves while an invite is pending
    then: accepting later adds a member to a private book · server issue
    status: known-issue
    risk: medium
  - id: E-BOOK-14
    group: Invites
    title: Admin escalates via an invite
    when: admin invites self as `owner`, or the owner as `member`
    then: server accepts any role → admin can become owner · open (review 4)
    status: known-issue
    risk: high
    related: [Q-BOOK-2, T-BOOK-02]

  # Switching & sync
  - id: E-BOOK-20
    group: Switching & sync
    title: Switched while offline
    when: book switched without connection
    then: data arrives with the reconnect pull (EC-BOOK-5) · header keeps the right book
    status: fixed
    risk: medium
  - id: E-BOOK-21
    group: Switching & sync
    title: Members heard nothing live
    when: member's realtime for a shared book
    then: fixed by `20261016120000_realtime_member_books.sql` · live for every book
    status: fixed
    risk: high
  - id: E-BOOK-22
    group: Switching & sync
    title: Currency changed on another phone
    when: co-member changes currency, app open here
    then: next sync rebuilds every cached amount
    risk: medium
  - id: E-BOOK-23
    group: Switching & sync
    title: Exporting a previewed book
    when: Book page shows a non-active book
    then: export disabled + *switch to this book* · never switches by itself
    status: by-design
    risk: low
  - id: E-BOOK-24
    group: Switching & sync
    title: Unsent edit, then a switch
    when: edit in A not pushed yet · switch to B · A's pull answers late
    then: the edit stays, pushed once A is open again · before 2026-09-23 the late pull overwrote it and marked it sent (EC-BOOK-1)
    status: fixed
    risk: high
    tests:
      - file: test/edge_cases/book_switch_sync_edge_cases_test.dart
        name: "an unsent edit made in A before the switch survives A's late response"
    related: [E-OFF-05]
  - id: E-BOOK-25
    group: Switching & sync
    title: Old book's money under the new book's name
    when: book switch · Home already shows the new book's avatar
    then: |
      - fixed 2026-11-03 · Home, Budget Book and Analytics show skeletons until the new book's figures load · never the last book's total (IOS-20-1)
      - the skeleton lasts as long as the switch's server call and realtime restart (5–8 s on the simulator) · making it near-instant is open (D-BOOK-7)
    status: fixed
    risk: high
    tests:
      - file: test/features/home/ui/screens/home_tab_test.dart
        name: a book switch hides the old book
      - file: test/features/book/ui/widgets/book_switch_curtain_test.dart
        name: hides the figures from the switch until the new book

  # Web
  - id: E-BOOK-30
    group: Web
    title: Web write right after a switch
    when: booking saved on the web the moment the book switches · the new book's accounts not loaded yet
    then: |
      - fixed 2026-11-02 · refused (*That account belongs to another book…*), never filed in the previous book · once the new book's accounts load, `/add` picks one of them and the save goes into the new book
      - new book, leave, delete, join clear the old book's data like a switch · leaving or deleting a book that isn't open switches nothing
      - was: could land in the previous book (review 7) · the old book's data under the new book's name (review 2) · a new account, list or rule filed in another book (review 3)
    status: fixed
    risk: high
    related: [T-BOOK-03, E-BOOK-32]
    tests:
      - file: e2e/books.spec.ts
        repo: web
        name: a booking saved the moment the book switches never lands in the previous book
      - file: src/lib/books/hooks.test.tsx
        repo: web
        name: drops what a request still in flight for the previous book brings back
      - file: src/app/(main)/books/page.test.tsx
        repo: web
        name: stays in the active book when the deleted book is no longer the active one
  - id: E-BOOK-31
    group: Web
    title: Web offers a refused *Remove*
    when: admin on the web views admins or self
    then: "web offers *Remove* → server refuses · app: plain members only"
    status: known-issue
    risk: low
  - id: E-BOOK-32
    group: Web
    title: Joined in the invite's own tab
    when: web used in the last 15 min · invite email opened in a new tab · *Join* → *Continue on the web*
    then: |
      - fixed 2026-11-02 · the joined book opens, under its own name
      - was: the book list stored by the earlier tab lacked it, so the header named another book over the joined book's data
    status: fixed
    risk: medium
    related: [E-BOOK-30]
    tests:
      - file: src/lib/books/hooks.test.tsx
        repo: web
        name: fetches instead of trusting a persisted list that lacks the active book

  # Offline books
  - id: E-BOOK-40
    group: Offline books
    title: Stuck inside an offline book
    when: an offline book is open · the open book does not sync
    then: switcher chip, Home avatar tap and Settings › Books stay (they need any book of the account to sync, not this one) · same fix for a free member inside their own local book
    status: fixed
    risk: high
    tests:
      - file: test/features/cloud_tier/offline_book_test.dart
        name: inside the offline book the account still syncs somewhere, so the switcher stays
  - id: E-BOOK-41
    group: Offline books
    title: Kept offline, but registered before
    when: a free account's own book or a restored own book is kept offline on *Keep offline*
    then: its empty server row stays (the last own book cannot be deleted) but is flagged `is_offline` · hidden on the web, not Cloud, never listed on another phone · *Move to cloud* reuses it instead of creating a second book · offline, *Keep offline* asks again next launch
    status: fixed
    risk: low
    tests:
      - file: test/features/cloud_tier/offline_book_test.dart
        name: "a kept book comes back on its own server row: flagged back, no second book, nothing moved"
      - file: test/features/book/domain/service/book_members_service_offline_test.dart
        name: lists the offline books this phone holds, never one kept on another phone of the account
    related: [D-BOOK-5, T-BOOK-04]
  - id: E-BOOK-43
    group: Offline books
    title: Nothing generated inside an offline book
    when: an offline book is open · relaunch, resume, day change
    then: recurring bookings, reminders and the budget watcher run as in a book without an account · before the 2026-10-27 review only saving a rule generated anything
    status: fixed
    risk: high
    tests:
      - file: test/app/lifecycle/session_life_cycle_manager_test.dart
        name: the session runs the local materializer on start and on resume, and never pulls the book
  - id: E-BOOK-44
    group: Offline books
    title: Deleting a kept book
    when: a book kept offline after a join or restore is deleted
    then: its flagged server row goes too, so the 3-book cap gets the slot back · the last server book is refused as always
    status: fixed
    risk: medium
    tests:
      - file: test/features/book/use_cases/delete_book_use_case_test.dart
        name: a kept book takes its flagged server row with it, so the cap gets the slot back
  - id: E-BOOK-45
    group: Offline books
    title: Keep offline after a partial upload
    when: an upload stopped half way · Cloud later · *Keep offline*
    then: refused (`BOOK_NOT_EMPTY`) · snack says part of the book is already in the cloud and *Move to cloud* finishes it · asked again next launch
    status: by-design
    risk: low
    tests:
      - file: test/app/ui/supabase_container_test.dart
        name: a book partly uploaded already cannot stay offline, and the snack says Move to cloud finishes it
    related: [D-BOOK-6]
  - id: E-BOOK-46
    group: Offline books
    title: Limit with a book kept on another phone
    when: phone B shows 2 own books, a third is kept offline on phone A
    then: "*New book* or *Move to cloud* refused · message: limit reached, counting books kept offline on another phone · web: same, *New book* disabled at three"
    status: fixed
    risk: low
    tests:
      - file: test/features/book/use_cases/create_book_use_case_test.dart
        name: the server cap says whether books kept on another phone are counted
      - file: test/features/book/ui/pages/book_page_test.dart
        name: the cap on a move to the cloud names books kept on another phone
    related: [D-BOOK-6]
  - id: E-BOOK-42
    group: Offline books
    title: Killed while moving to the cloud
    when: the app dies after the server book exists and before the upload page
    then: the book waits as one owing its upload · the next launch asks *Move {book} to the cloud?* · nothing is lost
    status: by-design
    risk: medium
    tests:
      - file: test/features/cloud_tier/offline_book_test.dart
        name: creates the server book, marks it, moves the rows and the bottom bar onto it, opens it and hands the upload to the claim
