# Source: OFFLINE_TIER_AI_CONTEXT.md §14 (join and read-only), Trello release notes 1.17.0 (items 1–3, 13).
# "Everyday sharing" is derived from FAMILY_ACCOUNTS / BOOK_AI_CONTEXT, not from an earlier checklist.
groups:
  - id: join
    title: Join & keep
    setup: A with Cloud · B without
    items:
      - id: C-BOOK-001
        text: B local book → invite → *Join {book}* + inviter → free account → no upload, shared syncs, own book local · Cloud account → own uploads too
      - id: C-BOOK-005
        text: Expired or revoked invite → *no longer valid* · no sign-in offered
      - id: C-BOOK-020
        text: A (Cloud) invites B (free) → shared book live both ways · B's own book never on the server
      - id: C-BOOK-021
        text: B Free → all features in A's book · locks back in own book · *Cloud through {book}*

  - id: read-only
    title: Read-only shared books
    items:
      - id: C-BOOK-003
        text: "Owner revokes → B: grey cloud-slash → *Export* (B on Free → paywall) · *{book} no longer syncs* · renew → *syncs again*, editable"
      - id: C-BOOK-004
        text: Owner deletes the book → B read-only · *was deleted* · *Books that stopped syncing* → *Export*, *Remove*
      - id: C-BOOK-006
        text: Tablet rail → same read-only button

  - id: everyday
    title: Everyday sharing
    setup: From the book docs
    items:
      - id: C-BOOK-010
        text: New book (Cloud) → opens · switcher shows both · double-tap avatar → back
      - id: C-BOOK-011
        text: Invite as member + admin → email arrives · email fails → link to copy
      - id: C-BOOK-012
        text: "Web: preview → sign in → *Join* → *Open in the Money Koi app* → book listed"
      - id: C-BOOK-013
        text: "Member: bookings, receipts, shopping work · accounts, categories, goals, loans, rules read-only + hint"
      - id: C-BOOK-014
        text: "Admin: invite + remove members · no currency, no *Erase data*"
      - id: C-BOOK-015
        text: Owner changes currency → confirm · partner relabels on sync · partner's format unchanged
      - id: C-BOOK-016
        text: Remove member → gone at once · their phone drops the book → own book
      - id: C-BOOK-017
        text: "*Leave* (member) + *Stop sharing* (owner) → land in a sensible book"
      - id: C-BOOK-018
        text: Shopping item on one phone → other within seconds
      - id: C-BOOK-019
        text: Switch offline → online → that book's data arrives

  - id: attribution
    title: Creator avatar on booking rows
    items:
      - id: C-BOOK-030
        text: B adds a booking → A sees B's face on the row · Budget Book, Home, category + tag lists
      - id: C-BOOK-031
        text: Recurring or receipt glyph wins over the avatar · own bookings show nothing
      - id: C-BOOK-032
        text: Form footer creator avatar = 20 px (was 16)
      - id: C-BOOK-033
        text: Invite link on a fresh phone → sign in → loading screen only, no language/currency/method step → *Join* → shared book active · Home checklist ticks from its entries · Books list shows the private book with the starter set

  - id: offline-books
    title: Offline books
    setup: Cloud account A with one cloud book
    items:
      - id: C-BOOK-040
        text: New book → *Offline book* → quick start → opens with the starter set · card badge *Offline book*, the cloud book's reads *Cloud book* · switcher rows say the same · web and a second phone of A never list it
      - id: C-BOOK-041
        text: In the offline book → bookings, a recurring rule (occurrences appear on relaunch), a receipt photo (stays on the phone), rename, currency change · no pending badges · switcher and Settings › Books still open · log out → log in → the book is back
      - id: C-BOOK-042
        text: Card ⋮ → *Move to cloud* → confirm → *Moving to the cloud* with counts → main · badge *Cloud book* · web shows everything · airplane mode mid-upload → *Try again* resumes · kill mid-upload → relaunch → *Move {book} to the cloud?* → *Move to cloud* finishes
      - id: C-BOOK-043
        text: Three created books (any mix) → *New book* reads the limit · *Move to cloud* with 3 cloud books on the server → the limit message, the book stays offline
      - id: C-BOOK-045
        text: Cloud account, a book that owes its upload → *Decide later* → card and switcher read *Upload pending* · after *Move to cloud* they read *Cloud book*
      - id: C-BOOK-046
        text: Upload stopped half way (airplane mode) → *Continue offline* → relaunch → *Keep offline* → snack *Part of this book is already in the cloud…* · asked again next launch · *Move to cloud* finishes it
      - id: C-BOOK-047
        text: Phone A keeps a book offline · phone B with 2 own books → *New book* → limit message names books kept offline on another phone · web *New book* disabled, same line
      - id: C-BOOK-044
        text: Free account B with a kept book → grant Cloud → relaunch → *Move {book} to the cloud?* · *Keep offline* → badge *Offline book*, Settings shows no *Finish backup* · *Decide later* → asked again on the next launch · delete the offline book → gone from this phone only
