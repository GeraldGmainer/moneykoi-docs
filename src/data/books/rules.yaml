# Source: FAMILY_ACCOUNTS_AI_CONTEXT.md, BOOK_AI_CONTEXT.md, OFFLINE_TIER_AI_CONTEXT.md §10,
# moneykoi-web BOOKS_WEB_AI_CONTEXT.md.
items:
  # What a book is
  - id: R-BOOK-01
    group: What a book is
    title: A book = a household's data
    text: |
      - accounts, categories, bookings, budgets, goals → the **book**
      - a person can be in several books · one active
      - private (`personal`) or shared (`family`) · households, not businesses
    source: FAMILY_ACCOUNTS §1
  - id: R-BOOK-02
    group: What a book is
    title: Data survives a member leaving
    text: |
      - creator = attribution only
      - everyone sees the same data · last write wins
    source: FAMILY_ACCOUNTS §2
  - id: R-BOOK-03
    group: What a book is
    title: One currency per book
    text: |
      - on the book, never the profile
      - only the **owner** changes it, after a confirm
      - amounts relabelled, **never** converted
      - money format stays per person
    source: FAMILY_ACCOUNTS §6
    tests:
      - file: test/features/book/domain/book_member_test.dart
        name: only the owner may change the book currency
      - file: test/features/book/data/data_sources/book_remote_source_test.dart
        name: updateBookCurrency reports a write RLS refused as owner-only
  - id: R-BOOK-04
    group: What a book is
    title: ≤ 3 owned books
    text: |
      - memberships unlimited
      - more than one own book = Cloud
    source: FAMILY_ACCOUNTS §1, BOOK §5
    tests:
      - file: test/features/book/bloc/book_management_bloc_test.dart
        name: only owned books count against the limit
    related: [R-MON-03]
  - id: R-BOOK-05
    group: What a book is
    title: Last own book can't be deleted
    text: server refuses (`LAST_BOOK`) → app never offers it
    source: BOOK §5
    tests:
      - file: test/features/book/bloc/book_management_bloc_test.dart
        name: the last owned book cannot be deleted, nor a book someone else owns

  # Roles
  - id: R-BOOK-10
    group: Roles
    title: Owner → admin → member
    text: |
      - **Owner**: one, fixed · can't leave → dissolve or delete · only one to change currency, erase data
      - **Admin**: invites, manages members, sets up accounts, categories, goals, loans, investments, rules
      - **Member**: bookings, receipts, shopping · reads the rest
    source: FAMILY_ACCOUNTS §2, §3
    tests:
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: every role may record bookings
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: structure is writable in a private book and for an owner or admin of a shared one
      - file: test/features/book/ui/book_card_menu_test.dart
        name: an owner of a shared book can rename, stop sharing and delete, but not leave
  - id: R-BOOK-11
    group: Roles
    title: Unknown role → no structure edits
    text: |
      - until the phone knows my role: structure + currency off
      - bookings stay open
    source: FAMILY_ACCOUNTS §5.4
    tests:
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: an unknown role in a shared book offers no structure writes and no currency change
  - id: R-BOOK-12
    group: Roles
    title: Roles change only on the server
    text: |
      - nobody sets their own role · ownership never moves
      - admins remove plain members only, not themselves
      - removing an admin needs the owner
    source: FAMILY_ACCOUNTS §2, §4.2

  # Sharing & invites
  - id: R-BOOK-20
    group: Sharing & invites
    title: Managing a book needs internet
    text: |
      - create · share · invite · roles · remove · leave · dissolve · delete → online
      - reading works offline
    source: FAMILY_ACCOUNTS §1
    tests:
      - file: test/features/book/data/data_sources/book_remote_source_test.dart
        name: offline fails fast without calling the server
  - id: R-BOOK-21
    group: Sharing & invites
    title: "Invites: one email, accepted on purpose"
    text: |
      - pending · ≤ 7 days · for the signed-in email
      - web `/invite` **never** auto-accepts (link scanners)
      - accepting twice = success
    source: FAMILY_ACCOUNTS §4.2, BOOKS_WEB §4.7
  - id: R-BOOK-22
    group: Sharing & invites
    title: Invite links open the browser
    text: |
      - `https://my.moneykoi.com/invite?token=…` not claimed by the app
      - web signs in → *Open in the Money Koi app* (`/open/family`)
      - in the app: paste, old link, or `com.psyren.moneykoi://invite`
    source: BOOK §1
    related: [Q-BOOK-1]
  - id: R-BOOK-23
    group: Sharing & invites
    title: Invite email is best effort
    text: |
      - max 10 s · fails → copy the link
      - never blocks the invite
    source: BOOK §7
  - id: R-BOOK-24
    group: Sharing & invites
    title: Cloud book → every feature inside
    text: owner pays · own book → own plan
    source: MONETIZATION §2
    related: [R-MON-02]

  # Switching & sync
  - id: R-BOOK-30
    group: Switching & sync
    title: Switching books never wipes
    text: |
      - reads, realtime, caches re-target
      - other book's unsent writes held, not dropped
      - swipe on Book page = preview · tap = switch
    source: FAMILY_ACCOUNTS §5.2, BOOK §3
    tests:
      - file: test/features/book/domain/service/book_session_test.dart
        name: re-targets the whole offline-first stack at the new book, in order
  - id: R-BOOK-31
    group: Switching & sync
    title: Only the active book is pulled
    text: |
      - other books may be stale until opened
      - → exports + comparisons: active book only
    source: FAMILY_ACCOUNTS §4.3, §6
  - id: R-BOOK-32
    group: Switching & sync
    title: Leave/delete removes only that book
    source: FAMILY_ACCOUNTS §5.2
    text: other books, their outbox + cursors stay
    tests:
      - file: test/features/book/domain/service/book_session_test.dart
        name: a book given up leaves the phone with its cursors, and only that book
  - id: R-BOOK-33
    group: Switching & sync
    title: Removed member → first remaining book
    text: |
      - only once the active book's row is on the phone
      - a new or just-joined book isn't taken as revoked
    source: BOOK §5, FAMILY_ACCOUNTS §5.4
    tests:
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: switches away from a book the user no longer belongs to
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: a book just created or joined is not taken for a revoked one before its pull lands
  - id: R-BOOK-34
    group: Switching & sync
    title: Can't sync → read-only, never hidden
    text: |
      - owner's plan ended, or deleted on the server
      - readable · writes refused
      - *Export* needs Pro since 2026-10-21 · Free → paywall (E-MON-23)
      - + becomes a grey cloud-slash button that explains why
    source: OFFLINE_TIER §10 (D-B1, E3), MONETIZATION §8 item 6
    tests:
      - file: test/core/offline_first/sync_gate_test.dart
        name: a book deleted on the server is read-only and never Cloud, whoever owned it
      - file: test/core/offline_first/writer_per_book_test.dart
        name: refuses a new row, an edit and a delete, and writes nothing
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: a read-only book takes every write away
    related: [D-B1, E-MON-23]
  - id: R-BOOK-35
    group: Switching & sync
    title: Members are told once
    text: "*{book} no longer syncs* · *{book} syncs again* · *{book} was deleted*"
    source: OFFLINE_TIER §10
    tests:
      - file: test/features/cloud_tier/cloud_status_notices_test.dart
        name: a book that stopped syncing is told once, under its own notification id
      - file: test/features/cloud_tier/cloud_status_notices_test.dart
        name: syncing again is told only for a book this phone was told had stopped

  # Data & attribution
  - id: R-BOOK-40
    group: Data & attribution
    title: "Whole-book export: owner + admin"
    text: |
      - export, import, back up the book → owner + admin
      - erase → owner only
      - everyone: booking CSV + own data
    source: DATA_PORTABILITY, BOOK §6
    tests:
      - file: test/features/book/domain/book_member_test.dart
        name: only an owner or admin may export the whole book
      - file: test/features/book/ui/book_card_menu_test.dart
        name: an admin of the active book can export and import but not erase
    related: [R-DATA-02, R-DATA-50]
  - id: R-BOOK-41
    group: Data & attribution
    title: Attribution shows the creator
    text: |
      - shared book: other member's avatar on the booking row
      - recurring or receipt glyph wins
      - form footer names the creator · shopping *added by*
      - own bookings show nothing
    source: FAMILY_ACCOUNTS §5.5, §6
    tests:
      - file: test/features/book/bloc/book_members_cubit_test.dart
        name: creator badges only show other people in a shared book with company

  # Web
  - id: R-BOOK-50
    group: Web
    title: Web opens only Cloud books
    text: |
      - every book listed · non-Cloud ones locked
      - *Get Cloud in the app to use this book here*
      - free member of a Cloud book → web works for that book
    source: BOOKS_WEB §4.11
    related: [R-MON-02]
  - id: R-BOOK-51
    group: Web
    title: Web manages the active book only
    text: no avatars · no rename · no preview · no realtime
    source: BOOKS_WEB §1, §6
