# Every user-facing feature, one row each. A row with `feature:` takes its tier, needs and
# live/planned status from moneykoi-app's feature.dart; only rows without one carry `tier:`.
# `web:` compares the web dashboard with the app — parity · partial · missing (app has it, web
# not yet) · app-only (deliberately phone-only) · web-only. `docs:` is the area page.
# Sources: MONETIZATION_AI_CONTEXT.md §4, moneykoi-app 02_FEATURES.md §0, moneykoi-web 02_FEATURES.md.

