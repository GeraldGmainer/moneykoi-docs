# Data in & out
- id: csv-import
  name: CSV booking import
  area: data
  tier: free
  note: the door in
  web: parity
  docs: data
- id: book-export
  name: Whole-book ZIP export
  area: data
  tier: free
  note: the door out, stays free (GDPR)
  web: parity
  webNote: without `moneykoi-data.json`
  docs: data
- id: download-all-data
  name: Download all your data
  area: data
  tier: free
  note: the all-data archive; access to your own data is never paid
  since: decided 2026-10-16
  web: missing
  webNote: the web reads only the active book
  docs: data
- id: backup-restore
  name: Restore a backup file
  area: data
  tier: free
  note: restoring is never paid
  web: parity
  docs: data
- id: backup-create
  name: Create a backup file
  area: data
  feature: backupCreate
  note: the backup reminder shows only with Pro
  web: parity
  webNote: no Share, no `settings.json`
  docs: data
- id: export-filtered
  name: Filtered booking export, per-screen CSV, PDF
  area: data
  feature: exportFiltered
  web: partial
  webNote: single-filter ledger CSV; no multi-select export page
  docs: data
- id: statement-import
  name: Bank statement import (CAMT.053 / MT940)
  area: data
  feature: statementImport

