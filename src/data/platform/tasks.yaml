      - branch push `moneykoi-supabase`: `send-book-invite` (accepts both hosts) + `20261018120000_changelog_domain_moneykoi_com.sql`
      - Play Console: website · privacy policy · account deletion URL
      - Search Console + sitemap for `moneykoi.com`
  - id: T-PLAT-03
    title: Check the invite email's sender name
    owner: gerald
    detail: |
      - `SMTP_FROM_NAME`, if set, overrides the default *Money Koi*
      - set → make it *Money Koi* on dev + prod · unset → nothing to do
    command: |
      cd moneykoi-supabase
      supabase secrets list --project-ref dpmemqshhdnanywcvsod   # dev · prod: cwheprirreyscppmbybp
      supabase secrets set SMTP_FROM_NAME="Money Koi" --project-ref dpmemqshhdnanywcvsod
