      - the app no longer falls back to `SUPABASE_ANON_KEY` (removed 2026-10-24) · a build without the new key reaches no server at all: no sign-in, no sync
      - order and the rest of the deploy (secrets, Vault, cron, web + admin env): `JWT_SIGNING_KEYS_PLAN.md` §3.6, dev first, prod ≥ 48 h later
      - check after: Sentry tag `supabase_key` reads `publishable` on the new build
    command: |
      # Dashboard → Project Settings → API Keys → create the publishable + secret key (dev, then prod)
      # moneykoi-app/.env.dev and .env.prod (SUPABASE_ANON_KEY is no longer read; delete the line):
      SUPABASE_PUBLISHABLE_KEY=sb_publishable_…
