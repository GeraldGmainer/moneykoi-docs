  - id: T-PLAT-11
    title: Revoke the Apple sign-in when an account is deleted
    owner: ai
    status: done
    detail: |
      - **done 2026-11-02** · App Review 5.1.1(v) · R-ACC-68 · C-PLAT-018
      - Apple sign-in → the app sends the authorization code to the new `account` function → Apple's refresh token kept on the server only (`apple_sign_in_token`, closed to clients) · a failed exchange never fails the sign-in
      - *Delete account*, app and web → the same function: revoke at Apple, then `delete_current_user` · a failed revoke never blocks
      - both bundle ids of the Apple provider (`com.psyren.moneykoi`, `.dev`), each revoked under its own
      - left: Gerald's key, secrets and deploy (T-PLAT-13)
    related: [T-PLAT-10, T-PLAT-13, D-PLAT-6]
