    owner: ai
    waitsFor: [D-PLAT-2]
    detail: Only if D-PLAT-2 says yes · Gerald pushes the migration after
    prompt: |
      New migration in moneykoi-supabase (never edit an applied one): in public.changelog, replace "MoneyKoi" with "Money Koi" inside the notes JSONB of every row and language (the 16 occurrences come from 20261015140000_changelog_app_and_web.sql, which rebuilt the table); URLs and file names stay; the rows must still pass internal.changelog_notes_valid. Hand Gerald the push command.
