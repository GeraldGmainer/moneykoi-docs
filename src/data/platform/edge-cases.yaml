items:
  - id: E-PLAT-01
    group: Builds
    title: iOS 15.0–15.4
    when: user on iOS 15.0–15.4 opens the App Store
    then: no update past 1.16.x
    status: by-design
    risk: medium
  - id: E-PLAT-02
    group: Builds
    title: Reinstall on iPhone keeps the keychain
    when: app deleted and installed again on the same iPhone
    then: |
      - since 2026-11-11 · the first start drops the old session and PIN hash · the app opens on Welcome · sign in again
      - was: it opened signed in with no data on the phone · offline, Home stayed on skeletons for good (F-47)
      - an app update keeps the session · Android starts clean either way
    status: fixed
    risk: low
    tests:
      - file: test/app/lifecycle/leftover_session_reset_test.dart
        name: a fresh install drops the session and PIN an earlier install left in the Keychain
      - file: test/app/lifecycle/leftover_session_reset_test.dart
        name: an update from a version without the marker keeps the session
    related: [D-PLAT-17]
  - id: E-PLAT-03
    group: Builds
    title: iOS build lags the Android release
    when: Android 1.x is out, the same iOS version still in review, the App Store id set
    then: |
      - the changelog on iOS shows *update available* with the store page still on the old build
      - the `upgrader` prompt stays quiet (it reads the store's version)
    status: known-issue
    risk: low
    related: [R-SET-43]
  - id: E-PLAT-04
    group: Screen & layout
    title: Black strip under every screen on Face ID iPhones
    when: any screen on an iPhone with a home indicator
    then: |
      - was: the bottom bar, *Save* bar, sheets and drawer ended 34 pt above the edge · pure black below
      - now: they paint to the edge · their content stays above the indicator (R-PLAT-32)
    status: fixed
    risk: low
    related: [R-PLAT-32, C-PLAT-019]
  - id: E-PLAT-05
    group: Screen & layout
    title: Save button 8 pt off the edge on iPhone SE
    when: any form on a phone without a home indicator
    then: |
      - was: the full-width *Save* sat 8 pt above the edge, its sides on the page gutter
      - now: the gutter below it too
    status: fixed
    risk: low
    related: [R-PLAT-32]
  - id: E-PLAT-06
    group: Screen & layout
    title: The **+** overlapped snackbars
    when: a booking saved from Home or the Budget Book
    then: |
      - was: *Booking created* sat flush on the bar · the **+** covered its lower edge · the hint snackbar floated · two styles swapping on one spot
      - now: every snackbar floats above the bar, clear of the **+**
    status: fixed
    risk: low
    related: [R-PLAT-32]
  - id: E-PLAT-07
    group: Builds
    title: Wordmark jumped at the launch handoff on iPhone
    when: cold start on an iPhone with a home indicator
    then: |
      - was: *MONEY KOI* sat on the home indicator on the launch screen, ~60 pt higher once the app's splash took over
      - now: both draw it 60 pt above the edge · device check C-PLAT-015
    status: fixed
    risk: low
    related: [R-PLAT-03, C-PLAT-015]
  - id: E-PLAT-08
    group: Screen & layout
    title: Android tablet held in portrait
    when: Android tablet (≥ 600 dp) · rotate to landscape, or a cold start in landscape
    then: |
      - fixed 2026-11-06 · the tablet rotates and the landscape layouts open · phones stay portrait
      - before: a letterboxed portrait strip with Android's *See and do more* dialog · the lock was decided on a 0×0 view at startup (AND-25-1)
    status: fixed
    risk: high
    tests:
      - file: test/main/service/startup_chrome_test.dart
        name: a 0×0 view locks nothing
  - id: E-PLAT-09
    group: Screen & layout
    title: Splash jumps at the handoff on Android 13
    when: cold start on Android 10–14
    then: |
      - fixed 2026-11-06 with edge to edge · the koi and wordmark stay put from the system splash to the app's
      - before: the wordmark jumped 24 dp and the nav bar turned black (AND-1-1)
    status: fixed
    risk: low
    related: [R-PLAT-32]
  - id: E-PLAT-10
    group: Screen & layout
    title: Date picker and quick add at 200 % font
    when: system font 200 % · small phone · a date field or quick add
    then: |
      - fixed 2026-11-11 · the picker scrolls, its text grows to 130 % at most
      - quick add keeps the field above the keyboard
      - was: overflow stripes · the quick-add field hidden
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/form/date_picker_sheet_test.dart
        name: a small phone at twice the font size shows the picker without overflow
      - file: test/features/quick_add/ui/sheets/quick_booking_sheet_test.dart
        name: with a large font and little room above the keyboard the preview gives way, not the field
  - id: E-PLAT-11
    group: Screen & layout
    title: Amounts ignored the system font size
    when: system font above 100 % · any amount
    then: |
      - fixed 2026-11-11 · amounts grow with the font, up to **130 %**
      - a screen reader hears one figure · *minus $12.50*, not digit by digit
      - was: every amount at its fixed size
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/budget_book/money_text_test.dart
        name: an amount follows the system font size, up to the cap
      - file: test/shared/ui/budget_book/money_text_test.dart
        name: a screen reader hears one figure, not the split spans
  - id: E-PLAT-12
    group: Screen & layout
    title: Budget Book summary at 200 % font
    when: system font 200 % · Budget Book › *Summary*
    then: |
      - fixed 2026-11-11 · the three totals stay readable, labels shrink to fit
      - category rows no longer overflow · their amounts shrink instead
      - was: tiny totals, *INCO…* · overflow stripes on every row
    status: fixed
    risk: medium
  - id: E-PLAT-13
    group: Screen & layout
    title: Snackbar over the rail in landscape
    when: tablet or phone in landscape · any snackbar
    then: |
      - fixed 2026-11-11 · the snackbar starts beside the rail · the rail and its add button stay reachable
      - was: it spanned the full width and covered the add button
    status: fixed
    risk: low
    tests:
      - file: test/main/ui/pages/main_page_test.dart
        name: in landscape a snackbar starts beside the rail
  - id: E-PLAT-14
    group: Screen & layout
    title: One Japanese character alone on a line
    when: Japanese · onboarding steps 3 and 5 in landscape · Welcome feature row
    then: |
      - fixed 2026-11-11 · the step text gets a wider column · a Welcome label shrinks onto one line
      - en · de labels still wrap between words
      - was: 「…あります/か？」, 「レシートをスキャ/ン」
    status: fixed
    risk: low
    tests:
      - file: test/features/auth/ui/widgets/welcome_keypoints_test.dart
        name: a Japanese label shrinks onto one line instead of leaving one character behind
  - id: E-PLAT-15
    group: Screen & layout
    title: Cut labels on a 360 dp phone
    when: German · 360 dp phone · Home and *Sicherung & Wiederherstellung*
    then: |
      - fixed 2026-11-11 · Home cash flow *EINNAHMEN* / *AUSGABEN* and *Gesamtsaldo* shrink to fit on one line · the backup title takes two lines
      - fixed the same day · the Japanese greeting shrinks · the scan hint's action keeps its inset · the *Wiederkehrend machen* hint text uses the full bar · a chart prints only as many dates as fit
      - was: *EINNAHME…*, *Gesamtsald/o*, *Sicherung & Wiederherstellu…*, 「おはようござ…」, the hint text at half width, the Home forecast dates running together
    status: fixed
    risk: low
    tests:
      - file: test/features/home/ui/widgets/cash_flow_overview_test.dart
        name: a narrow phone shrinks a column label instead of cutting it off
      - file: test/features/home/ui/widgets/total_balance_overview_test.dart
        name: a narrow phone keeps the label on one line beside the total
      - file: test/features/home/ui/screens/home_tab_test.dart
        name: on a 360 dp phone a greeting too wide for the bar shrinks instead of being cut
      - file: test/features/getting_started/ui/hints/hint_snackbar_test.dart
        name: a long action goes under the text, which keeps the whole width of the bar
      - file: test/features/getting_started/ui/hints/hint_chip_test.dart
        name: without × the action keeps the same inset from the right edge as the text from the left
      - file: test/shared/ui/chart/budget_line_chart_test.dart
        name: a narrow plot prints only as many labels as fit side by side
    related: [E-PLAT-12]
  - id: E-PLAT-16
    group: Accessibility
    title: Buttons announced under the launch splash
    when: app start · screen reader or UI test · the splash still covers the first screen
    then: covered buttons are hidden until the splash lifts · before 2026-11-12 found but not tappable, the demo video run lost its first tap
    status: fixed
    risk: low
    tests:
      - file: test/main/ui/widgets/launch_splash_test.dart
        name: a covered button is hidden from semantics, then takes the first tap while the splash fades
  - id: E-PLAT-17
    group: Web
    title: "Web date pickers ignored language and week start"
    when: any date picker on the web, German language, week starting Monday
    then: month and weekday names in the app's language · the week starts on the day set in Settings · before 2026-11-12 every picker read English and started on Sunday
    status: fixed
    risk: medium
  - id: E-PLAT-18
    group: Web
    title: Blank page after a crash on the web
    when: web · a page throws while rendering
    then: "*Something went wrong* with *Try again* / *Reload page* · the shell stays · before 2026-11-12 a blank screen"
    status: fixed
    risk: medium
    tests:
      - file: src/components/shared/error-fallback.test.tsx
        repo: web
        name: says what failed and retries on the button
  - id: E-PLAT-19
    group: Web
    title: "Web Settings: money-format choices in English"
    when: German language, Settings → money format
    then: "symbol position shows itself with the book's symbol (`€ 123`, `123 €`) · separators read *Punkt ( . )*, *Komma ( , )*, *Leerzeichen*, *Ohne*, as in the app · before 2026-11-12 English labels (*Symbol before, spaced*)"
    status: fixed
    risk: low
