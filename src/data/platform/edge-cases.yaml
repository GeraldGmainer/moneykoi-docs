items:
  - id: E-PLAT-01
    group: Builds
    title: iOS 15.0–15.4
    when: user on iOS 15.0–15.4 opens the App Store
    then: no update past 1.16.x
    status: by-design
    risk: medium
  - id: E-PLAT-02
    group: Builds
    title: Reinstall on iPhone keeps the keychain
    when: app deleted and installed again on the same iPhone
    then: |
      - the Supabase session and the old PIN hash survive (iOS keychain) · the app opens signed in
      - app lock is off: its switch is a pref, which the uninstall did wipe · a new PIN overwrites the old hash
      - Android starts clean
    status: by-design
    risk: low
  - id: E-PLAT-03
    group: Builds
    title: iOS build lags the Android release
    when: Android 1.x is out, the same iOS version still in review, the App Store id set
    then: |
      - the changelog on iOS shows *update available* with the store page still on the old build
      - the `upgrader` prompt stays quiet (it reads the store's version)
    status: known-issue
    risk: low
    related: [R-SET-43]
  - id: E-PLAT-04
    group: Screen & layout
    title: Black strip under every screen on Face ID iPhones
    when: any screen on an iPhone with a home indicator
    then: |
      - was: the bottom bar, *Save* bar, sheets and drawer ended 34 pt above the edge · pure black below
      - now: they paint to the edge · their content stays above the indicator (R-PLAT-32)
    status: fixed
    risk: low
    related: [R-PLAT-32, C-PLAT-019]
  - id: E-PLAT-05
    group: Screen & layout
    title: Save button 8 pt off the edge on iPhone SE
    when: any form on a phone without a home indicator
    then: |
      - was: the full-width *Save* sat 8 pt above the edge, its sides on the page gutter
      - now: the gutter below it too
    status: fixed
    risk: low
    related: [R-PLAT-32]
  - id: E-PLAT-06
    group: Screen & layout
    title: The **+** overlapped snackbars
    when: a booking saved from Home or the Budget Book
    then: |
      - was: *Booking created* sat flush on the bar · the **+** covered its lower edge · the hint snackbar floated · two styles swapping on one spot
      - now: every snackbar floats above the bar, clear of the **+**
    status: fixed
    risk: low
    related: [R-PLAT-32]
  - id: E-PLAT-07
    group: Builds
    title: Wordmark jumped at the launch handoff on iPhone
    when: cold start on an iPhone with a home indicator
    then: |
      - was: *MONEY KOI* sat on the home indicator on the launch screen, ~60 pt higher once the app's splash took over
      - now: both draw it 60 pt above the edge · device check C-PLAT-015
    status: fixed
    risk: low
    related: [R-PLAT-03, C-PLAT-015]
  - id: E-PLAT-08
    group: Screen & layout
    title: Android tablet held in portrait
    when: Android tablet (≥ 600 dp) · rotate to landscape, or a cold start in landscape
    then: |
      - fixed 2026-11-06 · the tablet rotates and the landscape layouts open · phones stay portrait
      - before: a letterboxed portrait strip with Android's *See and do more* dialog · the lock was decided on a 0×0 view at startup (AND-25-1)
    status: fixed
    risk: high
    tests:
      - file: test/main/service/startup_chrome_test.dart
        name: a 0×0 view locks nothing
  - id: E-PLAT-09
    group: Screen & layout
    title: Splash jumps at the handoff on Android 13
    when: cold start on Android 10–14
    then: |
      - fixed 2026-11-06 with edge to edge · the koi and wordmark stay put from the system splash to the app's
      - before: the wordmark jumped 24 dp and the nav bar turned black (AND-1-1)
    status: fixed
    risk: low
    related: [R-PLAT-32]
  - id: E-PLAT-10
    group: Screen & layout
    title: Date picker and quick add at 200 % font
    when: system font 200 % · small phone · a date field or quick add
    then: |
      - fixed 2026-11-11 · the picker scrolls, its text grows to 130 % at most
      - quick add keeps the field above the keyboard
      - was: overflow stripes · the quick-add field hidden
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/form/date_picker_sheet_test.dart
        name: a small phone at twice the font size shows the picker without overflow
      - file: test/features/quick_add/ui/sheets/quick_booking_sheet_test.dart
        name: with a large font and little room above the keyboard the preview gives way, not the field
  - id: E-PLAT-11
    group: Screen & layout
    title: Amounts ignored the system font size
    when: system font above 100 % · any amount
    then: |
      - fixed 2026-11-11 · amounts grow with the font, up to **130 %**
      - a screen reader hears one figure · *minus $12.50*, not digit by digit
      - was: every amount at its fixed size
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/budget_book/money_text_test.dart
        name: an amount follows the system font size, up to the cap
      - file: test/shared/ui/budget_book/money_text_test.dart
        name: a screen reader hears one figure, not the split spans
  - id: E-PLAT-12
    group: Screen & layout
    title: Budget Book summary at 200 % font
    when: system font 200 % · Budget Book › *Summary*
    then: |
      - fixed 2026-11-11 · the three totals stay readable, labels shrink to fit
      - category rows no longer overflow · their amounts shrink instead
      - was: tiny totals, *INCO…* · overflow stripes on every row
    status: fixed
    risk: medium
