    status: open
    answer: |
      - drawer button glyph: pure white on every tab · candidate: `primaryTextColor` off Home
      - loading overlay dims 0.5 · candidate: `scrim` (0.33) or `scrimStrong` (0.4)
      - remote-loading bar: Material blue · candidate: accent → secondary accent
      - inline error inset 30 next to 40 · candidate: unify on 40 or 32
      - plus, no decision: `ScrollableNavBar` is unused → AI deletes it with `tabLabelIdle`
      - source: codebase hygiene plan §7 (deleted 2026-11-07)

