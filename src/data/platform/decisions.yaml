  - id: D-PLAT-16
    question: "JWT Phase D: what share of installs must carry the new key first?"
    status: open
    date: 2026-11-09
    answer: |
      - Phase D cuts off every install built without the publishable key (T-PLAT-21)
      - suggested: ≥ 98 % of active installs on a build with the key (Play Console) and Sentry `supabase_key` = `legacy` only on those stragglers for 7 days
      - and if it is not met on Dec 20: Supabase's end-of-2026 cutoff wins anyway · or Phase D waits until the last week of December
      - source: JWT plan §8.1 (plan deleted 2026-11-09 · `moneykoi-supabase/API_KEYS_AI_CONTEXT.md`)

  - id: D-PLAT-13
    question: CI on pull requests too?
    status: open
    answer: |
      - today: CI runs on a push to `main` / `develop` only · a PR gets **no** CI
      - yes → add `pull_request` to `.github/workflows/dart.yml` · doubles the runs on a PR branch
      - source: codebase hygiene plan §2 (deleted 2026-11-07)

  - id: D-PLAT-14
