# Source: app FORECAST_AI_CONTEXT.md; web FORECAST_WEB_AI_CONTEXT.md; Trello item 16; MONETIZATION D7, D9.
items:
  - id: R-FC-01
    group: The one invariant
    title: Forecast is never a booking
    text: |
      - never stored, never in balances, analytics or budgets
      - planned payment retired by the review, never *becomes* the booking
      - skip one occurrence → a forecast item, never a rule exception
    source: FORECAST §1, CLAUDE.md
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: a skip removes the occurrence and leaves the rule byte-identical
  - id: R-FC-02
    group: The one invariant
    title: Pro · read-only after the plan
    text: |
      - page, Home card, Analytics card → Pro
      - plan ended → page read-only
      - review: *confirm* · *didn't happen* · *book it now* work · *move* → paywall (D7)
    source: MONETIZATION §3a, §12 D7, FORECAST §9
    related: [E-MON-21, D7]
  - id: R-FC-10
    group: The line
    title: Each euro claimed once
    text: |
      1. future-dated bookings
      2. planned payments
      3. recurring rules + loan installments
      4. what budgets leave, per day
      5. everyday estimate for the unbudgeted rest

      A rule inside a budget uses up **every** cap around it, doesn't stack.
      Whole book 3600 + Housing 1600 + bill 117 → month = 3600, not 3717.
    source: FORECAST §5, §5.2
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: a materialised future booking and its rule are counted once
      - file: test/features/forecast/forecast_engine_test.dart
        name: a recurring rule inside a budget consumes the cap instead of stacking on it
      - file: test/features/forecast/forecast_engine_test.dart
        name: a bill inside a sub-budget consumes the whole-book cap too
      - file: test/features/forecast/forecast_engine_test.dart
        name: a budgeted category contributes nothing to the baseline residual
  - id: R-FC-03
    group: The line
    title: Nested budgets count once
    text: whole 2000 + Food 600 + Dining 200 → future month shows 2000 (was 1800 before 1.17.0)
    source: FORECAST §5.2, Trello item 16
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: 'three nested budgets still spread the whole-book cap once: the outer subtracts what the inner ones emit, not their raw rates'
  - id: R-FC-11
    group: The line
    title: Skip one · "€X this time"
    text: |
      - change one occurrence, rule untouched
      - rule booked that date → change stops counting
    source: FORECAST §5.4
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: an amount override stops counting once the rule materialised that occurrence
  - id: R-FC-12
    group: The line
    title: Loan installment counted once
    text: |
      - a rule that books it wins
      - borrowed → line down · lent → line up
    source: FORECAST §5.3
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: a recurring rule that already books the installment wins; the loan is not charged twice
  - id: R-FC-14
    group: The line
    title: Income and bills switch separately
    text: |
      - *Recurring income* · *Recurring bills* · two rows, two toggles
      - bills off + whole-book budget → month total unchanged · cap spread in full
      - a bill no budget covers leaves the line · the row says how many
    source: FORECAST §5.0, plan D1–D2
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: 'switch separately: bills off keeps the salary, income off keeps the rent'
      - file: test/features/forecast/forecast_engine_test.dart
        name: 'bills off under a whole-book budget: the cap is spread in full'
  - id: R-FC-15
    group: The line
    title: Income estimate
    text: |
      - median monthly income **no rule** booked · last months · spread per day
      - *From history* · *A monthly figure* · *Off* · default from history
      - a month's estimate is its total: income already booked that month (hand-typed salary, future-dated too) is taken off · only the rest is spread over the days left
      - this month not booked yet → the whole month's figure over the days left
      - book without rules → line no longer only falls
    source: FORECAST §5.5, plan D3
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: spread from tomorrow
      - file: test/features/forecast/forecast_engine_test.dart
        name: this month gets only what is still missing, spread over the days left
      - file: test/features/forecast/forecast_engine_test.dart
        name: leaves out income a rule booked
  - id: R-FC-16
    group: The line
    title: Monthly figures by hand
    text: |
      - *Spent per month* · *Received per month*
      - ÷ the days of each month · February ≠ March · month ends hold
      - an old daily figure stays until a monthly one is typed
    source: FORECAST §4, plan D4
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: divides by the days of each month and wins over an old daily figure
  - id: R-FC-17
    group: The line
    title: Accounts that count
    text: |
      - settings → one switch per account
      - off → not in the balance · not in safe to spend · its rules, plans, bookings leave the line
      - transfer into an excluded account = money leaving
    source: FORECAST §5.0, §7, plan D11
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: a rule, a booking and a planned item on an excluded account leave the line
      - file: test/features/forecast/use_cases/get_forecast_use_case_test.dart
        name: an excluded account is left out of the anchor
  - id: R-FC-13
    group: The line
    title: Horizon follows your history
    text: |
      - 3–24 months · < 2 full months history → 24 draws 12
      - horizon > 4× history → *speculative*
      - band widens with distance
    source: FORECAST §6, §9
  - id: R-FC-20
    group: The numbers
    title: Safe to spend
    text: |
      - today's balance − due until payday or month end − everyday − buffer
      - payday = next occurrence of the **largest** income rule · not the first income
      - the hero says which end · tap the balance card → the calculation
      - negative → red shortfall, never 0
    source: FORECAST §6, plan D8
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: safe to spend ends at the next occurrence of the largest income rule
      - file: test/features/forecast/domain/forecast_entities_test.dart
        name: safe to spend clamps the display amount and flags a shortfall
  - id: R-FC-21
    group: The numbers
    title: Lowest point never smoothed
    text: low point, first day < 0, first day < buffer → from the due-date line, even with *spread evenly*
    source: FORECAST §6
  - id: R-FC-23
    group: The numbers
    title: Trend, low, coverage
    text: |
      - hero: *≈ +X a month* under the closing · average of complete months
      - month tile: *Low X · date* when below the closing
      - *Coverage %* replaces *Forecast quality* · share from rules, budgets, plans
      - accuracy line when a snapshot ≥ 14 days old predicted today
    source: FORECAST §6, §9, plan D6, D9, D10
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: the monthly net averages the complete months
      - file: test/features/forecast/use_cases/get_forecast_use_case_test.dart
        name: the accuracy line reads the oldest snapshot inside the window
  - id: R-FC-24
    group: The numbers
    title: Every row shows its calculation
    text: |
      - *What's in this forecast* is a page · each row opens a sheet
      - parts add up to the row **to the cent**
      - *Last n months*: was · will be — income, spending, net
    source: FORECAST §9, plan D5, D7
    tests:
      - file: test/features/forecast/ui/calculation_specs_test.dart
        name: every summing sheet adds up to its row
      - file: test/features/forecast/ui/forecast_sources_page_test.dart
        name: a row opens its calculation sheet, whose parts meet the row figure
  - id: R-FC-04
    group: The numbers
    title: One "per day" figure
    text: |
      - same in: assumptions row · *Every day in <month>* · month page · day feed
      - today has no share
      - assumptions sheet: full months only
    source: FORECAST §6, §9, Trello item 16
    tests:
      - file: test/features/forecast/domain/forecast_month_rate_test.dart
        name: per-day figures split the spread into budgets and the estimate over the days that carry a share
  - id: R-FC-22
    group: The numbers
    title: Month page adds up
    text: income · each outflow · net · per day → net = month tile
    source: FORECAST §9
  - id: R-FC-30
    group: Review
    title: Booked early or never? You decide
    text: |
      - booking ±5 days + 15 % of a planned one → suggested match
      - planned ≤ 30 days back, no match → *did it happen?*
      - until answered it counts as due **today** on the line · older than 30 days → off the line
      - **never** automatic · no transfers, corrections, rule bookings
    source: FORECAST §5.6
    related: [D-FC-15, E-FC-29]
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: an unanswered past date counts as due today, not on its own day
      - file: test/features/forecast/domain/item_matcher_test.dart
        name: rule-generated bookings, transfers and balance corrections are never candidates
      - file: test/features/forecast/domain/item_matcher_test.dart
        name: a date before the item was created was never awaited
  - id: R-FC-31
    group: Alerts
    title: Low-balance + below-zero alerts
    text: |
      - opt-in · even with the app closed
      - once per dip · your time · never after the day
      - date, **never** amount · already below 0 → no "drop"
    source: FORECAST §8.1
    tests:
      - file: test/features/forecast/domain/forecast_alert_plan_test.dart
        name: a line that already starts below the floor never "drops" below it
      - file: test/features/forecast/domain/forecast_alert_plan_test.dart
        name: a dip that moves earlier than the one announced alerts again
    related: [R-NTF-01]
  - id: R-FC-50
    group: Where it opens
    title: Three ways in
    text: |
      - Home card · only with recurring bookings or planned payments
      - Analytics card · Pro
      - drawer *Forecast*, after *Recurring* · always there
      - Free: dimmed in the drawer's Pro group → paywall at Forecast
    source: FORECAST §9, NAVIGATION §8
    tests:
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Free: listed dimmed in the Pro group, and a tap opens the paywall at Forecast'
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Pro: no lock, and a tap opens the forecast without a Home card or Analytics'
  - id: R-FC-40
    group: Web
    title: "Web: same engine"
    text: |
      - port in integer thousandths · same numbers as the app since 2026-10-27
      - recurring income + bills apart · income estimate · monthly figures · pay rule · accounts that count
      - sources sheet: coverage, *Last n months*, every row opens its calculation · committed bar opens safe to spend
      - settings sheet: owners + admins
      - planned-item review since 2026-10-28 (R-FC-41) · not on the web: alerts, accuracy line
      - budget period from server clock · rule with deleted account still projected
    source: FORECAST_WEB §7
    tests:
      - file: src/app/(main)/forecast/lib/calculation-specs.test.ts
        repo: web
        name: every summing sheet adds up to its row
  - id: R-FC-41
    group: Web
    title: "Web: planned payments to check"
    text: |
      - same review as the app: ±5 days · 15 % · same category or one level up/down · never automatic
      - card right under the hero, only when something needs an answer
      - match: *Yes, that's it* · *Not this booking* · overdue: *Book it now* · *Move to another date* · *It didn't happen* · each with Undo
      - repeating plan: settles that one date, the series keeps running · no *Move*
      - *Book it now* opens booking entry in a new tab, prefilled (title, category, amount, date) → *Mark as happened* retires it
      - *Not this booking* is remembered per browser and per book, like the app's per device
      - *Move* has no paywall on the web (no Pro gate there)
    source: FORECAST_WEB §4 rule 31, §7
    related: [R-FC-30, E-FC-21]
    tests:
      - file: src/app/(main)/forecast/lib/item-matcher.test.ts
        repo: web
        name: rule-generated bookings, transfers and balance corrections are never candidates
      - file: src/app/(main)/forecast/services/forecast.service.test.ts
        repo: web
        name: "a repeating item settles only that date, through its own exdates — never a rule's"
      - file: src/app/(main)/forecast/components/item-review.test.tsx
        repo: web
        name: '"book it now" opens the booking form in a new tab and retires the item only when it is marked as happened'
      - file: src/app/(main)/forecast/page.test.tsx
        repo: web
        name: '"not this booking" is remembered on this device, per book, and the suggestion leaves at once'
  - id: R-FC-42
    group: Web
    title: "Web: the forecast as a year calendar"
    text: |
      - web-first · the app has it since 2026-11-09 (R-FC-51) · the app has no *Compact* grid and no hover, and shows dots where the web shows the movement
      - *Overview · Calendar* in the header switches the whole page · kept in the link (`?view=calendar`, `&year=` for another year)
      - one calendar year · ‹ › from the book's first year to as far as the forecast reaches (up to 24 months)
      - laid out like Gerald's forecast spreadsheet: each month a column, one row a day · day · **movement** · **balance at the day's end** · what it was (the biggest item, *+2* for more) · zebra rows
      - **up to today what was booked** (walked back from today's balance) · **from today the forecast** · booked rows dimmer
      - the movement column holds bookings and dated payments only · the everyday estimate and budgets only slope the balance, like the sheet's daily decline
      - red balance below zero · amber below the buffer · ⚠ on the year's lowest forecast day
      - three months a row on a wide screen, two on a smaller one, one on a phone
      - *Table · Compact* beside the year: *Compact* is a week grid (day, balance, dots), two months a row at most · remembered per browser
      - hover a day (both layouts): date, every item with its amount, what the forecast spreads over it, closing balance
      - a day opens beside the year (a sheet from the bottom on a phone or tablet): opening, closing, *Booked* (opens the booking), *Expected* (*Skip* · *Change* · *Edit*), what is spread over the day, net change · *Plan something on this day* from today on
      - accounts left out of the forecast are left out of the past too · a transfer to or from one moves the balance
      - days before the book's history and past the horizon: drawn, no balance
      - never scrolls sideways · a figure too long for its column shortens (1.2M), whole in the day panel · six figures fit whole even on a 320 px phone
    source: FORECAST_WEB §4 rule 32
    related: [D-FC-17, R-FC-40]
    tests:
      - file: src/app/(main)/forecast/page.test.tsx
        repo: web
        name: switches the whole page to a year calendar, and keeps the choice in the URL
      - file: src/app/(main)/forecast/page.test.tsx
        repo: web
        name: "every day closes where the balance is: booked before today, the forecast from today"
      - file: src/app/(main)/forecast/page.test.tsx
        repo: web
        name: a day opens with what is expected, and an occurrence skips from there as from the feed
      - file: src/app/(main)/forecast/lib/calendar-grid.test.ts
        repo: web
        name: "runs on without a step: every day opens where the day before closed"
      - file: e2e/forecast.mobile.spec.ts
        repo: web
        name: a long balance is shortened, never cut, at
      - file: src/app/(main)/forecast/page.test.tsx
        repo: web
        name: swaps the table for a compact grid, and the browser remembers the choice
      - file: src/app/(main)/forecast/page.test.tsx
        repo: web
        name: hovering a day shows what moved it and where it closes
  - id: R-FC-51
    group: Reading
    title: The forecast as a year calendar (app)
    text: |
      - the web's calendar (R-FC-42) on a phone · Forecast → calendar icon in the top bar · its own page, back returns to the forecast
      - one month under the other · each a header (month, *Closing balance*, ⚠ when a day dips below zero) over a row per day
      - a row: day (today in an orange circle) · **dots** · **balance at the day's end** · what it was (the biggest item, *+2* for more) · zebra rows · whole amounts, no currency sign
      - **up to today what was booked** (walked back from today's balance) · **from today the forecast** (up to 24 months, the overview's toggles) · booked rows dimmer
      - "a dot an item: green money in, gray money out, blue a transfer · at most two, and a day with money in and out shows one of each · the amounts are in the day's sheet (decided 2026-11-09: the movement column took the label's room)"
      - the dots mark bookings and dated payments only · the everyday estimate and budgets only slope the balance
      - the month's name stays on top while its days scroll, with a gap before the next month
      - red balance below zero · amber below the buffer · ⚠ on the year's lowest forecast day
      - ‹ year › from the book's first year to as far as the forecast reaches · opens on this year with today in the middle of the screen
      - "**Go to date** (date icon in the top bar): a date from the book's first day to the forecast's last, *Today* as a shortcut · opens that day's year with the day in the middle, highlighted in orange until the next pick or year arrow"
      - **tap a day → sheet**: opening, closing, *Booked* (opens the booking), *Expected* (tap → the payment's own sheet: *Skip* with Undo · *Change* · *Edit*), what is spread over the day, net change · *Plan something on this day* from today on (not for read-only members)
      - accounts left out of the forecast are left out of the past too · a transfer to or from one moves the balance · a balance correction counts on its day
      - days before the book's history and past the horizon: drawn, no balance, no tap
    source: FORECAST §9a
    related: [R-FC-42, D-FC-17]
    tests:
      - file: test/features/forecast/ui/calendar_year_test.dart
        name: "no step anywhere: every day opens where the day before closed"
      - file: test/features/forecast/ui/calendar_year_test.dart
        name: "walks back from the live total: each day closes where the next one opened, future rows ignored"
      - file: test/features/forecast/ui/calendar_year_test.dart
        name: "the dots: an item each, bookings and dated events only, and a quiet forecast day has none"
      - file: test/features/forecast/ui/calendar_year_test.dart
        name: at most two dots, and a small income still shows beside bigger bills
      - file: test/features/forecast/ui/forecast_calendar_page_test.dart
        name: "tapping today opens its sheet: booked, expected, and plan on this day"
      - file: test/features/forecast/ui/forecast_calendar_page_test.dart
        name: "a date in another year opens that year on it; the same date again scrolls back to it"
      - file: test/features/forecast/ui/forecast_calendar_page_test.dart
        name: "a row draws its dots, green for money in, and a quiet day none"
      - file: test/features/forecast/ui/forecast_calendar_page_test.dart
        name: the month being scrolled keeps its header pinned at the top of the list
      - file: test/features/forecast/ui/forecast_calendar_page_test.dart
        name: an expected row closes the day sheet and opens the event sheet
