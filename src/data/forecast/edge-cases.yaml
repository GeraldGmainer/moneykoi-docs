items:
  - id: E-FC-10
    group: Line
    title: Rule occurrence dated today
    when: server already booked today's occurrence
    then: projected only without a booking · never twice
    risk: high
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: a rule occurrence dated today is projected unless a booking already exists for it
  - id: E-FC-11
    group: Line
    title: Whole-book budget zeroes the estimate
    when: active whole-book budget
    then: estimate 0 by design · sheet says the budget covers it
    status: by-design
    risk: low
  - id: E-FC-12
    group: Line
    title: Home total ≠ forecast start
    when: future-dated bookings exist
    then: |
      - Home total includes them · forecast adds them on their days
      - sheet explains · **don't** "fix" Home
    status: by-design
    risk: medium
  - id: E-FC-14
    group: Line
    title: Bill inside a sub-budget stacked on the whole-book cap
    when: whole-book budget + sub-budget + rule inside the sub-budget
    then: |
      - fixed 2026-10-22 · next month = cap, not cap + bill
      - was ≈ 1 286 a month too low on Gerald's book → −781 instead of +500
      - current month was already right · Goals tab *spent* counts every budget
    status: fixed
    risk: high
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: a bill inside a sub-budget consumes the whole-book cap too
      - file: test/features/forecast/forecast_engine_test.dart
        name: 'three nested budgets with a bill in the innermost: every enclosing cap absorbs it once'
  - id: E-FC-15
    group: Web
    title: Web still stacks the bill on the whole-book cap
    when: same book opened on the web
    then: |
      - fixed 2026-10-27 · web claims every enclosing cap, as the app does
      - was: web line lower than the app's from next month on
    status: fixed
    risk: high
    related: [E-FC-14]
    tests:
      - file: src/app/(main)/forecast/lib/forecast-engine.test.ts
        repo: web
        name: 'a bill inside a sub-budget consumes the whole-book cap too: a complete month closes exactly one cap lower'
  - id: E-FC-16
    group: Web
    title: Web reads the old recurring toggle only
    when: app switched bills off, income on
    then: |
      - fixed 2026-10-27 · web reads and writes both toggles · old toggle off still switches both off
      - income estimate, monthly figures, pay rule, counted accounts now on the web too
    status: fixed
    risk: medium
    related: [E-FC-15]
    tests:
      - file: src/app/(main)/forecast/services/forecast.service.test.ts
        repo: web
        name: reads each recurring direction through the old single toggle, as the app does
      - file: src/app/(main)/forecast/lib/forecast-engine.test.ts
        repo: web
        name: 'switch separately: bills off keeps the salary, income off keeps the rent'
  - id: E-FC-18
    group: Web
    title: Web counted a changed occurrence on top of its booking
    when: '*Change this one* on a rule, then the server books that occurrence early'
    then: |
      - fixed 2026-10-27 · the real booking replaces the change, as in the app since 2026-10-07
      - was: both counted on the web until the date passed
    status: fixed
    risk: medium
    tests:
      - file: src/app/(main)/forecast/lib/forecast-engine.test.ts
        repo: web
        name: an amount override stops counting once the rule materialised that occurrence
  - id: E-FC-19
    group: Line
    title: Month breakdown left out the income estimate
    when: income estimate on (auto with income history, or *Received per month*)
    then: |
      - fixed 2026-10-27 in app + web · *Income* includes the estimate · net = month tile
      - was: breakdown net lower than the tile
    status: fixed
    risk: low
    related: [E-FC-01]
    tests:
      - file: test/features/forecast/ui/forecast_more_widgets_test.dart
        name: the income estimate is income too, so the net still equals the month net
      - file: src/app/(main)/forecast/lib/month-breakdown.test.ts
        repo: web
        name: the income estimate is income too, so the net still equals the month net
  - id: E-FC-20
    group: Line
    title: Loans breakdown hid a lent loan
    when: a lent loan next to a borrowed one, loans row tapped
    then: |
      - fixed 2026-10-27 in app + web · the lent loan is its own + line · the lines add up to the row
      - was: lent repayment missing, taken off the largest borrowed loan (car loan −150 shown as −50)
    status: fixed
    risk: medium
    tests:
      - file: test/features/forecast/ui/calculation_specs_test.dart
        name: a lent loan is its own line, paid back to the book, and the sheet still adds up
      - file: src/app/(main)/forecast/lib/calculation-specs.test.ts
        repo: web
        name: a lent loan is its own line, paid back to the book, and the sheet still adds up
  - id: E-FC-22
    group: Line
    title: This month's income counted twice
    when: salary typed in by hand on the 1st · no rule · today the 2nd
    then: fixed 2026-11-03 · the rest of the month adds no second salary (IOS-14-1)
    status: fixed
    risk: high
    related: [R-FC-15, E-FC-23]
    tests:
      - file: test/features/forecast/forecast_engine_test.dart
        name: a salary typed in on the 1st is this month
  - id: E-FC-23
    group: Web
    title: Web counts this month's income twice
    when: salary typed in by hand on the 1st · web forecast
    then: web still spreads the plain daily rate over the rest of the month (`forecast-engine.ts` `estimatePerDay`) · open
    status: known-issue
    risk: high
    related: [E-FC-22]
  - id: E-FC-21
    group: Web
    title: "*Book it now* on the web retires on a second click"
    when: overdue planned payment → *Book it now* on the web
    then: |
      - booking entry opens in a new tab, prefilled: title, category, side, amount, planned date
      - retired on *Mark as happened*, not on save · the app retires it on save
    status: known-issue
    risk: low
    related: [R-FC-41]
    tests:
      - file: src/app/(main)/forecast/components/item-review.test.tsx
        repo: web
        name: 'hands /add the title, category, amount and the planned date'
  - id: E-FC-17
    group: Line
    title: Restore keeps the five new settings at defaults
    when: a backup restored on the server
    then: income/bills toggles, estimate mode, monthly figures → defaults · `restore_book_apply` not redefined
    status: known-issue
    risk: low
  - id: E-FC-13
    group: Web
    title: Member changes settings on web
    when: member with a setting row edits on the web
    then: nothing saves, no message, value snaps back · unreported
    status: known-issue
    risk: low
  - id: E-FC-01
    group: Forecast
    title: Day feed vs month card
    when: active monthly income goal
    then: feed shows net, card outflow only → may disagree
    status: known-issue
    risk: medium
  - id: E-FC-02
    group: Forecast
    title: Exact-zero net tinted green
    when: month net exactly 0
    then: fixed 2026-10-22 · zero bare · negative plain · positive green · strip and month page agree
    status: fixed
    risk: low
  - id: E-FC-03
    group: Forecast
    title: Last day of a month
    when: per-day read on the last day
    then: all four places agree (C-FC-003)
    risk: medium
  - id: E-FC-04
    group: Chart
    title: Tooltip date and amount
    when: touch the forecast line
    then: "*Apr 14, 2027* · *$11k* in the money format · before *4/14/2027* · *$ 11.0k* · IOS-14-3"
    status: fixed
    risk: low
    tests:
      - file: test/shared/money_plain_test.dart
        name: places the symbol by the money format
