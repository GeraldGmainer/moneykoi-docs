        text: 'Assumptions: full months only · signed net + "X in · Y out" · test mid-month'
      - id: C-FC-003
        text: Per-day in 4 places matches · toggle *spread evenly* · test the last day
      - id: C-FC-004
        text: "Month breakdown: income · outflows · net · per day → net = tile"
