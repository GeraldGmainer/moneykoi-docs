# Trello release notes 1.17.0 (item 16); the "Everyday" group is derived from the context docs.
groups:
  - id: everyday
    title: Everyday
    items:
      - id: C-FC-010
        text: "Safe to spend names payday or month end · negative → red shortfall · little history: 24 draws 12"
      - id: C-FC-011
        text: Plan a payment → line dips · Budget Book + balances unchanged
      - id: C-FC-012
        text: Skip an occurrence → gone · rule unchanged, books the next · Undo
      - id: C-FC-013
        text: Book a planned one early → suggested · confirm → once · overdue → *It didn't happen*
      - id: C-FC-014
        text: Alerts on · outflow below zero next week → one notification with date, no amount
      - id: C-FC-015
        text: "Drawer *Forecast* after *Recurring* · Pro: opens with no Home card · Free: dimmed in the Pro group → paywall at Forecast"
      - id: C-FC-028
        text: Lent loan next to a borrowed one → loans row → lent loan is its own + line · lines add up to the row
  - id: calculation
    title: Calculation · 2026-10-22
    items:
      - id: C-FC-016
        text: "Whole-book budget + sub-budget + bill inside → next month's outflow = cap · sheet: budgets = cap − bills inside"
      - id: C-FC-017
        text: "Sources page: tap every row → sheet · parts sum to the row · budgets sheet names cap − bills inside − nested"
      - id: C-FC-018
        text: "Bills toggle off → whole-book month unchanged · a bill without budget: row says *n bills outside any budget*"
      - id: C-FC-019
        text: "Child benefit on the 8th + salary on the 30th → *Free until 30.* from the 1st, not *until 8.*"
      - id: C-FC-020
        text: "Settings → Accounts that count → savings off → balance card and hero drop its money · its rules gone"
      - id: C-FC-021
        text: "Income estimate: book without a salary rule, 2 full months → line rises · *Received per month* by hand works"
      - id: C-FC-022
        text: "Hero *≈ +X a month* ≈ month tiles' nets · tile shows *Low* · chips one row · chart labels *Nov* when opened late in a month"
      - id: C-FC-023
        text: "Web vs app, same book: Free until, *a month*, 12-month closing, low, month tiles, every sources row equal · web sources rows open their sums"
      - id: C-FC-024
        text: "Web settings: bills off / savings account off → app shows the same toggles after sync · and back"
  - id: web-review
    title: Web review · 2026-10-28
    items:
      - id: C-FC-025
        text: "Web: book a planned payment 2 days early → *Planned payments to check* under the hero · *Yes, that's it* → card gone, plan off the line · Undo brings it back · app shows it *Happened* after sync"
      - id: C-FC-026
        text: "Web: planned date passed → *Book it now* → new tab, title, category, amount and date filled · save · *Mark as happened* → gone · repeating plan *It didn't happen* → only that date gone, next one still on the line"
      - id: C-FC-027
        text: "Web: *Not this booking* → suggestion gone at once, past date then asks *did it happen?* · reload keeps it · other book or the phone still asks"
  - id: web-calendar
    title: Web calendar · 2026-11-07
    items:
      - id: C-FC-029
        text: "Web: *Calendar* → the whole page is the year, month columns of day rows · today marked · past balances = the Balance page's line on those days · rent day: −rent in the movement, balance drops by it, *Rent* beside · quiet days blank in the movement, balance still sloping · ‹ › to last year and next · reload keeps it · *Compact* → week grid, reload keeps it · hover a day → items, amounts, closing"
      - id: C-FC-030
        text: "Web on a phone (and 320 px): one month column, no sideways scroll · tap a day → sheet with booked + expected · *Skip this one* works · a 6-figure balance fits whole · a 9-figure one reads *123M*, whole in the sheet"
  - id: app-calendar
    title: App calendar · 2026-11-09
    items:
      - id: C-FC-033
        text: "Forecast → calendar icon → this year, today's row (orange circle) mid-screen · rows above dimmer · rent day: gray dot, balance drops by the rent, *Rent* beside · payday: green dot · a day with 3+ items: two dots, a green one if any money came in · quiet days no dot, balance still sloping · scrolling: the month's name stays on top, a clear gap before the next month · past balances = the web calendar's on the same days · ‹ last year, › next year, arrows stop at the ends · 360 dp phone: no figure cut, no sideways scroll"
      - id: C-FC-034
        text: "Tap a past day → *Booked* rows open the booking, no *Plan* · tap a future rent day → *Expected* → *Skip this one* → day sheet gone, Undo snackbar · balance from that day up by the rent · Undo → back · *Plan something on this day* → item form with that date · read-only member: no *Plan* · German + Japanese"
      - id: C-FC-035
        text: "Calendar → date icon → the sheet starts at the book's first day, ends at the forecast's last · pick a day next year → that year opens, the day mid-screen in orange · scroll away, pick the same day → scrolls back · *Today* → today's row · ‹ › clears the orange · figures readable at a glance (bigger than the first build) · day sheet: opening and closing side by side, labels on one line, amounts as large as the booking rows' or larger · German + Japanese label on long-press"
  - id: release-1-17
    title: Forecast fixes · 1.17.0
    items:
      - id: C-FC-001
        text: Whole 2000 + Food 600 + Dining 200 → future month shows 2000 (was 1800)
      - id: C-FC-002
        text: 'Assumptions: full months only · signed net + "X in · Y out" · test mid-month'
      - id: C-FC-003
        text: Per-day in 4 places matches · toggle *spread evenly* · test the last day
      - id: C-FC-004
        text: "Month breakdown: income · outflows · net · per day → net = tile"
      - id: C-FC-005
        text: "Copy: *How the line is built* · *Covered by the whole-book budget* · *Everyday estimate*"
  - id: release-2-0-0
    title: 2.0.0 · 2026-11-08
    items:
      - id: C-FC-031
        text: "Forecast → planned payments in three groups: *Upcoming* · *To check* · *Booked or skipped* · book one → it moves to the last group · German + Japanese headers fit"
      - id: C-FC-032
        text: "Committed + everyday + buffer above the balance → *Of the balance*: everyday keeps its figure, a short row names the gap, no *Free 0.00* · three 39.99 bills booked by hand, then a 39.99 rule → the monthly line counts it once · overdue planned payment → *Book it now* → form on the planned date · Home forecast card *In 1 month* → caption *End of November*"
  - id: release-2-1-findings
    title: 2.1 · device round 2026-11-11
    items:
      - id: C-FC-036
        text: "Forecast calendar → tap the day a starting balance was set → *Initial balance* row · rows add up to *Net change*"
      - id: C-FC-037
        text: "Font size 200 % → forecast calendar → day numbers and weekdays whole · pinned month header clear of the first row"
      - id: C-FC-038
        text: "Listed asset, bought twice, before market prices arrive → position chart drawn from the trade prices (no emulator has the catalog)"
