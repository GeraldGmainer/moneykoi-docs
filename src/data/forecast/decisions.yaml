    question: Safe to spend · which income ends the window?
    status: decided
    date: 2026-10-22
    answer: "next occurrence of the largest income rule · no setting · built"
  - id: D-FC-11
    question: Hero · show the per-month net?
    status: decided
    date: 2026-10-22
    answer: "*≈ +X a month* under the closing · built"
  - id: D-FC-12
    question: Month tiles · show the low too?
    status: decided
    date: 2026-10-22
    answer: "*Low X · date* as a second figure · built"
  - id: D-FC-13
    question: Which accounts count?
    status: decided
    date: 2026-10-22
    answer: "settings row *Accounts that count* · built"
  - id: D-FC-14
    question: Horizon chips in one row?
    status: decided
    date: 2026-10-22
    answer: "`3 · 6 · 12 · 24` + *Months* caption · built"
  - id: D-FC-2
    question: Match a booked payment automatically?
    status: decided
