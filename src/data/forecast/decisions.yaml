items:
  - id: D-FC-1
    question: Setup coach, nudges, scorecard, per-account
    status: open
    answer: |
      - not built · parked in `plan_later/FORECAST_PLAN.md`
      - accuracy data already recorded daily
  - id: D-FC-3
    question: Recurring · one row or two?
    status: decided
    date: 2026-10-22
    answer: "two rows, two toggles · *Recurring income* · *Recurring bills* · built"
  - id: D-FC-4
    question: Budget only · what does *bills off* do?
    status: decided
    date: 2026-10-22
    answer: "no new mode · bills toggle off + whole-book budget · row names bills no budget covers · built"
  - id: D-FC-5
    question: No rules, no budgets · where does income come from?
    status: decided
    date: 2026-10-22
    answer: "income estimate · median of the last months, spread per day · auto / manual / off · built"
  - id: D-FC-6
    question: Monthly figures by hand for a fresh book?
    status: decided
    date: 2026-10-22
    answer: "*Spent per month* + *Received per month* · engine divides by the month's days · built"
  - id: D-FC-7
    question: History averages in the sheet?
    status: decided
    date: 2026-10-22
    answer: "*Last n months* block · was vs will be · built"
  - id: D-FC-8
    question: Rename *Forecast quality* + show accuracy?
    status: decided
    date: 2026-10-22
    answer: "*Coverage* + accuracy line from the daily snapshot · built"
  - id: D-FC-9
    question: Sources as a page · calculations as its sheets?
    status: decided
    date: 2026-10-22
    answer: "page replaces the sheet · calculation sheet per row · toggles view-only · built"
  - id: D-FC-10
    question: Safe to spend · which income ends the window?
    status: decided
    date: 2026-10-22
    answer: "next occurrence of the largest income rule · no setting · built"
  - id: D-FC-11
    question: Hero · show the per-month net?
    status: decided
    date: 2026-10-22
    answer: "*≈ +X a month* under the closing · built"
  - id: D-FC-12
    question: Month tiles · show the low too?
    status: decided
    date: 2026-10-22
    answer: "*Low X · date* as a second figure · built"
  - id: D-FC-13
    question: Which accounts count?
    status: decided
    date: 2026-10-22
    answer: "settings row *Accounts that count* · built"
  - id: D-FC-14
    question: Horizon chips in one row?
    status: decided
    date: 2026-10-22
    answer: "`3 · 6 · 12 · 24` + *Months* caption · built"
  - id: D-FC-2
    question: Match a booked payment automatically?
    status: decided
    answer: No · suggest only · a wrong match drops a payment you count on
  - id: D-FC-15
    question: Count an overdue planned payment until it is answered?
    status: decided
    date: 2026-11-06
    answer: |
      - **a) count it as due today** until booked, skipped or moved · build: 2.0.1
      - before: a planned payment past its date drops out of the line while it waits in *Planned payments to check* · *Already spoken for $0.00* · the forecast reads 260 $ too high
      - a) count it as due today until it is booked, skipped or moved
      - b) keep it out, and say on the card what the review holds
      - source: Android emulator round, AND-14-6
  - id: D-FC-16
    question: "Home *IN 1 MONTH* shows the month end: caption the date?"
    status: decided
    date: 2026-11-06
    answer: |
      - **caption the date** · *End of November* · *Ende November* · *11月末* · another year → *End of October 2027* · built 2026-11-06
      - horizon stays the month end · matches the month tiles
      - source: Android emulator round, AND-14-5
  - id: D-FC-17
    question: Forecast calendar in the app too?
    status: open
    answer: |
      - the web has one since 2026-11-07 (R-FC-42): a year, each day's end balance, booked up to today and forecast after, a day panel
      - the app lists a budget-book calendar with projected balances as later work, "only after a prototype" (FORECAST §12.3) · the web calendar is that prototype
      - a) port it to the app's forecast page · b) keep it web-only
