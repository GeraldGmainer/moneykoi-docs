  - id: R-SCN-32
    group: Review & save
    title: How much was bought is kept
    text: |
      - *2 x 1,29*, *0,59 x 3*, *1,079 kg x 2,49 EUR/kg*, *6,000 ST a 9,08* → saved with the item: amount, unit, price per unit
      - only when it multiplies out to the line total · a pack size (*6x0,5L*) is not a quantity
      - LIDL on the item row · ADEG and BILLA the row above · SPAR between name and price · LIDL's weight row below
      - the deposit is not in the price per unit · a discount is · a weighed item keeps the printed price per kg
      - a new price typed in the review → the line counts as **1 piece** (D-ANL-12) · a renamed line keeps it
      - *Merge* keeps the products inside the receipt; the bookings merge as before (D-ANL-7)
      - a count the photo lost (*X 3,99 7,98*, *5,99 11,98* under the name) is read off the total when it is an exact multiple
      - for everyone, Free too · read by *Price changes* (Pro, R-ANL-41)
      - measured 2026-11-14 on ADEG, BILLA, LIDL, SPAR: **92 %** right on the app's OCR (emulator scales), 62 % on the Mac stand-in · the 85 % bar of D-ANL-13 is met
    source: SCANNER §4.13f
    related: [R-ANL-41, D-ANL-12, D-ANL-13]
    tests:
      - file: test/features/receipt/domain/parsers/quantity_reader_test.dart
        name: "ADEG: the row above the item, never the item before it"
      - file: test/features/receipt/use_cases/save_receipt_use_case_test.dart
        name: a counted line saves quantity, unit and the unit price as decimal strings
  - id: R-SCN-35
    group: Review & save
    title: Account from the payment on the receipt
    text: |
      - paper says cash (*ZAHLUNG BAR*, *Gegeben Bar*, *Bar*) → a **cash** account
      - debit card (*Visa Debit*, *Debit Mastercard*, *E-Cash*, *EC-Karte*, *Maestro*, *Bankomat*) → a **checking** account
      - card brand without *Debit* (*Visa*, *Mastercard*, *Kreditkarte*) → a **credit card** account · none → checking
      - card without a brand (*Kartenzahlung*, *Karte*, *kontaktlos*) → checking while the book has no credit card account · else not sure
      - bank printed on the slip (*Erste Visa Debit*) → the account with that word in its name, first
      - several fit → the one with the latest booking (either side of a transfer) · never booked → last used, else the first · hidden accounts never
      - not sure, cash **and** card, nothing printed, or no fitting account → last used account, as before
      - a picked account is **not** remembered as last used · the user's own pick still is, and survives *Scan more*
      - ignored: vouchers, loyalty cards (*PAYBACK*, *OBI-Karte*), *Rückgeld* alone (card slips print *0,00*)
      - corpus 2026-11-15, 155 receipts: 72 cash · 56 debit · 4 credit (a bare *Visa*) · 23 nothing printed or read
    source: SCANNER §4.51
    related: [D-SCN-24, E-SCN-74]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_import_test.dart
        name: ZAHLUNG BAR opens the review on the cash account and leaves the last used one alone
      - file: test/features/receipt/bloc/scanner_cubit_import_test.dart
        name: an account the user picked stays through Scan more
      - file: test/features/receipt/domain/services/payment_account_resolver_test.dart
        name: of several, the one with the latest booking
      - file: test/features/receipt/domain/services/payment_method_detector_test.dart
        name: "change given back alone says nothing: card slips print RÜCKGELD 0,00 too"
