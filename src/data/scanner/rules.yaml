# Source: app SCANNER_AI_CONTEXT.md, CATEGORY §8a, skills/scanner-corpus-round; web BOOKING_ENTRY §4.9.
items:
  - id: R-SCN-01
    group: The flow
    title: On the phone, no cloud
    text: |
      - ML Kit OCR on the device · no cloud AI
      - on-device LLM removed 2026-09-28
      - web: no scanner · splits a total by hand
    source: SCANNER §1
  - id: R-SCN-02
    group: The flow
    title: One live scan, then review
    text: |
      1. **Read**: hover top to bottom · every frame and every *Capture* still go into one receipt · a row counts once seen twice (a still: once) · RKSV / TSE QR gives total and date exactly
      2. **Photo**: optional, when no still was taken · *Without photo*
      3. **Review**: fix · merge · categorize · *Save*
    source: SCANNER §1, §4.37
    related: [R-SCN-11, R-SCN-25]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: a QR code gives the total the rows never showed, and a zero-total code is ignored
  - id: R-SCN-04
    group: The flow
    title: Shop parsers + a generic one
    text: |
      - own parser: SPAR · BILLA · LIDL · ADEG · HOFER · TEDI · Smyths · OBI
      - other shops → generic parser
      - restaurant → one *Dining* booking
      - one-category shops (Baumarkt, IKEA, pharmacy, petrol, DM/BIPA) → one booking
    source: SCANNER §1, §2
    tests:
      - file: test/features/receipt/domain/constants/merchant_category_registry_test.dart
        name: unknown merchants are itemizable with no default category
  - id: R-SCN-05
    group: The flow
    title: "*Skip items* = one booking"
    text: total known, no item read yet · total as one uncategorized line · pick the category in review
    source: SCANNER §1
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: Skip items books one uncategorised line at the total
  - id: R-SCN-06
    group: The flow
    title: From gallery photos
    text: |
      - one or more, top to bottom · read at **full size**, like a *Capture* still
      - unreadable photo fails alone · no total anywhere → back to the camera
      - overlapping photos are joined by their rows
      - also without a camera: *Pick photos* on the camera-declined and error cards
    source: SCANNER §4.30, §4.38
    related: [R-SCN-26, E-SCN-33]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_camera_test.dart
        name: and an unreadable photo is reported there
      - file: test/features/receipt/bloc/scanner_cubit_import_test.dart
        name: "an imported photo is read like a still: at its own size, and scaled down where that does not add up"
  - id: R-SCN-25
    group: The flow
    title: When a scan ends
    text: |
      - ready: items = total (±5 ct) as read · a repaired price **never** counts
      - ends at once: QR read · *Capture* still · total + date confirmed in review
      - otherwise: once the phone rests (R-SCN-27) → buzz → photo step or review
      - *Done*: ends early · mismatch → review banner · no total → review at 0
    source: SCANNER §4.37, §4.38
    related: [R-SCN-27, E-SCN-20]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: Done ends the pass early; a total never read opens the review at 0
      - file: test/features/receipt/domain/services/scan_finish_rule_test.dart
        name: "the code: its total and date are exact"
      - file: test/features/receipt/domain/services/scan_finish_rule_test.dart
        name: a still, which showed all there is to show
  - id: R-SCN-27
    group: The flow
    title: The scan waits for the receipt's end
    text: |
      - date, shop name and QR often print **below** the total
      - rest = no new row + no movement for 1.2 s
      - 2.5 s while date or shop are still unread
      - hint until then · *Keep going to the end of the receipt*
    source: SCANNER §4.38
    related: [R-SCN-25, R-SCN-28, E-SCN-32]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: the date printed below the total is read when the pan goes on, and the hint asks for it
      - file: test/features/receipt/domain/services/scan_finish_rule_test.dart
        name: while the date or the shop is unread the pause is the longer one
      - file: test/features/receipt/domain/services/scan_finish_rule_test.dart
        name: "frames that show no receipt count as rest: lifting the phone away ends it"
    checks: [C-SCN-018, C-SCN-019]
  - id: R-SCN-26
    group: The flow
    title: Camera and photo size
    text: |
      - camera at the sensor's full resolution · opens at 2× zoom (lens range permitting)
      - a still is read **twice** · full size in bands + whole at 1920 px
      - the reading whose items meet the total is the receipt · never a mix
      - the stored photo stays 1080 px wide, cropped to the frame · upload unchanged
    source: SCANNER §4.8, §4.38
    tests:
      - file: test/features/receipt/domain/services/still_reader_test.dart
        name: a sensor-size still is read in overlapping bands and merged into one page in its own pixels
      - file: test/features/receipt/domain/services/still_reader_test.dart
        name: a large still is read a second time scaled down
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: the second is the receipt when the first misses a row and the second adds up
  - id: R-SCN-22
    group: The flow
    title: Camera declined · ask again before Settings
    text: |
      - *Not now* in the app's own camera dialog → card *Allow camera*, which shows the phone's real prompt
      - *Open Settings* only once the phone itself refused (iOS lists the switch only after it asked once)
      - Android: the first refusal can still be asked again, the second sends to Settings
    source: SCANNER §4.15g
    tests:
      - file: test/features/receipt/ui/pages/scanner_page_test.dart
        name: a decline in the app rationale offers the real request, never Settings
      - file: test/features/receipt/bloc/scanner_cubit_camera_test.dart
        name: a refusal the OS will not ask again about sends the user to Settings
    checks: [C-SCN-010]
  - id: R-SCN-11
    group: The flow
    title: German TSE QR = like RKSV
    text: |
      - KassenSichV `V0;…` locks total + date exactly · sums per VAT rate kept
      - only sales · training/voided/cancelled ignored
      - date = local day · shop learned per till from the first fix
      - built from the spec · untested on real receipts (C-SCN-006)
    source: SCANNER §4.36, §4.38
    related: [R-SCN-30]
    tests:
      - file: test/features/receipt/domain/parsers/tse_parser_test.dart
        name: sums the gross amounts per rate into the total
      - file: test/features/receipt/domain/parsers/tse_parser_test.dart
        name: ignores everything that is not a sale
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: reads a German TSE code as well
  - id: R-SCN-12
    group: The flow
    title: Not in books without cents
    text: |
      - currencies without 2 decimals (yen, won, forint, rupiah, dong, CLP, KWD)
      - → *not available yet* · *Got it* · camera never starts
      - currency lookup fails → scanner opens as before
    source: SCANNER §4.36
    tests:
      - file: test/features/receipt/ui/pages/scanner_page_test.dart
        name: a book in a currency without cents gets
      - file: test/features/receipt/ui/pages/scanner_page_test.dart
        name: a failed currency lookup still opens the scanner
  - id: R-SCN-13
    group: The flow
    title: Beta · one page before the first scan
    text: |
      - *BETA* · *Made for Austrian receipts*
      - total, date, photo: most receipts
      - items: tuned for the 8 shops · others a best guess
      - the only page before the first scan (D-SCN-05, 2026-11-11) · no *Skip*, no progress bar · *Got it, scan a receipt* opens the camera
      - shown once · help button replays every step, the three camera pages included
    source: SCANNER §4.15g, §4.36
    related: [D-SCN-01]
    tests:
      - file: test/features/receipt/ui/widgets/scanner_onboarding_test.dart
        name: opens on the coverage step
      - file: test/features/receipt/ui/widgets/scanner_onboarding_test.dart
        name: "is the only page: no progress bar, no Skip, and the one button starts the camera"
      - file: test/features/receipt/domain/parsers/shop_registry_test.dart
        name: every shop the onboarding lists as itemized has its own parser
  - id: R-SCN-03
    group: Review & save
    title: Every line needs a category
    text: |
      - unresolved → *Tap to categorise* · **no** silent "Other"
      - guess names a parent with subs → a fitting sub inside it · none → blank · never the parent (D-SCN-04)
      - Save off until: all categorized + sum = total (1 ct apart still counts, R-SCN-31) + account picked
      - Categories page warns ahead
    source: SCANNER §4.9, §4.15d, CATEGORY §8a
    related: [R-LED-01, R-LED-20]
    tests:
      - file: test/features/receipt/domain/services/scanner_intelligence_service_test.dart
        name: never resolves to a parent that has subcategories
      - file: test/features/receipt/domain/services/scanner_intelligence_service_test.dart
        name: a guess only a parent with subcategories matches leaves the line uncategorised
      - file: test/features/receipt/domain/services/scanner_intelligence_service_test.dart
        name: a guess naming a parent stays inside it, even when a leaf elsewhere would fit
  - id: R-SCN-07
    group: Review & save
    title: One booking per line
    text: |
      - description = item · merged line = merchant
      - + receipt record · round-ups · trip tag
      - total editable · mismatch blocks Save
    source: SCANNER §4.17, §4.18, §4.27
    related: [R-SCN-31]
  - id: R-SCN-08
    group: Review & save
    title: Merge all · by category · undo
    text: |
      - all → one line, shop's name
      - by category → one per category
      - first merge undoable
    source: SCANNER §4.17
  - id: R-SCN-09
    group: Review & save
    title: Photos kept · uploaded on Cloud
    text: |
      - *Upload photos*: per device, default on
      - no Cloud → queued on the phone · Cloud → book storage
    source: SCANNER §4.17, OFFLINE_TIER §7
    related: [R-MON-14]
  - id: R-SCN-10
    group: Review & save
    title: The scanner learns
    text: |
      - category fixes remembered on the device · quick booking uses them
      - restaurant venue learned from its QR · a pick outside the dining category unlearns it
    source: SCANNER §4.21, QUICK_BOOKING §3
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: recategorising a restaurant scan away from Dining learns it is not one
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: a pick inside the branch Dining resolves to keeps the venue a restaurant
  - id: R-SCN-20
    group: Accuracy
    title: Measured on real receipts
    text: |
      - 152+ receipts with truth files (2026-09-26)
      - every fix round measured before + after
      - photos never in the app repo · `scanner-corpus-round` skill
    source: SCANNER §4.31–§4.35
  - id: R-SCN-21
    group: Review & save
    title: First review · three tips, no carousel
    text: |
      - the first review shows one-line tips in place: *Tap any field to fix it* · *Every item needs a category* (while one is missing) · *Save, and each item becomes a booking* (once all are set)
      - one at a time, in that order · the next appears once the shown one is closed (×) or acted on · the save tip sits under the items, not over them (since 2026-11-06, AND-7-3)
      - the save tip shows only while *Save* is on · a tap on it saves like the button, **never** more (E-SCN-49)
      - each once, per phone · the help button still replays the full intro, Edit & Merge included
      - whoever saw the old 4-page tutorial sees no tips
    source: SCANNER §4.15g
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_flow_test.dart
        name: "one tip at a time: hero first, the category tip once the hero is closed"
      - file: test/features/receipt/service/scanner_onboarding_progress_test.dart
        name: whoever saw the old carousel is shown nothing
    related: [R-SCN-13, R-SCN-03, E-SCN-49]
  - id: R-SCN-23
    group: Review & save
    title: Amounts on the app keypad
    text: |
      - *Total* and an item's *Price* are typed on the app's own keypad, like every other amount
      - ✓ hands the sheet back · the item sum and *still missing* stay above the keys
      - the *Total* row shows a neutral money icon, never a currency sign of its own
    source: SCANNER §4.27, §4.17
    tests:
      - file: test/features/booking/ui/widgets/add_receipt/review_total_edit_sheet_test.dart
        name: the sheet opens on the keypad, never on the OS number pad
      - file: test/features/booking/ui/widgets/add_receipt/review_item_edit_sheet_test.dart
        name: the price is keyed on the app keypad, the name is the only text field
    checks: [C-SCN-012]
  - id: R-SCN-24
    group: Review & save
    title: A receipt typed in starts neutral
    text: |
      - total entered, no item yet → *Add items up to {total}*, grey
      - *Math mismatch* in red only once items exist and still disagree
    source: SCANNER §4.17
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_test.dart
        name: a hand-entered receipt with a total and no item yet starts neutral, not red
      - file: test/features/booking/ui/pages/add_receipt_page_test.dart
        name: a hand-entered receipt turns red once its items disagree with the total
  - id: R-SCN-28
    group: Review & save
    title: A date that was not read
    text: |
      - scanned receipt, no readable date → today · marked *Date not read · today*
      - a date more than 10 years back or in the future is **never** taken
      - a damaged date (`05,02.2026`) counts only when no clean one is printed
      - typed-in receipt → today, no mark
    source: SCANNER §4.38
    related: [R-SCN-27, E-SCN-34]
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_test.dart
        name: a scanned receipt whose date was not read says so; one that was read, or was typed in, does not
      - file: test/features/receipt/domain/services/receipt_data_extractor_test.dart
        name: a date in a year no receipt at hand has is not read at all (tastekitchen_20260618_B)
      - file: test/features/receipt/domain/services/receipt_data_extractor_test.dart
        name: a clean date wins over a damaged one above it
  - id: R-SCN-29
    group: Review & save
    title: Suggested fix for a mismatch
    text: |
      - items ≠ total + exactly **one** small fix closes the gap → card *Suggested fix*
      - fix = ≤ 2 prices by a misread digit or lost comma · or 1 row dropped
      - only prices read off the paper · nothing changes without *Apply*
      - rare by design · most gaps are missing rows, not digits
    source: SCANNER §4.38
    related: [R-SCN-07, D-SCN-07, E-SCN-22]
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_test.dart
        name: a scanned receipt one misread row away from its total offers the fix, and Apply hands it to the cubit
      - file: test/features/receipt/domain/services/receipt_repair_search_test.dart
        name: two rows that could carry the same fix are ambiguous, so nothing is suggested
      - file: test/features/receipt/domain/services/receipt_repair_search_test.dart
        name: two misread digits on two rows are found together
    checks: [C-SCN-021]
  - id: R-SCN-30
    group: Accuracy
    title: Germany and Switzerland · header first
    text: |
      - total, date, shop read like Austrian receipts · `CHF` + `1'234.50` amounts
      - EDEKA, Kaufland, ALDI, Migros, Coop, Denner, Volg → groceries
      - items → generic parser, a best guess · VAT letters only from the receipt's own table
      - **no** real German or Swiss receipt tested yet (T-SCN-08)
    source: SCANNER §4.38
    related: [R-SCN-11, D-SCN-09, R-SCN-13]
    tests:
      - file: test/features/receipt/domain/services/receipt_data_extractor_test.dart
        name: "a Swiss total: CHF, a dot decimal, an apostrophe for the thousands"
      - file: test/features/receipt/domain/services/receipt_data_extractor_test.dart
        name: a total of a thousand and more is read with its separator and without one

  - id: R-SCN-31
    group: Review & save
    title: One cent never blocks Save
    text: |
      - items vs. total compared in whole cents
      - gap of 1 ct → no *Math mismatch*, *Save* stays on · at **any** amount
      - 2 ct or more → mismatch, *Save* off
      - kept on 2026-11-13 · exact match not taken (D-SCN-14)
    source: SCANNER §4.40
    related: [R-SCN-03, R-SCN-07, D-SCN-14, E-SCN-50]
    tests:
      - file: test/features/booking/ui/widgets/add_receipt/review_metrics_test.dart
        name: a one-cent gap is judged the same at every amount
      - file: test/features/booking/ui/widgets/add_receipt/review_metrics_test.dart
        name: a two-cent gap is a mismatch at every amount
