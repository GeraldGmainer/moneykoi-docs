items:
  - id: J-SCN-01
    group: Scanning
    title: Scans a supermarket receipt
    from: Home quick action *Scan receipt* (or the booking form)
    steps:
      - hold over the receipt until total, date, shop lock
      - photograph items part by part
      - review → categorize, fix, merge → *Save*
    result: one booking per item + photo
    checks: [C-SCN-001]
  - id: J-SCN-02
    group: Scanning
    title: Scans a restaurant bill
    from: the scanner
    steps:
      - total locks · restaurant detected
      - one photo, or *Without photo*
    result: one *Dining* booking
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_harvest_capture_test.dart
        name: one shot books the restaurant line with the photo
    checks: [C-SCN-002]
  - id: J-SCN-03
    group: Scanning
    title: Imports from the gallery
    from: scanner → gallery button
    steps:
      - pick photos top to bottom
    result: review, like from the camera
    checks: [C-SCN-003]
  - id: J-SCN-04
    group: Scanning
    title: Receipt for an existing booking
    from: a booking → *Scan receipt*
    steps:
      - scan
    result: receipt linked · photos uploaded
