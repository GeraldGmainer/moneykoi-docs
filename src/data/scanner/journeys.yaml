items:
  - id: J-SCN-01
    group: Scanning
    title: Scans a supermarket receipt
    from: hold **+** → *Scan receipt* · Home quick action *Scan receipt* · the booking form
    steps:
      - start at the store name, move the phone down at a brisk pace · the strip at the right edge turns green where the receipt is read, a white frame shows where the camera is · the hint's ring turns once per reading (R-SCN-33, R-SCN-34)
      - the panel counts items and the sum · the hint says what is still needed
      - too fast → *Slower* at once, with a vibration · a stretch that stays yellow on the strip → *… still missing · back to the yellow mark* → hover there until it is green
      - items meet the total → *Keep going to the end of the receipt* until date and shop are read
      - sure (the same result twice, date and shop read, a few rows read below the total) → ends at once, the hand still moving · QR read → at once · otherwise once the phone rests (a green bar fills meanwhile) → buzz → optional photo or *Without photo* (R-SCN-25)
      - "short receipt: one tap on *Capture* instead · *Done* ends early"
      - review → categorize, fix, merge → *Save*
    result: one booking per item, + photo when one was taken
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: frames that read the whole receipt end the pass when the items meet the total, then offer the photo
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: "one still of a short receipt is the whole scan: review opens with the photo and its item boxes"
    checks: [C-SCN-001, C-SCN-014, C-SCN-018]
  - id: J-SCN-02
    group: Scanning
    title: Scans a restaurant bill
    from: the scanner
    steps:
      - header and total read (or the QR) · restaurant detected → the scan ends there
      - one photo, or *Without photo*
    result: one *Dining* booking
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: reaching review on a restaurant QR learns the venue as a restaurant
    checks: [C-SCN-002]
  - id: J-SCN-03
    group: Scanning
    title: Imports from the gallery
    from: scanner → gallery button, or *Pick photos* when the camera is declined or missing
    steps:
      - pick photos top to bottom
      - each is read at full size, QR included
    result: review, like from the camera
    checks: [C-SCN-003, C-SCN-011, C-SCN-020]
  - id: J-SCN-04
    group: Scanning
    title: Receipt for an existing booking
    from: a booking → *Scan receipt*
    steps:
      - scan
    result: receipt linked · photos uploaded
