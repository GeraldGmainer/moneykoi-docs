items:
  - id: E-SCN-01
    group: Reading
    title: Misread total
    when: OCR misreads `SUMME`
    then: editable in review · magic wand → items' sum
    risk: medium
  - id: E-SCN-02
    group: Reading
    title: Web-link QR
    when: QR is a link, not RKSV data
    then: resolved online once → total and date from the code
    risk: low
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: a web-link code is resolved once per pass
  - id: E-SCN-03
    group: Reading
    title: ADEG multiplier rows
    when: '"2 x 1,29" above the item'
    then: row skipped · item keeps its total
    risk: medium
    tests:
      - file: test/features/receipt/domain/parsers/adeg_parser_strategy_test.dart
        name: a multiplier row above is skipped; the item below keeps its total
  - id: E-SCN-07
    group: Reading
    title: German receipt late evening
    when: TSE time after 23:00 UTC
    then: booked on the printed local day
    status: by-design
    risk: low
    tests:
      - file: test/features/receipt/domain/parsers/tse_parser_test.dart
        name: a sale after 23:00 UTC lands on the next local day
  - id: E-SCN-04
    group: Saving
    title: Category doesn't exist
    when: keyword resolves to a missing bucket
    then: line → *Tap to categorise* · Save waits for a pick · Categories hint warns ahead
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/domain/services/scanner_intelligence_service_test.dart
        name: a guess only a parent with subcategories matches leaves the line uncategorised
  - id: E-SCN-08
    group: Saving
    title: Only a parent with subs matches
    when: guess names a parent that has subs (German sub-category book · *Wohnen*, *Gesundheit*, *Transport*)
    then: a fitting sub of that parent (*Möbel*, *Apotheke*, *Tanken*) · none → *Tap to categorise*, never a leaf elsewhere (D-SCN-04) · fixed 2026-10-27
    status: fixed
    risk: high
    related: [R-LED-01, R-SCN-03, D-SCN-04]
    tests:
      - file: test/features/receipt/domain/services/scanner_intelligence_service_test.dart
        name: never resolves to a parent that has subcategories
      - file: test/features/receipt/domain/services/scanner_intelligence_service_test.dart
        name: a parent whose subs are all hidden still takes no line
  - id: E-SCN-09
    group: Saving
    title: Restaurant scan re-picked to its own dining sub
    when: German book · restaurant scan · user picks *Auswärts essen* or another sub of the dining parent
    then: venue stays a restaurant · only a pick outside that branch unlearns it · fixed 2026-10-27
    status: fixed
    risk: medium
    related: [R-SCN-10]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: a pick inside the branch Dining resolves to keeps the venue a restaurant
  - id: E-SCN-05
    group: Saving
    title: Long receipts + retakes
    when: "same part read twice — hovered back over, or a second still of it"
    then: rows are placed by position before any parsing · a retake adds no row · never over the total · fixed 2026-11-11 (one assembled receipt, SCANNER §4.37)
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: "a retake of the same page adds no line: one part, the sum still matches"
  - id: E-SCN-06
    group: Web
    title: Web manual split
    when: receipt split on `/add-receipt`
    then: no receipt record · merchant lost · open · items saved all or none since 2026-10-24
    status: known-issue
    risk: medium
    related: [E-BKG-23]
  - id: E-SCN-10
    group: Saving
    title: Photo with its boxes on an iPad
    when: iPad · scan review · tap the photo tile (*Photo #1 · 6 items*)
    then: the photo runs past the dialog's bottom · 113 px on a 13" iPad · clipped in a release build · found by the App Store screenshot run 2026-11-01 · open
    status: known-issue
    risk: low
    related: [E-SCN-11]
  - id: E-SCN-11
    group: Reading
    title: iPhone reads one line fewer than Android
    when: iOS · the website's demo receipt *Markt am Eck* imported from the gallery
    then: 6 of 7 items · *Joghurt natur 250g 0,99* missed · *Math mismatch* by 0.99 · Android reads all 7 · found by the App Store screenshot run 2026-11-01 · not yet checked on a real iPhone · open
    status: known-issue
    risk: medium
    related: [E-SCN-10]
  - id: E-SCN-12
    group: Camera
    title: "*Not now* led to a Settings page without a camera switch"
    when: iPhone · camera dialog → *Not now*
    then: card *Allow camera* fires the iOS prompt · *Open Settings* only after iOS refused · before 2026-11-03 straight to Settings, where iOS shows no switch until it asked once (IOS-7-1)
    status: fixed
    risk: high
    related: [R-SCN-22]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_camera_test.dart
        name: declining the app rationale leaves the real request open
  - id: E-SCN-13
    group: Camera
    title: No camera, no way in
    when: camera declined, broken, or none (simulator)
    then: "*Pick photos* on the card reads gallery photos · before 2026-11-03 only *Open Settings* / *Try again* (IOS-7-2)"
    status: fixed
    risk: medium
    related: [R-SCN-06]
    tests:
      - file: test/features/receipt/ui/pages/scanner_page_test.dart
        name: a scanner without a working camera offers photos from the gallery
  - id: E-SCN-14
    group: Review
    title: Euro icon in a dollar book
    when: any non-euro book · *Add receipt* or the scan review
    then: neutral money icon on the *Total* row · before 2026-11-03 a € glyph next to $23.45 (IOS-7-3)
    status: fixed
    risk: low
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_test.dart
        name: the total row carries no currency glyph of its own
  - id: E-SCN-15
    group: Review
    title: A receipt typed in started with a red error
    when: "*Add receipt* → total entered, no item yet"
    then: grey *Add items up to …* · red *Math mismatch* only once items disagree · before 2026-11-03 red banner and red footer from the start (IOS-7-5)
    status: fixed
    risk: low
    related: [R-SCN-24]
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_test.dart
        name: a hand-entered receipt with a total and no item yet starts neutral, not red
  - id: E-SCN-16
    group: Photos
    title: Grayscale gallery photo
    when: a grayscale PNG picked from the gallery
    then: kept gray, white paper stays white · before 2026-11-06 it was stored red (AND-7-2)
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/domain/services/still_reader_test.dart
        name: a grayscale PNG keeps white paper white instead of red
  - id: E-SCN-17
    group: Reading
    title: Tracking lost mid-receipt
    when: phone lifted, moved too fast or off the paper during the hover
    then: "hint *Back to the last line read: …* · what was read stays · the next frames start a new part, joined as soon as its rows overlap the old ones"
    status: by-design
    risk: medium
    related: [R-SCN-02]
  - id: E-SCN-18
    group: Reading
    title: Two identical rows in a row
    when: the same article twice, one under the other (2× *SEMMERL 0,39*)
    then: two rows · a row is known by where it is, never by its text
    status: by-design
    risk: high
    related: [E-SCN-05]
  - id: E-SCN-19
    group: Reading
    title: Shop known late
    when: QR read first, the franchise header (ADEG, SPAR-Partner) only later
    then: the parser is picked again from the header and the whole receipt is re-read · nothing to redo
    status: fixed
    risk: low
  - id: E-SCN-20
    group: Reading
    title: Sum does not meet the total at *Done*
    when: a row missed or misread · *Done* tapped
    then: review opens with the mismatch banner · *Scan more* continues the same scan · *Redo item scan* starts the items over
    status: by-design
    risk: medium
    related: [R-SCN-25]
  - id: E-SCN-21
    group: Reading
    title: A row read in two cuts
    when: "some frames read `0,180 kg (N)` alone, the rest the whole row `0,180 kg (N) x 19,90 EUR/kg`"
    then: "the whole reading wins the row · before 2026-11-11 both stayed, the row read twice and the article (CHILILEBERKAESE) went missing; on the emulator it showed as *Port. Port.*"
    status: fixed
    risk: high
    related: [E-SCN-18, E-SCN-05]
    tests:
      - file: test/features/receipt/domain/services/assembly/hover_assembler_test.dart
        name: a shorter cut of a row that later frames read whole does not stay beside the whole line (real frames, spar_20260914_A)
  - id: E-SCN-22
    group: Reading
    title: A repaired price makes the sum fit early
    when: two of three articles read, one price misread so that a digit fix (3,99 → 8,99) would meet the total
    then: the scan goes on until the items add up as read · a repair is only offered in review · before 2026-11-12 the repaired sum ended the scan and the third article was never read
    status: fixed
    risk: high
    related: [R-SCN-25, E-SCN-20]
    tests:
      - file: test/features/receipt/domain/services/live_scan_engine_test.dart
        name: "a live parse never repairs a sum toward the total: two of three articles are not a match"
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: a sum the reconciler had to repair is never a match
  - id: E-SCN-23
    group: Reading
    title: QR on the still that ends the scan
    when: restaurant or one-category receipt, one *Capture*, the QR too small for the live preview
    then: the QR on the still is read before the scan ends · merchant and restaurant memory are learned · before 2026-11-12 it was skipped
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_lifecycle_test.dart
        name: a still that ends a one-category pass still reads the code printed on it
  - id: E-SCN-24
    group: Photos
    title: Scan more after the photo step
    when: hover scan, photo taken on the photo step, *Scan more* in review
    then: the photo stays with the receipt, no second photo step · removed in review → asked for again · before 2026-11-12 the photo was lost
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_lifecycle_test.dart
        name: the photo taken on the photo step stays with the receipt through Scan more
  - id: E-SCN-25
    group: Photos
    title: A still removed from a hovered scan
    when: hover plus one *Capture* · the still deleted in review · *Scan more*
    then: only that photo goes, the hovered items stay · before 2026-11-12 every hovered item vanished with it
    status: fixed
    risk: high
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_lifecycle_test.dart
        name: a still removed from a hovered pass keeps the hovered items for Scan more
  - id: E-SCN-26
    group: Photos
    title: Photo-step photo in review
    when: hover scan with a photo from the photo step
    then: the thumbnail reads *#1*, no item count · before 2026-11-12 *#1 · 0 items*, as if the scan had failed
    status: fixed
    risk: low
    tests:
      - file: test/features/booking/ui/widgets/add_receipt/review_photo_gallery_test.dart
        name: a photo taken only as proof shows its number without an item count
  - id: E-SCN-27
    group: Camera
    title: Closed or *Rescan* while the camera opens
    when: back pressed while the camera starts · *Rescan* tapped twice · a QR web link answering after *Rescan*
    then: one camera, released on close · the late link answer is dropped, never applied to the next receipt · before 2026-11-12 a second camera stayed open and the old total could land on the new scan
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_lifecycle_test.dart
        name: Rescan tapped twice opens one camera
      - file: test/features/receipt/bloc/scanner_cubit_lifecycle_test.dart
        name: a web link that resolves after Rescan never reaches the new scan
  - id: E-SCN-28
    group: Review
    title: English category name in a German book
    when: German book · scan review · an item, a line merged by category, the item editor
    then: the book's own category name, *Lebensmittel* · before 2026-11-12 the scanner's English name, *Groceries* · the saved booking was always right
    status: fixed
    risk: low
    tests:
      - file: test/features/booking/ui/widgets/add_receipt/review_item_tile_test.dart
        name: a scanner bucket shows the name of the category it resolved to
      - file: test/features/booking/ui/widgets/add_receipt/review_item_tile_test.dart
        name: a line merged by category is titled with the resolved category name
      - file: test/features/booking/ui/widgets/add_receipt/review_item_tile_test.dart
        name: the editor shows the resolved category name and keeps the bucket it saves
  - id: E-SCN-29
    group: Photos
    title: "Replace took the receipt from sibling bookings"
    when: "split scan · *Replace* the receipt on one of its bookings"
    then: "the others keep photos, lines and merchant · fixed 2026-11-12 · before, the shared receipt was deleted (bug hunt 7)"
    status: fixed
    risk: high
    tests:
      - file: test/features/receipt/use_cases/attach_receipt_use_case_test.dart
        name: "keeps a receipt that another booking from the same scan still shows"
  - id: E-SCN-30
    group: Photos
    title: "*Scan more* dropped the photos"
    when: "scan review · *Scan more* · save"
    then: "existing photos kept, the new one added · fixed 2026-11-12 · before, the receipt saved with none (bug hunt 26)"
    status: fixed
    risk: high
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: "Scan more reopens the pass with what was read; Redo item scan starts the items over"
  - id: E-SCN-31
    group: Review
    title: "*Rescan* closed the scanner"
    when: "scan review · *Rescan* · the camera opens while the review slides out"
    then: "the camera stays open · fixed 2026-11-13 · before, the scanner closed too and Home showed"
    status: fixed
    risk: high
    related: [E-SCN-27]
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_flow_test.dart
        name: a second state change while the review is leaving does not pop the scanner under it
  - id: E-SCN-32
    group: Reading
    title: Scan ended before the date was read
    when: date, shop name or QR printed below the total · hover scan
    then: "the scan waits until the phone rests · fixed 2026-11-13 · before, it ended at the total and booked today's date"
    status: fixed
    risk: high
    related: [R-SCN-27, R-SCN-28]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: items that add up do not end it while the phone has only just come to rest
      - file: test/features/receipt/bloc/scanner_cubit_live_test.dart
        name: "a receipt that is one line waits too: the total row is seldom the last one"
  - id: E-SCN-33
    group: Reading
    title: Gallery photo lost most rows
    when: a 12 MP photo from the gallery
    then: "read at full size, like a still · fixed 2026-11-13 · before, shrunk to 1600 px and most prices went unread"
    status: fixed
    risk: high
    related: [R-SCN-06]
    tests:
      - file: test/features/receipt/bloc/scanner_cubit_import_test.dart
        name: "an imported photo is read like a still: at its own size, and scaled down where that does not add up"
  - id: E-SCN-34
    group: Reading
    title: Date with a damaged separator
    when: "`05,02.2026` · `02 05.2025` · `10.08 26` beside a time"
    then: read as the date when no clean one is on the page · within the last 2 years only
    status: fixed
    risk: medium
    related: [R-SCN-28]
    tests:
      - file: test/features/receipt/domain/services/receipt_data_extractor_test.dart
        name: a comma for the first separator (apotheke_20260205_A)
      - file: test/features/receipt/domain/services/receipt_data_extractor_test.dart
        name: three small numbers without a time are no date
  - id: E-SCN-35
    group: Reading
    title: Amount of 1000 or more without a separator
    when: "`1249,00` printed without a thousands dot"
    then: "read as 1249,00 · fixed 2026-11-13 · before, no parser saw the amount"
    status: fixed
    risk: high
    tests:
      - file: test/features/receipt/domain/services/receipt_data_extractor_test.dart
        name: a total of a thousand and more is read with its separator and without one
  - id: E-SCN-36
    group: Reading
    title: QR missed on a still or gallery photo
    when: a small or dense QR on a full-size photo
    then: "looked for twice · a 2560 px copy first, then the file · 55 → 63 of 66 corpus codes on iOS"
    status: fixed
    risk: medium
    related: [E-SCN-23]
    tests:
      - file: test/features/receipt/domain/services/still_reader_test.dart
        name: a copy that shows none is followed by the file
      - file: test/features/receipt/bloc/scanner_cubit_import_test.dart
        name: a code on an imported photo is the receipt
  - id: E-SCN-37
    group: Reading
    title: QR read after *Scan more*
    when: review shows an OCR total · *Scan more* · the QR is read now
    then: the QR's total replaces the review's · date and shop stay as reviewed
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: a code read only now overrides the total the review showed, never its date or its shop
  - id: E-SCN-38
    group: Reading
    title: Training receipt QR
    when: RKSV code of a till in training mode
    then: ignored · total and date come from the print
    status: by-design
    risk: low
    tests:
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: rejects a training receipt
  - id: E-SCN-39
    group: Reading
    title: Pharmacy without a readable header
    when: "the page says *Apotheke* or carries the pharmacist's line · shop unknown"
    then: "one **Health** line, named *Apotheke* · a street called Apothekergasse does not count"
    status: fixed
    risk: low
    related: [R-SCN-04, D-SCN-10]
    tests:
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: a pharmacy receipt without its header is one Health line (apotheke_20250502_A)
      - file: test/features/receipt/domain/services/receipt_pipeline_test.dart
        name: an address or an advert with the word in it is no pharmacy
  - id: E-SCN-40
    group: Reading
    title: Total row booked as an item
    when: "the total label misread · `Z0 zahlen` · `Zwischensume`"
    then: "a total row when it carries the total or the sum of the items above · fixed 2026-11-13 · before, an extra item that also swallowed the change row"
    status: fixed
    risk: high
    tests:
      - file: test/features/receipt/domain/parsers/parser_noise_test.dart
        name: a damaged label counts on the row of the known total (lidl_20260701_A)
      - file: test/features/receipt/domain/parsers/obi_parser_strategy_test.dart
        name: "a Zwischensumme that lost a letter is no item: the coupons below come off the last article (obi_20260609_A)"
      - file: test/features/receipt/domain/parsers/parser_noise_test.dart
        name: without the figure a near-label stays an item
  - id: E-SCN-41
    group: Reading
    title: Discount that lost its minus
    when: "`Rabatt 20% 1,40` under a 6,99 line (SPAR) · `Preisvorteil 0)40` (LIDL)"
    then: "taken off when it is the printed share of the line above · a comma read as `)` is a comma again"
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/domain/parsers/spar_parser_strategy_test.dart
        name: a Rabatt that lost its minus is taken off when it is the printed share of the line above (spar_20260718_A)
      - file: test/features/receipt/domain/parsers/spar_parser_strategy_test.dart
        name: a positive Rabatt figure that is not that share stays informational
      - file: test/features/receipt/domain/parsers/lidl_parser_strategy_test.dart
        name: a discount whose comma was read as a bracket is still taken off (lidl_20260714_A)
  - id: E-SCN-42
    group: Reading
    title: Multipack discount on two lines
    when: "ADEG · `2 x MULTIPACKNACHLASS -0.80` under two equal lines"
    then: "both lines share it · before 2026-11-13 the last line took it all"
    status: fixed
    risk: low
    tests:
      - file: test/features/receipt/domain/parsers/adeg_parser_strategy_test.dart
        name: is shared by the two equal lines above it (adeg_20260708_B)
  - id: E-SCN-43
    group: Reading
    title: VAT letter glued to the price
    when: "ADEG, BILLA · `B1.98` read as one token"
    then: "price 1,98 · before 2026-11-13 the B became an 8 and the line cost 81,98"
    status: fixed
    risk: high
    tests:
      - file: test/features/receipt/domain/parsers/adeg_parser_strategy_test.dart
        name: a VAT letter glued to the price is the letter, not an 8 in front of it (adeg_20260717_A)
      - file: test/features/receipt/domain/parsers/billa_parser_strategy_test.dart
        name: a VAT letter glued to the price is the letter, not an 8 in front of it
  - id: E-SCN-44
    group: Reading
    title: Deposit label misread
    when: "`FAND EINEG 0,25` · `PEANDFLASCHE`"
    then: "folds into its drink like *Pfand* · never on *Einweg* alone, which also names gloves"
    status: fixed
    risk: medium
    tests:
      - file: test/features/receipt/domain/parsers/spar_parser_strategy_test.dart
        name: a deposit row whose label the reader damaged still folds into its drink (spar_20260602_A)
      - file: test/features/receipt/domain/parsers/parser_noise_test.dart
        name: "never EINWEG alone: it also names gloves and cutlery"
  - id: E-SCN-45
    group: Reading
    title: Word split by the reader
    when: "`Partyart ikel` · `Supennude ln` · `Maisbål lchen`"
    then: "category of the whole word · scanner only, typed text stays as typed · before 2026-11-13 no category or the wrong one"
    status: fixed
    risk: medium
    related: [R-SCN-03]
    tests:
      - file: test/features/receipt/domain/services/category_chain_test.dart
        name: two fragments that spell a key match it
      - file: test/features/receipt/domain/services/category_chain_test.dart
        name: two unrelated words never spell a short key across their gap
      - file: test/features/receipt/domain/services/category_chain_test.dart
        name: typed text is matched as typed
  - id: E-SCN-46
    group: Reading
    title: Item name on another row than its price
    when: "unknown shop · price row holds only counts or codes · `(2) € 6,50`"
    then: "name from the row above · from below only when the receipt prints every name below · article numbers leave the name"
    status: fixed
    risk: medium
    related: [R-SCN-04]
    tests:
      - file: test/features/receipt/domain/parsers/generic_parser_strategy_test.dart
        name: "counts and a currency sign are no name: the row above is (libro_20260702_A)"
      - file: test/features/receipt/domain/parsers/generic_parser_strategy_test.dart
        name: the name printed below an article row is taken when nothing above is one (deichmann_20260811_A)
      - file: test/features/receipt/domain/parsers/generic_parser_strategy_test.dart
        name: a receipt that prints names above never takes one from below, even when its first name is unusable
  - id: E-SCN-47
    group: Reading
    title: Prices one row off their names
    when: curled or tilted paper · the price column sits a row higher or lower
    then: "sum right, but lines carry a neighbor's price or name · open (lidl_20260417_A, spar_20260619_A)"
    status: known-issue
    risk: medium
  - id: E-SCN-48
    group: Reading
    title: Discount row without a figure
    when: "`Preisvorteil` printed, its amount not read at all"
    then: "review shows the mismatch · the user fixes the line · open (lidl_20260701_A)"
    status: known-issue
    risk: low
    related: [R-SCN-29]

