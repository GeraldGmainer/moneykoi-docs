# Source: Gerald, 2026-10-17 (scanner coverage before the Nov 1 launch).
items:
  - id: D-SCN-01
    question: Untrained shops and countries at launch?
    status: decided
    date: 2026-10-17
    answer: |
      - release everywhere · no region lock, no big banner
      - first onboarding tab: *BETA* + what works where (R-SCN-13)
  - id: D-SCN-02
    question: "Unknown shops: items or one line?"
    status: decided
    date: 2026-10-17
    answer: Best-effort items via the generic parser
  - id: D-SCN-03
    question: "Yen books: hide or show?"
    status: decided
    date: 2026-10-17
    answer: Show *not available yet* · all currencies without 2 decimals (R-SCN-12)
  - id: D-SCN-04
    question: "A guess names a parent with subs: where does the line go, and does the hint warn?"
    status: decided
    date: 2026-10-27
    answer: |
      - look for a fitting sub inside that parent · none → no category, picked in review
      - never a leaf outside that parent
      - the parent covers its bucket · no hint
    related: [R-LED-01, R-LED-20, E-SCN-08]
  - id: D-SCN-05
    question: Four intro pages before the first scan?
    status: decided
    date: 2026-11-11
    answer: |
      - **one page**: *BETA* + which shops are itemized · then the camera
      - *Welcome*, *Smart auto-detect*, *Capture the items* only in the help sheet · the camera guides live (*Point at the total line*, *Hold steady*)
      - source: new-user review, 2026-11-11 · built the same day
    related: [R-SCN-13, D-HOM-13]
  - id: D-SCN-06
    question: "Promote the scorecard baselines after the capture rework?"
    status: decided
    date: 2026-11-13
    answer: |
      - **accepted**: the fix rounds of 2026-11-13 promoted every scale (SCANNER §4.41, §4.42, §4.46) · no receipt lost on any scale
      - from now on an agent promotes after a round when no receipt stopped passing on any scale and the category oracle is not lower · otherwise it asks
      - before: the rework's agent promoted nothing (D-CAP-3)
      - every scale re-scored on the one-page pipeline · gained and lost receipts per scale in SCANNER_ACCURACY_PLAN.md §14
      - new scales (emulator-native, emulator-bands, hover-synth, emulator-stills) have their own first baselines
      - promote = `SCORECARD_UPDATE=1` per scale, then commit the corpus repo
