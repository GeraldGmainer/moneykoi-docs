  - id: D-SCN-06
    question: "Promote the scorecard baselines after the capture rework?"
    status: decided
    date: 2026-11-13
    answer: |
      - **accepted**: the fix rounds of 2026-11-13 promoted every scale (SCANNER §4.41, §4.42, §4.46) · no receipt lost on any scale
      - from now on an agent promotes after a round when no receipt stopped passing on any scale and the category oracle is not lower · otherwise it asks
      - before: the rework's agent promoted nothing (D-CAP-3)
      - every scale re-scored on the one-page pipeline · gained and lost receipts per scale in SCANNER_ACCURACY_PLAN.md §14
      - new scales (emulator-native, emulator-bands, hover-synth, emulator-stills) have their own first baselines
      - promote = `SCORECARD_UPDATE=1` per scale, then commit the corpus repo
