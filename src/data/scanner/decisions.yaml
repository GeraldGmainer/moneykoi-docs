  - id: D-SCN-14
    question: "Review: tolerate a one-cent gap, or require an exact match?"
    status: decided
    date: 2026-11-13
    answer: |
      - **keep one cent**: it never blocks *Save*, at any amount · two cents always do (R-SCN-31)
      - why: a spread basket discount or a folded Pfand rounds a cent off on a correct scan
      - not taken: items must equal the total to the cent · source: SCANNER §4.40
    related: [R-SCN-31, E-SCN-50]
  - id: D-SCN-15
    question: "Review: block the automatic price repair when the gap is a whole-euro amount on a receipt of whole-euro prices?"
    status: decided
    date: 2026-11-13
    answer: |
      - **keep repairing** (Gerald) · the repaired line stays orange in the review
      - found 2026-11-13 (repair fuzz, SCANNER §4.44): on the real dumps the reconciler made one repair, and it was wrong · a lost *1,00* line made *5,00* read *6,00*
      - fuzz: every error the repair searches for → 0 wrong · errors it cannot tell apart by the sum (two in one bracket, a missing line) → 1–11 % wrong
      - a) **block it** for a whole-euro gap on whole-euro prices · the mismatch banner stays instead · recommended
      - b) keep it · the repaired line is shown orange
    related: [R-SCN-31]
  - id: D-SCN-16
    question: "Scanner: may a VIES name replace a merchant the header guessed?"
    status: decided
    date: 2026-11-13
    answer: |
      - **yes**: a VIES name replaces a guessed merchant, never one a shop's parser rules found or the user typed (Gerald)
      - built 2026-11-13 (SCANNER §4.45): a printed ATU with a valid check digit asks VIES when the code carries none · it only fills a merchant the page never named (§7.3)
      - on the corpus the guesser always names something, sometimes junk (*ELR*, *EUR*, a discount line) · so the lookup never fills anything (0 of 155)
      - a) **a VIES name replaces a guessed one**, never a name the shop's own rules found · recommended
      - b) keep it: fills only an empty merchant
  - id: D-SCN-17
    question: "Scanner: should lines confirmed while the phone is held still keep a finished scan open?"
    status: decided
    date: 2026-11-14
    answer: |
      - **no**, once date and shop are read: only movement keeps it open, the 1.2 s pause stays (Gerald)
      - found on the first real phone: held still, faint print kept confirming about once a second and each line restarted the pause · one receipt waited 9 s with the phone motionless
      - corpus (steady hover, 146 receipts): nothing lost where the scan now ends
      - a) **ignore those lines** · recommended
      - b) the same, and a 0.8 s pause
      - c) keep the rule, only show the wait
  - id: D-SCN-18
    question: "Scanner: how should the row ticks keep up with a moving hand?"
    status: decided
    date: 2026-11-14
    answer: |
      - superseded 2026-11-17: the ticks are gone, the receipt strip shows progress (D-SCN-25)
      - **predict from the pan speed** (Gerald, after trying a): the ticks are drawn ahead by how fast the receipt moved through the last frames × how old the read frame is, capped below a second
      - the ticks were drawn where the rows were ~0.4 s earlier (the reading takes that long)
      - a) track the motion on every camera frame · recommended first, built and dropped the same day: the preview lagged and the measured shift was mostly empty
      - b) **predict from the pan speed**
      - c) fade the ticks while moving
  - id: D-SCN-19
    question: "Scanner review: what should × on a tip do?"
    status: decided
    date: 2026-11-14
    answer: |
      - **× ends all three review tips, for good** (Gerald) · acting on a tip still lets the next follow
      - a) **× ends all tips** · recommended
      - b) × closes only that tip (before)
      - c) no review tips at all
  - id: D-SCN-20
    question: "Scanner: which rows get a tick?"
    status: decided
    date: 2026-11-14
    answer: |
      - superseded 2026-11-17: the ticks are gone, the receipt strip shows progress (D-SCN-25)
      - **only rows the scan made something of**: items, shop, date, total (Gerald: not a tick on every row)
      - a) every row seen twice (before)
      - b) **rows read as an item or a header field**
    related: [R-SCN-33]
  - id: D-SCN-21
    question: "Scanner: how does the pace show while hovering?"
    status: decided
    date: 2026-11-15
    answer: |
      - **a ring at the end of the hint, one turn per reading** · *Slower* judged by how far the receipt moved between two readings (Gerald asked for a ring or a speed text · both built · tried on the phone the same night, left as is)
      - no *too slow* text: a slow pass loses nothing, and how fast is safe is not measured yet (T-SCN-11)
    related: [R-SCN-34, T-SCN-11]
  - id: D-SCN-22
    question: "Scanner: end a matched scan after a fixed time, even while the phone still moves?"
    status: decided
    date: 2026-11-17
    answer: |
      - **no timer · end when the scan is sure** (Gerald: *when the scanner logic is confident enough*)
      - sure = the same match on two readings in a row · date and shop read, shop not a guess · 4 printed rows read below the total
      - measured on 146 corpus receipts: 0 wrong endings · ending on the first match alone cut 8 short (a first *SUMME* before a basket discount, a shop name still a guess)
      - phone, short receipt: 12.9 s → 3.2 s · the options as they stood:
      - today: items = total, then the phone has to rest 1.2 s (2.5 s while date or shop are unread) · a pass waited 5.7 s after the match because the hand moved on past the total
      - a) keep: only rest ends it · date, shop and QR print below the total (R-SCN-27)
      - b) once date and shop are read too: end 2 s after the match, moving or not · recommended
      - c) end the moment items = total and date and shop are read
    related: [R-SCN-25, R-SCN-27]
  - id: D-SCN-23
    question: "Scanner: rows never shown between two read stretches — say where?"
    status: decided
    date: 2026-11-17
    answer: |
      - **show it on screen: the receipt strip** (D-SCN-25) · the unread stretch is yellow, the hint says *back to the yellow mark* · the options as they stood:
      - today: the hint names the amount missing (*… still missing*), not the place · a pass held the top third for 17 s while 25 rows further down were unread (E-SCN-73)
      - a) keep the amount
      - b) say the direction: *Move on down · rows before the total are unread* · recommended
      - c) show it on screen: an arrow at the edge the unread rows lie beyond
    related: [E-SCN-73]
  - id: D-SCN-24
    question: "Scanner: pick the account from the payment printed on the receipt?"
    status: decided
    date: 2026-11-15
    answer: |
      - **yes** · cash → cash account · card → checking or credit card · nothing sure → last used, as before
      - a debit card → checking · a brand without *Debit* → credit card account if there is one, else checking
      - a bank named on the slip → the account named after it, first
      - several fitting → the one with the latest booking
      - vouchers ignored · cash and card on one receipt → not sure
      - the picked account is never saved as last used
    related: [R-SCN-35, E-SCN-74]
  - id: D-SCN-25
    question: "Scanner: what shows reading progress while the hand moves?"
    status: decided
    date: 2026-11-17
    answer: |
      - **a receipt strip at the edge, no marks on the text** (Gerald, after the ticks never sat on the rows of a moving picture)
      - the ticks were drawn where a row was half a second earlier, pushed ahead by a guess of the hand's speed · a hand that changes speed breaks the guess
      - a) **receipt strip**: green read · yellow not sure · a frame for the camera
      - b) the strip plus a soft band over the picture
      - c) counter only
      - d) keep the ticks, tune them
    related: [R-SCN-33, D-SCN-18, D-SCN-20, D-SCN-23]
  - id: D-SCN-26
    question: "Scanner: when does *Slower* show?"
    status: decided
    date: 2026-11-17
    answer: |
      - **at once, with a vibration** · it used to wait a second, and by then the stretch was behind the hand
      - only by how far the receipt moved between two readings (a third of the picture) · the fixed 12 rows a second fired on passes that lost nothing
    related: [R-SCN-34]
  - id: D-SCN-27
    question: "Scanner: a receipt paid with a voucher · which amount is the total?"
    status: decided
    date: 2026-11-18
    answer: |
      - **a) the whole purchase** · a voucher is a way of paying, the money is spent now (164,55 · 36,29)
      - the sum printed before the first voucher counts · the smaller sums printed after each voucher do not
      - b) only what was paid besides the voucher (0 · 24,34)
      - c) the last sum printed (48,85 · 24,34) · what the app did until then
      - found 2026-11-18 on two Bauhaus receipts whose truth files disagreed
    related: [E-SCN-82]
  - id: D-SCN-28
    question: "Scanner: how long is the receipt strip while the receipt's length is unknown?"
    status: decided
    date: 2026-11-18
    answer: |
      - **a + c** (Gerald, on the phone): the rest from the amount still missing · before a total is known, only what is read
      - a) rows to come ≈ missing amount ÷ what a read row carries on average · right in the second half of a scan, up to a third too long before
      - b) a fixed scale, the strip scrolls · no "how far still"
      - c) no rest at all, the strip is what is read
      - d) a bar by amount instead of a picture of the receipt
      - not taken: a first look without zoom to measure the paper · a long receipt does not fit at 1× either, and its length would need the paper's edges, not text
      - added the same day: the paper's ends from empty rows · parts apart after a jump
    related: [R-SCN-33, D-SCN-25]
  - id: D-SCN-29
    question: "Scanner: how does the scan say *faster / slower / where to go* without a line of text?"
    status: decided
    date: 2026-11-18
    answer: |
      - **a + c + d, with the orange pill kept for warnings** (Gerald, on the phone)
      - a) the frame on the strip takes the speed's colour · white, amber, red
      - c) an arrow beside the frame shows the way
      - d) no text for plain guidance · warnings and errors stay written, large, on the warning colour
      - too fast is also felt: three taps per reading · one long vibration was tried and is not played by the Nothing 3a during the camera
      - *Slower* goes with the next reading at normal speed (D-SCN-26 said only when it comes)
      - not taken: b) a speed bar · e) a tick per good reading
    related: [R-SCN-34, D-SCN-26, D-SCN-25]

