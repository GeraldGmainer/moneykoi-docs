# Derived from the context docs; accuracy itself is measured with the scanner-corpus-round skill.
groups:
  - id: scan
    title: Scanner
    items:
      - id: C-SCN-001
        text: BILLA/SPAR hovered top to bottom → ticks on read rows · total from QR or *SUMME* · ends by itself at the total, no doubles · uncategorized blocks Save
      - id: C-SCN-002
        text: Restaurant → one Dining booking · *Without photo* works
      - id: C-SCN-003
        text: "Gallery: long receipt in 3 photos · unreadable one fails alone"
      - id: C-SCN-004
        text: "*Upload photos* off → saved without photos · no Cloud → photos queued + shown"
      - id: C-SCN-005
        text: iOS clean build → text + barcode recognition (C-PLAT-001)
      - id: C-SCN-006
        text: German TSE receipt (REWE, ALDI, Lidl DE, dm) → total + date lock · late evening keeps printed date
      - id: C-SCN-007
        text: Yen book → *not available yet*, no camera · *Got it* closes
      - id: C-SCN-008
        text: Fresh install → one *BETA* page, 8 shops, no *Skip* · *Got it, scan a receipt* → camera · *How it works* replays all steps
      - id: C-SCN-009
        text: First scan on a fresh phone → review opens with the scan, no tutorial · *Tap any field* tip under the receipt card · *Every item needs a category* above the items until all are set, then *Save, and each item…* above the bar · × on any tip → no further tip, not even on the next scan · second scan → no tips · ? still replays the intro
      - id: C-SCN-010
        text: "iPhone, fresh install → scanner → *Not now* → card *Allow camera* (no *Open Settings*) → tap → the iOS camera prompt · *Don't Allow* → card turns to *Open Settings* → lands on Money Koi's page with a Camera switch · Android: first *Deny* keeps *Allow camera*, the second → *Open Settings*"
      - id: C-SCN-011
        text: "Camera declined (or the simulator, no camera) → *Pick photos* on the card → the photo picker → review like from the camera · a photo without a total → snackbar, card stays"
      - id: C-SCN-012
        text: "*Add receipt* → total and item price open the app keypad, never the phone's number pad · ✓ hands the form back · magic wand fills the rest · USD book → no euro sign on the *Total* row"
      - id: C-SCN-013
        text: "Debug build, scanner app bar: preset button cycles veryHigh → ultraHigh → max · log `ScanLog: matrix` per preset: ≥ 4 OCR passes a second at max, preview smooth · `linePx` at hover distance per preset (far above ~35 = OCR time wasted, the lowest preset that stays above it wins) · still size and read time in `ScanLog: still`"
      - id: C-SCN-014
        text: "Ten long receipts (> 30 items) by hover, five chains · each ends by itself or with one *Done* · no doubled row · a few short receipts with one *Capture* · note `ocrMedian` and `parseMax` from `ScanLog: pass`"
      - id: C-SCN-015
        text: "Hover feel: 2× zoom focuses at ~15–20 cm · hints readable, no flicker · *Slower*, *Closer*, *Back to the last line read* appear when provoked · torch works"
      - id: C-SCN-016
        text: "After a hover without a still → photo step · *Without photo* → review · *Capture* → review with the photo, 1080 px wide, labelled *#1* · *Scan more* → back in review, the photo still there"
      - id: C-SCN-017
        text: "iPhone: scanner open → home screen → back → preview live, rows keep ticking · same on the photo step (Android passed on the emulator 2026-11-12)"
      - id: C-SCN-018
        text: "Hover a receipt whose date prints below the total → hint *Keep going to the end of the receipt* → ends ~1 s after the phone rests at the end · review shows the printed date"
      - id: C-SCN-019
        text: "Stop at the total and hold still → ends after ~2.5 s · review marks *Date not read · today* in the warning color · tap the date → fix it"
      - id: C-SCN-020
        text: "Gallery: one full-size photo of a long receipt → every row read, QR found · three overlapping photos → one receipt, no doubles (emulator + iOS simulator passed 2026-11-13)"
      - id: C-SCN-021
        text: "Receipt with one price misread → review: *Math mismatch* + *Suggested fix* → *Apply* → banner gone, *Save* on (Android emulator passed 2026-11-13)"
      - id: C-SCN-022
        text: "Review → *Rescan* → the camera, not Home · scan again → review (Android emulator + iOS simulator passed 2026-11-13)"

      - id: C-SCN-023
        text: "Hover to the last row, lift the phone at once → the panel's count and sum include that row · the scan ends by itself"
      - id: C-SCN-024
        text: "Hover too far and too fast in turns → the hint changes within ~2 s, never stuck on the first one · no flicker"
      - id: C-SCN-025
        text: "Receipt whose QR is a web link, one *Capture*, slow network → shutter spins ≤ 4 s → review with the code's total, date, shop · offline: the print's values"
      - id: C-SCN-026
        text: "Open the scanner → gallery button at once → back out of the picker → preview live, rows tick without a *Capture*"
      - id: C-SCN-027
        text: "320 dp phone, largest text, de/en/ja → empty review: both buttons stacked, nothing cut · *Total* sheet: hint readable beside the items sum"
      - id: C-SCN-028
        text: "Review → edit an item → type a 60-character name → the row and the receipt-line column stay in shape · saved booking: description cut"
      - id: C-SCN-029
        text: "Web *Add receipt* → merchant typed, 3 items of 3.333 against 10 → *0.01 left* shown · fix → saved · phone after a sync shows the receipt card with merchant and items (needs T-BOOK-06)"
      - id: C-SCN-030
        text: "Release APK on a real Android phone (`flutter build apk --release --flavor dev`) → hover a receipt → rows tick, the pass ends by itself · the debug build alone proves nothing here (E-SCN-64)"
      - id: C-SCN-031
        text: "Hover a long receipt, moving the hand at normal speed → ticks stay close to their rows instead of trailing ~0.4 s behind · no preview lag · all items read → shop line gives way to *All items read, total matches · final check…* + a green bar · hold still → ends when the bar is full (~1.2 s) · move → the bar starts over"
      - id: C-SCN-032
        text: "First scan → review → tip card: × in the top-right corner on the first line, the action right-aligned under it · × → no tip follows · Home book-switch, Budget Book calendar and booking-form scan hints look the same"
      - id: C-SCN-033
        text: "Hover held close, a few rows at a time, the receipt wider than the frame · start by moving in or out · work down in steps → no item twice, the sum meets the total without zooming out"
      - id: C-SCN-034
        text: "Release build · long receipt (40+ items), one slow pass top to bottom, the phone held as it comes, not flat → every item ticked on the way · sum meets the total when the total is read · ends by itself · review: nothing missing, nothing twice (E-SCN-67) · debug build: done by Gerald 2026-11-15, 54 of 54"
      - id: C-SCN-035
        text: "Ticks sit on items, shop, date and total only · none on address, tax table or footer · no tick before a row was read (R-SCN-33)"
      - id: C-SCN-036
        text: "Hint pill ends in a small ring that turns once per reading · held close and moved quickly → *Slower* · Reduce motion on → the ring stands still (R-SCN-34)"
      - id: C-SCN-037
        text: "Start at the total, then go to the store name and hover down → items stand above the total · one receipt, sum matches, nothing twice (E-SCN-70)"
      - id: C-SCN-038
        text: "iPhone · long receipt by hover, phone slightly turned → as C-SCN-034 · the levelling there reads the text's corners and has never run on a device"
      - id: C-SCN-039
        text: "Release build, long receipt · seconds from opening the scanner to the first tick · seconds for one pass · readings per second (`ocrMedian` in the pass log) → the numbers T-SCN-11 starts from"
      - id: C-SCN-040
        text: "Book with a cash and a checking account · SPAR paid cash (*ZAHLUNG BAR*) → review shows the cash account · save · new manual booking → still the last used account, not cash · card receipt (*Visa Debit*) → checking · receipt without a payment line → last used (R-SCN-35)"
