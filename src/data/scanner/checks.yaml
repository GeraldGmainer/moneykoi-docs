# Derived from the context docs; accuracy itself is measured with the scanner-corpus-round skill.
groups:
  - id: scan
    title: Scanner
    items:
      - id: C-SCN-001
        text: BILLA/SPAR with QR → total, date, shop lock · 2 item photos merge, no doubles · uncategorized blocks Save
      - id: C-SCN-002
        text: Restaurant → one Dining booking · *Without photo* works
      - id: C-SCN-003
        text: "Gallery: long receipt in 3 photos · unreadable one fails alone"
      - id: C-SCN-004
        text: "*Upload photos* off → saved without photos · no Cloud → photos queued + shown"
      - id: C-SCN-005
        text: iOS clean build → text + barcode recognition (C-PLAT-001)
      - id: C-SCN-006
        text: German TSE receipt (REWE, ALDI, Lidl DE, dm) → total + date lock · late evening keeps printed date
      - id: C-SCN-007
        text: Yen book → *not available yet*, no camera · *Got it* closes
      - id: C-SCN-008
        text: Fresh install → *BETA* tab first, 8 shops · *How it works* replays it
      - id: C-SCN-009
        text: First scan on a fresh phone → review opens with the scan, no tutorial · *Tap any field* tip under the receipt card · *Every item needs a category* above the items until all are set, then *Save, and each item…* above the bar · second scan → no tips · ? still replays the intro
      - id: C-SCN-010
        text: "iPhone, fresh install → scanner → *Not now* → card *Allow camera* (no *Open Settings*) → tap → the iOS camera prompt · *Don't Allow* → card turns to *Open Settings* → lands on Money Koi's page with a Camera switch · Android: first *Deny* keeps *Allow camera*, the second → *Open Settings*"
      - id: C-SCN-011
        text: "Camera declined (or the simulator, no camera) → *Pick photos* on the card → the photo picker → review like from the camera · a photo without a total → snackbar, card stays"
      - id: C-SCN-012
        text: "*Add receipt* → total and item price open the app keypad, never the phone's number pad · ✓ hands the form back · magic wand fills the rest · USD book → no euro sign on the *Total* row"
