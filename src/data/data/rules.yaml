# Source: BACKUP_RESTORE_AI_CONTEXT.md, BOOKING_IMPORT_AI_CONTEXT.md (bank layer: §9a, §9b, §17–§20), moneykoi-web IMPORT_WEB_AI_CONTEXT.md, BOOKING_EXPORT_AI_CONTEXT.md,
# DATA_PORTABILITY_AI_CONTEXT.md, moneykoi-app lib/features/monetization/domain/feature.dart.
items:
  # Backup files
  - id: R-DATA-01
    group: Backup files
    title: Restore never merges
    text: |
      - makes a **new** book
      - or undoes changes in the book it came from · red dialog
      - phone without Cloud → replaces one of your books
    source: BACKUP §0, §1
  - id: R-DATA-02
    group: Backup files
    title: Backup is Pro · restore is free
    text: |
      - create: Pro + owner or admin
      - restore: everyone, any plan
      - photos, passphrase, reminder → same lock as create
      - import free · export Pro (R-MON-21)
    source: BACKUP §6, MONETIZATION §3 rule 5
    tests:
      - file: test/features/backup/use_cases/create_backup_use_case_test.dart
        name: an owner or admin of the active book may back it up, a member may not
      - file: test/features/backup/use_cases/schedule_backup_reminder_use_case_test.dart
        name: nothing is armed while backups are locked by the plan
    related: [R-MON-21]
  - id: R-DATA-03
    group: Backup files
    title: Backup made on the phone, offline
    text: |
      - from the phone's copy, incl. unsent writes
      - only uploaded photos need a connection
    source: BACKUP §3
    tests:
      - file: test/features/backup/data/book_snapshot_reader_test.dart
        name: read pages by id, encodes every row through the codec and resolves lookups by name
  - id: R-DATA-04
    group: Backup files
    title: Everything, not just bookings
    text: |
      - every synced record kind is in the file
      - a new kind fails the build until added
    source: BACKUP §9, §11
    tests:
      - file: test/features/backup/backup_entity_coverage_test.dart
        name: every tenant-scoped synced entity is backed up
  - id: R-DATA-05
    group: Backup files
    title: Never half a book
    text: |
      - server restore = one transaction
      - phone restore stages rows, swaps at once
      - cancel, failure, kill → book unchanged
    source: BACKUP §4, §4c
    tests:
      - file: test/features/backup/restore_backup_use_case_test.dart
        name: cancelling stops the upload and never applies
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: 'an app killed part-way: the staged rows are never the book'
  - id: R-DATA-06
    group: Backup files
    title: New ids on restore
    text: |
      - every id new · links follow
      - kept only on a phone with no other book
    source: BACKUP §5, §4c
    tests:
      - file: test/features/backup/backup_remapper_test.dart
        name: every id is regenerated and every link follows its row
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: next to another book on the phone the ids are remapped, so nothing can collide
  - id: R-DATA-07
    group: Backup files
    title: Old files restore · newer refused
    source: BACKUP §8
    text: |
      - `format_v1.moneykoi` checked in, never regenerated
      - newer format → refused by name
    tests:
      - file: test/features/backup/backup_archive_test.dart
        name: the checked-in format v1 fixture still opens and remaps
      - file: test/features/backup/backup_archive_test.dart
        name: a file from a newer app is refused by name
  - id: R-DATA-08
    group: Backup files
    title: Nothing silently missing
    text: |
      - unlinkable row → skipped, counted
      - duplicate name → " (2)"
      - bad photo → left out, counted · restore still succeeds
    source: BACKUP §5, §4d
    tests:
      - file: test/features/backup/backup_remapper_test.dart
        name: a booking whose category is not in the file is skipped, and its dependants unlink
      - file: test/features/backup/backup_archive_extras_test.dart
        name: a photo that fails its checksum is left out and counted, the rest still come
  - id: R-DATA-09
    group: Backup files
    title: Only a finished save counts
    text: cancelled save or share → no *last backup* stamp, no re-armed reminder
    source: BACKUP §3
    tests:
      - file: test/features/backup/use_cases/create_backup_use_case_test.dart
        name: a cancelled picker is not a backup, so nothing is stamped
      - file: test/features/backup/use_cases/create_backup_use_case_test.dart
        name: a dismissed share sheet is not a backup
  - id: R-DATA-10
    group: Backup files
    title: No storage permission
    text: |
      - system save dialog = the permission
      - **never** saved in app storage · uninstall would delete it
    source: BACKUP §3a, BOOKING_EXPORT §7
  - id: R-DATA-11
    group: Backup files
    title: Passphrase is yours alone
    text: |
      - ≥ 8 characters, typed twice · AES-256
      - opens in 7-Zip, umlauts too
      - lost passphrase = lost file
    source: BACKUP §4h
    tests:
      - file: test/features/backup/bloc/create_backup_cubit_test.dart
        name: the passphrase reaches the backup but never the state
      - file: test/features/backup/backup_archive_extras_test.dart
        name: a protected file opens only with its passphrase, every entry encrypted
  - id: R-DATA-12
    group: Backup files
    title: "Photos: opt-in, via the upload queue"
    text: |
      - under the restored receipt's new id + new book
      - storage paths never copied
    source: BACKUP §4d
    tests:
      - file: test/features/backup/backup_archive_extras_test.dart
        name: are extracted under the restored receipt id, byte for byte
      - file: test/features/backup/data/backup_photo_restorer_test.dart
        name: queues each photo under the restored receipt and the new book, in order, then cleans up
  - id: R-DATA-13
    group: Backup files
    title: Settings travel · new phone only
    text: |
      - applied only on a restore from *Welcome back* › *Restore*
      - **never** notification switches or goal reminders
    source: BACKUP §4g
    tests:
      - file: test/features/backup/data/backup_settings_store_test.dart
        name: profile settings are written, but notifications stay as the phone has them
  - id: R-DATA-14
    group: Backup files
    title: "Undo in place: four fences"
    text: book syncs · file from this book · owner or admin · no unsent writes
    source: BACKUP §4b
    tests:
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: never a book that does not sync, and apply refuses it before anything is sent
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: a file from another book, or no active book, is the wrong book
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: pending outbox items of this book block the rewind
  - id: R-DATA-15
    group: Backup files
    title: Where a restore lands
    text: |
      - **Cloud account** → new book on the server
      - **free account** → replaces a chosen own book, or a new local one
      - **empty phone** (*Welcome back* › *Restore*) → this phone + settings
      - **local book** → replaced after a red confirm
    source: BACKUP §4c
    tests:
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: an account with Cloud restores on the server into a new book
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: a new book of its own is the target, never a server restore that would open empty
  - id: R-DATA-16
    group: Backup files
    title: Phone restore keeps name + currency
    text: other currency → a note · **nothing** converted
    source: BACKUP §4c

  # Your data
  - id: R-DATA-20
    group: Your data
    title: "*Download all data*: Pro, everyone"
    text: |
      - zip: `profile.json` + README + one `.moneykoi` per book
      - joined book → only own entries
      - **Pro** since 2026-10-21 · free before (D-DATA-12)
      - Free: row wears the lock → paywall *Data export*
    source: BACKUP §4f, MONETIZATION §3 rule 5
    tests:
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: 'one zip: a restorable backup per book, the profile and a README'
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: without Pro nothing is read or saved
    related: [R-MON-21]
  - id: R-DATA-21
    group: Your data
    title: Books read where their rows are
    text: |
      - active book + non-syncing books → from the phone
      - other syncing books → from the server
      - offline + another syncing book → refused
    source: BACKUP §4f
    tests:
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: another book that does not sync comes from the phone, offline too
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: offline with other books is refused before anything is read
  - id: R-DATA-22
    group: Your data
    title: Whole-book ZIP strips ids
    text: |
      - 14 CSVs + `moneykoi-data.json` + README
      - **Pro** · owner or admin · active book · Book card menu
      - no book or person ids inside
      - Free: ⋮ *Export data* + lapse review *Export* → paywall
    source: DATA_PORTABILITY §1, §2, MONETIZATION §3a
    tests:
      - file: test/features/data_export/bloc/data_export_cubit_test.dart
        name: a member who may not export is denied, and export does nothing
      - file: test/features/data_export/export_book_archive_use_case_test.dart
        name: without Pro the export is refused before the book is read
    related: [R-MON-21, E-MON-23]
  - id: R-DATA-23
    group: Your data
    title: "Erase: owner only, final"
    text: |
      - deletes every record, every device
      - keeps book, name, members, settings
      - nothing left in the trash
    source: DATA_PORTABILITY §5
    tests:
      - file: test/features/book/ui/book_card_menu_test.dart
        name: the owner of the active book can export, import and erase

  # CSV import
  - id: R-DATA-30
    group: CSV import
    title: One CSV · owner/admin · free
    text: |
      - into the active book · bookings + needed accounts, categories, labels
      - nothing written before **Import**
      - a bank's monthly file: comfort parts are **Pro** → R-DATA-74
    source: BOOKING_IMPORT §1
    related: [R-DATA-74]
    tests:
      - file: test/features/data_import/use_cases/commit_import_use_case_test.dart
        name: a member who may not import is refused before anything is written
  - id: R-DATA-31
    group: CSV import
    title: Accounts match exactly
    text: |
      - same name, any case, hidden ones too
      - **never** fuzzy · "Giro" ≠ "Giro alt"
      - no row names an account → *Into which account?* (2026-11-03) · preset = last used
    source: BOOKING_IMPORT §7
    tests:
      - file: test/features/data_import/ui/booking_import_page_test.dart
        name: a file without an account column asks into which account
  - id: R-DATA-32
    group: CSV import
    title: "Categories: exact → synonym → new"
    text: |
      - within the same side · income / expense
      - DE/EN/JA synonyms only suggest
      - new = top-level · never onto a parent with subs
    source: BOOKING_IMPORT §8
  - id: R-DATA-33
    group: CSV import
    title: Skipped + listed
    text: |
      - transfers · opening balances
      - bad dates or amounts · zero amounts
      - each with row number + reason
      - **no category is not a skip** since 2026-11-03 (D-DATA-15) → R-DATA-40
      - a row can **become** a transfer since 2026-11-10 → R-DATA-87
    source: BOOKING_IMPORT §5, §16 D12
    related: [R-DATA-40, R-DATA-87]
  - id: R-DATA-40
    group: CSV import
    title: No category → guessed, else picked in Review
    text: |
      - category column optional · a bank CSV imports (D-DATA-15, replaces D11)
      - guess from payee, then description · same engine as quick booking · only existing categories, same side
      - payee column = *Empfänger/Auftraggeber*, *Payee*, *Merchant*, *支払先*, *取引先* …
      - the payee also **names the booking** since 2026-11-10 → R-DATA-75 · before: only a clue
      - Pro: a learned payee answers before the guess → R-DATA-85
      - Review: the category is a pill, tap → change it · no guess → *Choose a category*, unticked, can't be ticked
      - nothing imports without a category
    source: BOOKING_IMPORT §4, §8a
    tests:
      - file: test/features/data_import/use_cases/prepare_import_use_case_test.dart
        name: asks the engine with the payee first, then the description, within the row's side, once per text
      - file: test/features/data_import/bloc/import_wizard_cubit_test.dart
        name: without a guess it is never selected, by a tap or by Select all
      - file: test/features/data_import/bloc/import_wizard_cubit_test.dart
        name: a category picked in Review selects it and stays with the draft
    related: [D-DATA-15, R-DATA-75, R-DATA-85]
  - id: R-DATA-34
    group: CSV import
    title: Duplicates start unticked
    text: |
      - same account, side, amount · within **±3 days** since 2026-11-10 · before: the same day
      - counted pairwise · description ignored
      - a row an import brought is found by its key first → R-DATA-77
      - row label: one of three states → R-DATA-78 · before: one duplicate label
    source: BOOKING_IMPORT §9, §9a, §16 D7
    tests:
      - file: test/features/data_import/domain/import_duplicate_matcher_test.dart
        name: a hand-typed booking within three days is a possible duplicate; four days is not
    related: [R-DATA-77, R-DATA-78, R-DATA-79]
  - id: R-DATA-35
    group: CSV import
    title: Cut to server limits
    text: |
      - description 20 · account + category names 20 · labels 24
      - description = the payee since 2026-11-10 → R-DATA-75
    source: BOOKING_IMPORT §5
    related: [R-DATA-75]
  - id: R-DATA-36
    group: CSV import
    title: No currency handling
    text: |
      - currency column ignored · all in the book's currency
      - a currency column naming another code → one warning on *Columns* (2026-11-03) · nothing converted
    source: BOOKING_IMPORT §5
    tests:
      - file: test/features/data_import/domain/import_currency_check_test.dart
        name: a currency column naming another code is reported with its header
  - id: R-DATA-37
    group: CSV import
    title: Limits
    text: 16 MB · 10,000 rows → *split it* · sync note from 2,000
    source: BOOKING_IMPORT §3
    tests:
      - file: test/features/data_import/use_cases/read_import_file_use_case_test.dart
        name: a file above the size cap is refused before it is read
  - id: R-DATA-38
    group: CSV import
    title: Undo on the result screen only
    text: |
      - deleted for good, not trashed
      - items used since are kept
      - a moved starting balance goes back as it was (R-DATA-41)
      - a saved format + learned payees go back too → R-DATA-88
      - leave the page → undo gone
    source: BOOKING_IMPORT §11
    related: [R-DATA-88]
    tests:
      - file: test/features/data_import/use_cases/undo_import_use_case_test.dart
        name: a moved starting balance is put back as it was (D-DATA-17)
      - file: test/features/data_import/use_cases/undo_import_use_case_test.dart
        name: everything the import wrote is deleted, bookings and their labels first
      - file: test/features/data_import/use_cases/undo_import_use_case_test.dart
        name: a category someone booked onto since is kept
  - id: R-DATA-39
    group: CSV import
    title: Insert or skip, never update
    text: never changes existing bookings · never rebuilds recurring rules
    source: BOOKING_IMPORT §13
  - id: R-DATA-41
    group: CSV import
    title: Older history moves a starting balance
    text: |
      - an account's starting balance is its balance on its date · rows from the file up to that day are already in it
      - those rows move the starting balance back to the earliest of them · today's balance stays the typed one
      - rows after that day add as usual · an account without a starting balance just adds them
      - result screen: *Bank: initial balance moved to 9/3/26, so today's balance stays the same*
      - before 2026-11-09: added on top · Bank 2,000 → 8,606.38 € (AND-11-1)
      - web: moves it too since 2026-11-11 · shown on the result · web Undo puts it back
    source: BOOKING_IMPORT §10
    related: [D-DATA-17, R-DATA-38]
    tests:
      - file: test/features/data_import/domain/import_opening_shift_test.dart
        name: rows up to the opening day move it back to the earliest one; today still ends at the typed balance
      - file: test/features/data_import/use_cases/commit_import_use_case_test.dart
        name: history up to a starting balance moves the opening, written last and kept on the receipt (D-DATA-17)

  # Bank import (2026-11-10)
  - id: R-DATA-74
    group: Bank import
    title: Import free · monthly comfort is Pro
    text: |
      - free: the import · re-import key · ±3-day check · *Deleted earlier* · pending rows · balance compare · open-with
      - **Pro**: saved formats · learned payees · row editing · transfer suggestion · import reminder
      - one wizard · Pro parts wear the lock → paywall *Bank import with saved formats*
      - Free result screen: one line *With Pro, the next file from this bank goes straight to Review*
    source: BOOKING_IMPORT §1, §9b, §17 · feature.dart `statementImport`
    tests:
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: no recognition, no learned payees, no format saved, no row edit
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: a purchase made mid-wizard counts for the import
    related: [R-MON-21, R-MON-59, D-DATA-19, D-DATA-12]
  - id: R-DATA-75
    group: Bank import
    title: Description = the payee
    text: |
      - expense → the payee · income → the payer · cut to **20**
      - trailing legal form dropped · *REWE Markt GmbH* → *REWE Markt*
      - empty payee (fee, interest) → the purpose text
      - purpose: a grey line in Review · not saved on the booking
    source: BOOKING_IMPORT §5, §9
    tests:
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: the payee names an expense, the payer an income, the purpose a row with neither
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: a trailing legal form goes when something is left
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: 'every row says what it is: purpose, pending, possible duplicate, learned, transfer'
    related: [D-DATA-21, D-DATA-30, R-DATA-35]
  - id: R-DATA-76
    group: Bank import
    title: One combined bank text is cleaned
    text: |
      - only a file without a payee or payer column
      - removed: the leading phrase · card + terminal tokens · IBANs · digit runs ≥ 4
      - `Bezahlung Karte MC/0001234 BILLA DANKT 1234 WIEN` → `BILLA DANKT WIEN`
      - all noise → the original stays · word list from **synthetic** files so far (T-DATA-05)
    source: BOOKING_IMPORT §20
    tests:
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: each line of the Raiffeisen fixtures is cleaned down to its merchant
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: a text without bank noise is left alone, and an all-noise text keeps its original
    related: [D-DATA-27, T-DATA-05]
  - id: R-DATA-77
    group: Bank import
    title: Re-import key on every imported booking
    text: |
      - `booking.import_ref` · Free too · synced → exact across phones, reinstalls, the web
      - made from: the account the row was read into · day · signed amount · payee · purpose
      - **never** from a Review edit, the row number or a balance column
      - counted, not just found · two identical coffees stay two
    source: BOOKING_IMPORT §9a, §13
    tests:
      - file: test/features/data_import/domain/import_ref_test.dart
        name: 'a draft hashes its file row: the side signs the amount, an edit changes nothing'
      - file: test/features/data_import/domain/import_ref_test.dart
        name: 'same row, other account: the key stays apart (D-BANK-43)'
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a row moved to another account in Review keeps its key (D-BANK-43)
      - file: test/features/data_import/fixtures/bank_fixtures_test.dart
        name: two identical coffees on one day stay two
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: a booking carries its import_ref to the row and back
    related: [D-DATA-22, R-DATA-78]
  - id: R-DATA-78
    group: Bank import
    title: Three duplicate states
    text: |
      - *Already imported* · key in the book → collapsed group below, unticked, tickable
      - *Deleted earlier* · key in this phone's trash, 30 days → same group
      - *Possible duplicate* · ±3-day match → main list, unticked
      - *Select all* never ticks the collapsed group
    source: BOOKING_IMPORT §9, §9a
    tests:
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: 'a row whose key is in the book is already imported: collapsed, unticked, still tickable'
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: 'a key in the trash: deleted earlier (D-BANK-28)'
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: Select all never ticks the rows that are already in the book (D-BANK-27)
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: the rows already in the book sit in one closed group below; open, they are rows like any other
    related: [D-DATA-34, R-DATA-34, R-DATA-79]
  - id: R-DATA-79
    group: Bank import
    title: Who joins the ±3-day check
    text: |
      - hand-typed, scanned and recurring bookings
      - rows imported while pending · the booked twin comes with other text
      - **both** legs of every transfer · the other account's file finds it
      - a booked bank row: found only by its own key
    source: BOOKING_IMPORT §9a
    tests:
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a booked bank row is only found by its own key; one imported while pending still pairs
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: 'a transfer counts on both accounts: from this one as an expense, to it as income (plan §5.3)'
      - file: test/features/data_import/domain/import_duplicate_matcher_test.dart
        name: pairwise, the nearest day first
      - file: test/features/data_import/domain/import_duplicate_matcher_test.dart
        name: three days across the autumn clock change are still three days
    related: [R-DATA-34, R-DATA-78]
  - id: R-DATA-80
    group: Bank import
    title: Pending rows start unticked
    text: |
      - status *Vorgemerkt*, *pending*, *ausstehend*, *未確定* → *Pending at the bank*
      - unticked whatever else it is · can be ticked
    source: BOOKING_IMPORT §9, §20
    tests:
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a pending row starts unticked and can be ticked (D-BANK-13)
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: a pending row is a draft that says so (D-BANK-13)
    related: [D-DATA-21]
  - id: R-DATA-81
    group: Bank import
    title: Saved formats · straight to Review
    text: |
      - **Pro** · the user's, not a book's · usable in any book
      - recognized by header names + delimiter + column count · no values
      - recognized → *Review* with banner *Recognized: {name}* + account pill
      - *Change* or back → every step again
    source: BOOKING_IMPORT §17
    tests:
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: lands on Review with the saved mapping, the format and the file facts
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: 'back and Change leave the shortcut: the earlier steps show in full again'
      - file: test/features/data_import/domain/import_format_test.dart
        name: 'next month hashes the same: the preamble values and the rows stay out'
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: a recognized file names its format and its account on a pill; Change goes back to Columns
    related: [D-DATA-20, D-DATA-35, R-DATA-82, R-DATA-83]
  - id: R-DATA-82
    group: Bank import
    title: A format's account and names, per book
    text: |
      - file's IBAN → that account · no IBAN → the one used last
      - an IBAN no entry has → asked · **never** guessed
      - asked once per book, then remembered
      - names never answered → their step, only *New in this file*, then Review
    source: BOOKING_IMPORT §17
    tests:
      - file: test/features/data_import/domain/import_format_test.dart
        name: 'the account: the file IBAN decides, else the last used, else nothing (D-BANK-6, D-BANK-31)'
      - file: test/features/data_import/domain/import_format_test.dart
        name: names answered last time are applied; unseen ones are reported (D-BANK-29)
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: names nobody answered for yet stop at their step, with only those (D-BANK-29)
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: the account pill sets the file account and runs the duplicate check again (D-BANK-31)
    related: [D-DATA-20, D-DATA-35]
  - id: R-DATA-83
    group: Bank import
    title: Saving a format
    text: |
      - *Save this format* above the Import button · ticked by default · name = the account's name
      - other headers, same account → *Update "{name}"* · no second entry
      - at most **20** · the 21st asks, then replaces the least recently used
      - managed in Settings › Backup & restore › *Saved import formats* · rename, delete
    source: BOOKING_IMPORT §17
    tests:
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: the import hands the commit the format to keep current, ticked by default (D-BANK-15)
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: takes every step; on Review the format is offered under the account name (D-BANK-38)
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: 'the bank changed its export: the same entry gets the new fingerprint and columns (D-BANK-20)'
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: a 21st format replaces the least recently used one (D-BANK-38)
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: 'formats: the name, the account with the last four of its IBAN, when it was used; delete asks first'
    related: [D-DATA-28, D-DATA-29, D-DATA-41]
  - id: R-DATA-84
    group: Bank import
    title: "IBAN: fingerprint only"
    text: |
      - stored: a keyed hash + the last four · **never** the full IBAN
      - key: random per user · synced with the formats → the web matches too
      - server holds key + hash → pseudonymous, not secret
      - listing may say *stored only as a fingerprint* · never *never on the server*
    source: BOOKING_IMPORT §13, §17 · STORE_LISTING §1, §8.1
    tests:
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: 'a new format: the mapping, the account with its IBAN as a hash, and a key made once'
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: a file without an IBAN makes no key; an existing key is kept
      - file: test/features/data_import/domain/import_format_test.dart
        name: a new key is 32 random bytes, and another key gives another hash
    related: [D-DATA-23, D-DATA-26, T-DATA-09, T-PRIV-03]
  - id: R-DATA-85
    group: Bank import
    title: Learned payees
    text: |
      - **Pro** · payee → category · per book · synced
      - taught only by a category **picked or changed** in the import · never an accepted guess
      - next file: the rule beats the category the file names → *Learned*
      - read by the import only · remembers the category only
      - `REWE MARKT 4711` = `REWE Markt GmbH` · a refund is its own rule
    source: BOOKING_IMPORT §18
    tests:
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: only a category picked or changed in the import teaches a rule (D-BANK-21)
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a learned payee rule beats the category the file names (D-BANK-21)
      - file: test/features/data_import/domain/import_format_test.dart
        name: a rule answers before the file category, for the normalized payee and the row side only
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: the key folds case, umlauts, digits and punctuation, and is cut to 64
    related: [D-DATA-24, D-DATA-31, R-DATA-89]
  - id: R-DATA-86
    group: Bank import
    title: Editing a row in Review
    text: |
      - **Pro** · row tap → *Edit row* · amount · side · date · description · account · category · labels · *Make it a transfer*
      - pickers: the book's items + what this import creates · nothing created in the sheet
      - Free: the tap opens the paywall · tick box + category pill keep working
      - edits survive a step back · gone with a new column mapping
    source: BOOKING_IMPORT §9b
    tests:
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: a row tap opens the edit sheet; Apply hands the edit to the cubit
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: an edit overrides date, amount, description, labels and category; a flipped side asks for a category
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: edits survive a trip back to an earlier step and are cleared by a new mapping
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: an edited row is written as edited, under the key of the file row
    related: [D-DATA-21, D-DATA-37]
  - id: R-DATA-87
    group: Bank import
    title: Transfers from a bank file
    text: |
      - made in *Edit row*, or suggested · counterparty IBAN = an own account
      - suggestion: **Pro** · own IBANs are known only from saved formats
      - booked **once**, on the paying account · no category
      - a row the file itself calls a transfer: still skipped (R-DATA-33)
    source: BOOKING_IMPORT §9b, §16 D12
    tests:
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a transfer is booked once, on the paying account, with the key of the row it came from
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a suggested transfer has no category, is ticked, and never points at its own account
      - file: test/features/data_import/domain/import_format_test.dart
        name: a counterparty IBAN that is an own account of this book suggests it
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: making a row a transfer hides the category and asks for the other account
    related: [D-DATA-23, D-DATA-32, R-DATA-33]
  - id: R-DATA-88
    group: Bank import
    title: Undo takes everything back
    text: |
      - the bookings · a newly saved format · the payees this import learned
      - an updated format → as it was · a format the 21st pushed out returns
      - a failed import saves no format and no payee
    source: BOOKING_IMPORT §10, §11
    tests:
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: undo takes the format and the rules back with the bookings
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: undo removes a new format and writes an updated one back as it was (D-BANK-30)
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: a failed import saves no format and no rule
    related: [D-DATA-36, R-DATA-38]
  - id: R-DATA-89
    group: Bank import
    title: Who may
    text: |
      - import · learned payees · reminder: **owner or admin**
      - members read *Learned payees* · can't change them
      - formats are the user's own
      - Pro ended → both pages read-only with the lock · nothing deleted
    source: BOOKING_IMPORT §17, §18 · plan §1c, §10.2
    tests:
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: 'payees: the learned key and its category; a member reads and cannot change'
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: rename and delete; all of it refused without Pro
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: without Pro nothing is learned, and a direct change is refused
    related: [D-DATA-37, D-DATA-29]
  - id: R-DATA-90
    group: Bank import
    title: Balance compare after the import
    text: |
      - Free · when the file states a balance + every imported row went into **one** account
      - equal → *Matches the bank: {amount}* · no button
      - different → *Bank: … · Book: …* · *{n} rows not imported* · *Check balance*
      - *Check balance* → Balance check on that day · the bank's figure filled, *From the bank file*
      - a card: the debt compares whichever sign the bank writes
    source: BOOKING_IMPORT §19
    tests:
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: 'equal at the currency precision: matches; the book is read at the end of the stated day'
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: 'different: both figures, and the bank figure is what the count field takes'
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: 'a card: the debt compares whichever sign the bank writes, and the field takes the amount owed'
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: 'no stated balance, no day, more than one account or an unknown account: no compare'
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: a failing compare never fails the import
    related: [D-DATA-38, R-BC-11]
  - id: R-DATA-91
    group: Bank import
    title: Open a CSV with Money Koi
    text: |
      - Free · app only · from Files, Downloads or a mail attachment
      - decided by **content**: a zip → restore · a table of 2+ columns → import · else *This file can't be opened*
      - into the active book · the File step says *Into {book}*
      - a member gets the owner-or-admin note · nothing is read
    source: BOOKING_IMPORT §19
    tests:
      - file: test/features/data_import/service/opened_file_sniffer_test.dart
        name: text that reads as a table is an import, with its name and bytes, whatever it is called
      - file: test/features/data_import/service/opened_file_sniffer_test.dart
        name: a ZIP is a backup, whatever it is called
      - file: test/features/data_import/service/opened_file_sniffer_test.dart
        name: binary data, one column of words and an empty file are not a table
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: a CSV opens the booking import with the file loaded, not the restore
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: a file that is neither a backup nor a table says it cannot be opened
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: a file opened with Money Koi starts the wizard loaded, into the active book
    related: [D-DATA-39, J-DATA-07]
  - id: R-DATA-92
    group: Bank import
    title: Import reminder
    text: |
      - **Pro** · per book · 30 days after the last import into it · off by default
      - switched on: *Remind in a month* on the result · Settings › Notifications › *Import reminder*
      - overdue → once per 30 days, never daily · another phone's import moves it
      - tap → the import for that book
    source: BOOKING_IMPORT §19
    tests:
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: thirty days after the last import, at the reminder time
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: an overdue reminder repeats once per interval, never daily
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: armed a month after the newest imported booking, one id per book, tap names the book
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: off by default; nothing without Pro, for a member, or in a book that never imported
    related: [D-DATA-40, R-NTF-15]
  - id: R-DATA-93
    group: Bank import
    title: Formats stay out of a backup · payees go in
    text: |
      - `.moneykoi`: learned payees + every booking's re-import key
      - saved formats: **not** in the file · the user's, not the book's
      - *Download all data*: no formats either → D-DATA-43
      - the Pro → Cloud claim carries the formats up · server's key wins
    source: BOOKING_IMPORT §17, §18 · BACKUP_FORMAT.md §1a, §4, §6
    tests:
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: a backup file never carries the formats; the claim does (BACKUP_FORMAT.md, plan §10.1)
      - file: test/features/data_import/domain/import_format_test.dart
        name: a book id inside the document follows the claim (plan §10.1)
    related: [D-DATA-42, D-DATA-43, R-DATA-04]
  - id: R-DATA-94
    group: Bank import
    title: What the file itself says
    text: |
      - account: exactly one valid IBAN above the header
      - balance: a line naming *Kontostand*, *Saldo*, *Balance*, *残高* · else the newest booked row's balance column
      - date = the booking day · a value-day column is never picked by itself · *Columns* can switch
      - read from **synthetic** DKB + Raiffeisen files only · real ones: T-DATA-05
    source: BOOKING_IMPORT §20
    tests:
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: exactly one valid IBAN in the preamble is the account; two leave it open
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: without a preamble balance, the running-balance column of the newest booked row counts
      - file: test/features/data_import/domain/import_bank_row_test.dart
        name: the booking day is the date; a value-day column is never claimed for it (D-BANK-32)
      - file: test/features/data_import/fixtures/bank_fixtures_test.dart
        name: 'keeps the preamble: one account IBAN and the stated balance with its day'
    related: [D-DATA-37, T-DATA-05]

  # Booking export
  - id: R-DATA-50
    group: Booking export (CSV)
    title: "Booking export: Pro, every member"
    text: |
      - `Feature.exportFiltered` · lock → paywall *Data export*
      - read-only members may use it
      - same gate as every export (R-MON-21)
    source: feature.dart, backup_restore_page.dart, BOOKING_EXPORT §1
    tests:
      - file: test/features/backup/ui/backup_restore_page_test.dart
        name: a read-only member may export bookings, though not back up or import
    related: [R-MON-21]
  - id: R-DATA-51
    group: Booking export (CSV)
    title: Opens on This month
    text: the budget month · *Reset* returns to it
    source: BOOKING_EXPORT §4
    tests:
      - file: test/features/booking_export/bloc/booking_export_cubit_test.dart
        name: opens on the budget month, so older bookings wait for a wider period
  - id: R-DATA-52
    group: Booking export (CSV)
    title: File reads back via import
    text: |
      - plain table · no metadata, no booking id
      - transfers + opening balances → skipped on import
      - text starting `=` `+` `-` `@`, tab or CR → leading `'` · import strips it · amounts stay bare
      - `currency` = ISO code (`USD`) since 2026-11-03 · older files with `$` still import (D-DATA-14)
      - last row ends with a line break
    source: BOOKING_EXPORT §1, DATA_PORTABILITY §1a
    tests:
      - file: test/features/booking_export/booking_export_round_trip_test.dart
        name: every booking comes back field by field, transfers and opening balances listed as skipped
      - file: test/features/budget_book/service/booking_csv_builder_test.dart
        name: writes the ISO code, not the symbol, so a dollar is never ambiguous
      - file: test/shared/export/service/csv_encoder_test.dart
        name: ends the last row with a line break, so no tool drops or merges it
      - file: test/features/booking_export/booking_export_round_trip_test.dart
        name: no booking id is written, in the header or in a row
      - file: test/features/booking_export/booking_export_round_trip_test.dart
        name: reads back as written, amounts untouched
    related: [E-PRIV-43, D-DATA-14]
  - id: R-DATA-53
    group: Booking export (CSV)
    title: "Filters: OR within, AND across"
    text: |
      - period · categories · labels · creator
      - parent's own row = bookings on the parent itself
      - ticking a parent → its subs too
    source: BOOKING_EXPORT §4
    tests:
      - file: test/features/booking_export/domain/booking_export_matcher_test.dart
        name: 'an id is exact: a parent stands for its own bookings only, its subcategories are picked by theirs'

  # On the web
  - id: R-DATA-70
    group: On the web
    title: "Web backup: same file"
    text: |
      - same `.moneykoi` format + passphrase · files move freely
      - browser download · no `settings.json`
      - photos once, no retry queue
    source: BACKUP_RESTORE_WEB §7
  - id: R-DATA-71
    group: On the web
    title: "Web book export: 14 CSVs"
    text: |
      - owner or admin · active book · Books page
      - no `moneykoi-data.json`
      - no *Download all data* on the web
    source: DATA_EXPORT_WEB §7
  - id: R-DATA-72
    group: On the web
    title: "Web CSV import: same wizard"
    text: |
      - Columns → Accounts → Categories → Review
      - writes straight to the server
      - duplicates: ±3 days since 2026-11-11 · before: the exact day
      - bank layer → R-DATA-95
    source: IMPORT_WEB §1, §4, §7
    related: [R-DATA-95, R-DATA-96, R-DATA-97]
  - id: R-DATA-95
    group: On the web
    title: "Web bank import: same engine, no paywall"
    text: |
      - built 2026-11-11 · saved formats, learned payees, row editing, transfers, balance compare
      - **no** lock · every web book is Cloud, Cloud includes Pro
      - same re-import key as the app · shared vector files, a test fails on drift
      - states: *Already imported* (collapsed card) · *Possible duplicate* (±3 days) · *Pending at the bank* (unticked) · transfer legs count
      - not on the web: *Deleted earlier* · open-with · import reminder · usage event
    source: IMPORT_WEB §1, §4, §7, §9
    tests:
      - file: src/app/(main)/bookings/import/lib/bank-import.test.ts
        repo: web
        name: a hand-typed booking within three days is a possible duplicate, on the fourth day it is not
      - file: src/app/(main)/bookings/import/lib/bank-import.test.ts
        repo: web
        name: 'both legs of a transfer count: out of this account for an expense row, into it for an income row'
      - file: src/app/(main)/bookings/import/page.test.tsx
        repo: web
        name: a recognized file goes straight to Review, with its account, its already imported rows collapsed, and Change back to Columns
    related: [R-DATA-74, R-DATA-77, R-DATA-78, E-DATA-84, D-DATA-25]
  - id: R-DATA-96
    group: On the web
    title: "Web category guess: history, then names"
    text: |
      - order: learned payee → the book's bookings (same description, then a shared word) → category names
      - **no** keyword map or merchant registry → app may guess where the web says *Choose a category*
      - category column optional on the web too · a row without a category can't be ticked
    source: IMPORT_WEB §4.4
    tests:
      - file: src/app/(main)/bookings/import/page.test.tsx
        repo: web
        name: a bank file without a category column goes on; Review asks for the categories it cannot guess
      - file: src/app/(main)/bookings/import/lib/bank-import.test.ts
        repo: web
        name: a row without a category cannot be selected, whatever the selection says
    related: [R-DATA-40, D-DATA-33, D-DATA-15]
  - id: R-DATA-97
    group: On the web
    title: "Web: editing, managing, balance, undo"
    text: |
      - row editing in a dialog · existing items + what the import creates · a transfer booked once, on the paying account
      - Settings › Data Management: *Saved import formats* (every role, own) · *Learned payees* (members read)
      - *Check balance* → `/balance-check/new` · the bank's figure via sessionStorage, **never** the URL · *From the bank file* until edited
      - Undo: bookings + format + learned payees + a moved opening
    source: IMPORT_WEB §4.7–§4.9, §4.12, §6
    tests:
      - file: src/app/(main)/bookings/import/page.test.tsx
        repo: web
        name: compares the stated balance and hands the bank figure to the balance check outside the URL
      - file: src/app/(main)/settings/learned-payees/page.test.tsx
        repo: web
        name: a member reads the rules and can change none
      - file: src/app/(main)/bookings/import/services/import.service.test.ts
        repo: web
        name: 'takes everything back: a new format, a created and a changed rule, a moved opening (D-BANK-30)'
    related: [R-DATA-86, R-DATA-89, R-DATA-90, R-DATA-88, E-DATA-91]
  - id: R-DATA-73
    group: On the web
    title: "Web booking export: ledger CSV"
    text: current ledger filter → `bookings.csv` · no export page, no PDF
    source: DATA_EXPORT_WEB §7, catalog
