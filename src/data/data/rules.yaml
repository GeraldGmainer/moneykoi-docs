# Source: BACKUP_RESTORE_AI_CONTEXT.md, BOOKING_IMPORT_AI_CONTEXT.md, BOOKING_EXPORT_AI_CONTEXT.md,
# DATA_PORTABILITY_AI_CONTEXT.md, moneykoi-app lib/features/monetization/domain/feature.dart.
items:
  # Backup files
  - id: R-DATA-01
    group: Backup files
    title: A restore never merges into another book
    text: |
      It makes a **new** book, or — only for the book the file came from — undoes changes in place behind a red dialog. On a phone without Cloud it replaces one of your own books.
    source: BACKUP §0, §1
  - id: R-DATA-02
    group: Backup files
    title: Creating a backup is Pro; restoring is free
    text: |
      Create: Pro, owner or admin of the active book. Restore: everyone, any plan. The photos option, the passphrase and the reminder ride on the same lock.
    source: BACKUP §6, MONETIZATION §3 rule 5
    tests:
      - file: test/features/backup/use_cases/create_backup_use_case_test.dart
        name: an owner or admin of the active book may back it up, a member may not
      - file: test/features/backup/use_cases/schedule_backup_reminder_use_case_test.dart
        name: nothing is armed while backups are locked by the plan
    related: [R-MON-21]
  - id: R-DATA-03
    group: Backup files
    title: A backup is made on the phone, offline
    text: |
      From the phone's own copy, which also holds writes not yet synced. Only photos already uploaded need a connection.
    source: BACKUP §3
    tests:
      - file: test/features/backup/data/book_snapshot_reader_test.dart
        name: read pages by id, encodes every row through the codec and resolves lookups by name
  - id: R-DATA-04
    group: Backup files
    title: Everything, not just bookings
    text: |
      Every synced kind of record of the book is in the file; a new one fails the build until it is added.
    source: BACKUP §9, §11
    tests:
      - file: test/features/backup/backup_entity_coverage_test.dart
        name: every tenant-scoped synced entity is backed up
  - id: R-DATA-05
    group: Backup files
    title: Never half a book
    text: |
      The server restore is one transaction; a phone restore stages every row aside and swaps them in at once. A cancel, a failure or a killed app leaves the book as it was.
    source: BACKUP §4, §4c
    tests:
      - file: test/features/backup/restore_backup_use_case_test.dart
        name: cancelling stops the upload and never applies
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: 'an app killed part-way: the staged rows are never the book'
  - id: R-DATA-06
    group: Backup files
    title: New ids on restore
    text: |
      Every id is regenerated and every link follows. Kept only on a phone that holds no other book, where nothing can collide.
    source: BACKUP §5, §4c
    tests:
      - file: test/features/backup/backup_remapper_test.dart
        name: every id is regenerated and every link follows its row
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: next to another book on the phone the ids are remapped, so nothing can collide
  - id: R-DATA-07
    group: Backup files
    title: An old file always restores; a newer one is refused by name
    source: BACKUP §8
    text: |
      `format_v1.moneykoi` is checked in and never regenerated — it stands for files on users' drives.
    tests:
      - file: test/features/backup/backup_archive_test.dart
        name: the checked-in format v1 fixture still opens and remaps
      - file: test/features/backup/backup_archive_test.dart
        name: a file from a newer app is refused by name
  - id: R-DATA-08
    group: Backup files
    title: Nothing silently missing
    text: |
      A row that cannot be linked is skipped and counted, a renamed duplicate gets " (2)", a bad photo is left out and counted — the restore still succeeds and the result says what happened.
    source: BACKUP §5, §4d
    tests:
      - file: test/features/backup/backup_remapper_test.dart
        name: a booking whose category is not in the file is skipped, and its dependants unlink
      - file: test/features/backup/backup_archive_extras_test.dart
        name: a photo that fails its checksum is left out and counted, the rest still come
  - id: R-DATA-09
    group: Backup files
    title: Only a finished save counts as a backup
    text: |
      A cancelled save dialog or a dismissed share sheet is not a backup: no *last backup* stamp, no re-armed reminder.
    source: BACKUP §3
    tests:
      - file: test/features/backup/use_cases/create_backup_use_case_test.dart
        name: a cancelled picker is not a backup, so nothing is stamped
      - file: test/features/backup/use_cases/create_backup_use_case_test.dart
        name: a dismissed share sheet is not a backup
  - id: R-DATA-10
    group: Backup files
    title: No storage permission, ever
    text: |
      The system save dialog is the permission. Never saved into the app's own storage — it dies with an uninstall.
    source: BACKUP §3a, BOOKING_EXPORT §7
  - id: R-DATA-11
    group: Backup files
    title: The passphrase is the user's alone
    text: |
      ≥ 8 characters, typed twice; every entry AES-256 encrypted, opens in 7-Zip with the same passphrase (umlauts too). It never sits in app state. Lost passphrase = lost file.
    source: BACKUP §4h
    tests:
      - file: test/features/backup/bloc/create_backup_cubit_test.dart
        name: the passphrase reaches the backup but never the state
      - file: test/features/backup/backup_archive_extras_test.dart
        name: a protected file opens only with its passphrase, every entry encrypted
  - id: R-DATA-12
    group: Backup files
    title: Photos are opt-in and come back through the upload queue
    text: |
      Under the restored receipt's new id and the new book; storage paths are never copied.
    source: BACKUP §4d
    tests:
      - file: test/features/backup/backup_archive_extras_test.dart
        name: are extracted under the restored receipt id, byte for byte
      - file: test/features/backup/data/backup_photo_restorer_test.dart
        name: queues each photo under the restored receipt and the new book, in order, then cleans up
  - id: R-DATA-13
    group: Backup files
    title: Settings travel, but only a new phone takes them
    text: |
      Applied on a *Welcome back* restore only; notification settings and goal reminders never (turning a channel on is when the OS asks).
    source: BACKUP §4g
    tests:
      - file: test/features/backup/data/backup_settings_store_test.dart
        name: profile settings are written, but notifications stay as the phone has them
  - id: R-DATA-14
    group: Backup files
    title: Undo in place has four fences
    text: |
      A book that syncs; the file made from this very book; owner or admin; no unsent writes of this book.
    source: BACKUP §4b
    tests:
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: never a book that does not sync, and apply refuses it before anything is sent
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: a file from another book, or no active book, is the wrong book
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: pending outbox items of this book block the rewind
  - id: R-DATA-15
    group: Backup files
    title: Where a restore lands
    text: |
      - **Account with Cloud** → a new book on the server
      - **Account without Cloud** → replaces the own book you pick, or a new own book kept on the phone
      - **No account, empty phone** (*Welcome back*) → this phone, with settings
      - **Local book** → replaces it, after a red confirmation
    source: BACKUP §4c
    tests:
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: an account with Cloud restores on the server into a new book
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: a new book of its own is the target, never a server restore that would open empty
  - id: R-DATA-16
    group: Backup files
    title: A phone restore keeps the book's name and currency
    text: |
      A file in another currency gets a note; nothing is converted.
    source: BACKUP §4c

  # Your data
  - id: R-DATA-20
    group: Your data
    title: '*Download all your data* is free, for every member'
    text: |
      One zip: `profile.json`, a README and one restorable `.moneykoi` per book. A book you only belong to gives your own entries. Access to your own data is never paid (decided 2026-10-16), even though each file inside restores like a backup.
    source: BACKUP §4f
    tests:
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: 'one zip: a restorable backup per book, the profile and a README'
  - id: R-DATA-21
    group: Your data
    title: Books are read where their real rows are
    text: |
      The active book and any book that does not sync from the phone; another book that syncs from the server. Offline with another syncing book → refused before anything is read.
    source: BACKUP §4f
    tests:
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: another book that does not sync comes from the phone, offline too
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: offline with other books is refused before anything is read
  - id: R-DATA-22
    group: Your data
    title: The whole-book export (ZIP) strips ids
    text: |
      14 CSVs + `moneykoi-data.json` + README, owner or admin, active book, from the Book card menu. No id that names a book or a person leaves in it.
    source: DATA_PORTABILITY §1, §2
    tests:
      - file: test/features/data_export/bloc/data_export_cubit_test.dart
        name: a member who may not export is denied, and export does nothing
  - id: R-DATA-23
    group: Your data
    title: Erase data — owner only, irreversible
    text: |
      Deletes every record of the book, on every device; keeps the book, its name, members and settings. Nothing stays in the trash to restore.
    source: DATA_PORTABILITY §5
    tests:
      - file: test/features/book/ui/book_card_menu_test.dart
        name: the owner of the active book can export, import and erase

  # CSV import
  - id: R-DATA-30
    group: CSV import
    title: One CSV, owner or admin, free
    text: |
      Into the active book; bookings plus the accounts, categories and labels they need. Nothing is written until **Import**.
    source: BOOKING_IMPORT §1
    tests:
      - file: test/features/data_import/use_cases/commit_import_use_case_test.dart
        name: a member who may not import is refused before anything is written
  - id: R-DATA-31
    group: CSV import
    title: Accounts match exactly, never fuzzily
    text: |
      Same name, ignoring case, hidden accounts included. "Giro" onto "Giro alt" would move money silently.
    source: BOOKING_IMPORT §7
  - id: R-DATA-32
    group: CSV import
    title: Categories — exact, then a synonym as a suggestion, then new
    text: |
      Always within the side (income / expense). DE/EN/JA synonyms suggest; a new one is top-level with the template's look. Never onto a parent that has subcategories — the user picks a sub.
    source: BOOKING_IMPORT §8
  - id: R-DATA-33
    group: CSV import
    title: What is skipped and listed
    text: |
      Rows without a category (a file without a category column cannot continue), transfers, opening balances, bad dates or amounts, zero amounts — each with its row number and reason.
    source: BOOKING_IMPORT §5
  - id: R-DATA-34
    group: CSV import
    title: Duplicates start unticked
    text: |
      Same account, day, side and amount as an existing booking — counted pairwise, description ignored.
    source: BOOKING_IMPORT §9
  - id: R-DATA-35
    group: CSV import
    title: Cut to the server's limits
    text: |
      Description 20 characters (hard cut), account and category names 20, labels 24.
    source: BOOKING_IMPORT §5
  - id: R-DATA-36
    group: CSV import
    title: No currency handling
    text: |
      A currency column is ignored; every amount is taken in the book's currency, nothing converted or flagged.
    source: BOOKING_IMPORT §5
  - id: R-DATA-37
    group: CSV import
    title: Limits
    text: |
      16 MB, 10,000 rows (refused with "split it"), a background-sync note from 2,000.
    source: BOOKING_IMPORT §3
    tests:
      - file: test/features/data_import/use_cases/read_import_file_use_case_test.dart
        name: a file above the size cap is refused before it is read
  - id: R-DATA-38
    group: CSV import
    title: Undo on the result screen only
    text: |
      Deleted for good, not trashed; an account, category or label someone booked onto since is kept. Leaving the page ends it.
    source: BOOKING_IMPORT §11
    tests:
      - file: test/features/data_import/use_cases/undo_import_use_case_test.dart
        name: everything the import wrote is deleted, bookings and their labels first
      - file: test/features/data_import/use_cases/undo_import_use_case_test.dart
        name: a category someone booked onto since is kept
  - id: R-DATA-39
    group: CSV import
    title: Insert or skip, never update
    text: |
      An import never changes an existing booking, and never rebuilds recurring rules.
    source: BOOKING_IMPORT §13

  # Booking export
  - id: R-DATA-50
    group: Booking export (CSV)
    title: Filtered booking export is Pro, for every member
    text: |
      `Feature.exportFiltered` — the tile wears the lock and opens the paywall. Read-only members may use it. (`BOOKING_EXPORT_AI_CONTEXT.md` D12 still says "free" — stale, see T-DATA-01.)
    source: feature.dart, backup_restore_page.dart
    tests:
      - file: test/features/backup/ui/backup_restore_page_test.dart
        name: a read-only member may export bookings, though not back up or import
    related: [T-DATA-01]
  - id: R-DATA-51
    group: Booking export (CSV)
    title: Opens on This month, never all time
    text: |
      The anchored budget month. *Reset* returns to it.
    source: BOOKING_EXPORT §4
    tests:
      - file: test/features/booking_export/bloc/booking_export_cubit_test.dart
        name: opens on the budget month, so older bookings wait for a wider period
  - id: R-DATA-52
    group: Booking export (CSV)
    title: The file reads back through the import
    text: |
      A plain table: no metadata block, no booking id; transfers and opening balances come back as skipped.
    source: BOOKING_EXPORT §1
    tests:
      - file: test/features/booking_export/booking_export_round_trip_test.dart
        name: every booking comes back field by field, transfers and opening balances listed as skipped
      - file: test/features/booking_export/booking_export_round_trip_test.dart
        name: no booking id is written, in the header or in a row
  - id: R-DATA-53
    group: Booking export (CSV)
    title: Filters — OR within, AND across
    text: |
      Period, categories, labels, creator. A parent's own row means bookings filed on the parent itself; ticking a parent takes its subs too.
    source: BOOKING_EXPORT §4
    tests:
      - file: test/features/booking_export/domain/booking_export_matcher_test.dart
        name: 'an id is exact: a parent stands for its own bookings only, its subcategories are picked by theirs'

  # On the web
  - id: R-DATA-70
    group: On the web
    title: Backup & restore — the same file, in a browser
    text: |
      The web writes and reads the same `.moneykoi` format (passphrase included) — files move freely between web and app. Differences: a browser download instead of Save / Share, no `settings.json` (ignored on open, never written), photos downloaded and uploaded at once without a retry queue, packing on the main thread.
    source: BACKUP_RESTORE_WEB §7
  - id: R-DATA-71
    group: On the web
    title: Book export — 14 CSVs and a README
    text: |
      Owner or admin, active book, from the Books page. No `moneykoi-data.json` (nothing reads it since 2026-09-28). Download all your data is not on the web — it reads only the active book.
    source: DATA_EXPORT_WEB §7
  - id: R-DATA-72
    group: On the web
    title: CSV import — the same wizard
    text: |
      Columns → Accounts → Categories → Review with the app's detection and fixtures; writes go straight to the server (no outbox), the duplicate window is the exact day range.
    source: IMPORT_WEB §7
  - id: R-DATA-73
    group: On the web
    title: Booking export — one CSV from the ledger
    text: |
      The ledger's current filter as the shared 16-column `bookings.csv`; no multi-select export page, no PDF.
    source: DATA_EXPORT_WEB §7, catalog
