# Source: Trello release notes 1.17.0 (items 9, 21–27). The "Import, export, erase" group is
# derived from the context docs, not from an earlier checklist.
groups:
  - id: backup
    title: Create a backup
    setup: Pro (simulator) + owner or admin
    items:
      - id: C-DATA-001
        text: "*Include receipt photos* → progress → *Save to device* → *Choose where to save* (iPhone: names the Files app, iCloud Drive or a folder on this device · Android: a folder like Downloads) → file in Files · *last backup* updates"
      - id: C-DATA-015
        text: Photos on, offline → *N photos could not be included* · backup made
      - id: C-DATA-016
        text: 100+ photos → no out-of-memory crash
      - id: C-DATA-002
        text: Passphrase < 8 → error · mismatch → error · "Käse-Brot1" → opens in 7-Zip/Keka
      - id: C-DATA-020
        text: "iOS: passphrase offers a strong password → saved to Keychain"
      - id: C-DATA-055
        text: "iPhone: *Save to device* → the save picker opens as a card below the status bar, *Cancel* clear of the clock · *Cancel* → back on the page, nothing saved (IOS-10-2)"

  - id: restore
    title: Restore
    items:
      - id: C-DATA-003
        text: "Cloud: restore → preview → red confirm → new book · *N photos restored*"
      - id: C-DATA-017
        text: One damaged jpg → only that photo fails
      - id: C-DATA-019
        text: Protected file via picker, open-with, *Welcome back* › *Restore* → unlock sheet · wrong → error, stays · photos restore
      - id: C-DATA-004
        text: Delete 3 → restore → *Bring back* · edit → *Undo everything* · partner follows
      - id: C-DATA-005
        text: Fresh install → *Sign in* → *Restore* → *Restore a backup* → all back · no double recurring
      - id: C-DATA-014
        text: Local book → *Restore* → red *Replace* → book = file
      - id: C-DATA-013
        text: Airplane or kill during phone restore → book untouched
      - id: C-DATA-026
        text: Old v1 file restores · 100 MB+ on both platforms · non-backup → *damaged*

  - id: settings
    title: Settings travel with the file
    items:
      - id: C-DATA-021
        text: Phone A settings → backup → fresh phone B restore → preview says settings · values match · B's notifications unchanged

  - id: open-with
    title: Open-with `.moneykoi`
    items:
      - id: C-DATA-006
        text: "Files · Gmail · WhatsApp · Drive · AirDrop → restore preview · Android: one recents card"
      - id: C-DATA-022
        text: Each source × cold/warm/open × account/local/fresh
      - id: C-DATA-023
        text: Protected → unlock first · app lock → lock first · relaunch → preview not reopened

  - id: reminder
    title: Backup reminder
    items:
      - id: C-DATA-007
        text: Reminder fires → tap → *Backup & restore* for that book
      - id: C-DATA-024
        text: "*Weekly* → permission · Debug → Notify shows it · backup → time moves · book switch → re-armed"

  - id: all-data
    title: Download all data
    setup: Pro (simulator)
    items:
      - id: C-DATA-008
        text: "Two books, one joined → zip: profile.json + README + backup per book · joined = own entries"
      - id: C-DATA-025
        text: Save + share work · offline with 2+ syncing books → *needs internet* · inner files restore

  - id: csv
    title: Import, export, erase
    setup: From the context docs
    items:
      - id: C-DATA-009
        text: Real bank CSV (Sparkasse, N26) → columns, accounts, categories, review, import, undo
      - id: C-DATA-010
        text: Export by category + tag → CSV → Excel/Numbers → import into another book
      - id: C-DATA-011
        text: "Book card → *Export data* (ZIP) · member: hidden"
      - id: C-DATA-012
        text: "*Erase data* → trash empty too · partner's phone empties"
      - id: C-DATA-027
        text: "Simulator *Free* → book card ⋮ *Export data* · *Download all data* · *Export bookings* · Budget Book ⋮ *Export* · PDF → each opens the paywall at *Data export*"
      - id: C-DATA-028
        text: "Simulator *Free* → CSV import and *Restore from a backup* still work, no lock"
      - id: C-DATA-056
        text: "Budget Book › Export › *CSV* → menu *Save to device* first, *Share* second → save → system dialog → *File saved* · *PDF* → *Share* → share sheet · same in Analytics › Export and a category's activity · Android + iPhone (D-DATA-18)"

  - id: web
    title: On the web
    items:
      - id: C-DATA-050
        text: Web backup (passphrase) → restore in app · app backup → restore on web · both compare
      - id: C-DATA-053
        text: "Forecast: bills off, *Spent per month* 300, income estimate *off* → web backup → restore in app (and the reverse) → all three kept"
      - id: C-DATA-051
        text: "Web book export → 14 CSVs + README · member: no export"
      - id: C-DATA-052
        text: "Same bank CSV, web vs app → same columns, accounts, duplicates · a guessed category may differ: the web shows *Choose a category* where the app guesses (R-DATA-96)"
      - id: C-DATA-069
        text: "Web, after the migration (T-DATA-07): first file of a bank → *Save this format* → the second file goes straight to *Review*, *Recognized: {name}*"
      - id: C-DATA-070
        text: "Web: the same file twice → every row under *n already imported* · nothing to import · app-imported file on the web → the same"
      - id: C-DATA-071
        text: "Web, as a member: Settings › Data Management › *Learned payees* lists the rules · no change, no delete · *Saved import formats* still editable"
      - id: C-DATA-072
        text: "Format saved on the phone → the web recognizes that bank's next file · format saved on the web → the phone recognizes it · needs T-DATA-07"
      - id: C-DATA-073
        text: "Web: file with a stated balance, one row unticked → *Bank: … · Book: …* → *Check balance* → count sheet, one field filled, *From the bank file* · no amount in the address bar"
      - id: C-DATA-074
        text: "Real DKB file → Amazon rows named *Amazon* · tap a row → order number on top → tap opens the order on amazon.de (browser or Amazon app) → back: the sheet still holds what was typed · copy button → number on the clipboard · Android + iPhone"
      - id: C-DATA-076
        text: "Recurring payment *Netflix* 12.99 on the 5th, booked → bank file with Netflix 12.99 on the 7th → Review: *Recurring payment, already booked*, unticked, category *Streaming Service* · summary *1 booking is already in this book from a recurring payment* · tick it → the line goes · a deleted booking's date → row ticked, *not booked yet* · Android + iPhone + web"
      - id: C-DATA-075
        text: "Amazon row → *Split* → part 1 shows the whole amount · part 2 amount on the app keypad, description, category → amber *more than the amount* → wand on part 1 → *Parts add up* → *Apply* → row lists both parts · import → two bookings · a split left short also applies and imports as typed · the same file again → row under *already imported*, no badge beside it · Amazon rows start without a category"
  - id: release-2-0-0
    title: 2.0.0 · 2026-11-08
    items:
      - id: C-DATA-054
        text: "CSV import of a bank file with a payee column → each row gets its own category guess · payee mapped · account and currency hints on their steps · export → currency column reads `EUR` · a description `=1+1` exports as `'=1+1`, amounts like `-12.5` stay numbers · import that file → `=1+1` again · same on the web"
  - id: bank-import
    title: Bank import · 2026-11-10
    setup: Built on **synthetic** bank files only · real exports first (T-DATA-05) · Pro (simulator) unless a line says Free · server migration applied (T-DATA-07)
    items:
      - id: C-DATA-057
        text: "Real DKB Girokonto export → account IBAN + *Kontostand* read · the payee names each booking · purpose as a grey line · *Vorgemerkt* rows unticked, *Pending at the bank*"
      - id: C-DATA-058
        text: "Real DKB Visa export → no IBAN · the merchant names the booking · the foreign-currency column is not the amount · balance line right for a card that owes"
      - id: C-DATA-059
        text: "Real Raiffeisen export (no header) → date, text, amount found · each text cleaned down to the merchant · wrong or missing cleaner words noted"
      - id: C-DATA-060
        text: "Two exports of one account overlapping by weeks → the second adds each row once · the rest under *n already imported* · same file again → nothing to import"
      - id: C-DATA-061
        text: "Second account of the same bank → same format recognized · its IBAN picks the other account · a file without IBAN → account pill, last used · a transfer between both is suggested"
      - id: C-DATA-062
        text: "Tap a `.csv` in Files and in a mail attachment · Android + iPhone · app closed and app open → import loaded, *Into {book}* · a `.moneykoi` still opens the restore · a photo → *This file can't be opened*"
      - id: C-DATA-063
        text: "Result → *Remind in a month* → permission asked → reminder *Time for the bank file* fires 30 days later (time travel) → tap opens the import for that book, from another book too"
      - id: C-DATA-064
        text: "Review → tap a row → *Edit row* → amount on the app keypad · phone + tablet → *Apply* → the row shows the new amount · *Reset to the file* puts it back"
      - id: C-DATA-065
        text: "Simulator *Free* → Review: *Save this format* locked → paywall *Bank import with saved formats* · row tap → paywall · tick boxes + category pill work · result shows the Pro hint line · a Free user meets these locks only when Pro lapsed during a bank import (R-DATA-74) · the entry lock is C-DATA-078"
      - id: C-DATA-066
        text: "After the migration: format + learned payee saved on phone A → phone B and the web recognize the next file, rows show *Learned*"
      - id: C-DATA-067
        text: "Untick one row → import → *Bank: … · Book: …* + *1 row not imported* → *Check balance* → count page on the bank's day, one field filled, *From the bank file*"
      - id: C-DATA-068
        text: "Backup & restore → *Saved import formats*: rename, delete · *Learned payees*: *Change category*, delete · a member reads only · simulator *Free* → both locked, entries kept"
      - id: C-DATA-077
        text: "Bank file with a long payee (*Hausverwaltung Müller GmbH*) → Review and the saved booking say *Hausverwaltung* · same on the web (A5-1)"
      - id: C-DATA-078
        text: "Simulator *Free* → Budget Book ⋮ › *Import bank file* wears the lock → paywall → buy Pro → the bank import opens · Settings › Backup & restore › *Import bookings* with Pro → no *Save this format*, no lock on the rows, no reminder switch on the result · a `.csv` from Files: Pro → *Recognized* for a saved bank, Free → the simple import (D-DATA-52)"
      - id: C-DATA-079
        text: "Bank file with rows already typed by hand → Review lists only the new rows · three closed groups below: *n possible duplicates*, *n booked by recurring payments*, *n already imported* · open → each row unticked, a duplicate with the category of the booking it matched, a recurring row with its payment's · *Select all* leaves the groups alone · same on the web (D-DATA-53)"
      - id: C-DATA-080
        text: "Bank file without a category column (DKB, ELBA) → *Categories*: one line per payee, *SPAR* branches on one line · pick a category on a line → every row of it set · open a line → one row changed · *All other expenses without a category* → the rest · *Review*: the picked rows ticked, a possible duplicate not · a row left without a category unticked · small phone and the web at 1280 / 1600 / wide (D-DATA-54)"
      - id: C-DATA-082
        text: "Pro, a book with one cash and one credit card account → DKB file: *Transfers, cash and card* above the payees · *Card settlement* → the credit card, *Suggested* · *Own account* (rows to the own name) → *Choose an account* → pick savings · *No transfer* → the rows show up under the payees · import → transfers, no expense in analytics · Mein ELBA: *Cash withdrawal* → the cash account · Free → the card is not there · web at 390 / 1440 (D-DATA-54)"
      - id: C-DATA-083
        text: "Web import, a DKB file → pencil on an Amazon row: a panel from the right, nothing focused, no red · it clears the sidebar at 1280 and 1600, one column at 390 · category: the add page's picker, a parent opens its subcategories, the recent categories above it · the list's *Choose a category* pill the same · *Save this format* says *skips Columns and Accounts* · *Date* opens a calendar · labels suggest the book's labels, a new name only becomes a label at *Import* · *Split* → part 1 = the whole amount · part 2 = 20 → amber *more than the amount* → wand on part 1 → *Parts add up* · *Apply* → the row lists both parts · import → two bookings · a split left 5 short also imports, as typed · Amazon rows start on *Choose a category* · the duplicate and recurring groups show no badge beside the name · phone 390 (R-DATA-107)"
      - id: C-DATA-081
        text: "DKB export → after *Choose a CSV file* the import opens on *Accounts* · *Columns* ticked, Back shows it · a Mein ELBA file (no header) or a sheet with *01/02/2026* opens on *Columns* · without a category column *Columns* shows one plain grey line, no red box · phone and web (D-DATA-54)"
