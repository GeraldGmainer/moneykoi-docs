# Source: Trello release notes 1.17.0 (items 9, 21–27). The "Import, export, erase" group is
# derived from the context docs, not from an earlier checklist.
groups:
  - id: backup
    title: Create a backup
    setup: Pro (simulator) + owner or admin
    items:
      - id: C-DATA-001
        text: "*Include receipt photos* → progress → *Save to device* → file in Files · *last backup* updates"
      - id: C-DATA-015
        text: Photos on, offline → *N photos could not be included* · backup made
      - id: C-DATA-016
        text: 100+ photos → no out-of-memory crash
      - id: C-DATA-002
        text: Passphrase < 8 → error · mismatch → error · "Käse-Brot1" → opens in 7-Zip/Keka
      - id: C-DATA-020
        text: "iOS: passphrase offers a strong password → saved to Keychain"

  - id: restore
    title: Restore
    items:
      - id: C-DATA-003
        text: "Cloud: restore → preview → red confirm → new book · *N photos restored*"
      - id: C-DATA-017
        text: One damaged jpg → only that photo fails
      - id: C-DATA-019
        text: Protected file via picker, open-with, *Welcome back* → unlock sheet · wrong → error, stays · photos restore
      - id: C-DATA-004
        text: Delete 3 → restore → *Bring back* · edit → *Undo everything* · partner follows
      - id: C-DATA-005
        text: Fresh install → *Welcome back* → *Restore a backup* → all back · no double recurring
      - id: C-DATA-014
        text: Local book → *Restore* → red *Replace* → book = file
      - id: C-DATA-013
        text: Airplane or kill during phone restore → book untouched
      - id: C-DATA-026
        text: Old v1 file restores · 100 MB+ on both platforms · non-backup → *damaged*

  - id: settings
    title: Settings travel with the file
    items:
      - id: C-DATA-021
        text: Phone A settings → backup → fresh phone B restore → preview says settings · values match · B's notifications unchanged

  - id: open-with
    title: Open-with `.moneykoi`
    items:
      - id: C-DATA-006
        text: "Files · Gmail · WhatsApp · Drive · AirDrop → restore preview · Android: one recents card"
      - id: C-DATA-022
        text: Each source × cold/warm/open × account/local/fresh
      - id: C-DATA-023
        text: Protected → unlock first · app lock → lock first · relaunch → preview not reopened

  - id: reminder
    title: Backup reminder
    items:
      - id: C-DATA-007
        text: Reminder fires → tap → *Backup & restore* for that book
      - id: C-DATA-024
        text: "*Weekly* → permission · Debug → Notify shows it · backup → time moves · book switch → re-armed"

  - id: all-data
    title: Download all data
    setup: Pro (simulator)
    items:
      - id: C-DATA-008
        text: "Two books, one joined → zip: profile.json + README + backup per book · joined = own entries"
      - id: C-DATA-025
        text: Save + share work · offline with 2+ syncing books → *needs internet* · inner files restore

  - id: csv
    title: Import, export, erase
    setup: From the context docs
    items:
      - id: C-DATA-009
        text: Real bank CSV (Sparkasse, N26) → columns, accounts, categories, review, import, undo
      - id: C-DATA-010
        text: Export by category + tag → CSV → Excel/Numbers → import into another book
      - id: C-DATA-011
        text: "Book card → *Export data* (ZIP) · member: hidden"
      - id: C-DATA-012
        text: "*Erase data* → trash empty too · partner's phone empties"
      - id: C-DATA-027
        text: "Simulator *Free* → book card ⋮ *Export data* · *Download all data* · *Export bookings* · Budget Book ⋮ *Export* · PDF → each opens the paywall at *Data export*"
      - id: C-DATA-028
        text: "Simulator *Free* → CSV import and *Restore from a backup* still work, no lock"

  - id: web
    title: On the web
    items:
      - id: C-DATA-050
        text: Web backup (passphrase) → restore in app · app backup → restore on web · both compare
      - id: C-DATA-051
        text: "Web book export → 14 CSVs + README · member: no export"
      - id: C-DATA-052
        text: Same bank CSV, web vs app → same columns, accounts, categories, duplicates
