  - id: D-DATA-19
    question: Bank CSV import · what is Pro?
    status: decided
    date: 2026-11-10
    answer: |
      - **one wizard, Pro parts locked** · no second menu entry
      - Free: today's import · category guess · duplicate check · re-import key · ±3 days · pending rows
      - Pro: saved formats · learned payees · editing single rows in *Review*
      - upsell: *Save this format* shown locked · one line on the result screen
      - import stays free (D-DATA-12) · Pro is the monthly convenience
      - plan: `plans/BANK_CSV_IMPORT_PLAN.md` D-BANK-1
    related: [D-DATA-12, D-DATA-11]
  - id: D-DATA-20
    question: Saved import formats · whose, where, when?
    status: decided
    date: 2026-11-10
    answer: |
      - the **user's** · usable in any book · no automatic book switch
      - stores the account per book · asked once in each book, then automatic
      - Pro: kept on the phone · synced whenever a Cloud book is active (own or shared) → web · the Cloud upgrade carries it up
      - *Save this format* ticked by default
      - recognized file → banner *Recognized: …* → straight to *Review* · earlier steps via back
      - plan: `plans/BANK_CSV_IMPORT_PLAN.md` D-BANK-3…6, 15, 17
    related: [D-DATA-19]
