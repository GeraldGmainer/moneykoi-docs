  - id: D-DATA-26
    question: Bank import · which key for the IBAN hash?
    status: open
    answer: |
      - an IBAN hash can be reversed by trying candidates
      - a) random per-user key on the settings row · server sees key + hash · pseudonymous only · **recommended**, listing says *stored only as a fingerprint*
      - b) key the server never sees · the web can't match IBANs → no transfer suggestion there
      - c) last four + bank code only, no hash · two accounts ending alike collide
      - plan §13 O1
    related: [D-DATA-23]
