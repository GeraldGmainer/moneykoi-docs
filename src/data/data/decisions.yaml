  - id: D-DATA-17
    question: A CSV with older bookings on top of a starting balance — which balance is right?
    status: decided
    date: 2026-11-06
    answer: |
      - **a) dated history moves the opening** · the import result says so · built 2026-11-09 · R-DATA-41 · web not yet
      - before: the setup's starting balance is *today's* balance · the import adds every older row on top · Bank 2,000 → 8,606.38 €
      - a) dated history moves the opening: the account still ends at the typed balance today
      - b) keep adding · the import's *Accounts* step warns and offers to clear the starting balance
      - c) ask per account in the import
      - source: Android emulator round, AND-11-1
