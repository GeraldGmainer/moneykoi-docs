  - id: T-DATA-07
    title: Apply the bank-import migration · server first
    owner: gerald
    detail: |
      - `20261110160000_bank_import.sql` · written, **not applied** · local → prod · dev is paused since 2026-11-08 (by hand only)
      - **before the app build ships**: the app pushes `profile_setting.import_formats` + `booking.import_ref` · without them every settings push with a saved format fails (E-DATA-88)
      - also carries the rewind fix (T-DATA-06, E-DATA-69) · never `db reset`
    command: |
      # 1 local
      cd /Users/gerald/Projects/moneykoi/moneykoi-supabase
      supabase migration up
      psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -c "SELECT internal.rewind_columns('booking') @> ARRAY ['reconciliation_id', 'adjustment_type', 'import_ref'];"   # t
      # 2 dev (paused · only if resumed): by hand
      supabase link --project-ref dpmemqshhdnanywcvsod && supabase db push
      # 3 prod: commit, push main (CI runs db push), then
      psql "$PROD_DATABASE_URL" -c "select version from supabase_migrations.schema_migrations where version = '20261110160000';"
      psql "$PROD_DATABASE_URL" -c "SELECT tablename FROM pg_publication_tables WHERE pubname = 'supabase_realtime' AND tablename = 'import_payee_rule';"
