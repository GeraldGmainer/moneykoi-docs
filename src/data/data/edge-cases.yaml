    risk: low
  - id: E-DATA-61
    group: On the web
    title: "Web: connection drops mid-restore"
    when: network goes during a photo restore
    then: rest left out, counted · restore again to fill in
    status: by-design
    risk: medium
  - id: E-DATA-62
    group: On the web
    title: "Web: very large backup"
    when: big book packed, or file > 4 GiB
