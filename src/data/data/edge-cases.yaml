    then: button disabled + note · empty book → says so
    risk: low
    tests:
      - file: test/features/booking_export/ui/booking_export_page_test.dart
        name: an empty book says so instead of blaming the filters
  - id: E-DATA-51
    group: Export & erase
    title: 10,000 bookings in review
    when: a wide export
    then: rows load a page at a time · full count shown
    risk: low
    tests:
      - file: test/features/booking_export/ui/booking_export_page_test.dart
        name: 10 000 bookings build one page at a time, and the count stays the full one
  - id: E-DATA-52
    group: Export & erase
    title: Opening balances + transfers
    when: category filter set
    then: left out · no filter → exported as `opening_balance` / `transfer`
    risk: low
    tests:
      - file: test/features/booking_export/domain/booking_export_matcher_test.dart
        name: the stand-in category of an opening balance never matches, even by its own id
  - id: E-DATA-53
    group: Export & erase
    title: Erase leaves no trash
    when: erased book has bookings in trash
    then: trash purged too · other phones empty in minutes
    risk: medium
  - id: E-DATA-60
    group: On the web
    title: "Web: cancelled download counts"
    when: browser Save As cancelled
    then: "*last backup* already set · page can't see the cancel"
