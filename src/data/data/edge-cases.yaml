# Source: BACKUP_RESTORE_AI_CONTEXT.md §4–§9, BOOKING_IMPORT §3–§13, BOOKING_EXPORT §4–§7,
# DATA_PORTABILITY §5–§6.
items:
  # Backup & restore
  - id: E-DATA-01
    group: Backup & restore
    title: Wrong passphrase or damaged
    when: protected file, wrong passphrase
    then: |
      - first encrypted entry fails → *wrong passphrase*, ask again
      - later failures → *damaged* · Trello risk fixed
    status: fixed
    risk: medium
    tests:
      - file: test/features/backup/backup_archive_extras_test.dart
        name: a first entry that does not decrypt reads as a wrong passphrase, whatever archive says
  - id: E-DATA-66
    group: Backup & restore
    title: Forecast settings lost in backup and restore
    when: income or bills switched off, a monthly figure typed, or the income estimate set → backup → restore
    then: |
      - fixed 2026-10-27 · app, web and server keep all five
      - was: a restore reset them to the defaults · an app backup read from the server wrote the defaults · a web backup left them out
      - restore needs `20261027150000_restore_forecast_sources.sql` on the server (T-DATA-04)
    status: fixed
    risk: medium
    related: [E-FC-16]
    tests:
      - file: test/features/forecast/data/forecast_data_layer_test.dart
        name: name their table, columns and delete RPC and parse a row
      - file: src/lib/backup/backup-row-codec.test.ts
        repo: web
        name: carry every forecast setting, the split recurring flags and both monthly figures too
  - id: E-DATA-02
    group: Backup & restore
    title: Passphrase with umlauts
    when: file protected with "Käse-Brot1"
    then: opens in 7-Zip + Keka with it
    risk: medium
  - id: E-DATA-03
    group: Backup & restore
    title: Backup offline with photos
    when: photos on, phone offline
    then: uploaded photos missing + counted · queued ones in · backup made
    risk: low
    tests:
      - file: test/features/backup/data/backup_photo_collector_test.dart
        name: offline, uploaded photos are missing and nothing is downloaded; queued ones still come
  - id: E-DATA-04
    group: Backup & restore
    title: Sign-out mid-restore
    when: sign-out during a server restore
    then: restore stops · never applies to the next session
    risk: high
    tests:
      - file: test/features/backup/restore_backup_use_case_test.dart
        name: a sign-out mid-upload stops the restore instead of applying it for the next session
  - id: E-DATA-05
    group: Backup & restore
    title: Kill during a phone restore
    when: app dies while replacing the local book
    then: book untouched · staged rows swept next time
    status: fixed
    risk: high
    tests:
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: 'an app killed part-way: the staged rows are never the book'
  - id: E-DATA-06
    group: Backup & restore
    title: Old or hand-made file
    when: file lacks columns (icon, kind, time zone)
    then: filled like the server would · unreadable row skipped + counted
    status: fixed
    risk: medium
  - id: E-DATA-07
    group: Backup & restore
    title: Not a backup at all
    when: other binary file opened with Money Koi
    then: refused by content as *damaged*
    status: by-design
    risk: low
    tests:
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: a file the app could not read says so instead of nothing happening
  - id: E-DATA-08
    group: Backup & restore
    title: Second file during a preview
    when: another `.moneykoi` tapped while one is open
    then: replaces it · never stacks · running restore or dirty form stays
    risk: low
    tests:
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: a second file replaces the open page and the sheet on it, never stacks another
  - id: E-DATA-09
    group: Backup & restore
    title: Open-with from Gmail/WhatsApp
    when: sender starts Money Koi in its own task
    then: handed to the one app instance · one recents card · settled
    status: fixed
    risk: high
  - id: E-DATA-10
    group: Backup & restore
    title: Copying the opened file fails
    when: phone can't copy the shared file
    then: "*damaged* snackbar, not a silent log · fixed"
    status: fixed
    risk: medium
    tests:
      - file: test/features/backup/data/opened_backup_files_test.dart
        name: a file the platform could not copy is a damaged file, not silence
  - id: E-DATA-11
    group: Backup & restore
    title: Undo in place with unsent changes
    when: book has writes waiting to sync
    then: refused · a queued write would redo part
    risk: medium
    tests:
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: pending outbox items of this book block the rewind
  - id: E-DATA-12
    group: Backup & restore
    title: Revived name is taken
    when: brought-back account/category name in use
    then: revived one → " (2)" · counted
    risk: low
  - id: E-DATA-13
    group: Backup & restore
    title: Restored book not here yet
    when: pull after restore didn't bring the book
    then: "*Restored, not opened* · appears next sync"
    risk: low
    tests:
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: a book the pull has not brought yet is restored, not opened
  - id: E-DATA-14
    group: Backup & restore
    title: Bottom bar keyed by book
    when: file's settings applied on a new phone
    then: bar layout moves to the restored book's id
    status: fixed
    risk: low
    tests:
      - file: test/features/backup/data/backup_settings_store_test.dart
        name: apply writes the rebased layout
  - id: E-DATA-15
    group: Backup & restore
    title: Reminder tap, form open
    when: reminder tapped over an unsaved form
    then: no book switch, nothing pushed over it · tap now opens Backup & restore
    risk: medium
    tests:
      - file: test/features/backup/ui/backup_reminder_tap_test.dart
        name: 'a dirty form keeps the open book: no switch, nothing pushed over it'
  - id: E-DATA-16
    group: Backup & restore
    title: Overdue reminder
    when: ignored for weeks
    then: once per interval, not daily · month step → last day of short months
    risk: low
    tests:
      - file: test/features/backup/backup_reminder_slot_test.dart
        name: an overdue backup repeats once per interval, never every day the app opens
  - id: E-DATA-17
    group: Backup & restore
    title: All data + non-syncing book
    when: account's other book is local
    then: read from the phone, not the stale server · Trello bug fixed
    status: fixed
    risk: high
    tests:
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: another book that does not sync comes from the phone, offline too

  # Import
  - id: E-DATA-30
    group: CSV import
    title: German file looks Japanese
    when: Windows-1252 umlauts also valid Shift_JIS
    then: read as Windows-1252 · detector checks byte ranges
    risk: medium
  - id: E-DATA-31
    group: CSV import
    title: Ambiguous dates
    when: every date fits both orders (03/04/2026)
    then: red flag · user picks, shown both ways
    risk: medium
  - id: E-DATA-32
    group: CSV import
    title: Two identical coffees
    when: file has 2 equal rows, book has 1
    then: one stays ticked · counted pairwise
    risk: low
  - id: E-DATA-33
    group: CSV import
    title: Refund under an expense category
    when: '"Groceries" on both sides'
    then: two categories, one per side
    risk: low
  - id: E-DATA-34
    group: CSV import
    title: Multi-currency export
    when: rows in several currencies
    then: |
      - all at face value · nothing converted
      - a currency column with another code → warning on *Columns* (2026-11-03) · was: nothing flagged
    status: by-design
    risk: medium
    tests:
      - file: test/features/data_import/domain/import_currency_check_test.dart
        name: a mixed file lists the codes that are not the book
  - id: E-DATA-67
    group: CSV import
    title: Bank CSV without a category column
    when: German bank export · *Buchungsdatum; Empfänger/Auftraggeber; Verwendungszweck; Betrag; Währung*
    then: |
      - fixed 2026-11-03 · imports · categories guessed from payee + purpose · rest picked in Review
      - was: *Next* stayed off · *Empfänger/Auftraggeber* not detected
    status: fixed
    risk: medium
    tests:
      - file: test/features/data_import/domain/import_column_detector_test.dart
        name: 'a German bank export: the purpose is the description, Empfänger/Auftraggeber the payee'
    related: [D-DATA-15, R-DATA-40]
  - id: E-DATA-68
    group: CSV import
    title: File without an account column
    when: credit-card export, no account column
    then: |
      - fixed 2026-11-03 · *Into which account?* on the Accounts step
      - was: the first account picked without a word
    status: fixed
    risk: low
    related: [R-DATA-31]
  - id: E-DATA-35
    group: CSV import
    title: Import stops part-way
    when: a write fails mid-import
    then: says it stopped · *Undo* for what landed
    risk: medium
    tests:
      - file: test/features/data_import/use_cases/commit_import_use_case_test.dart
        name: a failure partway still reports everything that may have landed
  - id: E-DATA-36
    group: CSV import
    title: Demoted mid-wizard
    when: owner makes the importing admin a member
    then: told · nothing moves on
    risk: low
    tests:
      - file: test/features/data_import/bloc/import_wizard_cubit_test.dart
        name: a member demoted while the wizard was open is told, and nothing moves on
  - id: E-DATA-37
    group: CSV import
    title: First and last day of the file
    when: duplicate check at day edges (local vs UTC)
    then: window padded a day each way (EC-PER-2)
    status: fixed
    risk: low
  - id: E-DATA-38
    group: CSV import
    title: Big import syncs for minutes
    when: thousands of rows
    then: on screen at once · outbox sends one by one · note from 2,000
    status: by-design
    risk: medium

  # Export & erase
  - id: E-DATA-50
    group: Export & erase
    title: 1st of the budget month
