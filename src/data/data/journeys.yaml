# Source: BACKUP_RESTORE_AI_CONTEXT.md, BOOKING_IMPORT / BOOKING_EXPORT / DATA_PORTABILITY context
# docs, MONETIZATION §9b.
items:
  # Backups
  - id: J-DATA-01
    group: Backups
    title: Makes a backup
    from: Pro, owner or admin
    steps:
      - Settings → *Backup & restore* → *Create a backup*
      - photos? passphrase?
      - "*Save to device* or *Share*"
    result: "`MoneyKoi-<Book>-YYYY-MM-DD.moneykoi` · *last backup* updates"
    tests:
      - file: test/features/backup/use_cases/create_backup_use_case_test.dart
        name: builds a readable archive of the whole book and stamps the backup time
    checks: [C-DATA-001, C-DATA-002]
  - id: J-DATA-02
    group: Backups
    title: Restores into a new book
    from: account with Cloud
    steps:
      - "*Restore from a backup* → file"
      - preview + comparison
      - "*Where the book goes*: *Cloud book* (default) or *Offline book*"
      - red confirm
    result: new book "… (restored)" · photos follow · an offline book stays on the phone
    note: the offline pick is new (2026-10-27, BOOK §9)
    tests:
      - file: test/features/backup/restore_backup_use_case_test.dart
        name: a clean restore stages every row, applies once and opens the new book
    checks: [C-DATA-003]
  - id: J-DATA-03
    group: Backups
    title: Undoes changes in this book
    from: file from the active syncing book
    steps:
      - "comparison: deleted · edited · new"
      - "*Undo changes in this book*"
      - "*Bring back* or *Undo everything*"
      - red confirm
    result: book as it was · members get it via sync
    tests:
      - file: test/features/backup/use_cases/rewind_backup_use_case_test.dart
        name: stages every row with its original id, applies in the chosen mode and pulls
    checks: [C-DATA-004]
  - id: J-DATA-04
    group: Backups
    title: New phone, no account
    from: fresh install
    steps:
      - "*Sign in* → *Restore* → *Restore a backup*"
      - lands on this phone + settings
      - store asked for Pro, silently
    result: book back · nothing uploaded · no doubles
    tests:
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: without an account, a phone with no book restores into a new one
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: a picked file opens the restore sheet with its preview
    checks: [C-DATA-005, C-DATA-021]
    related: [J-MON-20]
  - id: J-DATA-05
    group: Backups
    title: Replaces the local book from a file
    from: local book
    steps:
      - "*Restore from a backup*"
      - red *Replace this book*
    result: book = the file
    tests:
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: replacing the book swaps its rows for the file
    checks: [C-DATA-014]
  - id: J-DATA-06
    group: Backups
    title: Restores on an account without Cloud
    from: free account
    steps:
      - several own books → pick one to replace
      - none → new own book on the phone
    result: nothing uploaded · Cloud later uploads
    tests:
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: with several books of its own, every one is offered with its currency, the open one chosen
      - file: test/features/backup/use_cases/restore_locally_use_case_test.dart
        name: the rows land in a new own book, made only once they are all staged, and the book opens
  - id: J-DATA-07
    group: Backups
    title: Opens a backup file from elsewhere
    from: Files, Gmail, WhatsApp, Drive, AirDrop
    steps:
      - tap the `.moneykoi`
      - app lock / passphrase first if on
    result: restore preview · or the *Restore* page (box koi, both restore buttons)
    tests:
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: an account or a book on the phone opens the restore preview in Backup & restore
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: a phone without an account or a book opens the welcome restore page, where the local restore lives
      - file: test/features/auth/ui/pages/welcome_restore_page_test.dart
        name: a file the app was opened with goes straight to the restore bloc
    checks: [C-DATA-006, C-DATA-022, C-DATA-023]
  - id: J-DATA-08
    group: Backups
    title: Is reminded to back up
    from: Pro, owner or admin
    steps:
      - Notifications → *Backup reminder* · weekly/monthly + time
      - "*Time for a backup*"
      - tap
    result: Backup & restore for that book
    tests:
      - file: test/features/backup/backup_reminder_slot_test.dart
        name: a fresh backup moves the reminder one whole interval out, at the reminder time
    checks: [C-DATA-007, C-DATA-024]
  - id: J-DATA-09
    group: Backups
    title: Uninstalled by accident
    from: Local Free or Pro
    steps:
      - "Android: reinstall may restore from Google backup"
      - "iPhone: only a backup file helps"
    result: restored, or gone without a file
    status: by-design
    note: The reminder (Pro) is what makes a file exist

  # Your data
  - id: J-DATA-10
    group: Your data
    title: Downloads all their data
    from: Pro, any member
    steps:
      - "*Personal data* → *Download all data*"
      - save or share the zip
    result: profile + settings + a backup per book
    note: Free → lock → paywall *Data export* (2026-10-21)
    tests:
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: lists every book with what of it goes in
    checks: [C-DATA-008, C-DATA-025, C-DATA-027]
  - id: J-DATA-11
    group: Your data
    title: Exports a whole book (ZIP)
    from: Pro, owner or admin
    steps:
      - Book card menu → *Export data*
    result: 14 CSVs + JSON + README
    note: Free → lock → paywall *Data export* (2026-10-21)
    tests:
      - file: test/features/data_export/data_export_page_test.dart
        name: 'idle: lists every kind of record and offers the export button'
    checks: [C-DATA-011, C-DATA-027]
  - id: J-DATA-12
    group: Your data
    title: Erases a book's data
    from: owner
    steps:
      - Book card menu → *Erase data*
      - irreversible → confirm
    result: empty book, name + members kept · phones follow in minutes
    checks: [C-DATA-012]

  # CSV
  - id: J-DATA-20
    group: CSV in & out
    title: Imports any CSV, step by step
    from: owner or admin
    steps:
      - "Settings › Backup & restore › *Import bookings* (or the book card ⋮)"
      - File → Columns → Accounts → Categories → Review
      - no category column → categories guessed · *Choose a category* on the rest in Review
      - "*Import*"
      - "*Undo* while on the result"
    result: bookings in · skipped rows listed
    tests:
      - file: test/features/data_import/bloc/import_wizard_cubit_test.dart
        name: import writes, then the result step offers undo
    checks: [C-DATA-009]
    related: [J-DATA-22, J-DATA-23]
  # Bank import (2026-11-10)
  - id: J-DATA-22
    group: Bank import
    title: First file of a bank
    from: Pro, owner or admin
    steps:
      - "Budget Book ⋮ › *Import bank file* → *Choose a CSV file*"
      - "Columns → Accounts → Categories → *Review*"
      - "*Categories*: one line per payee · a category per line · *All other expenses without a category* for the rest (R-DATA-103)"
      - "*Save this format* ticked · *Format name*"
      - "*Import bookings (n)*"
    result: "bookings in · *Format saved: {name}*"
    note: "Free: *Import bank file* wears the lock → paywall · *Import bookings* takes the same steps without saving a format"
    tests:
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: takes every step; on Review the format is offered under the account name (D-BANK-38)
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: Save this format sits ticked right above the Import button, with the name it will get
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: a saved format and learned payees are named on the result card
    checks: [C-DATA-057, C-DATA-065, C-DATA-078]
    related: [R-DATA-83, J-DATA-20]
  - id: J-DATA-23
    group: Bank import
    title: Next month, same bank
    from: Pro, a saved format
    steps:
      - "choose the new file"
      - "*Recognized: {name}* → straight to *Review* · a payee still without a category stops at *Categories* first, *Only without a category* on"
      - "new rows ticked · *n possible duplicates* and *n already imported* closed below"
      - "*Import bookings (n)*"
    result: "*Matches the bank: {amount}* · or *Bank: … · Book: …*"
    tests:
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: lands on Review with the saved mapping, the format and the file facts
      - file: test/features/data_import/fixtures/bank_fixtures_test.dart
        name: 'two overlapping exports: the second adds only the rows the first did not have'
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: a balance that matches is one line, without a button
    checks: [C-DATA-060, C-DATA-061]
    related: [R-DATA-81, R-DATA-78, R-DATA-90]
  - id: J-DATA-24
    group: Bank import
    title: Fixes a row · payee learned
    from: Pro, on *Review*
    steps:
      - "tap the row → *Edit row*"
      - "pick the category → *Apply*"
      - "*Import bookings (n)*"
    result: "*1 payee learned* · next file shows *Learned*"
    tests:
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: a row tap opens the edit sheet; Apply hands the edit to the cubit
      - file: test/features/data_import/use_cases/bank_import_use_cases_test.dart
        name: only a category picked or changed in the import teaches a rule (D-BANK-21)
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a learned payee rule beats the category the file names (D-BANK-21)
    checks: [C-DATA-064, C-DATA-068]
    related: [R-DATA-85, R-DATA-86]
  - id: J-DATA-25
    group: Bank import
    title: Transfer between own accounts
    from: Pro, on *Review*
    steps:
      - "row arrives as *Transfer to {account}*"
      - "or *Edit row* → *Make it a transfer*"
      - "*To account* → pick · *Apply*"
      - "*Import bookings (n)*"
    result: "one transfer, on the paying account"
    note: the other account's file later shows that row as *Possible duplicate*
    tests:
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: a transfer is booked once, on the paying account, with the key of the row it came from
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: a suggested transfer opens as one and can be turned back into a booking
      - file: test/features/data_import/domain/import_review_bank_test.dart
        name: 'a transfer counts on both accounts: from this one as an expense, to it as income (plan §5.3)'
    checks: [C-DATA-061]
    related: [R-DATA-87, R-DATA-79]
  - id: J-DATA-26
    group: Bank import
    title: Opens a CSV from Files or mail
    from: any plan, owner or admin
    steps:
      - "tap the `.csv` → Money Koi"
      - "Pro → the bank import · Free → *Import bookings*"
      - "File step: *Into {book}*"
      - "*Next* → the usual steps"
    result: "import loaded with that file"
    note: member → *Only the owner or an admin of this book can import bookings into it*
    tests:
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: a CSV opens the booking import with the file loaded, not the restore
      - file: test/features/backup/ui/backup_open_listener_test.dart
        name: a CSV opens the bank import with Pro, the simple one without
      - file: test/features/data_import/bloc/import_wizard_bank_test.dart
        name: a file opened with Money Koi starts the wizard loaded, into the active book
    checks: [C-DATA-062]
    related: [R-DATA-91, J-DATA-07]
  - id: J-DATA-27
    group: Bank import
    title: Balance differs → Balance check
    from: any plan, after an import
    steps:
      - "result: *Bank: … · Book: …*"
      - "*Check balance*"
      - "that day · one field filled · *From the bank file*"
      - "save the count"
    result: "difference booked · book = bank"
    tests:
      - file: test/features/data_import/ui/bank_import_ui_test.dart
        name: a balance that differs opens the Balance check with the bank figure, never in the route name
      - file: test/features/reconciliation/reconciliation_cubit_test.dart
        name: 'opened from a bank file: its day, the one account filled and labelled, the rest blank'
    checks: [C-DATA-067]
    related: [R-DATA-90, R-BC-11]
  - id: J-DATA-28
    group: Bank import
    title: An Amazon row into bookings
    from: Pro, Review of a DKB file
    steps:
      - "just a category: the pill → pick → *Apply to all* for the other Amazon rows"
      - "or tap the row → the order number on top → tap: the order on amazon.de"
      - "back in the app: description · category"
      - "several items: *Split* → part 2: amount, description, category · part 1 = the rest"
      - "*Apply* → the row lists its parts"
    result: "one booking per part · next month's file knows the row"
    tests:
      - file: test/features/data_import/ui/import_row_edit_test.dart
        name: a split in three, each part with its own text
      - file: test/features/data_import/ui/import_row_edit_test.dart
        name: a split row lists its parts under the payee and keeps its total
    checks: [C-DATA-074, C-DATA-075]
    related: [R-DATA-98, R-DATA-99, R-DATA-100]
  - id: J-DATA-21
    group: CSV in & out
    title: Exports bookings
    from: Pro, any member
    steps:
      - "*Backup & restore* → *Export bookings*"
      - filters · This month
      - "*Preview n bookings*"
      - "*Save as CSV* or *Share*"
    result: plain CSV the import reads back
    tests:
      - file: test/features/booking_export/ui/booking_export_page_test.dart
        name: a cancelled save dialog stays on the review, silently
    checks: [C-DATA-010]
