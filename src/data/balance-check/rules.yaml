# Source: app RECONCILIATION_AI_CONTEXT.md; web RECONCILIATION_WEB_AI_CONTEXT.md.
items:
  - id: R-BC-01
    group: What it is
    title: Count real balances, book the gap
    text: |
      - type each account's real balance
      - each difference → a **balance correction**
      - owners + admins run + delete · everyone reads history
    source: RECONCILIATION §1
    tests:
      - file: test/features/reconciliation/balance_check_nudge_use_case_test.dart
        name: a shared book asks admins and owners, never members
  - id: R-BC-02
    group: What it is
    title: Correction = own booking kind
    text: |
      - no category, no destination · linked to its check
      - **never** a system "Adjustment" category
      - tap → opens its check · to change: delete + recount
    source: RECONCILIATION §3, §5
  - id: R-BC-03
    group: Counting
    title: Blank = not counted
    text: |
      - **nothing** prefilled with the app's number
      - blank → no line, no correction · typed zero → line recorded
    source: RECONCILIATION §3, §4
    tests:
      - file: test/features/reconciliation/reconciliation_math_test.dart
        name: a blank account produces neither a line nor a booking
  - id: R-BC-05
    group: Counting
    title: "Cards + loans: amount owed"
    text: type 250 for a card owing 250 → compared to −250
    source: RECONCILIATION §4
    tests:
      - file: test/features/reconciliation/reconciliation_cubit_edges_test.dart
        name: a liability is counted as the positive amount owed and compared against its negative balance
  - id: R-BC-06
    group: Counting
    title: Investment + hidden accounts hidden
    text: |
      - else market moves → "untracked income"
      - typed into → stay visible
    source: RECONCILIATION §4
    tests:
      - file: test/features/reconciliation/reconciliation_cubit_test.dart
        name: archived and investment accounts start hidden and stay counted once filled
  - id: R-BC-07
    group: Counting
    title: Per account or all into one
    text: |
      - per account: +10 and −10 → two corrections
      - all into one → they cancel · confirm says which
    source: RECONCILIATION §4
    tests:
      - file: test/features/reconciliation/reconciliation_cubit_edges_test.dart
        name: a zero total of opposite differences is not "all matched"
  - id: R-BC-08
    group: Counting
    title: Its own date
    text: |
      - default today · Home card: last day of the ended period
      - balance read at end of that day
      - confirm warns about unsynced changes
    source: RECONCILIATION §4
  - id: R-BC-04
    group: Where it counts
    title: Moves totals, not "how you spend"
    text: |
      - **in**: balances · net worth · timelines · Home *Untracked* row · waterfall
      - **out**: categories · merchants · budgets · tags · Budget Book totals · period flows
    source: RECONCILIATION §6
    tests:
      - file: test/features/reconciliation/balance_query_parity_test.dart
        name: the book-wide opening balance counts corrections and nets transfers to zero
    related: [R-BB-10, R-ANL-02]
  - id: R-BC-09
    group: Reminders
    title: Home card + monthly reminder
    text: |
      - first 7 days of a budget month → *Check balances* card · owners + admins
      - dismiss per period
      - opt-in reminder on the next 3 month starts
    source: RECONCILIATION §7
    tests:
      - file: test/features/reconciliation/balance_check_nudge_test.dart
        name: is due in the first days of a period nobody has counted
  - id: R-BC-10
    group: Web
    title: "Web: one transaction + stale guard"
    text: |
      - balance moved after load → save refused
      - corrections listed in the web ledger, never counted (R-BKG-53) · no reminder
    source: RECONCILIATION §5, RECONCILIATION_WEB §9
