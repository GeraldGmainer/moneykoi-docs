items:
  - id: E-BC-01
    group: Counting
    title: Older month after a newer one
    when: September checked after October
    then: Sept correction shifts October → October no longer matches · open
    status: known-issue
    risk: medium
  - id: E-BC-02
    group: Counting
    title: Sync mid-count
    when: partner's booking syncs while typing
    then: "*App says* + differences refresh · typed counts stay"
    risk: medium
  - id: E-BC-03
    group: Counting
    title: Target from another book
    when: all-into-one remembers another book's account
    then: falls back to per account
    risk: low
    tests:
      - file: test/features/reconciliation/reconciliation_cubit_test.dart
        name: a stored single-mode target from another book falls back to per account
  - id: E-BC-04
    group: Web
    title: Web past balances
    when: book has corrections
    then: web `/balance` drops them → wrong past balances · open
    status: known-issue
    risk: medium
  - id: E-BC-05
    group: Web
    title: Web migration missing
    when: "`20261009100000_corrections_out_of_period_flows.sql` not applied"
    then: web counts corrections as spending · "never against your budgets" not true yet
    status: known-issue
    risk: medium
    related: [T-ANL-01]
  - id: E-BC-06
    group: Counting
    title: The count slot read like a label
    when: "*Check balances* · an account not counted yet"
    then: |
      - a filled field with its hint (*Counted balance* / *Amount owed*) on one line
      - before 2026-11-03 small grey text wrapped over two lines (iOS round, IOS-17-1)
    status: fixed
    risk: low
    tests:
      - file: test/features/reconciliation/ui/count_widgets_test.dart
        name: the empty slot looks like a field and keeps its hint on one line
  - id: E-BC-07
    group: Corrections
    title: Differences that cancel out
    when: one account +10 and another −10 against the counted balances
    then: |
      - fixed 2026-11-06 · *cancel out*, nothing booked · corrections are rounded to the currency's decimals
      - before: a −0,00 € correction was booked, and amounts like 28.890000000001 appeared (AND-17-3, AND-17-2)
    status: fixed
    risk: medium
    tests:
      - file: test/features/reconciliation/reconciliation_cubit_test.dart
        name: +10 and -10 cancel out
