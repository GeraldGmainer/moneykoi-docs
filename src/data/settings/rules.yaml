  - id: R-SET-30
    group: Support
    title: Feedback for everyone
    text: |
      - feedback · bug · idea · drawer + Settings · **no account needed**
      - account → *Attach email address* · admin reads it from the profile
      - no account → *Email for a reply (optional)* · checked, ≤ 254
      - → admin inbox · community voting removed 2026-10-02
    source: 02_FEATURES, MONETIZATION §3a, migration 20261021120000
    tests:
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: an untouched form has no change and cannot be sent
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: an account replies to its own address; without one the address is asked for
      - file: test/features/feedback/ui/pages/feedback_page_test.dart
        name: without an account the form asks for an optional reply address instead of the checkbox
      - file: test/features/feedback/ui/pages/feedback_page_test.dart
        name: a malformed reply address says so and keeps Send disabled
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: a book without an account keeps investments (prices come from the public price list) and feedback, and drops the account-bound entries
    related: [D-SET-2, R-SET-33]
