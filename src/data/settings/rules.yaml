  - id: R-SET-43
    group: Settings
    title: The update row opens this platform's store
    text: |
      - shown when the changelog lists a newer app version than this one · on top of *Changelog* and under the logo on *About* (since 2026-11-15)
      - *About* stays quiet when the changelog can't load: no row, no error
      - Android → the Play page · iOS → the App Store page (Apple ID `6829288599`, set 2026-10-31)
      - the paywall's *Update app* button opens the same page
    source: AppUrls.storeListing, UpdateAvailableBanner, 03_TECHNICAL_ARCHITECTURE.md › Flavors, bundle ids and the iOS target
    tests:
      - file: test/core/constants/app_urls_test.dart
      - file: test/features/settings/ui/pages/changelog_page_test.dart
        name: on iOS the update row opens the App Store page
      - file: test/features/settings/ui/pages/about_page_test.dart
        name: a newer version shows the update message, which opens this platform's store
      - file: test/features/settings/ui/pages/about_page_test.dart
        name: a failed changelog load keeps the page quiet
    related: [E-PLAT-03, T-PLAT-10]
  - id: R-SET-47
    group: Support
    title: The store's review card, after a saved booking
    text: |
      - a booking saved through the form, back on the main page → Google's / Apple's own review card, about 1.5 s later
      - **no question before it**: Google and Apple forbid *Do you like the app?* and any route around the card · unhappy users have *Feedback* in Settings
      - only after real use: ≥ 3 bookings on ≥ 2 different days · the first booking is often only a test (D-SET-6) · never in the demo
      - never in a launch that showed a getting-started hint · the first 14 days after setup are allowed otherwise
      - never in a launch that showed an update, the paywall or the usage-statistics ask · at most once per launch
      - at most every 120 days, 3 times per install · the store may still show nothing (its own quota) · the app never learns whether a review was left
      - Settings → Support → *Rate Money Koi* → iOS: the App Store's review form straight away · Android: the Play page (Play has no direct link) · never the card: a button that may open nothing is what Google forbids
    source: STORE_REVIEW_AI_CONTEXT.md, STORE_LISTING_AI_CONTEXT.md §11
    tests:
      - file: test/features/store_review/review_prompt_test.dart
        name: asks once the app is in use, and records the ask
      - file: test/features/store_review/review_prompt_test.dart
        name: "too few bookings, or all on too few days: no ask"
      - file: test/features/store_review/review_prompt_test.dart
        name: waits the interval between asks, and stops after the cap
      - file: test/features/store_review/review_prompt_test.dart
        name: an update, the paywall or another ask in this launch keeps it quiet
      - file: test/features/store_review/review_prompt_test.dart
        name: never in a launch that showed a getting-started hint
      - file: test/features/store_review/review_prompt_test.dart
        name: "a test booking alone is not use: the first ask needs 3 bookings on 2 days"
      - file: test/core/constants/app_urls_test.dart
        name: "iOS rating opens the App Store's review form, not the listing"
    related: [R-SET-43, C-SET-016, D-SET-6]
  - id: R-SET-46
    group: Settings
    title: Privacy & legal links terms, privacy policy and imprint
    text: |
      - *Terms of use* · *Privacy policy* · *Imprint* → the website's legal pages in the browser
      - imprint added 2026-11-07: Austrian law wants it one tap from the app (ECG § 5, MedienG § 25)
      - the site's imprint carries the trade details since 2026-11-07: GISA 40309453, BH Steyr-Land, WKO, GewO, MedienG § 25 (T-MON-11, site S-27)
    source: AppUrls.terms / .privacy / .imprint, MONETIZATION §8 item 10
    tests:
      - file: test/features/settings/ui/pages/privacy_settings_page_test.dart
        name: the terms open in the browser
      - file: test/features/settings/ui/pages/privacy_settings_page_test.dart
        name: the imprint opens in the browser
    related: [T-MON-05, T-MON-11]
  - id: R-SET-45
    group: Formatting
    title: Dates and percents follow the locale
    text: |
      - *System* date → locale medium: *Nov 2, 2026* · *2. Nov. 2026* · *2026年11月2日*
      - long dates in the locale's order: *Monday, November 2, 2026*
      - numeric dates **only** with a numeric date format picked
      - percents: *27%* en/ja · *27 %* de · a zero is bare
    source: 04_COMPONENT_REFERENCE.md › Dates, percents and compact money · iOS round IOS-2-5, IOS-13-4
    tests:
      - file: test/shared/ui/calendar/date_converter_test.dart
        name: puts weekday, day, month and year in the locale
      - file: test/shared/ui/calendar/date_converter_test.dart
        name: reads AppDateFormat.system as the locale
      - file: test/shared/utils/number_format_test.dart
        name: follows each locale
  - id: R-SET-48
    group: Settings
    title: Appearance — System, Light or Dark
    text: |
      - Settings → *Personalize* → *Appearance* · *System* · *Light* · *Dark*
      - **default *System***: follows the phone's light / dark setting, live while the app is open
      - *Light* / *Dark* ignore the phone
      - switches at once · no restart · the open page and the back stack stay
      - **this phone only**: never synced, each device its own · kept through sign-out and leaving the demo
      - free in every plan
    source: THEME_AI_CONTEXT.md §1 · LIGHT_THEME_PLAN.md §6
    tests:
      - file: test/features/settings/domain/theme_controller_test.dart
        name: follows the system until a mode is chosen
      - file: test/features/settings/domain/theme_controller_test.dart
        name: a chosen mode ignores the system and is stored on the device
      - file: test/features/settings/domain/theme_controller_test.dart
        name: a stored mode is restored
      - file: test/features/settings/domain/theme_controller_test.dart
        name: an unknown stored value falls back to the system
    checks: [C-SET-018, C-SET-019]
    related: [R-SET-49, J-SET-06]
  - id: R-SET-49
    group: Settings
    title: What keeps its own colors in light mode
    text: |
      - **dark in both**: launch screen (paints before the choice is read) · koi header on Home, with light status-bar icons over it · privacy shield · brand banners (active book, page info)
      - **follows the theme**: the total-balance card inside the koi header (white in light) · the scanner's panels, buttons and review pages
      - **drawn on the camera feed** (viewfinder frame, koi corners, row ticks) stays as in dark (D-SET-5)
      - **home-screen widgets** keep their own *Appearance* (light / dark plate) · never follow the app
      - **PDF export** looks the same in both
      - category and account colors are the user's own · light mode only folds them darker so the icon reads on white
      - every text color ≥ 4.5:1, every icon ≥ 3:1 on its ground, in both themes
    source: THEME_AI_CONTEXT.md §4, §5
    tests:
      - file: test/core/constants/app_palette_contrast_test.dart
        name: every drawer tint reads as a glyph on the drawer
      - file: test/core/constants/app_palette_contrast_test.dart
        name: a hairline is visible on its ground
      - file: test/core/constants/app_palette_dark_test.dart
        name: the dark palette is the palette the app shipped before it had two
    checks: [C-SET-020, C-SET-021, C-SET-022, C-SET-023]
    related: [R-SET-48, D-SET-5]
