# Source: app PROFILE_SETTINGS_AI_CONTEXT.md, 02_FEATURES, onboarding / settings / feedback tests;
# web SETTINGS_FORMATTING_WEB, ONBOARDING_WEB, AUTH_PROFILE_WEB, APP_SHELL_WEB §6a.
items:
  - id: R-SET-01
    group: Settings
    title: Three settings rows per person
    text: |
      - **shared**: money + date format · week + month start · summary view · goals · language
      - **app**: Home cards · notifications · bottom bars
      - **web**: web Home
      - currency = the **book's**, never a setting
    source: PROFILE_SETTINGS §1
    related: [R-BOOK-03]
  - id: R-SET-02
    group: Settings
    title: "Language: app per device, web per account"
    text: neither follows the other · open decision (D-SET-1)
    source: PROFILE_SETTINGS §1, §4
    tests:
      - file: test/features/settings/config/app_locales_test.dart
        name: falls back to English for unsupported languages
    related: [D-SET-1]
  - id: R-SET-03
    group: Settings
    title: Month starts 1–28
    text: |
      - *My month starts on the 25th* → every month period
      - app: confirm dialog · web: saves on pick, after its migrations
    source: BUDGET_BOOK §6.1, SETTINGS_FORMATTING_WEB §1
    related: [R-BB-05]
  - id: R-SET-04
    group: Settings
    title: Saves the moment it changes
    text: no Save button · confirmation, or an error if it failed
    source: SETTINGS_FORMATTING_WEB §1, settings tests
    tests:
      - file: test/features/settings/ui/pages/notification_settings_page_test.dart
        name: a failing save shows an error instead of the confirmation
  - id: R-SET-10
    group: Onboarding
    title: Onboarding
    text: |
      - language → currency suggested (English → USD)
      - starter categories come classified
      - no account → fully offline · invitees skip it
      - *Quick Start*: one tap · 4 accounts, 48 categories, no balances → Home keeps *Set starting balances*
    source: OFFLINE_TIER §3, ONBOARDING §1, ONBOARDING_WEB §1
    tests:
      - file: test/features/onboarding/domain/service/onboarding_initial_state_factory_test.dart
        name: maps an English locale to USD
      - file: test/features/onboarding/domain/service/category_generation_service_test.dart
        name: classifies the starter book as fixed or variable at the parent level
      - file: test/features/onboarding/ui/pages/onboarding_page_test.dart
        name: the first step has no back button and continue opens the method choice, two steps for a quick start
  - id: R-SET-12
    group: Onboarding
    title: Personalize — six steps
    text: |
      - accounts: the 4 starters as switches · at least one stays on · optional starting balance each (card = what is owed)
      - calendar: start of week · start of month · date format → written to the profile setting
      - lifestyle questions → categories · *Sub-categories* switch off = main groups only (~13), favorites Food & Drink, Personal & Shopping, Transportation
      - live read-only preview of the tree above *Create budget book*
      - a typed balance retires Home's *Set starting balances* card · a balance or calendar write that fails never blocks the setup
    source: ONBOARDING §2–§5
    tests:
      - file: test/features/onboarding/ui/pages/onboarding_page_test.dart
        name: personalize walks accounts, calendar, questions and categories, where create asks the bloc to personalize
      - file: test/features/onboarding/domain/entities/onboarding_preferences_test.dart
        name: the last account on cannot be switched off
      - file: test/features/onboarding/domain/service/category_generation_service_test.dart
        name: keeps only the parents and favors the groups booked most
      - file: test/features/onboarding/use_cases/onboarding_personalize_use_case_test.dart
        name: retires the Home balance card once a balance was typed in setup
      - file: test/features/onboarding/data/onboarding_data_test.dart
        name: a failing balance write never strands the setup
    related: [R-SET-10, R-SET-01]
  - id: R-SET-11
    group: Onboarding
    title: Web onboarding is shorter
    text: currency · 4 accounts · 44 categories, all or nothing · no balances, no variability
    source: ONBOARDING_WEB §1, web 02_FEATURES
  - id: R-SET-13
    group: Support
    title: Tips & features
    text: |
      - drawer → *Tips & features* · Settings → Support → *Tips & features* · never opens by itself
      - one row per feature: one line of payoff + *Open* · groups Everyday · Plan · Together · More
      - a tick on what is already in use (bookings, scans, rules, budgets, goals, loans, lists, positions, widgets, app lock, hidden amounts, quick entry, calendar)
      - locked rows keep the lock and open the paywall first · no row for a feature the plan cannot offer · widgets row Android only
      - the scanner row replays the pre-scan intro
    source: GETTING_STARTED §5
    tests:
      - file: test/features/getting_started/view_models/tips_catalog_test.dart
        name: a locked feature keeps its row, with the lock; an absent one loses it
      - file: test/features/getting_started/use_cases/get_tips_usage_use_case_test.dart
        name: every tick comes from its own trace
      - file: test/features/getting_started/ui/tips_page_test.dart
        name: "a destination row goes through the navigator: a tab is switched with its focus, a page is pushed"
    related: [R-HOM-40]
  - id: R-SET-20
    group: Profile
    title: Name + avatar
    text: |
      - app: compresses, deletes the old one
      - web: uploads the crop as is · not for local books
    source: AUTH_PROFILE_WEB §6, OFFLINE_TIER §7
  - id: R-SET-21
    group: Profile
    title: Set password
    text: twice · ≥ 6 characters · no current password · app + web
    source: AUTH_PROFILE_WEB §1
  - id: R-SET-30
    group: Support
    title: Feedback
    text: |
      - feedback · bug · idea · optional contact consent
      - needs an account · → admin inbox
      - community voting removed 2026-10-02
    source: 02_FEATURES, USAGE_STATS / admin README
    tests:
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: an untouched form has no change and cannot be sent
  - id: R-SET-31
    group: Support
    title: Changelog in your language
    text: |
      - app + web notes · newest first · English fallback
      - no account needed · cached offline
    source: OFFLINE_TIER §7, APP_SHELL_WEB §6a
    tests:
      - file: test/features/settings/domain/changelog_test.dart
        name: reads the language the release was written in
  - id: R-SET-32
    group: Support
    title: Developer mode
    text: |
      - About → tap the version 7×
      - app: plan simulator · debug tools · claim
      - web: only *Simulate an ended subscription*
    source: MONETIZATION §3b, APP_SHELL_WEB §6a
    related: [R-MON-53]
  - id: R-SET-40
    group: Copy
    title: Three languages, one voice
    text: |
      - EN "you" · DE *du* · JA no pronoun, です/ます
      - *Sicherung* not "Backup" · *Sparziel* · *Ausgabenlimit* · 帳簿
      - labels: no period · 2+ sentences: every one
    source: CLAUDE.md (UX copy)
