items:
  - id: R-SET-01
    group: Settings
    title: Three settings rows per person
    text: |
      - **shared**: money + date format · week + month start · summary view · goals · language
      - **app**: Home cards · notifications · bottom bars
      - **web**: web Home
      - currency = the **book's**, never a setting
    source: PROFILE_SETTINGS §1
    related: [R-BOOK-03]
  - id: R-SET-02
    group: Settings
    title: "Language: app per device, web per account"
    text: |
      - neither follows the other · open decision (D-SET-1)
      - a switch redraws every open page at once · fixed 2026-11-09: Profile kept its labels and switched only *Member since*
    source: PROFILE_SETTINGS §1, §4
    tests:
      - file: test/features/settings/config/app_locales_test.dart
        name: falls back to English for unsupported languages
      - file: test/shared/ui/settings/app_language_test.dart
        name: a language switch rebuilds const widgets on the open page and on the pages under it
    related: [D-SET-1]
  - id: R-SET-03
    group: Settings
    title: Month starts 1–28
    text: |
