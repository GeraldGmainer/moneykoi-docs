# Source: app PROFILE_SETTINGS_AI_CONTEXT.md, 02_FEATURES, onboarding / settings / feedback tests;
# web SETTINGS_FORMATTING_WEB, ONBOARDING_WEB, AUTH_PROFILE_WEB, APP_SHELL_WEB §6a.
items:
  - id: R-SET-01
    group: Settings
    title: Three settings rows per person
    text: |
      - **shared**: money + date format · week + month start · summary view · goals · language
      - **app**: Home cards · notifications · bottom bars
      - **web**: web Home
      - currency = the **book's**, never a setting
    source: PROFILE_SETTINGS §1
    related: [R-BOOK-03]
  - id: R-SET-02
    group: Settings
    title: "Language: app per device, web per account"
    text: neither follows the other · open decision (D-SET-1)
    source: PROFILE_SETTINGS §1, §4
    tests:
      - file: test/features/settings/config/app_locales_test.dart
        name: falls back to English for unsupported languages
    related: [D-SET-1]
  - id: R-SET-03
    group: Settings
    title: Month starts 1–28
    text: |
      - *My month starts on the 25th* → every month period
      - app: confirm dialog · web: saves on pick, after its migrations
    source: BUDGET_BOOK §6.1, SETTINGS_FORMATTING_WEB §1
    related: [R-BB-05]
  - id: R-SET-04
    group: Settings
    title: Saves the moment it changes
    text: no Save button · confirmation, or an error if it failed
    source: SETTINGS_FORMATTING_WEB §1, settings tests
    tests:
      - file: test/features/settings/ui/pages/notification_settings_page_test.dart
        name: a failing save shows an error instead of the confirmation
  - id: R-SET-10
    group: Onboarding
    title: Onboarding
    text: |
      - language → currency suggested (English → USD)
      - starter categories come classified
      - no account → fully offline · invitees skip it
      - *Quick start*: one tap · 4 accounts, 48 categories, no balances → Home keeps *Set starting balances*
      - one step count on every path (*Step 2 of 6* on the method choice) · the progress screen shows none · starting balances are typed in the picked currency's own format (since 2026-11-06, AND-1-3, AND-1-4)
      - signed in with the wrong account → *Log out* on the first step (web since 2026-10-28)
    source: OFFLINE_TIER §3, ONBOARDING §1, ONBOARDING_WEB §1
    tests:
      - file: src/app/onboarding/page.test.tsx
        repo: web
        name: logs out on this device from the first step and goes to the login page
      - file: test/features/onboarding/domain/service/onboarding_initial_state_factory_test.dart
        name: maps an English locale to USD
      - file: test/features/onboarding/domain/service/category_generation_service_test.dart
        name: classifies the starter book as fixed or variable at the parent level
      - file: test/features/onboarding/ui/pages/onboarding_page_test.dart
        name: the first step has no back button and continue opens the method choice, one six-step count on every path
  - id: R-SET-12
    group: Onboarding
    title: Personalize — six steps
    text: |
      - accounts: the 4 starters as switches · at least one stays on · optional starting balance each (card = what is owed)
      - calendar: start of week · start of month · date format → written to the profile setting
      - lifestyle questions → categories · *Sub-categories* switch off = main groups only (~13), favorites Food & Drink, Personal & Shopping, Transportation
      - live read-only preview of the tree above *Create budget book*
      - a typed balance retires Home's *Set starting balances* card · a balance or calendar write that fails never blocks the setup
    source: ONBOARDING §2–§5
    tests:
      - file: test/features/onboarding/ui/pages/onboarding_page_test.dart
        name: personalize walks accounts, calendar, questions and categories, where create asks the bloc to personalize
      - file: test/features/onboarding/domain/entities/onboarding_preferences_test.dart
        name: the last account on cannot be switched off
      - file: test/features/onboarding/domain/service/category_generation_service_test.dart
        name: keeps only the parents and favors the groups booked most
      - file: test/features/onboarding/use_cases/onboarding_personalize_use_case_test.dart
        name: retires the Home balance card once a balance was typed in setup
      - file: test/features/onboarding/data/onboarding_data_test.dart
        name: a failing balance write never strands the setup
    related: [R-SET-10, R-SET-01]
  - id: R-SET-11
    group: Onboarding
    title: Web onboarding is shorter
    text: currency · 4 accounts · 44 categories, all or nothing · no balances, no variability
    source: ONBOARDING_WEB §1, web 02_FEATURES
  - id: R-SET-13
    group: Support
    title: Tips & features
    text: |
      - drawer → *Tips & features* · Settings → Support → *Tips & features* · never opens by itself
      - one row per feature: one line of payoff + *Open* · groups Everyday · Plan · Together · More
      - a tick on what is already in use (bookings, scans, rules, budgets, goals, loans, lists, positions, widgets, app lock, hidden amounts, quick entry, calendar)
      - *Receipt scanner* ticks on a scan or on any saved receipt, one typed in through *Add receipt* too (2026-11-03) · the Home checklist's *Scan a receipt* still needs a scan
      - locked rows keep the lock and open the paywall first · no row for a feature the plan cannot offer · widgets row Android only
      - the scanner row replays the pre-scan intro
    source: GETTING_STARTED §5
    tests:
      - file: test/features/getting_started/view_models/tips_catalog_test.dart
        name: a locked feature keeps its row, with the lock; an absent one loses it
      - file: test/features/getting_started/use_cases/get_tips_usage_use_case_test.dart
        name: every tick comes from its own trace
      - file: test/features/getting_started/use_cases/get_tips_usage_use_case_test.dart
        name: a receipt typed in by hand ticks the receipt scanner too
      - file: test/features/getting_started/ui/tips_page_test.dart
        name: "a destination row goes through the navigator: a tab is switched with its focus, a page is pushed"
    related: [R-HOM-40]
  - id: R-SET-20
    group: Profile
    title: Name + avatar
    text: |
      - app: compresses, deletes the old one
      - web: uploads the crop as is · not for local books
    source: AUTH_PROFILE_WEB §6, OFFLINE_TIER §7
  - id: R-SET-21
    group: Profile
    title: Set password
    text: twice · ≥ 6 characters · no current password · app + web
    source: AUTH_PROFILE_WEB §1
  - id: R-SET-30
    group: Support
    title: Feedback for everyone
    text: |
      - feedback · bug · idea · drawer + Settings · **no account needed**
      - account → *Attach email address* · admin reads it from the profile
      - no account → *Email for a reply (optional)* · checked, ≤ 254
      - → admin inbox · community voting removed 2026-10-02
    source: 02_FEATURES, MONETIZATION §3a, migration 20261021120000
    tests:
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: an untouched form has no change and cannot be sent
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: an account replies to its own address; without one the address is asked for
      - file: test/features/feedback/ui/pages/feedback_page_test.dart
        name: without an account the form asks for an optional reply address instead of the checkbox
      - file: test/features/feedback/ui/pages/feedback_page_test.dart
        name: a malformed reply address says so and keeps Send disabled
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: a book without an account keeps investments (prices come from the public price list) and feedback, and drops the account-bound entries
    related: [D-SET-2, R-SET-33]
  - id: R-SET-33
    group: Support
    title: Feedback without an account
    text: |
      - sent through `submit_feedback` · insert-only · open to anon
      - ≤ 30 rows without an account per 10 min, whole project
      - admin shows the typed address, or *no account*
      - server without the migration → send fails (T-SET-01)
    source: moneykoi-supabase 20261021120000_feedback_without_account.sql
    tests:
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: sends as no account
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: a malformed address is never sent
    related: [T-SET-01]
  - id: R-SET-31
    group: Support
    title: Changelog in your language
    text: |
      - app + web notes · newest first · English fallback
      - no account needed · cached offline
    source: OFFLINE_TIER §7, APP_SHELL_WEB §6a
    tests:
      - file: test/features/settings/domain/changelog_test.dart
        name: reads the language the release was written in
  - id: R-SET-41
    group: Support
    title: Support by email
    text: |
      - Settings → Support & info → *Support by email* · app + web
      - opens the mail app with `support@moneykoi.com` · same address as the website's contact page
      - privacy requests: `privacy@moneykoi.com`, named in the privacy policy
    source: app `AppUrls.supportEmail`, web settings page · addresses since 2026-10-24
    tests:
      - file: test/features/settings/ui/pages/settings_page_test.dart
        name: groups the settings into their six sections
      - file: src/app/(main)/settings/page.test.tsx
        name: offers the support address as a mail link
        repo: web
  - id: R-SET-32
    group: Support
    title: Developer mode
    text: |
      - About → tap the version 7×
      - app: plan simulator · debug tools
      - web: only *Simulate an ended subscription*
    source: MONETIZATION §3b, APP_SHELL_WEB §6a
    related: [R-MON-53]
  - id: R-SET-42
    group: Support
    title: Open-source licenses
    text: |
      - About → *Open-source licenses* · app only
      - every pub package · bundled fonts + icon set: Inter, Poppins, Noto Sans JP, AssetGlyphs
      - native Android/iOS libraries (ML Kit, RevenueCat, Sentry) not listed
    source: MONETIZATION §8 (9)
    tests:
      - file: test/main/service/bundled_licenses_test.dart
        name: every font file under assets/fonts has a registered license
      - file: test/features/settings/ui/pages/about_page_test.dart
        name: the licenses row opens the license list with the app version
  - id: R-SET-44
    group: Support
    title: Price data sources
    text: |
      - About → *Price data sources* · app only · every plan
      - one row per price kind on the phone → its provider's site
      - follows the synced prices · a server cutover needs no release
      - no prices downloaded → *No prices on this phone yet*
    source: INVESTMENTS §7d, supabase INVESTMENT_PRICES §13.3
    related: [R-INV-20]
    tests:
      - file: test/features/settings/ui/pages/about_page_test.dart
        name: the row opens the provider of every price on this phone
      - file: test/features/settings/ui/pages/about_page_test.dart
        name: once ECB rates are on the phone the exchange rates quote the ECB
      - file: test/features/investment/domain/services/price_credits_test.dart
        name: a provider without a credit, an unknown asset or a hand-priced class names nobody
  - id: R-SET-40
    group: Copy
    title: Three languages, one voice
    text: |
      - never addresses the user (R-PLAT-24) · JA です/ます
      - *Sicherung* not "Backup" · *Sparziel* · *Ausgabenlimit* · 帳簿
      - labels: no period · 2+ sentences: every one
    source: CLAUDE.md (UX copy)
    related: [R-PLAT-24, R-PLAT-25]
  - id: R-SET-43
    group: Settings
    title: Changelog's update row opens this platform's store
    text: |
      - Android → the Play page · iOS → the App Store page (Apple ID `6829288599`, set 2026-10-31)
      - the paywall's *Update app* button opens the same page
    source: AppUrls.storeListing, 03_TECHNICAL_ARCHITECTURE.md › Flavors, bundle ids and the iOS target
    tests:
      - file: test/core/constants/app_urls_test.dart
      - file: test/features/settings/ui/pages/changelog_page_test.dart
        name: on iOS the update row opens the App Store page
    related: [E-PLAT-03, T-PLAT-10]
  - id: R-SET-45
    group: Formatting
    title: Dates and percents follow the locale
    text: |
      - *System* date → locale medium: *Nov 2, 2026* · *2. Nov. 2026* · *2026年11月2日*
      - long dates in the locale's order: *Monday, November 2, 2026*
      - numeric dates **only** with a numeric date format picked
      - percents: *27%* en/ja · *27 %* de · a zero is bare
    source: 04_COMPONENT_REFERENCE.md › Dates, percents and compact money · iOS round IOS-2-5, IOS-13-4
    tests:
      - file: test/shared/ui/calendar/date_converter_test.dart
        name: puts weekday, day, month and year in the locale
      - file: test/shared/ui/calendar/date_converter_test.dart
        name: reads AppDateFormat.system as the locale
      - file: test/shared/utils/number_format_test.dart
        name: follows each locale
