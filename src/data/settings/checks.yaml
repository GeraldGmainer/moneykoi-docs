      - id: C-SET-006
        text: "Welcome → *Get started*: language + method screens show no step counter · *Personalize* → accounts *1 of 3* → questions *2 of 3* → categories *3 of 3* · no calendar page · Settings → Display formats on Monday, calendar month, system date"
      - id: C-SET-007
        text: Personalize → *Expenses* listed right under the switch, *Income* below · *Sub-categories* off → preview shrinks to the groups, counter updates → book has no sub-categories · Home quick-add shows Food & Drink, Personal & Shopping, Transportation
      - id: C-SET-008
        text: Tips & features → every row's *Open* lands on its feature (calendar tab, budgets tab, recurring page, scanner with the intro again) · back returns to the list
      - id: C-SET-009
        text: Tips & features on Free → Forecast, Shared books, Investments wear the lock and open the paywall · after Pro the lock is gone · iOS has no widgets row
      - id: C-SET-010
        text: "No account → drawer *Feedback* → reply email field, no checkbox · `a@b` → error, *Send* off · valid address → sent → admin shows it"
      - id: C-SET-011
        text: "No account, email left empty → sent → admin inbox row reads *no account* · dev server without the migration → error, draft kept"
      - id: C-SET-012
        text: "Web: budget spent exactly to its cap → left *0.00*, never *−0.00* · chart axis at 999,950 → *1.0M*, not *1000.0k* · investment quantity 100 at scale 0 → *100*, not *1*"
      - id: C-SET-013
        text: About → *Open-source licenses* → koi mark, *Money Koi*, version · Inter, Poppins, Noto Sans JP, AssetGlyphs open with their license text · German + Japanese titles
      - id: C-SET-014
        text: Profile → *Language* row → Deutsch → page and drawer German at once (title, stats, *Sprache*, *Sicherheit & Daten*, *Abmelden* — not just *Mitglied seit*) · Settings → *Language* shows Deutsch · restart keeps it · back to English the same way · phone, tablet and landscape
      - id: C-SET-015
        text: About → *Price data sources* → metal, crypto, exchange-rate rows · each opens its provider's site · German + Japanese titles
      - id: C-SET-016
        text: "Review card (R-SET-47): internal-track build, not a debug one · a fresh install · 1 booking today, 2 more on another day (or the device date moved) · restart the app, so no getting-started hint showed in this launch · save a booking → Home, then Play's card · a second save in the same launch → nothing · Settings → *Rate Money Koi* → the Play page · iOS: TestFlight shows no card; the row opens the App Store's review form"
      - id: C-SET-017
        text: "Release build: *Quick Start* → *Create budget book* → Home shows the starting balance and the *Getting started* card at once, no *0,00 €* for seconds (AND-1-5)"
      - id: C-SET-018
        text: "Settings → *Appearance* → *Light* → Settings, the drawer and the page behind repaint at once, back goes where it went before · every tab (Home, Budget Book incl. calendar, Analytics charts + heatmap + treemap, Shopping, Investments) readable · bottom sheets, dialogs, snackbars, the keypad · restart keeps *Light* · same in *Dark* · de + ja copy"
      - id: C-SET-019
        text: "*Appearance* → *System* · switch the phone's dark mode with the app open → the app follows without a restart · Android quick tile + iOS Control Center"
      - id: C-SET-020
        text: "Light, cold start → dark launch screen, then the light app, no white flash · status-bar icons dark on light pages, light over the koi header on Home, light again once the header collapses · Android navigation bar follows"
      - id: C-SET-021
        text: "Light → scanner: camera frame + koi corners as in dark · panels, buttons, review pages and sheets light and readable · Profile → change photo → cropper toolbar readable"
      - id: C-SET-022
        text: "Light → home-screen widgets unchanged (their own *Appearance*) · widget config preview shows the widget's plate, not the app's · PDF export identical to one made in dark"
      - id: C-SET-023
        text: "Light → categories with pale user colors (yellow, light green, light blue): icon readable on its disc in the picker, ledger and analytics · app lock + hide-amounts blur readable"
