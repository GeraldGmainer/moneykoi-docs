        text: Formats + Sunday week + month start 25 (confirm) → Budget Book, budgets, analytics follow · web same
      - id: C-SET-002
        text: Account → feedback with and without *Attach email address* → admin inbox · email only when ticked
      - id: C-SET-003
        text: Changelog offline after one online open · German + Japanese
