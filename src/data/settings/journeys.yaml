items:
  - id: J-SET-01
    group: Setup
    title: Sets the formats
    from: Settings → Display formats
    steps:
      - money + date format · week + month start
    result: every screen follows · all devices
    checks: [C-SET-001]
  - id: J-SET-03
    group: Setup
    title: Personalized setup
    from: Welcome → *Get started* → *Personalize*
    steps:
      - accounts on/off · starting balances on the keypad · *1 of 3*
      - lifestyle questions → *Continue* · *2 of 3*
      - "*Sub-categories* switch · preview → *Create budget book*"
    result: book with the chosen accounts, balances dated today, categories
    note: |
      - *Quick start* skips all of it · the first two screens show no step counter
      - no calendar page since 2026-11-11 · week and month start, date format → Settings → Display formats
      - back from accounts → method choice, no counter
    checks: [C-SET-005, C-SET-006, C-SET-007]
    related: [R-SET-12]
  - id: J-SET-05
    group: Setup
    title: Switches the app language
    from: Profile (drawer header or Settings → profile card) · or Settings → *Language*
    steps:
      - "Profile: *Language* row · English · Deutsch · 日本語 · one tap"
      - "Settings: *Language* → sheet → pick"
    result: whole app in the new language at once · this device only
    tests:
      - file: test/features/settings/ui/pages/profile_settings_page_test.dart
        name: a tap switches the app language and remembers it
    checks: [C-SET-014]
    related: [R-SET-02]
  - id: J-SET-04
    group: Support
    title: Looks up a feature
    from: Drawer → *Tips & features* (or Settings → Support)
    steps:
      - four groups, one line per feature
      - "*Open* → the feature itself (tab switched or page pushed) · locked → paywall"
    result: feature opened · used rows ticked
    checks: [C-SET-008, C-SET-009]
    related: [R-SET-13]
  - id: J-SET-02
    group: Support
    title: Sends feedback
    from: Drawer or Settings → *Feedback*
    steps:
      - kind · message
      - "account: *Attach email address*"
      - "no account: optional reply email"
    result: row in the admin inbox
    note: No account works since 2026-10-21 · needs the server migration (T-SET-01)
    tests:
      - file: test/features/feedback/bloc/feedback_cubit_test.dart
        name: send passes the draft, the locale and the account to the use case and flags isSent
    checks: [C-SET-002, C-SET-010, C-SET-011]
    related: [R-SET-30, R-SET-33]
