items:
  - id: D-NTF-1
    question: Push notifications
    status: open
    answer: Separate, unbuilt project · `PUSH_INFRASTRUCTURE_PLAN.md` · id block 700000 reserved
  - id: D-NTF-2
    question: Tap opens the record?
    status: decided
    date: 2026-10-16
    answer: Only the backup reminder · others open the app · inbox rows not tappable
  - id: D-NTF-3
    question: Synced or per-device switches?
    status: decided
    answer: Synced · per-device override later if needed
  - id: D-NTF-4
    question: Where does a tap on a notification land?
    status: decided
    date: 2026-11-02
    answer: |
      - on its subject: *Over budget* → that budget · bill reminder → the rule / upcoming · goal or loan → its page · forecast alert → Forecast
      - backup reminder keeps its route · the inbox rows stay untappable
      - source: iOS simulator round, IOS-9-1
