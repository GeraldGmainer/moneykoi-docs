    question: Push notifications (server-decided timing)
    status: open
    answer: A separate, unbuilt project (`PUSH_INFRASTRUCTURE_PLAN.md`); block 700000 reserved.
  - id: D-NTF-2
    question: Tap a notification to open its record
    status: decided
    date: 2026-10-16
    answer: Only the backup reminder routes; every other channel opens the app. Inbox rows stay untappable.
  - id: D-NTF-3
    question: Synced or per-device switches
    status: decided
    answer: Synced; a per-device override is the later add if double-device nudging annoys.
