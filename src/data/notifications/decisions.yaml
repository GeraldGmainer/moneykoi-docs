items:
  - id: D-NTF-1
    question: Push notifications
    status: decided
    date: 2026-11-18
    answer: |
      - **decided 2026-11-18: build after the iOS launch, Q1 2027** · roadmap *Feb → Apr 2027*
      - separate, unbuilt project · `plan_later/PUSH_INFRASTRUCTURE_PLAN.md` · id block 700000 reserved
      - the case asked for (2026-11-17): someone else adds to a shared book → the other members get a push · today nothing tells them
      - needs Firebase + Apple push, a server function, the Data safety form and App Privacy updated
  - id: D-NTF-2
    question: Tap opens the record?
    status: decided
    date: 2026-10-16
    answer: Only the backup reminder · others open the app · inbox rows not tappable · replaced by D-NTF-4 (2026-11-02)
  - id: D-NTF-3
    question: Synced or per-device switches?
    status: decided
    answer: Synced · per-device override later if needed
  - id: D-NTF-4
    question: Where does a tap on a notification land?
    status: decided
    date: 2026-11-02
    answer: |
      - on its subject: *Over budget* → that budget · bill reminder → the rule / upcoming · goal or loan → its page · forecast alert → Forecast
      - backup reminder keeps its route · the inbox rows stay untappable
      - source: iOS simulator round, IOS-9-1
      - built 2026-11-03 · R-NTF-14 · real taps: C-NTF-005
