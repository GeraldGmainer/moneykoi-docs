items:
  - id: E-NTF-01
    group: Channels
    title: Book switch repeats an alert
    when: budget over in A → switch to B → back to A
    then: may alert again same period · known gap
    status: known-issue
    risk: low
  - id: E-NTF-02
    group: Channels
    title: Booking during the check
    when: booking lands mid-check
    then: noticed only at the next booking · known gap
    status: known-issue
    risk: low
  - id: E-NTF-03
    group: Channels
    title: App never opened
    when: weeks without a launch
    then: only the first reminder per rule · iOS caps ~64 · fix = push
    status: by-design
    risk: medium
  - id: E-NTF-04
    group: Channels
    title: Lead already passed
    when: reminder time in the past when armed
    then: skipped, never fired now
    risk: low
    tests:
      - file: test/features/recurring_booking/recurring_due_schedule_test.dart
        name: skips a lead that already passed rather than firing now
  - id: E-NTF-05
    group: Channels
    title: Doze holds an alarm
    when: OS still holds it past its time · re-arm
    then: row leaves the inbox · it never showed
    risk: low
    tests:
      - file: test/core/notifications/notification_log_store_test.dart
        name: an alarm the OS still held when cancelled leaves the inbox even if it ran late
  - id: E-NTF-06
    group: Permission
    title: Notifications refused for good
    when: Android prompt refused twice · a reminder switched on again
    then: |
      - fixed 2026-11-06 · the snackbar carries *Open settings* to the system notification setting
      - before: Android stopped asking and nothing in the app led to the setting (AND-9-1)
    status: fixed
    risk: medium
  - id: E-NTF-07
    group: Reminders
    title: Reminder sent again after a time change
    when: a bill reminder already arrived today · the reminder time is moved later
    then: |
      - fixed 2026-11-09 · one reminder per occurrence · a reminder not sent yet moves to the new time
      - before: the same *due tomorrow* arrived a second time at the new time (AND-9-2)
    status: fixed
    risk: low
    tests:
      - file: test/features/recurring_booking/use_cases/schedule_recurring_due_use_case_test.dart
        name: one already sent is not sent again after the time changes
