# Source: app NOTIFICATIONS_AI_CONTEXT.md (and the channel notes in FORECAST, RECONCILIATION,
# BACKUP_RESTORE, OFFLINE_TIER). The web sends no notifications.
items:
  - id: R-NTF-01
    group: The five rules
    title: Opt-in · each channel off
    text: |
      - switching on = when the OS asks → ask has a reason
      - refused → switch stays off + banner: allow in system settings
    source: NOTIFICATIONS §2
    tests:
      - file: test/core/notifications/notification_service_test.dart
        name: a permission request is refused without asking
      - file: test/core/notifications/notification_service_ios_test.dart
        name: switching reminders on asks for alert, badge and sound
  - id: R-NTF-02
    group: The five rules
    title: Everything is local
    text: |
      - scheduled on the phone · re-armed after sync + resume
      - no push server
      - every pass cancels + rebuilds → deleted rules lose their reminder
    source: NOTIFICATIONS §2
  - id: R-NTF-03
    group: The five rules
    title: Own time per channel
    text: |
      - picked in its sheet · bills 9:00 · entry nudge 20:00
      - Android: the clock dial · iPhone: the time wheel in a sheet, *Done* saves
    source: NOTIFICATIONS §3, §10 (2026-10-10)
    tests:
      - file: test/features/settings/ui/pages/notification_settings_page_test.dart
        name: on iOS the time is picked on the wheel in a sheet, not on the clock dial
  - id: R-NTF-04
    group: The five rules
    title: Settings sync · history doesn't
    text: |
      - switches + times on your profile
      - inbox per phone + account · signed out: only older rows
    source: NOTIFICATIONS §3, §9
  - id: R-NTF-10
    group: Channels
    title: Bill reminders
    text: |
      - each rule's **next** date only · transfers too
      - lead per rule or default 1 day · within 90 days
      - same day → one notification: "Rent, Phone and 2 more"
    source: NOTIFICATIONS §5
    tests:
      - file: test/core/notifications/notification_names_test.dart
        name: one name past the cap is still listed, never "and 1 more"
    related: [R-REC-13]
  - id: R-NTF-11
    group: Channels
    title: Over budget
    text: |
      - cap crossed, also by a partner's spending
      - once per budget + period · **never** at the warning level
    source: NOTIFICATIONS §5
    tests:
      - file: test/features/budget_goals/use_cases/budget_over_watcher_test.dart
        name: notifies each newly-over cap once and remembers its window
  - id: R-NTF-12
    group: Channels
    title: Entry nudge
    text: |
      - off · daily · weekly *log your spending*
      - skips logged days, partner's count too
      - quiet by itself after 2 weeks unopened
    source: NOTIFICATIONS §5
  - id: R-NTF-13
    group: Channels
    title: Other channels
    text: |
      - goals + loans · balance-check month start
      - forecast below buffer/zero · date, never amount
      - backup reminder (Pro) · tap opens Backup & restore
      - shared book stopped · resumed · deleted
    source: NOTIFICATIONS §1, §5
    related: [R-FC-31, R-BC-09, R-BOOK-35]
  - id: R-NTF-15
    group: Channels
    title: Import reminders
    text: |
      - channel *Import reminders* · **Pro** · off by default
      - *Time for the bank file* · 30 days after the last import into the book
      - Settings shows *Import reminder* only with Pro · tap opens the import for that book
    source: NOTIFICATIONS §1 · BOOKING_IMPORT §19
    tests:
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: the channel id is the one Android stores, in its own id block
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: off by default; nothing without Pro, for a member, or in a book that never imported
    related: [R-DATA-92]
  - id: R-NTF-14
    group: Channels
    title: A tap lands on the subject
    text: |
      - *Over budget* → that budget · several over at once → Budgets
      - bill reminder → its rule · several rules → *Upcoming*
      - goal nudge → the goal (several → Goals) · loan reminder → the loan
      - forecast alert → Forecast · after Pro ended: read-only with plans, else the paywall
      - record deleted or archived since → its list · a form with changes stays open
      - backup reminder keeps its route · entry nudge, balance check, shared-book notices only open the app
      - a reminder armed before the update only opens the app until the next re-arm
    source: NOTIFICATIONS §6
    tests:
      - file: test/app/navigation/notification_subject_tap_test.dart
        name: Over budget opens that budget
      - file: test/app/navigation/notification_subject_tap_test.dart
        name: a record deleted or archived since lands on its list instead
      - file: test/app/navigation/notification_subject_tap_test.dart
        name: a list tap never pops past a form that refuses to close
    checks: [C-NTF-005]
    related: [D-NTF-4]
  - id: R-NTF-20
    group: Inbox
    title: Bell keeps what was shown
    text: |
      - rows appear once their time passed
      - opening marks read · not tappable · no filters
    source: NOTIFICATIONS §9
    tests:
      - file: test/core/notifications/notification_log_store_test.dart
        name: cancelling a channel drops its pending rows and leaves what already fired
