items:
  - id: J-NTF-01
    group: Setup
    title: Turns on bill reminders
    from: Settings → Notifications → *Bill reminders*
    steps:
      - switch on → OS asks
      - pick the time · a wheel on the iPhone
    result: reminder before each next date
    checks: [C-NTF-001, C-NTF-006]
  - id: J-NTF-03
    group: Reminders
    title: Taps a reminder
    from: a notification banner or the lock screen
    steps:
      - tap
    result: the app opens on what it is about · budget, rule, goal, loan or Forecast
    checks: [C-NTF-005]
  - id: J-NTF-02
    group: Inbox
    title: Reads what came in
    from: Home → bell
    steps:
      - shown reminders, newest first
    result: badge clears
    checks: [C-NTF-003]
