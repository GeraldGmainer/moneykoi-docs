items:
  - id: E-SHP-01
    group: Items
    title: Same-name income category
    when: '"Lebensmittel" is income + expense'
    then: expense one used · fixed 2026-10-16
    status: fixed
    risk: medium
  - id: E-SHP-02
    group: Items
    title: Stepper on a decimal
    when: − on `0,5 kg`
    then: → `1,5 kg` · only a leading integer parsed · app + web · open (review 26)
    status: known-issue
    risk: low
  - id: E-SHP-03
    group: Items
    title: Partner edits a checked-off item
    when: offline edits arrive after the check-off
    then: dropped · delete wins
    status: by-design
    risk: low
  - id: E-SHP-04
    group: Web
    title: Web read fails
    when: shopping request fails
    then: "*Couldn't load the shopping lists* with *Try again* · before 2026-11-12 it looked empty or said *list not found* (review 14)"
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/shopping/components/shopping-workspace.test.tsx
        repo: web
        name: says the load failed and offers a retry, instead of an empty board or "not found"
  - id: E-SHP-05
    group: Items
    title: English item names stay uncategorized
    when: quick add `2 kg apples`, `milk`, `bread 2x`, `coffee` · Japanese `パン`, `牛乳`
    then: |
      - all under *Groceries* · the same everyday en/ja words as quick booking
      - before 2026-11-03 all four landed in *Uncategorized* while `Eier` worked (iOS round, IOS-18-1)
    status: fixed
    risk: low
    related: [E-BKG-40]
    tests:
      - file: test/features/shopping_list/domain/services/shopping_item_categorizer_test.dart
        name: everyday English and Japanese item names land on groceries
  - id: E-SHP-06
    group: Items
    title: Stepper on a decimal quantity
    when: "− on `0,5 kg`, + on `2.25 l`"
    then: "`0,5 kg` stays (never zero) · `1,5 kg` − → `0,5 kg` · `2.25 l` + → `3.25 l` · the decimal mark is kept · app and web · before 2026-11-12 − on `0,5 kg` gave `1,5 kg` (web review 26)"
    status: fixed
    risk: low
    tests:
      - file: test/features/shopping_list/ui/widgets/quantity_stepper_test.dart
        name: moves a decimal quantity with its decimals and its mark, never to zero
      - file: src/app/(main)/shopping/lib/bump-quantity.test.ts
        repo: web
        name: moves a decimal quantity with its decimals and its mark, never to zero
