# Source: app SHOPPING_LIST_AI_CONTEXT.md, MONETIZATION §3a; web SHOPPING_WEB_AI_CONTEXT.md.
items:
  - id: R-SHP-01
    group: Lists
    title: Pro · readable after the plan ends
    text: |
      - **Pro** since 2026-10-17, free before
      - plan ended + lists exist → read-only, banner
      - no lists → locked panel
    source: SHOPPING_LIST §0
    related: [R-MON-20]
  - id: R-SHP-02
    group: Lists
    title: Shared by design
    text: |
      - every member creates, renames, deletes lists + items
      - **no** owner/admin gate · don't "align" with accounts
    source: SHOPPING_LIST §1
  - id: R-SHP-03
    group: Lists
    title: Pinned list · app
    text: |
      - Settings → Navigation → Shopping slot → pick a list
      - tab opens straight into it
      - list gone or not synced → list of lists · pin kept
    source: SHOPPING_LIST §1c
    tests:
      - file: test/features/shopping_list/ui/pages/shopping_list_destination_test.dart
        name: a pinned list that no longer exists falls back to the list of lists
  - id: R-SHP-10
    group: Quick add
    title: Name + quantity, one field
    text: |
      - quantity only at start or end
      - ✓ `3x Äpfel` · `Milch 1,5 l` · `Red Bull 4x250ml` · `Zwei Äpfel` · `りんご3個`
      - ✗ `Milch 3,5%` · `Wein 5€` · `Spax 4x40mm` · `3XL Shirt` · `Vitamin B12`
      - unsure → whole text is the name
    source: SHOPPING_LIST §2
    tests:
      - file: test/features/shopping_list/domain/services/shopping_quantity_parser_test.dart
        name: things that must NOT split
      - file: test/features/shopping_list/domain/services/shopping_quantity_parser_test.dart
        name: number words
  - id: R-SHP-11
    group: Quick add
    title: Categorized once, when added
    text: |
      - matched to expense categories on add
      - then it's yours: drag, edit sheet
      - dropped into *Uncategorized* → stays
    source: SHOPPING_LIST §3
    tests:
      - file: test/features/shopping_list/domain/services/shopping_item_categorizer_test.dart
        name: resolve skips an income category of the same name
  - id: R-SHP-20
    group: Order & board
    title: One order, synced
    text: |
      - drag writes only the moved item · rebalance when gaps run out
      - grouped by category (per list, per device) or flat · same order
    source: SHOPPING_LIST §4, §5
    tests:
      - file: test/features/shopping_list/domain/services/shopping_position_test.dart
        name: exhausted gap rebalances to clean multiples with the moved item slotted in
  - id: R-SHP-21
    group: Order & board
    title: Check off = deleted for good
    text: |
      - hard delete · Undo = a fresh item
      - partner's queued edit never brings it back
    source: SHOPPING_LIST §9
  - id: R-SHP-30
    group: Booking
    title: Book an item
    text: |
      - swipe right or *Book as expense*
      - form: name (cut to 20) + guessed expense category
      - item removed only after Save · back → item stays
    source: SHOPPING_LIST §7b
  - id: R-SHP-40
    group: Web
    title: Board · web only
    text: |
      - ≥ 1024 px: every list a column · drag between · **C** checks off
      - narrower: list of lists + check button
      - no pin, swipes, trash bar, widget, realtime
    source: SHOPPING_WEB §1
