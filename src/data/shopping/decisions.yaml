  - id: D-SHP-1
    question: Explain the row gestures (swipe right books, swipe left deletes, tap edits)?
    status: decided
    date: 2026-11-03
    answer: |
      - **yes** · a one-time tip on the first list, like the quick-add bubble
      - once per phone · dismissible
      - built 2026-11-03
      - source: iOS simulator round, IOS-18-2
    related: [R-SHP-31]
  - id: D-SHP-2
    question: What do + and − do on a fraction or a range quantity?
    status: decided
    date: 2026-11-17
    answer: |
      - **step it** · a fraction by whole units (`1/2` → `1 1/2`) · a range moves both ends (`2-3` → `3-4`)
      - app and web together (`quantity_stepper.dart`, `bump-quantity.ts`)
      - built 2026-11-17 · any other number form (`0,5-1 l`, `1/0`) is left unchanged rather than half-read
      - source: bug hunt 23
    related: [E-SHP-08]
