items:
  - id: T-BKG-01
    title: Multi-currency · apply the parked server migration on dev
    owner: gerald
    detail: |
      - written 2026-11-11, **not** in `migrations/`: `moneykoi-supabase/supabase/migrations_later/20261111120000_multi_currency.sql`
      - the app branch `multi-currency` cannot push a booking, rule or account to a server without it (PGRST204) · dev first, before testing the branch
      - to apply: move it into `supabase/migrations/` with a fresh timestamp later than the newest migration there · re-copy any function body its header lists that changed in between
      - prod: with the December release, before the app build ships
      - at move time: `BACKUP_FORMAT.md` §4 gains the optional columns (list in `MULTI_CURRENCY_AI_CONTEXT.md` §4)
  - id: T-BKG-02
    title: Multi-currency · web shows, the app enters (D-BKG-35)
    owner: ai
    waitsFor: [T-BKG-01]
    detail: |
      - lists + detail: original amount and rate under the book amount
      - a foreign booking: book amount + currency read-only on the web
      - new booking / rule / transfer forms: no foreign account, no cross-currency pair · note *Foreign-currency entries are made in the app*
      - accounts, dashboard, balance timeline, forecast: foreign accounts read `native_balance` at today's rate · handle `balance: null` + `accounts_without_rate`
      - import: `ImportField` learns `originalAmount`, `originalCurrency`, `fxRate` (shared `import_formats_schema.json`)
    prompt: |
      Build the web part of multi-currency in moneykoi-web (D-BKG-35, "web shows, the app enters"). Read
      moneykoi-app/.agents/references/MULTI_CURRENCY_AI_CONTEXT.md §2, §4 and §6, and the parked server migration
      moneykoi-supabase/supabase/migrations_later/20261111120000_multi_currency.sql for the columns and RPC outputs.
  - id: T-BKG-03
    title: Multi-currency · delete the built plan file
    owner: gerald
    detail: |
      - `moneykoi-app/.agents/plans/MULTI_CURRENCY_PLAN.md` · built, its content moved to `MULTI_CURRENCY_AI_CONTEXT.md`
      - an agent may not delete it here (the auto-mode guard refused)
  - id: T-BKG-04
    title: Multi-currency · renumber the local migration if split lands first
    owner: ai
    detail: |
      - the branch takes `migration_v28.sql` · **split took v28 on 2026-11-14** → the branch's file becomes `migration_v29.sql`, `_databaseVersion` 29
      - server: `internal.rewind_columns` and `restore_book_apply` now carry `split_group_id` (T-BKG-05) → re-copy both
      - whichever merges second takes the next number and bumps `_databaseVersion` · the multi-currency file is plain re-runnable `ADD COLUMN`s
      - on merge: link the branch's tests to E-BKG-44 … E-BKG-59 (`npm run check` reads tests from the main checkout, so they cannot be linked before)
  - id: T-BKG-05
    title: Split transactions · apply the server migration
    owner: gerald
    detail: |
      - written 2026-11-14: `moneykoi-supabase/supabase/migrations/20261114100000_booking_split_group.sql`
      - adds `booking.split_group_id` · redefines `internal.rewind_columns` and `restore_book_apply` (bank-import bodies + the column)
      - **before** an app build with split ships: without the column the server refuses every booking push (PGRST204)
      - local: `supabase migration up` · prod: merge to `main` (CI pushes)
      - then run the read-only checks at the end of the file
      - multi-currency (T-BKG-01) redefines the same two functions: at its move, re-copy them from this file
  - id: T-BKG-06
    title: Split transactions · the web shows the group
    owner: ai
    waitsFor: [T-BKG-05]
    detail: |
      - today the web lists each part as its own booking · totals are right
      - ledger: group rows by `split_group_id`, header with total, as the app
      - `/add-receipt`: send one group id for the items of a receipt (`receipt_create_with_bookings` needs the column in `p_items` or a parameter)
      - editing a part on the web must keep `split_group_id` (check the update payload)
  - id: T-BKG-07
    title: Refunds · check how they count today
    owner: ai
    detail: |
      - for D-BKG-41, decided 2026-11-18: a refund lowers the original expense category, in the month of its own date · check before planning
      - can a booking be a negative expense? the form and its calculator, quick-add, the bank CSV import, the scanner, the web
      - where a refund lands today: the *Refunds* income category, a bank credit, a returned receipt line
      - which figures it moves: budgets, savings rate, analytics, cash flow, forecast, tag totals
      - output: what happens today, file:line, what blocks the decided way, and a plan sketch (app, web, server, the *Refunds* category of existing books)
  - id: T-BKG-08
    title: Voice input · can speech become a booking with cloud AI?
    owner: ai
    status: done
    detail: |
      - **done 2026-11-18 → D-BKG-44**: on the phone only, no cloud AI · two parser gaps found (E-BKG-88, E-BKG-89)
      - research for `voice-input` (catalog, roadmap *Later*) · asked 2026-11-17
      - speech to text: on the device (Android, iOS) or a cloud service · de, en, ja
      - text to booking: the quick-add line parser already turns *Coffee 3.50 yesterday* into a booking · speech could feed it, or a cloud model reads amount, category, account, date
      - what leaves the phone, where it is processed (EU?), cost per booking, behaviour offline · the privacy line R-PRIV-40 and the store's Data safety form
      - output: a recommendation with a plan sketch · tier open (the catalog row says Pro)
  - id: T-BKG-09
    title: Fewer taps to add a booking
    owner: ai
    detail: |
      - asked 2026-11-17: improve adding a booking further, fewer taps
      - count today's taps per way in: the + button, quick-add, Home quick actions, the widget, the scanner, a recurring rule's *book now*
      - look for cuts: better defaults (last account and category), suggestions, saving straight from quick-add, fewer screens
      - output: proposals with the tap count before and after · anything that changes what a user sees is Gerald's call
