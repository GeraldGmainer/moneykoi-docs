# Source: app QUICK_BOOKING, TRASH, FORMS, CATEGORY (money signs) context docs, 02_FEATURES;
# web BOOKINGS_WEB, BOOKING_ENTRY_WEB, TAGS_WEB.
items:
  # The booking form
  - id: R-BKG-01
    group: The booking form
    title: Three shapes
    text: |
      - expense · income → type = the category's type
      - transfer → no category · From + To
      - correction (balance check) → neither
    source: CATEGORY §money signs, RECONCILIATION
  - id: R-BKG-02
    group: The booking form
    title: Save at the bottom · back asks
    text: |
      - full-width *Save* · on once changed + valid
      - back with changes → *Discard / Keep editing*
      - barely started → just dropped · create = edit look
    source: CLAUDE.md, FORMS §1–§4
  - id: R-BKG-03
    group: The booking form
    title: App's own keypad
    text: |
      - hero amount + calculator
      - **=** → category → maybe description
      - 2 skipped prompts in a row → stops asking · transfers never
    source: FORMS §7b, §8c
  - id: R-BKG-04
    group: The booking form
    title: From + To are one pair
    text: |
      - each picker shows the other's account with ⇅ → pick = swap
      - ⇅ button swaps
      - only an explicit From becomes the next default
    source: FORMS §8e
    tests:
      - file: test/features/booking/bloc/booking_save_bloc_test.dart
        name: picking the To account as From swaps the pair and remembers the new From
      - file: test/features/booking/bloc/booking_save_bloc_test.dart
        name: picking the From account as To swaps the pair without touching the last account
  - id: R-BKG-05
    group: The booking form
    title: Defaults + 20 characters
    text: |
      - new booking: last account, today
      - description cut to 20 · blank → none
    source: BOOKING_IMPORT §13, use cases
    tests:
      - file: test/features/booking/use_cases/use_cases_test.dart
        name: saves a booking, normalizing a blank description to null
  - id: R-BKG-06
    group: The booking form
    title: Creator kept on edit
    text: |
      - new → active book + signed-in person
      - editing another's booking keeps them as creator
    source: FAMILY_ACCOUNTS §5.5
    tests:
      - file: test/features/booking/use_cases/use_cases_test.dart
        name: attributes a NEW booking to the active workspace and current profile
  - id: R-BKG-07
    group: The booking form
    title: Signs by what the figure is
    text: |
      - one booking → + / −
      - labelled total → none · net or change → signed · zero bare
      - expenses **never** tinted · transfer: no sign, own color
    source: CLAUDE.md, CATEGORY_AI_CONTEXT
    related: [R-LED-30]

  # Quick booking
  - id: R-BKG-10
    group: Quick booking
    title: One line → live chips
    text: |
      - long-press centre **+** · web: long press +, sidebar, ⌘K, key **Q**
      - `kebap 5,90 gestern #trip cash` → amount · category · account · date · tags
      - tap + → full form
    source: QUICK_BOOKING §1–§2, BOOKING_ENTRY_WEB §4.16
  - id: R-BKG-11
    group: Quick booking
    title: "Amounts: last separator decides"
    text: |
      - `1.234,56` = `1,234.56`
      - one separator + 3 digits → thousands (`1.500` = 1500)
      - digits in a word (`7up`) never an amount
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/quick_booking_parser_test.dart
        name: the last separator decides the decimals
      - file: test/features/booking/quick_add/quick_booking_parser_test.dart
        name: three trailing digits are a thousands group
      - file: test/features/booking/quick_add/quick_booking_parser_test.dart
        name: digits welded into a word are not an amount
  - id: R-BKG-12
    group: Quick booking
    title: Dates in EN, DE, JA
    text: |
      - `gestern` · `vor 2 tagen` · `last friday` · `先週の金曜日` · `3.7.`
      - longest phrase wins · weekday → last 1–7 days
      - not: month names, slash/ISO dates, bare day
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/date_extractor_test.dart
        name: a longer keyword wins over the one nested inside it
      - file: test/features/booking/quick_add/date_extractor_test.dart
        name: the week boundary follows the start-of-week setting
  - id: R-BKG-13
    group: Quick booking
    title: Accounts by exact name
    text: whole word, any case, longest first · hidden never · else last account
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/account_extractor_test.dart
        name: only whole words match — cashback is not Cash
      - file: test/features/booking/quick_add/account_extractor_test.dart
        name: the longest account name wins over its prefix
  - id: R-BKG-14
    group: Quick booking
    title: Guessed category saves directly
    text: |
      - your history first → category names → keyword tables
      - no "guess" marker
      - Save locked only while no category
    source: QUICK_BOOKING §3–§4
    tests:
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: a guessed category saves without being confirmed
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: save stays locked while no category was found
  - id: R-BKG-15
    group: Quick booking
    title: Hand-picked chips stay
    text: typing on never overwrites a chip you picked
    source: QUICK_BOOKING §4
    tests:
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: a re-parse never clobbers a confirmed field
  - id: R-BKG-16
    group: Quick booking
    title: "`#name` uses or creates a tag"
    text: |
      - any case/spaces, archived too
      - new → created on Save, shown *name (new)*
      - > 24 characters → Save blocked
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/tag_extractor_test.dart
        name: an archived tag still matches, so its name is never minted twice

  # Tags
  - id: R-BKG-20
    group: Tags
    title: Tags belong to the book
    text: |
      - ≤ 24 chars · unique · no `#` or `|`
      - rename · archive · merge · delete
      - tag page: totals, per category, by day
    source: tag_name.dart, TAGS_WEB §4
    tests:
      - file: test/features/tag/domain/tag_name_test.dart
        name: rejects a case-insensitive duplicate
      - file: test/features/tag/use_cases/merge_tags_use_case_test.dart
        name: rewrites a source assignment onto the target
  - id: R-BKG-21
    group: Tags
    title: "Trip mode: new bookings only"
    text: |
      - per book, 7 days default · tag pre-selected
      - **never** edits, recurring, imports
      - ends on last day, or tag archived/deleted
    source: TAGS_WEB trip mode, ActiveTagService
    tests:
      - file: test/features/tag/services/active_tag_service_test.dart
        name: is scoped per book
      - file: test/features/tag/services/active_tag_service_test.dart
        name: an archived or deleted tag is cleared on read
  - id: R-BKG-22
    group: Tags
    title: Transfers listed, never summed
    text: |
      - shown on tag pages, in no total
      - *Add bookings from dates*: no recurring, transfers, corrections
    source: tag_summary, tag_range_selection
    tests:
      - file: test/features/tag/view_models/tag_summary_test.dart
        name: transfers are listed but excluded from every money figure
      - file: test/features/tag/view_models/tag_range_selection_test.dart
        name: pre-selects one-off bookings, never recurring ones, transfers or the already tagged

  # Trash
  - id: R-BKG-30
    group: Trash
    title: Local trash, per device
    text: |
      - delete → *Undo* · Trash: 30 days, max 200
      - **not** a backup: per device, gone after reinstall
      - web has none
    source: TRASH §1, §5, §7
    tests:
      - file: test/features/trash/sweep_trash_use_case_test.dart
        name: sweeps with the retention window and the row cap from FeatureConstants
  - id: R-BKG-31
    group: Trash
    title: Restore = new booking
    text: |
      - new id, same content + tags
      - goal/loan links not restored
      - recurring comes back unlinked · rule won't redo that date
    source: TRASH §4
  - id: R-BKG-32
    group: Trash
    title: Bookings only
    text: not receipts, accounts, categories, rules, goals, loans, shopping
    source: TRASH §8

  # Search
  - id: R-BKG-40
    group: Search
    title: One search for everything
    text: |
      - Budget Book ⋮ → *Search* · web ⌘K
      - accounts · categories · goals · loans · bookings
      - 5 each + *Show all*
    source: 02_FEATURES, search tests
    tests:
      - file: test/features/search/ui/search_results_view_test.dart
        name: a record section caps at five and offers Show all
      - file: test/features/search/ui/widgets/search_results_view_navigation_test.dart
        name: a parent category opens its activity filtered by parent only

  # Web
  - id: R-BKG-50
    group: Web ledger
    title: Web filters live in the URL
    text: |
      - shareable, restored on return
      - type · account · category · tag · member · cost type
      - search: description, merchant, names, amounts, dates
    source: BOOKINGS_WEB §4.2, §4.4
  - id: R-BKG-51
    group: Web ledger
    title: "Web bulk edit: only what changes"
    text: |
      - shift-range or every match
      - tags · category · account · date · description · delete
      - category only for one side · transfers skipped
    source: BOOKINGS_WEB §4.6–§4.7
  - id: R-BKG-52
    group: Web ledger
    title: Deleted occurrence stays skipped
    text: date stays taken → rule never re-creates it
    source: BOOKINGS_WEB §4.8
