# Source: app QUICK_BOOKING, TRASH, FORMS, CATEGORY (money signs) context docs, 02_FEATURES;
# web BOOKINGS_WEB, BOOKING_ENTRY_WEB, TAGS_WEB.
items:
  # The booking form
  - id: R-BKG-01
    group: The booking form
    title: Three shapes
    text: |
      - expense · income → type = the category's type
      - transfer → no category · From + To
      - correction (balance check) → neither
    source: CATEGORY §money signs, RECONCILIATION
  - id: R-BKG-02
    group: The booking form
    title: Save at the bottom · back asks
    text: |
      - full-width *Save* · on once changed + valid
      - back with changes → *Discard / Keep editing*
      - barely started → just dropped · create = edit look
      - *×* with the keypad up → one tap: keypad closes and the form leaves · asks if changed · back only closes the keypad
      - iPhone: edge swipe on an unchanged form or any page → back · with changes the swipe does nothing, *×* asks (D-BKG-9)
      - a new booking or rule form opens without the last page's snackbar over its keypad
    source: CLAUDE.md, FORMS §1–§4, §7
    related: [D-BKG-9, E-BKG-27, E-BKG-29, R-BKG-54]
    tests:
      - file: test/shared/ui/form/form_save_scaffold_test.dart
        name: with an overlay open, × closes it and leaves an untouched form in the same tap
      - file: test/shared/ui/form/form_save_scaffold_test.dart
        name: with an overlay open, × on a dirty form closes it and asks
      - file: test/app/navigation/slide_route_swipe_back_test.dart
        name: on iOS a SlideRightRoute goes back on an edge swipe
      - file: test/app/navigation/slide_route_swipe_back_test.dart
        name: on iOS a page that blocks its pop keeps the edge swipe blocked
  - id: R-BKG-54
    group: The booking form
    title: "Keyboard: lists drop it, forms keep it"
    text: |
      - dragging a list (search, pickers, filters, tags, shopping list) closes the keyboard · scrolling a form doesn't
      - a picker sheet opened from a page leaves the keyboard down when it closes · a sheet over a sheet keeps it (quick booking types on after a chip)
      - names and descriptions start with a capital · merchant and counterparty capitalize each word
      - all platforms · found on iOS (IOS-5-4, IOS-6-3, IOS-6-4)
    source: FORMS §8f
    tests:
      - file: test/app/ui/app_scroll_behavior_test.dart
        name: dragging a result list closes the keyboard
      - file: test/app/ui/app_scroll_behavior_test.dart
        name: a form keeps its keyboard while it scrolls
      - file: test/app/navigation/sheet_focus_observer_test.dart
        name: closing a picker sheet over a page leaves the keyboard down
      - file: test/app/navigation/sheet_focus_observer_test.dart
        name: a sheet opened from a sheet hands focus back to the first sheet
  - id: R-BKG-03
    group: The booking form
    title: App's own keypad
    text: |
      - hero amount + calculator
      - **=** → category → maybe description
      - 2 skipped prompts in a row → stops asking · transfers never
      - long-press the amount → *Paste* · iPhone (iOS 16+): the system menu, no *Allow Paste* alert
    source: FORMS §7b, §8c, §9
    related: [E-BKG-28]
  - id: R-BKG-04
    group: The booking form
    title: From + To are one pair
    text: |
      - each picker shows the other's account with ⇅ → pick = swap
      - ⇅ button swaps
      - only an explicit From becomes the next default
    source: FORMS §8e
    tests:
      - file: test/features/booking/bloc/booking_save_bloc_test.dart
        name: picking the To account as From swaps the pair and remembers the new From
      - file: test/features/booking/bloc/booking_save_bloc_test.dart
        name: picking the From account as To swaps the pair without touching the last account
  - id: R-BKG-05
    group: The booking form
    title: Defaults + 20 characters
    text: |
      - new booking: last account, today
      - description cut to 20 · blank → none
    source: BOOKING_IMPORT §13, use cases
    tests:
      - file: test/features/booking/use_cases/use_cases_test.dart
        name: saves a booking, normalizing a blank description to null
  - id: R-BKG-06
    group: The booking form
    title: Creator kept on edit
    text: |
      - new → active book + signed-in person
      - editing another's booking keeps them as creator
    source: FAMILY_ACCOUNTS §5.5
    tests:
      - file: test/features/booking/use_cases/use_cases_test.dart
        name: attributes a NEW booking to the active workspace and current profile
  - id: R-BKG-07
    group: The booking form
    title: Signs by what the figure is
    text: |
      - one booking → + / −
      - labelled total → none · net or change → signed · zero bare
      - expenses **never** tinted · transfer: no sign, own color
    source: CLAUDE.md, CATEGORY_AI_CONTEXT
    related: [R-LED-30]

  # Quick booking
  - id: R-BKG-10
    group: Quick booking
    title: One line → live chips
    text: |
      - long-press centre **+** · web: long press +, sidebar, ⌘K, key **Q**
      - `kebap 5,90 gestern #trip cash` → amount · category · account · date · tags
      - tap + → full form
    source: QUICK_BOOKING §1–§2, BOOKING_ENTRY_WEB §4.16
  - id: R-BKG-11
    group: Quick booking
    title: "Amounts: last separator decides"
    text: |
      - `1.234,56` = `1,234.56`
      - one separator + 3 digits → thousands (`1.500` = 1500)
      - digits in a word (`7up`) never an amount
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/quick_booking_parser_test.dart
        name: the last separator decides the decimals
      - file: test/features/booking/quick_add/quick_booking_parser_test.dart
        name: three trailing digits are a thousands group
      - file: test/features/booking/quick_add/quick_booking_parser_test.dart
        name: digits welded into a word are not an amount
  - id: R-BKG-12
    group: Quick booking
    title: Dates in EN, DE, JA
    text: |
      - `gestern` · `vor 2 tagen` · `last friday` · `先週の金曜日` · `3.7.`
      - longest phrase wins · weekday → last 1–7 days
      - not: month names, slash/ISO dates, bare day
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/date_extractor_test.dart
        name: a longer keyword wins over the one nested inside it
      - file: test/features/booking/quick_add/date_extractor_test.dart
        name: the week boundary follows the start-of-week setting
  - id: R-BKG-13
    group: Quick booking
    title: Accounts by exact name
    text: whole word, any case, longest first · hidden never · else last account
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/account_extractor_test.dart
        name: only whole words match — cashback is not Cash
      - file: test/features/booking/quick_add/account_extractor_test.dart
        name: the longest account name wins over its prefix
  - id: R-BKG-14
    group: Quick booking
    title: Guessed category saves directly
    text: |
      - your history first → category names → keyword tables
      - keyword tables know everyday en + ja words (`milk`, `bus ticket`, `gas`, `starbucks`, `パン`, `電車`) · only words with one obvious category
      - a ticket, bus, train, taxi → *Public Transit*, never *Fuel* · no transit category → no guess
      - a store for everything → **no** guess from its name · Amazon, Galaxus, eBay, AliExpress, Temu
      - a chain counts as a whole word · *Sparen* ≠ SPAR
      - never a parent with subs · not even from an old booking on one
      - no "guess" marker
      - Save locked only while no category
      - Return on an incomplete prompt: keyboard stays · only the category missing → category picker · else the empty chips turn red and shake
    source: QUICK_BOOKING §3–§4
    tests:
      - file: test/shared/categorization/category_suggestion_engine_test.dart
        name: a booking left on a parent that has since got subs is not suggested
      - file: test/shared/categorization/everyday_words_test.dart
        name: a ticket without a transit leaf is no guess, never Fuel
      - file: test/shared/categorization/category_suggestion_engine_test.dart
        name: a store that sells everything is not guessed
      - file: test/shared/categorization/category_suggestion_engine_test.dart
        name: a chain name inside another word is not that chain
      - file: test/features/quick_add/ui/sheets/quick_booking_submit_test.dart
        name: a prompt missing only its category opens the category picker
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: a guessed category saves without being confirmed
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: save stays locked while no category was found
  - id: R-BKG-15
    group: Quick booking
    title: Hand-picked chips stay
    text: typing on never overwrites a chip you picked
    source: QUICK_BOOKING §4
    tests:
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: a re-parse never clobbers a confirmed field
  - id: R-BKG-16
    group: Quick booking
    title: "`#name` uses or creates a tag"
    text: |
      - any case/spaces, archived too
      - new → created on Save, shown *name (new)*
      - > 24 characters → Save blocked
    source: QUICK_BOOKING §3
    tests:
      - file: test/features/booking/quick_add/tag_extractor_test.dart
        name: an archived tag still matches, so its name is never minted twice

  # Tags
  - id: R-BKG-20
    group: Tags
    title: Tags belong to the book
    text: |
      - ≤ 24 chars · unique · no `#` or `|`
      - rename · archive · merge · delete
      - tag page: totals, per category, by day
    source: tag_name.dart, TAGS_WEB §4
    tests:
      - file: test/features/tag/domain/tag_name_test.dart
        name: rejects a case-insensitive duplicate
      - file: test/features/tag/use_cases/merge_tags_use_case_test.dart
        name: rewrites a source assignment onto the target
  - id: R-BKG-21
    group: Tags
    title: "Trip mode: new bookings only"
    text: |
      - per book, 7 days default · tag pre-selected
      - **never** edits, recurring, imports
      - ends on last day, or tag archived/deleted
    source: TAGS_WEB trip mode, ActiveTagService
    tests:
      - file: test/features/tag/services/active_tag_service_test.dart
        name: is scoped per book
      - file: test/features/tag/services/active_tag_service_test.dart
        name: an archived or deleted tag is cleared on read
  - id: R-BKG-22
    group: Tags
    title: Transfers listed, never summed
    text: |
      - shown on tag pages, in no total
      - *Add bookings from dates*: no recurring, transfers, corrections
    source: tag_summary, tag_range_selection
    tests:
      - file: test/features/tag/view_models/tag_summary_test.dart
        name: transfers are listed but excluded from every money figure
      - file: test/features/tag/view_models/tag_range_selection_test.dart
        name: pre-selects one-off bookings, never recurring ones, transfers or the already tagged

  # Trash
  - id: R-BKG-30
    group: Trash
    title: Local trash, per device
    text: |
      - delete → *Undo* · Trash: 30 days, max 200
      - **not** a backup: per device, gone after reinstall
      - web has none
    source: TRASH §1, §5, §7
    tests:
      - file: test/features/trash/sweep_trash_use_case_test.dart
        name: sweeps with the retention window and the row cap from FeatureConstants
  - id: R-BKG-31
    group: Trash
    title: Restore = new booking
    text: |
      - new id, same content + tags
      - goal/loan links not restored
      - recurring comes back unlinked · rule won't redo that date
    source: TRASH §4
  - id: R-BKG-32
    group: Trash
    title: Bookings and positions only
    text: |
      - bookings · investment positions with their transactions (since 2026-11-09, R-INV-42)
      - not receipts, accounts, categories, rules, goals, loans, shopping
    source: TRASH §4a, §8
    related: [R-INV-42]

  # Search
  - id: R-BKG-40
    group: Search
    title: One search for everything
    text: |
      - Budget Book ⋮ → *Search* · web ⌘K
      - accounts · categories · goals · loans · bookings
      - 5 each + *Show all*
    source: 02_FEATURES, search tests
    tests:
      - file: test/features/search/ui/search_results_view_test.dart
        name: a record section caps at five and offers Show all
      - file: test/features/search/ui/widgets/search_results_view_navigation_test.dart
        name: a parent category opens its activity filtered by parent only

  # Web
  - id: R-BKG-50
    group: Web ledger
    title: Web filters live in the URL
    text: |
      - shareable, restored on return
      - type · account (both ends of a transfer) · category · tag · member · cost type
      - search: description or merchant, as the app (since 2026-10-28)
    source: BOOKINGS_WEB §4.2, §4.4
    tests:
      - file: src/app/(main)/bookings/services/bookings.service.test.ts
        repo: web
        name: ORs the description and the receipt merchant, and looks up nothing else
  - id: R-BKG-51
    group: Web ledger
    title: "Web bulk edit: only what changes"
    text: |
      - shift-range or every match
      - phone: no checkboxes · long press a row → selecting · then a tap ticks, not opens
      - tags · category · account · date · description · delete
      - category only for one side · transfers skipped
    source: BOOKINGS_WEB §4.6–§4.7
    tests:
      - file: src/app/(main)/bookings/components/bookings-table.test.tsx
        repo: web
        name: starts selecting on a long touch, and the click that ends it opens nothing
      - file: src/app/(main)/bookings/components/bookings-table.test.tsx
        repo: web
        name: ticks a row on a tap while something is selected, instead of opening it
  - id: R-BKG-52
    group: Web ledger
    title: Deleted occurrence stays skipped
    text: date stays taken → rule never re-creates it
    source: BOOKINGS_WEB §4.8
  - id: R-BKG-53
    group: Web ledger
    title: Corrections + opening balances listed, never counted
    text: |
      - *Balance correction* → opens its balance check · *Initial balance* → opens the account
      - not income, not expense · no checkbox, no menu · *Select all N* counts bookings only
      - calendar: opening balance on its day, not summed · corrections left out, as the app
      - CSV: both rows, as the app's file · signed amounts add up to the balances
    source: BOOKINGS_WEB §4.1 (decided 2026-10-28, D-BKG-6)
    tests:
      - file: src/app/(main)/bookings/page.test.tsx
        repo: web
        name: asks for corrections and lists each opening balance where the order puts it, counted in the total
      - file: src/app/(main)/bookings/page.test.tsx
        repo: web
        name: offers to select only the bookings among what matches
      - file: src/app/(main)/bookings/page.test.tsx
        repo: web
        name: lists an opening balance on its calendar day without counting it
      - file: src/app/(main)/bookings/lib/export-csv.test.ts
        repo: web
        name: "writes an opening balance as the app's opening_balance row: signed by itself, no category, no id"
      - file: e2e/bookings.spec.ts
        repo: web
        name: lists a balance correction and an opening balance, each opening what it belongs to
  - id: R-BKG-55
    group: Split
    title: One purchase, several categories
    text: |
      - booking form → *Split across categories*, its own button under the form (below *Add receipt*) · not on a transfer · gone while split
      - also the last row of the category picker, only when the picker is opened from the booking form · part one's sheet opens at once · not in recurring, budget, filter, quick add, import or scanner pickers
      - each part: category, amount, own description (else the purchase's)
      - date, account, receipt, tags = the purchase's, on every part
      - the amount on top stays the total · *Save* only when the parts match it exactly · line under the parts: *left to assign* / *over the total* / *Parts match the total*
      - changing the total never rescales parts
      - Free
    source: BOOKING_SPLIT §1, §4
    related: [J-BKG-31, E-BKG-71, D-BKG-37]
    tests:
      - file: test/features/booking/ui/modal/category_picker_modal_test.dart
        name: is not offered unless the caller asks for it
      - file: test/features/booking/domain/booking_draft_split_test.dart
        name: "three thirds and a cent validate: the sum is Decimal, never double"
      - file: test/features/booking/domain/booking_draft_split_test.dart
        name: a remainder, an overshoot, a missing category and a zero part are all invalid
      - file: test/features/booking/domain/booking_draft_split_test.dart
        name: raising the total reopens the remainder instead of scaling parts
  - id: R-BKG-56
    group: Split
    title: Parts are ordinary bookings
    text: |
      - every part counts in its own category: summary, budgets, analytics, calendar · no total changes
      - counts count parts (*n transactions*), as scanned receipts always did
      - ledger: the parts of one purchase sit under one header (description · *n parts* · total) · a filter that leaves one part shows it as a plain row with a split mark
      - opening any part opens the whole purchase
      - *Make recurring* not offered on a split · rules stay single-category
    source: BOOKING_SPLIT §1, §6
    related: [R-BKG-55]
    tests:
      - file: test/shared/ui/budget_book/split_group_entry_test.dart
        name: parts of one group collapse into one entry where the first part stood
      - file: test/shared/ui/budget_book/split_group_entry_test.dart
        name: "a filter that leaves one part shows it as a plain row: no sibling is fetched"
      - file: test/features/booking/bloc/booking_save_bloc_test.dart
        name: opening one part loads the whole group, clean
  - id: R-BKG-57
    group: Split
    title: Editing, merging, deleting a split
    text: |
      - splitting an existing booking keeps it as part one → its goal or loan link, its rule and its history stay
      - only that part belongs to the recurring rule · new parts never do
      - a part's sheet: bin icon removes it · down to one part = one booking again
      - merge icon → *Merge into one booking*: one booking with the total
      - *Delete* → *Delete split booking?* → every part to the trash · *Undo* brings all back
      - round-up: once per purchase, on the total
    source: BOOKING_SPLIT §3, §4
    related: [E-BKG-72, D-BKG-38]
    tests:
      - file: test/features/booking/use_cases/split_booking_use_case_test.dart
        name: "splitting a generated booking: the first part keeps id, recurring pair and receipt; the new part carries no pair"
      - file: test/features/booking/use_cases/split_booking_use_case_test.dart
        name: a group edit saves only the changed part, adds the new one and deletes the removed one
      - file: test/features/booking/use_cases/split_booking_use_case_test.dart
        name: un-split keeps the chosen row with the total, clears the group and deletes the rest
      - file: test/features/booking/bloc/booking_save_bloc_test.dart
        name: deleting removes every part and hands them all to the undo
      - file: test/features/budget_goals/use_cases/apply_round_up_use_case_test.dart
        name: a purchase booked as several rows rounds up once, on its total, linked to the first row
