items:
  - id: J-BKG-01
    group: Entering
    title: Books an expense
    from: tap the centre **+**
    steps:
      - amount → **=**
      - category · favorites first
      - description, if learned
      - "*Save*"
    result: booking · last account, today
    checks: [C-BKG-001]
  - id: J-BKG-02
    group: Entering
    title: Books a transfer
    from: the booking form → *Transfer*
    steps:
      - amount → *Transfer* → keypad closes · or *Transfer* first → keypad stays up for the amount
      - From + To · or ⇅
      - "*Save*"
    result: transfer · not income or expense
    tests:
      - file: test/features/booking/ui/pages/booking_save_page_test.dart
        name: tapping Transfer after an amount closes the keypad onto From and To
    checks: [C-BKG-002, C-BKG-048]
  - id: J-BKG-03
    group: Entering
    title: Quick booking
    from: hold the centre **+** → *Quick entry*
    steps:
      - "type `kebap 5,90 gestern #trip cash`"
      - check chips · tap to fix
      - "*Save*"
    result: booking · sheet closes + confirmation
    tests:
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: init seeds the last-used account
    checks: [C-BKG-010, C-BKG-011]
  - id: J-BKG-10
    group: Fixing
    title: Deletes and undoes
    from: a booking's edit page
    steps:
      - "⋮ → *Delete* → *Delete booking?* · *The booking moves to the trash for 30 days* → *Delete*"
      - "*Undo* · or later Trash → restore"
    result: booking back as a new row
    tests:
      - file: test/features/trash/get_trash_entries_use_case_test.dart
        name: pairs each mapped booking with its own deletion stamp
    checks: [C-BKG-020]
  - id: J-BKG-11
    group: Fixing
    title: Bulk-edits on the web
    from: '`/bookings`'
    steps:
      - tick rows or *select all N matching*
      - "*Add tags* / *Edit* / *Delete*"
    result: only touched fields change
    checks: [C-BKG-030]
  - id: J-BKG-12
    group: Fixing
    title: Bulk-edits in the app
    from: "*Budget Book* › *Transactions* · or *Search*"
    steps:
      - hold a row · drag or tap more · or a day's header
      - "*Tags* / *Category* / *Date* / *More* / *Delete*"
      - pick → "*Save N bookings*"
    result: only rows that change are written · *Undo* in the snackbar
    checks: [C-BKG-058]
  - id: J-BKG-20
    group: Tags
    title: Tracks a trip
    from: a tag page
    steps:
      - start trip mode
      - book as usual · tag pre-selected
      - "*Add bookings from dates*"
    result: trip totals by category + day
    tests:
      - file: test/features/tag/services/active_tag_service_test.dart
        name: start makes the tag active for the current book
    checks: [C-BKG-012]
  - id: J-BKG-30
    group: Search
    title: Searches
    from: Budget Book ⋮ → *Search* (web ⌘K)
    steps:
      - type
      - tap a result or *Show all*
    result: the account, category, goal, loan or booking
    tests:
      - file: test/features/search/ui/pages/search_page_test.dart
        name: typing searches once, after the debounce
    checks: [C-BKG-040]
  - id: J-BKG-31
    group: Entering
    title: Splits a purchase
    from: the booking form (new or existing)
    steps:
      - amount = the total · pick the first category
      - "*Split across categories* (own button under the form) → part one holds the total"
      - "or: category picker → last row *Split across categories* → part one's sheet opens with the total"
      - "tap part one → lower its amount → *Apply*"
      - "*Add part* → sheet opens with the rest filled in → category → *Apply*"
      - "*Parts match the total* → *Save*"
    result: one booking per part · one group in the ledger
    tests:
      - file: test/features/booking/ui/pages/booking_save_page_test.dart
        name: Split in the action bar swaps the category row for the parts; one part is not saveable, merge puts the row back
      - file: test/features/booking/ui/pages/booking_save_page_test.dart
        name: Split in the category picker after Done starts the split and opens part one, whose pick lands on the draft
      - file: test/features/booking/use_cases/split_booking_use_case_test.dart
        name: a new split writes one booking per part under one group id and rounds up once
    checks: [C-BKG-052, C-BKG-053, C-BKG-057]
  - id: J-BKG-32
    group: Entering
    title: Splits by the receipt's items
    from: a booking with an attached receipt that has line items
    steps:
      - "*Split by receipt items* under the receipt"
      - one part per category of the items, amounts summed
      - items without a category → their amount shows as *left to assign*
      - fix the parts → *Save*
    result: the receipt's booking spread over its categories
    checks: [C-BKG-054]
