items:
  - id: D-BKG-1
    question: Quick booking on tap, not long press?
    status: decided
    answer: Not yet · guess is weakest for new users · one-line change later
  - id: D-BKG-2
    question: Mark a guessed category?
    status: decided
    answer: No · a confirm tap on every entry costs more than a rare miss
  - id: D-BKG-3
    question: Trash for rules, goals, loans · server trash?
    status: dropped
    date: 2026-09-09
    answer: Dropped · regret happens within minutes, on that device
  - id: D-BKG-4
    question: Restored occurrence keeps its rule link?
    status: decided
    date: 2026-10-08
    answer: No · plain booking · server key would refuse it
  - id: D-BKG-5
    question: Description prompt on a transfer
    status: decided
    date: 2026-10-06
    answer: Never · **=** opens the missing From/To instead
  - id: D-BKG-6
    question: Balance corrections and opening balances in the ledger — and as income?
    status: decided
    date: 2026-10-28
    answer: Listed in the Budget Book and the web ledger · never income or expense · the app still counts an opening balance as income (E-BB-10)
    related: [R-BKG-53, E-BB-10]
  - id: D-BKG-7
    question: Ledger search on the web — wider than the app's?
    status: decided
    date: 2026-10-28
    answer: No · description or merchant, as the app · names, amounts, dates have their own filters
    related: [R-BB-06, R-BKG-50]
  - id: D-BKG-8
    question: Account filter — both ends of a transfer?
    status: decided
    date: 2026-10-28
    answer: Yes · both balances move · the web already does · the app's source-only filter is to change (E-BB-11)
    related: [R-BKG-50, E-BB-11]
  - id: D-BKG-9
    question: iOS edge swipe on a form with unsaved changes?
    status: decided
    date: 2026-11-02
    answer: |
      - blocked while the form has changes · the *×* asks *Discard / Keep editing*
      - a clean form swipes back like any page
      - source: iOS simulator round, IOS-2-1
