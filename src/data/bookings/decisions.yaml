items:
  - id: D-BKG-1
    question: Quick booking on tap, not long press?
    status: decided
    answer: Not yet · guess is weakest for new users · one-line change later
  - id: D-BKG-2
    question: Mark a guessed category?
    status: decided
    answer: No · a confirm tap on every entry costs more than a rare miss
  - id: D-BKG-3
    question: Trash for rules, goals, loans · server trash?
    status: dropped
    date: 2026-09-09
    answer: Dropped · regret happens within minutes, on that device
  - id: D-BKG-4
    question: Restored occurrence keeps its rule link?
    status: decided
    date: 2026-10-08
    answer: No · plain booking · server key would refuse it
  - id: D-BKG-5
    question: Description prompt on a transfer
    status: decided
    date: 2026-10-06
    answer: Never · **=** opens the missing From/To instead
  - id: D-BKG-6
    question: Balance corrections and opening balances in the ledger — and as income?
    status: decided
    date: 2026-10-28
    answer: Listed in the Budget Book and the web ledger · never income or expense · the app still counts an opening balance as income (E-BB-10)
    related: [R-BKG-53, E-BB-10]
  - id: D-BKG-7
    question: Ledger search on the web — wider than the app's?
    status: decided
    date: 2026-10-28
    answer: No · description or merchant, as the app · names, amounts, dates have their own filters
    related: [R-BB-06, R-BKG-50]
  - id: D-BKG-8
    question: Account filter — both ends of a transfer?
    status: decided
    date: 2026-10-28
    answer: Yes · both balances move · the web already does · the app's source-only filter is to change (E-BB-11)
    related: [R-BKG-50, E-BB-11]
  - id: D-BKG-9
    question: iOS edge swipe on a form with unsaved changes?
    status: decided
    date: 2026-11-02
    answer: |
      - blocked while the form has changes · the *×* asks *Discard / Keep editing*
      - a clean form swipes back like any page
      - built 2026-11-03 · *swipe → Discard / Keep editing* is Android back only
      - source: iOS simulator round, IOS-2-1
    related: [R-BKG-02, E-BKG-29]
  - id: D-BKG-10
    question: Auto-capture · Free or Pro?
    status: decided
    date: 2026-11-10
    answer: |
      - **Pro** · first payment appearing alone = the paywall moment
      - after a lapse: review stays readable · new captures stop
      - plan: `plan_later/AUTO_CAPTURE_PLAN.md` §9
  - id: D-BKG-11
    question: Auto-capture · which banks in v1?
    status: decided
    date: 2026-11-10
    answer: |
      - phase 0 samples all parse → **supported**
      - samples = payment + refund + declined + 3DS prompt
      - other apps → generic parser · labelled as such
  - id: D-BKG-12
    question: Auto-capture · ever book without a tap?
    status: decided
    date: 2026-11-10
    answer: |
      - **never** in v1 · like the forecast review
      - later maybe: opt-in per merchant after 5 unchanged confirms
  - id: D-BKG-13
    question: Auto-capture · keep the notification text?
    status: decided
    date: 2026-11-10
    answer: |
      - **no** · parsed fields + parser name only
  - id: D-BKG-14
    question: Auto-capture · which book gets a draft?
    status: decided
    date: 2026-11-10
    answer: |
      - the book **active at capture** · changeable in the review
      - bank → account mapping per book
  - id: D-BKG-15
    question: Auto-capture · foreign-currency Wallet taps?
    status: decided
    date: 2026-11-10
    answer: |
      - **book currency** · the iPhone trigger sends none reliably
      - foreign cards wait for multi-currency
  - id: D-BKG-16
    question: Auto-capture · a scan matches a waiting draft?
    status: decided
    date: 2026-11-10
    answer: |
      - same day + same amount → the scan's save sheet **asks**
      - *replace the draft* preselected
  - id: D-BKG-17
    question: Auto-capture · a refund notification?
    status: decided
    date: 2026-11-10
    answer: |
      - **income draft** · category from that merchant's income bookings
      - none found → user must pick one before *Book*
  - id: D-BKG-18
    question: Auto-capture · where do waiting drafts show?
    status: decided
    date: 2026-11-10
    answer: |
      - **Home system card** · only while drafts wait · not in the editor
      - + a row in the inbox
  - id: D-BKG-19
    question: Auto-capture · which apps can be picked?
    status: decided
    date: 2026-11-10
    answer: |
      - **curated bank list** only · grown per release
      - missing bank → request via feedback
  - id: D-BKG-20
    question: Auto-capture · waiting drafts after a Pro lapse?
    status: decided
    date: 2026-11-10
    answer: |
      - still **bookable** or dismissable · only new captures stop
  - id: D-BKG-21
    question: Auto-capture · only one platform passes phase 0?
    status: decided
    date: 2026-11-10
    answer: |
      - **ship the passing one** · the other waits for a re-test
  - id: D-BKG-22
    question: Multi-currency · what ships, in phases?
    status: decided
    date: 2026-11-10
    answer: |
      - **everything in one release** · no phases
      - foreign bookings · foreign recurring rules · foreign-currency accounts · cross-currency transfers
  - id: D-BKG-23
    question: Multi-currency · when?
    status: decided
    date: 2026-11-10
    answer: |
      - **December** · contract tracker + subscription check-up move to January
  - id: D-BKG-24
    question: Multi-currency · what does a Free user see?
    status: decided
    date: 2026-11-10
    answer: |
      - **Pro** · currency chip visible to everyone · Free tap → paywall
      - existing foreign rows always shown in full · their amounts stay editable
  - id: D-BKG-25
    question: Multi-currency · how is a foreign amount entered?
    status: decided
    date: 2026-11-10
    answer: |
      - **foreign amount + book amount, linked** · either editable
      - book amount typed from the bank statement → rate derived
  - id: D-BKG-26
    question: Multi-currency · which rate prefills?
    status: decided
    date: 2026-11-10
    answer: |
      - **latest feed rate** (ECB, 29 currencies) · else last rate used for that currency in the book
      - nothing → empty · Save disabled · never 1:1
  - id: D-BKG-27
    question: Multi-currency · default currency on a trip?
    status: decided
    date: 2026-11-10
    answer: |
      - **trip carries an optional currency** · form, quick add, scanner start in it until the trip ends
  - id: D-BKG-28
    question: Multi-currency · change the book currency while foreign rows exist?
    status: decided
    date: 2026-11-10
    answer: |
      - **blocked** · tile explains why
  - id: D-BKG-29
    question: Multi-currency · web in the same release?
    status: decided
    date: 2026-11-10
    answer: |
      - **web shows, app enters** · originals + native balances visible
      - foreign amount and currency read-only on the web
  - id: D-BKG-30
    question: Multi-currency · rate of a recurring occurrence?
    status: decided
    date: 2026-11-10
    answer: |
      - **rate of its day** (latest when created) · else last used · else the rule's own rate
  - id: D-BKG-31
    question: Multi-currency · CSV?
    status: decided
    date: 2026-11-10
    answer: |
      - export **appends** original_amount · original_currency · fx_rate
      - Money Koi import reads them back · other files: face value + warning, as today
  - id: D-BKG-32
    question: Multi-currency · quick add?
    status: decided
    date: 2026-11-10
    answer: |
      - **ISO codes + trip default** · `czk 250` · symbols ($, ¥) stay book currency
  - id: D-BKG-33
    question: Multi-currency · third currency on a foreign account (HUF with the CZK card)?
    status: decided
    date: 2026-11-10
    answer: |
      - **refused** · every booking on a foreign account is in that account's currency
  - id: D-BKG-34
    question: Multi-currency · transfer between two currencies?
    status: decided
    date: 2026-11-10
    answer: |
      - **two amounts** · sent + received at the bank's rate · nets to zero book-wide
  - id: D-BKG-35
    question: Multi-currency · balance timeline and net-worth chart with a foreign account?
    status: decided
    date: 2026-11-10
    answer: |
      - **today's rate for the whole line** · chart note says so
  - id: D-BKG-36
    question: Multi-currency · a foreign account's balance on the server and the web?
    status: decided
    date: 2026-11-10
    answer: |
      - **new native balance columns** · current_balance keeps its meaning (booked value in the book currency)
