  - id: D-BKG-37
    question: Split · parts typed with a remainder line, or part one always takes the rest?
    status: open
    answer: |
      - built: every part is typed · a line shows what is left or over · *Save* only on an exact match (the plan's §3.2)
      - the bank import does it the other way since 2026-11-11: part one is always the rest, never typed
      - the remainder line was kept because *Split by receipt items* must show a discount instead of hiding it in part one
      - to decide: leave both, or move one to the other's way
    related: [R-BKG-55]
  - id: D-BKG-38
    question: Split · the plan's open points, built as recommended. Keep?
    status: open
    answer: |
      - **Free** (catalog) · no lock
      - **round-up once per purchase**, on the total · this also changed scanned receipts: before, one round-up per line
      - **new itemized scans group in the ledger** under one header · old scans stay as they are · split bank rows group too
      - **delete on a split deletes every part** · one part is removed in its sheet
      - a recurring booking that is split: the original row stays the rule's occurrence
      - rules that split, a split in quick booking, purchase-level "biggest expense": not built
      - German: *aufteilen* / *Teil* (as the bank import), not *Splitbuchung*
    related: [R-BKG-57, R-SCN-07, R-BUD-41]
  - id: D-BKG-39
    question: Split · where does a purchase description go when every part has its own?
    status: open
    answer: |
      - today: the purchase description lives only on parts without their own · no purchase row · an edit no part reads is not stored (E-BKG-77)
      - scans: the header shows the receipt's shop, so a scan reads right without one
      - a) leave it · rename the shop in the receipt section
      - b) a scan stores the shop on every part not renamed on the review page · item names stay on the receipt only, not on the bookings · no lookup needed
      - c) a stored purchase description on every part (new column, app + server migration, web)
    related: [E-BKG-76, E-BKG-77, R-BKG-56]
  - id: D-BKG-40
    question: Bulk edit in the app · amount, mixed sides, splits, after a save, where, plan, drag?
    status: decided
    date: 2026-11-17
    answer: |
      - amount: not offered
      - category on income + expenses: greyed, the tap says why (web parity)
      - category on split bookings: skipped and counted
      - after a save: selecting ends
      - where: *Budget Book* › *Transactions* + *Search*
      - plan: Free
      - drag-to-select: in the first build
    related: [R-BKG-58, R-BKG-59]
  - id: D-BKG-41
    question: How does a refund count?
    status: decided
    date: 2026-11-18
    answer: |
      - **decided 2026-11-18: money back in the original expense category, lowering its spend** · budgets, savings rate and analytics show net spend · as YNAB, Monarch, Copilot
      - not built · T-BKG-07 checks first how negative expenses behave today, then a plan
      - today, probably: a booking's direction comes from its category, so a refund goes into the income category *Refunds* (`en.json` key `retour`)
      - a returned €80 jacket then raises income instead of lowering clothing spend · skews budgets, savings rate and analytics
      - YNAB, Monarch and Copilot subtract a refund from the original category
      - not checked: whether a negative expense is blocked · T-BKG-07 checks first, before any plan
      - options: keep income *Refunds* · or money back in the original expense category, lowering its spend
    related: [T-BKG-07]
