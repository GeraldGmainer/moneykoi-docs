  - id: D-BKG-26
    question: Multi-currency · which rate prefills?
    status: decided
    date: 2026-11-10
    answer: |
      - **latest feed rate** (ECB, 29 currencies) · else last rate used for that currency in the book
      - nothing → empty · Save disabled · never 1:1
  - id: D-BKG-27
    question: Multi-currency · default currency on a trip?
    status: decided
    date: 2026-11-10
    answer: |
