      - built 2026-11-11 on branch `multi-currency` · app + server migration (parked, T-BKG-01) · web open (T-BKG-02)
  - id: D-BKG-23
    question: Multi-currency · when?
    status: decided
    date: 2026-11-10
    answer: |
