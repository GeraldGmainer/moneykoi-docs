items:
  - id: D-BKG-1
    question: Quick booking on tap, not long press?
    status: decided
    answer: Not yet · guess is weakest for new users · one-line change later
  - id: D-BKG-2
    question: Mark a guessed category?
    status: decided
    answer: No · a confirm tap on every entry costs more than a rare miss
  - id: D-BKG-3
    question: Trash for rules, goals, loans · server trash?
    status: dropped
    date: 2026-09-09
    answer: Dropped · regret happens within minutes, on that device
  - id: D-BKG-4
    question: Restored occurrence keeps its rule link?
    status: decided
    date: 2026-10-08
    answer: No · plain booking · server key would refuse it
  - id: D-BKG-5
    question: Description prompt on a transfer
    status: decided
    date: 2026-10-06
    answer: Never · **=** opens the missing From/To instead
  - id: D-BKG-6
    question: Balance corrections and opening balances in the ledger — and as income?
    status: decided
    date: 2026-10-28
    answer: Listed in the Budget Book and the web ledger · never income or expense · the app still counts an opening balance as income (E-BB-10)
    related: [R-BKG-53, E-BB-10]
  - id: D-BKG-7
    question: Ledger search on the web — wider than the app's?
    status: decided
    date: 2026-10-28
    answer: No · description or merchant, as the app · names, amounts, dates have their own filters
    related: [R-BB-06, R-BKG-50]
  - id: D-BKG-8
    question: Account filter — both ends of a transfer?
    status: decided
    date: 2026-10-28
    answer: Yes · both balances move · the web already does · the app's source-only filter is to change (E-BB-11)
    related: [R-BKG-50, E-BB-11]
  - id: D-BKG-9
    question: iOS edge swipe on a form with unsaved changes?
    status: decided
    date: 2026-11-02
    answer: |
      - blocked while the form has changes · the *×* asks *Discard / Keep editing*
      - a clean form swipes back like any page
      - built 2026-11-03 · *swipe → Discard / Keep editing* is Android back only
      - source: iOS simulator round, IOS-2-1
    related: [R-BKG-02, E-BKG-29]
  - id: D-BKG-10
    question: Auto-capture · Free or Pro?
    status: open
    answer: |
      - recommended: **Pro** · first payment appearing alone = the paywall moment
      - after a lapse: review stays readable · new captures stop
      - plan: `plan_later/AUTO_CAPTURE_PLAN.md` §9 D1
  - id: D-BKG-11
    question: Auto-capture · which banks in v1?
    status: open
    answer: |
      - decided by phase 0 samples on Gerald's phones
      - payment + refund + declined + 3DS all parse → supported
      - the rest → generic parser · labelled as such
  - id: D-BKG-12
    question: Auto-capture · ever book without a tap?
    status: open
    answer: |
      - recommended: **never** in v1 · like the forecast review
      - later maybe: opt-in per merchant after 5 unchanged confirms
  - id: D-BKG-13
    question: Auto-capture · keep the notification text?
    status: open
    answer: |
      - recommended: **no** · keep parsed fields + parser name only
      - the text is the most sensitive thing the feature touches
  - id: D-BKG-14
    question: Auto-capture · which book gets a draft?
    status: open
    answer: |
      - recommended: the book active at capture · changeable in the review
      - bank → account mapping per book
  - id: D-BKG-15
    question: Auto-capture · foreign-currency Wallet taps?
    status: open
    answer: |
      - the iPhone trigger sends no reliable currency
      - recommended: book currency · foreign cards wait for multi-currency
  - id: D-BKG-16
    question: Auto-capture · a scan matches a waiting draft?
    status: open
    answer: |
      - same day, same amount → the scan's save sheet asks
      - recommended: ask · default *replace the draft*
