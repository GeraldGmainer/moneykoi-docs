items:
  - id: E-BKG-01
    group: Quick booking
    title: "`vor 2 tagen` + an amount"
    when: "`apfel 2,5 vor 2 tagen`"
    then: date takes its own `2` → 2.50, two days ago
    risk: medium
  - id: E-BKG-02
    group: Quick booking
    title: 3-decimal currency
    when: KWD/BHD book types `1,500`
    then: read as 1500 · all shipped currencies have ≤ 2 decimals
    status: by-design
    risk: low
  - id: E-BKG-03
    group: Quick booking
    title: Only an amount
    when: prompt is just `5,90`
    then: description = category name
    risk: low
  - id: E-BKG-04
    group: Quick booking
    title: Opened from the widget
    when: quick booking widget opens the sheet
    then: keyboard requested again with a bounded retry
    risk: medium
  - id: E-BKG-05
    group: Quick booking
    title: Upper-case umlauts in history
    when: booked `DÖNER`, now typing `döner`
    then: normalized history lookup finds it
    risk: low
  - id: E-BKG-10
    group: Trash
    title: Restore, category deleted
    when: trashed booking's category is gone
    then: entry leaves the trash
    status: by-design
    risk: low
  - id: E-BKG-11
    group: Trash
    title: Trash never blocks category delete
    when: all a category's bookings are in trash
    then: category deletable · trash doesn't count as use
    risk: low
  - id: E-BKG-12
    group: Trash
    title: Restored occurrence today or later
    when: recurring occurrence restored, unlinked
    then: forecast also projects the rule → counted twice · accepted
    status: known-issue
    risk: low
  - id: E-BKG-13
    group: Trash
    title: Deleting an imported year
    when: thousands deleted at once
    then: trash keeps max 200 per type
    status: by-design
    risk: low
  - id: E-BKG-20
    group: Web
    title: Web double submit
    when: double-click Save, ⌘↵ or Enter again on `/add` or `/add-receipt` while saving
    then: books once · Save greyed until the insert answers (fixed 2026-10-24)
    status: fixed
    risk: high
    tests:
      - file: src/app/(main)/add/page.test.tsx
        repo: web
        name: saves one booking when the save button is clicked again while the first save is in flight
      - file: src/app/(main)/add-receipt/page.test.tsx
        repo: web
        name: books the receipt once when save is clicked again while the first save is in flight
  - id: E-BKG-21
    group: Web
    title: Web grouped amounts
    when: "`1,250.00` / `1.250,00` pasted · German `1.500`"
    then: rejected, or saved as 1.5 · open (review 15b)
    status: known-issue
    risk: high
  - id: E-BKG-22
    group: Web
    title: Web 0/3-decimal currencies
    when: JPY/KWD book edits a booking or splits a receipt
    then: |
      - 2-decimal calculator rewrites KWD amounts
      - receipt tolerance + labels wrong (reviews 13, 16, 22)
    status: known-issue
    risk: medium
  - id: E-BKG-23
    group: Web
    title: Web receipt split
    when: an item fails while saving `/add-receipt`
    then: |
      - all items go in one insert · a failure books none, a retry books each once (fixed 2026-10-24)
      - an item of 0 or below is refused (fixed 2026-10-24)
      - still no receipt row · open
    status: known-issue
    risk: medium
    tests:
      - file: src/app/(main)/add-receipt/page.test.tsx
        repo: web
        name: "does not book an item twice when a save is retried after the insert failed: every line goes in one all-or-none insert"
      - file: src/app/(main)/add-receipt/page.test.tsx
        repo: web
        name: does not book a negative item, even when the lines still add up to the total
  - id: E-BKG-24
    group: Web
    title: Corrections in the web ledger
    when: balance check booked corrections
    then: listed in `/bookings` since 2026-10-28 · opens its check · counted as neither side (D-BKG-6)
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/bookings/components/bookings-table.test.tsx
        repo: web
        name: names a balance correction and opens its balance check; no checkbox, no menu
  - id: E-BKG-25
    group: Booking form
    title: Favorite of the other type
    when: "*New Income* → picker → an expense favorite or recent"
    then: form switches to *Expense* with that category · before 2026-10-23 it saved an expense under *Income*
    status: fixed
    risk: high
    tests:
      - file: test/features/booking/ui/modal/category_picker_modal_interaction_test.dart
        name: a pick of the other type switches the form type before reporting the category
  - id: E-BKG-26
    group: Booking form
    title: Back or a tap as the keypad opens
    when: "*New booking* · back, or a tap on another field, in the frame the keypad slides up · also recurring form, keypad amount fields"
    then: |
      - keypad closes or never shows · the form stays · no crash
      - before 2026-10-31 a crash (Play pre-launch robot, `1.18.0+34`)
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/calculator/calculator_sheet_test.dart
        name: closed in the frame it was opened in, it never shows and reports closed
      - file: test/shared/ui/calculator/calculator_sheet_test.dart
        name: a back press in the frame it was opened in does not throw
  - id: E-BKG-27
    group: Booking form
    title: Last snackbar over the next keypad
    when: save a booking → **+** again within ~4 s · also the recurring form
    then: |
      - the form opens clean · the old bar and any queued one are cleared
      - before 2026-11-03 *Booking created* / *Make recurring* sat over the keypad's last row · a tap on ✓ opened a rule from the previous booking (iOS round, IOS-2-6)
    status: fixed
    risk: high
    related: [R-BKG-02]
    tests:
      - file: test/features/booking/ui/pages/booking_save_page_test.dart
        name: a snackbar from the page below is cleared once the form opens, action and all
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: a snackbar from the page below is cleared once the form opens
  - id: E-BKG-28
    group: Booking form
    title: Paste on an iPhone
    when: iOS 16+ · long-press the amount → *Paste*
    then: |
      - the system *Paste* menu · no *Allow Paste?* alert · Android keeps the app's own menu
      - before 2026-11-03 the app read the clipboard itself → the alert every time, the app frozen until answered (iOS round, IOS-2-2)
    status: fixed
    risk: medium
    related: [C-BKG-045]
    tests:
      - file: test/utils/helper/paste_helper_test.dart
        name: shows the system Paste item and never reads the clipboard itself
      - file: test/utils/helper/paste_helper_test.dart
        name: the text iOS pastes into the hidden field is parsed and applied
  - id: E-BKG-29
    group: Booking form
    title: No swipe-back on iPhone
    when: iPhone · edge swipe on a booking, goal, budget, loan, settings page, rule editor…
    then: |
      - goes back like any iOS page · a form with changes stays put, its *×* asks (D-BKG-9)
      - before 2026-11-03 nothing happened on 52 pages (iOS round, IOS-2-1)
    status: fixed
    risk: high
    related: [R-BKG-02, D-BKG-9, C-BKG-044]
    tests:
      - file: test/app/navigation/slide_route_swipe_back_test.dart
        name: on iOS a SlideRightRoute goes back on an edge swipe
  - id: E-BKG-30
    group: Booking form
    title: Transfer picked with the keypad up
    when: "*New booking* · keypad up → *Transfer* · also the recurring form"
    then: |
      - amount already typed → keypad closes, From and To in view
      - no amount yet → keypad stays up · camera key gone, back on *Expense* / *Income*
      - before 2026-11-03 the keypad stayed up over From and To, with the camera key still on it
    status: fixed
    risk: medium
    related: [J-BKG-02, C-BKG-048]
    tests:
      - file: test/features/booking/ui/pages/booking_save_page_test.dart
        name: tapping Transfer after an amount closes the keypad onto From and To
      - file: test/features/booking/ui/pages/booking_save_page_test.dart
        name: tapping Transfer before an amount keeps the keypad up, without the scan key
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: switching to a transfer closes the keypad once an amount is typed, and keeps it up before
  - id: E-BKG-40
    group: Quick booking
    title: Everyday English words get no category
    when: English book · `milk 2`, `taxi 20`, `bus ticket 2`, `gas 40`, `starbucks 5`, `cinema 12`, `rewe 30` · Japanese `パン 200`
    then: |
      - Groceries · Public Transit · Public Transit · Fuel · Dining Out · Movie · Groceries · 食料品
      - before 2026-11-03 most got no category and `bus ticket` saved as *Fuel* (iOS round, IOS-4-1)
    status: fixed
    risk: medium
    related: [R-BKG-14, E-SHP-05]
    tests:
      - file: test/shared/categorization/everyday_words_test.dart
        name: a ticket without a transit leaf is no guess, never Fuel
      - file: test/shared/categorization/everyday_words_test.dart
        name: "keyword map: everyday en/ja words"
  - id: E-BKG-41
    group: Quick booking
    title: Return key on an incomplete prompt
    when: "`bread 2.40` (no category) → keyboard **done** · or an empty prompt"
    then: |
      - keyboard stays · the category picker opens · more missing → those chips red and shaking · empty prompt → nothing else
      - a Return within the 200 ms parse delay saves what is on screen
      - before 2026-11-03 the keyboard dropped and nothing said what was missing (iOS round, IOS-4-2)
    status: fixed
    risk: low
    related: [R-BKG-14]
    tests:
      - file: test/features/quick_add/ui/sheets/quick_booking_submit_test.dart
        name: a prompt missing more than the category keeps the keyboard and flags the gaps
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: a return key inside the debounce saves the prompt on screen, not the last parse
  - id: E-BKG-43
    group: Quick booking
    title: Sheet hides behind the rising keyboard
    when: hold **+** → quick booking opens with the keyboard
    then: |
      - fixed 2026-11-07: the sheet stands on the keyboard and rises with it, like an input bar · closing rides it down
      - before: the keyboard came up alone, the sheet slid in behind it and popped out on top (iOS) · on Android the keyboard covered the sheet for a frame, then the sheet jumped
      - the first open or close after an install can stutter in a debug build · judge it on TestFlight / internal
    status: fixed
    risk: low
    tests:
      - file: test/shared/ui/common/keyboard_docked_sheet_test.dart
        name: the sheet slides in from the keyboard top, not from behind the keyboard
      - file: test/shared/ui/common/keyboard_docked_sheet_test.dart
        name: the sheet rides the keyboard down when it closes
  - id: E-BKG-42
    group: Amount
    title: Typed trailing zero
    when: keypad `1 2 . 5 0`
    then: hero shows *12.50* while typing · *12.50* after ✓ · before 2026-11-03 *12.5* · IOS-2-4
    status: fixed
    risk: low
    tests:
      - file: test/features/booking/ui/widgets/amount_display_test.dart
        name: keeps a typed trailing zero
  - id: E-BKG-79
    group: Amount
    title: Keyed zeros on a quantity or price
    when: "keypad sheet of a number field (investment quantity, price, rate) · `0 . 0 0 0 0`, then `4`"
    then: |
      - readout shows *0.0000* while typing, then *0.00004* · `1 2 .` shows *12.* · a price pads to the currency's decimals (`1 .` → *1.00*)
      - a value not typed (opened for edit, a g → oz t switch, **=**) still reads trimmed: *0.3215 oz t*
      - money fields (goal, loan, account) unchanged: always the currency's decimals
      - before 2026-11-16 *0* until the first non-zero digit
    status: fixed
    risk: low
    related: [E-BKG-42, C-INV-066]
    tests:
      - file: test/shared/ui/calculator/calculator_amount_display_test.dart
        name: a quantity reads every keyed zero before the digit that ends it
      - file: test/shared/ui/calculator/calculator_amount_display_test.dart
        name: a weight reads its keyed digits; a converted value still reads at displayDigits
      - file: test/shared/ui/calculator/calculator_amount_display_test.dart
        name: a price keeps keyed zeros past the currency precision and pads below it
  - id: E-BKG-44
    group: Multi-currency
    title: No exchange rate for the chosen currency
    when: a currency the feed does not serve (VND, AED …) and never used in this book
    then: |
      - *Amount in EUR* stays empty · the rate line says *No exchange rate for VND. Enter the amount in EUR or a rate.*
      - Save stays disabled until a book amount or a rate is typed · never booked at 1.0
    status: by-design
    risk: high
  - id: E-BKG-45
    group: Multi-currency
    title: Book amount typed from the statement
    when: CZK 250 entered, then *Amount in EUR* set to 10.31
    then: |
      - the rate is derived from the two amounts · line reads *From the amount in EUR*
      - typing the foreign amount again keeps that rate · typing a rate recomputes the EUR amount
    status: by-design
    risk: medium
  - id: E-BKG-46
    group: Multi-currency
    title: Back to the book currency
    when: a CZK booking is switched to EUR in the form
    then: the EUR amount stays · the CZK amount and the rate are dropped
    status: by-design
    risk: low
  - id: E-BKG-47
    group: Multi-currency
    title: Booking on a foreign account
    when: a CZK account is picked
    then: |
      - the chip shows CZK and is fixed · tap says *Bookings on this account are in CZK*
      - a goal contribution, loan payment or trade booked there gets the CZK amount filled in from today's rate · the book amount stays the one handed over
    status: by-design
    risk: high
  - id: E-BKG-48
    group: Multi-currency
    title: Transfer into a foreign account
    when: EUR 400 from the giro to a CZK account
    then: |
      - *Received in CZK* is prefilled from today's rate and editable (the bank's figure)
      - CZK → CZK needs one figure only · book-wide the transfer still counts 0
    status: by-design
    risk: high
  - id: E-BKG-49
    group: Multi-currency
    title: Foreign account without a rate
    when: an account in a currency with no feed rate and no booking yet
    then: |
      - its balance shows in its own currency · *Not converted, no rate for …*
      - Home's total leaves it out · the card says *1 account without exchange rate*
    status: by-design
    risk: high
  - id: E-BKG-50
    group: Multi-currency
    title: Quick add with a currency code
    when: "`CZK 250 lunch` · `pen 3` · `KWD 1.500`"
    then: |
      - upper-case code → CZK booking · a lower-case code only for a currency the book already used or the trip's
      - `pen 3` stays a pen · KWD 1.500 is 1.5 (three decimals)
      - Free: the code stays text
    status: by-design
    risk: medium
  - id: E-BKG-51
    group: Multi-currency
    title: Book currency change with foreign rows
    when: Settings → Currency while a foreign booking, rule or account exists (archived accounts too)
    then: refused with *Not changeable while bookings or accounts in other currencies exist* · the server refuses it too
    status: by-design
    risk: high
  - id: E-BKG-52
    group: Multi-currency
    title: Account currency after its first booking
    when: editing the currency of an account a booking, transfer or rule points at
    then: the tile is greyed · saving anyway is refused with *The currency is fixed once the account has bookings*
    status: by-design
    risk: medium
  - id: E-BKG-53
    group: Multi-currency
    title: Known gaps on the branch
    when: multi-currency on the `multi-currency` branch, before release
    then: |
      - scanner review shows the book symbol on a trip · the saved bookings are right · by decision, not fixed
      - bank files: *Originalbetrag* / *Amount (Foreign Currency)* not read as the original yet
      - demo: no foreign subscription rule
    status: known-issue
    risk: low
  - id: E-BKG-54
    group: Multi-currency
    title: Renaming a foreign account
    when: a CZK account opened at EUR 400 is renamed months later
    then: |
      - the opening balance keeps its EUR value · only a new opening figure, currency or rate re-values it
      - fixed 2026-11-11 · before: every save re-valued it at today's rate, and with no rate it vanished from the ledger
    status: fixed
    risk: high
  - id: E-BKG-55
    group: Multi-currency
    title: Currency with no feed rate and no booking
    when: a VND account is opened
    then: |
      - the form shows *No exchange rate for VND* under the opening balance · tap → type the rate
      - from then on the account converts at that rate until a feed or a booking brings a newer one
    status: by-design
    risk: medium
  - id: E-BKG-56
    group: Multi-currency
    title: Planned payment booked during a trip
    when: forecast → book a planned €950 rent while a CZK trip is on
    then: stays EUR 950 · the trip currency only applies to an empty new booking · fixed 2026-11-11 (it turned into CZK 950)
    status: fixed
    risk: high
  - id: E-BKG-57
    group: Multi-currency
    title: Saved booking moved onto a foreign account
    when: editing a EUR 10 booking and picking the CZK account
    then: keeps EUR 10 · CZK amount worked out from the rate · fixed 2026-11-11 (it became CZK 10)
    status: fixed
    risk: high
  - id: E-BKG-58
    group: Multi-currency
    title: Balance check without a rate
    when: a counted foreign account differs and no rate exists (or single mode books it onto an account in another currency)
    then: Save stays off · the summary says *No exchange rate for …, so this count cannot be booked* · never silently left out
    status: fixed
    risk: medium
  - id: E-BKG-59
    group: Multi-currency
    title: Quick add with a currency nobody has a rate for
    when: "`AED 50 taxi` with no AED rate"
    then: the amount chip is flagged before saving · *No exchange rate for this currency* · the full form takes a rate
    status: by-design
    risk: low
  - id: E-BKG-60
    group: On the web
    title: Sorting the list by account or category
    when: click the *Account* or *Category* column header on `/bookings`
    then: rows order by the account's or category's name, newest first inside each · transfers (no category) sort together · before 2026-11-12 the order followed internal ids and looked random
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/bookings/services/bookings.service.test.ts
        repo: web
        name: sorts by %s by the related name (never the uuid), newest first inside it
  - id: E-BKG-61
    group: On the web
    title: Deleting one booking from its row menu
    when: "⋯ → *Delete* on a row"
    then: a dialog of the app's own names the booking, its date and amount · *Cancel* keeps it · before 2026-11-12 the browser's own confirm box asked
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/bookings/components/bookings-table.test.tsx
        repo: web
        name: does nothing when the confirm is cancelled
  - id: E-BKG-62
    group: Web
    title: Receipt lines off by a fraction of a cent
    when: web · *Add receipt* · 3 × 3.333 against 10 · or a yen receipt
    then: compared in whole minor units of the currency · 0.01 left is shown, not hidden · yen compare as whole yen · fixed 2026-11-12
    status: fixed
    risk: medium
    tests:
      - file: src/app/(main)/add-receipt/lib/allocation.test.ts
        repo: web
        name: does not call three lines of 3.333 a balanced 10
      - file: src/app/(main)/add-receipt/lib/allocation.test.ts
        repo: web
        name: compares whole yen in a zero-decimal book
  - id: E-BKG-63
    group: Trash
    title: "Double tap on *Restore*"
    when: "Trash · *Restore* tapped twice · or a restore that fails"
    then: "restored once · *Restored* only after it worked, an error otherwise · fixed 2026-11-12 · before, two bookings (bug hunt 3, 62)"
    status: fixed
    risk: high
    tests:
      - file: test/features/trash/trash_cubit_test.dart
        name: "a second tap while a restore runs writes no second copy"
      - file: test/features/trash/trash_page_test.dart
        name: "a failed restore shows the error, not Restored"
  - id: E-BKG-64
    group: Quick booking
    title: "*5 euro* lost the amount"
    when: "quick booking · *kaffee 3,50 euro* · *2 bier 5 euro*"
    then: "3.50 · 5 · the currency's name counts like its code · fixed 2026-11-12 · before, no amount or 2.00 (bug hunt 38)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/booking/quick_add/quick_booking_parser_test.dart
        name: "the currency's name after the amount is consumed like its code"
  - id: E-BKG-65
    group: Quick booking
    title: "Chips behind the typed text"
    when: "quick booking · fast typing · second tap while saving"
    then: "chips match the text · one booking · fixed 2026-11-12 (bug hunt 37, 10)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/booking/quick_add/quick_booking_cubit_test.dart
        name: "an older parse that finishes last does not overwrite the newer one"
  - id: E-BKG-66
    group: Web
    title: Web receipt saved without its merchant
    when: web · *Add receipt* · merchant typed · saved
    then: a real receipt with merchant, date, total and items · bookings linked to it · phone shows the receipt card · built 2026-11-12, live once pushed (T-BOOK-06) · until then bookings only, as before
    status: fixed
    risk: medium
    related: [T-BOOK-06]
    tests:
      - file: src/app/(main)/add-receipt/services/receipt.service.test.ts
        repo: web
        name: writes the receipt and its bookings in one RPC
  - id: E-BKG-67
    group: Web
    title: Bookings of a deleted category on the web
    when: web ledger · a booking whose category was deleted
    then: stays listed · *Deleted category* next to the name · kept under the Fixed / Variable filter · ledger still adds up to the balance · decided + built 2026-11-12
    status: fixed
    risk: low
  - id: E-BKG-68
    group: Amount
    title: More decimals than the currency has
    when: 100 ÷ 3 on the keypad · a pasted 0.1 + 0.2 · 333.333 JPY · KWD *1.250* in quick add
    then: rounded to the currency's decimals on save · 33.33 · 0.30 · 333 · KWD 1.25 · fixed 2026-11-13 · before, stored as typed (EC-AMT-8…14)
    status: fixed
    risk: high
    tests:
      - file: test/edge_cases/amounts_currency_edge_cases_test.dart
        name: EUR 100 ÷ 3 then Done stores the 33.33 the display shows
  - id: E-BKG-69
    group: Trash
    title: Old trash entry restored twice
    when: Trash on two phones · same booking restored on both
    then: restored once · the second restore does nothing · fixed 2026-11-13 (EC-TRASH-5)
    status: fixed
    risk: high
    tests:
      - file: test/edge_cases/trash_restore_edge_cases_test.dart
        name: restoring a stale entry a second time after it already came back does not duplicate it
  - id: E-BKG-70
    group: Booking form
    title: Note or item name too long for sync
    when: a note with emoji · a shopping item name over 50 · a quantity over 20
    then: fields stop where the server's column ends, counted like the server · a Japanese word being typed is not cut · fixed 2026-11-13 · before, saved on the phone and refused on sync (contract A2, A3)
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/form/code_point_limit_formatter_test.dart
        name: text an input method is still composing is left alone until it is committed
  - id: E-BKG-71
    group: Split
    title: Parts do not add up
    when: parts 4 + 5 on a total of 10 · or 6 + 5
    then: "*Save* stays off · the line says how much is left or over · nothing is spread or rounded for the user"
    status: by-design
    risk: medium
    tests:
      - file: test/features/booking/domain/booking_draft_split_test.dart
        name: a remainder, an overshoot, a missing category and a zero part are all invalid
  - id: E-BKG-72
    group: Split
    title: Only some parts on this phone
    when: another phone split a booking · sync has brought 1 of 3 parts so far
    then: the part shows as a plain booking with a split mark and opens as one · the group appears once the others land · no total is stored, so nothing is ever wrong in between
    status: by-design
    risk: low
    tests:
      - file: test/features/booking/domain/booking_draft_split_test.dart
        name: a group that synced only one part opens as a plain booking
  - id: E-BKG-73
    group: Split
    title: Backup restored beside its book
    when: a backup with split purchases restored into a new book of the same account
    then: the parts stay grouped under new group ids · the two books' purchases never merge
    status: by-design
    risk: medium
    tests:
      - file: test/features/backup/backup_remapper_test.dart
        name: the parts of a split purchase stay one group under a new id
  - id: E-BKG-75
    group: Split
