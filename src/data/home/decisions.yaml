items:
  - id: D-HOM-1
    question: Drag cards on Home itself?
    status: open
    answer: Not built · editor first, measure the ask (D9)
  - id: D-HOM-2
    question: Net-worth card
    status: open
    answer: Unblocked · build on the Analytics series · name reserved
  - id: D-HOM-3
    question: Bar with 3 or 5 tabs
    status: decided
    answer: No · + needs the middle · would be a redesign
  - id: D-HOM-4
    question: iOS widgets
    status: open
    answer: Planned (`plans/IOS_WIDGET_PLAN.md`) · icon assets port directly
  - id: D-HOM-5
    question: Where do locked pages sit in the Free drawer?
    status: decided
    date: 2026-10-21
    answer: |
      - Pro group at the very end · *Get Pro* in its header
      - Gerald: "a pro group on bottom, so that settings is still visible"
      - early-adopter window → header without button
    related: [R-HOM-13]
  - id: D-HOM-6
    question: Balance-check card on a book created this month?
    status: decided
    date: 2026-11-02
    answer: |
      - not shown until the book has lived through one full period
      - a book set up on Nov 2 first sees it at the next month start
      - source: iOS simulator round, IOS-3-5
  - id: D-HOM-7
    question: Tapping the open tab again — scroll to the top?
    status: decided
    date: 2026-11-03
    answer: |
      - **yes** · iOS + Material convention
      - every page that can sit in the bar · the tablet rail too
      - built 2026-11-03
      - source: iOS simulator round, IOS-3-3
    related: [R-HOM-14]
  - id: D-HOM-8
    question: Balance-check card right after starting balances are set?
    status: decided
    date: 2026-11-03
    answer: |
      - **no** · typing in starting balances is a count of its own
      - set on Nov 3 (or Oct 31) → no November card · Dec 1 asks again
      - starting-balance card still open → no balance-check card
      - built 2026-11-03
      - source: Gerald's iOS test, book set up Oct 31
    related: [D-HOM-6, R-BC-09]
