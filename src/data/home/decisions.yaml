items:
  - id: D-HOM-1
    question: Drag cards on Home itself?
    status: open
    answer: Not built · editor first, measure the ask (D9)
  - id: D-HOM-2
    question: Net-worth card
    status: open
    answer: Unblocked · build on the Analytics series · name reserved
  - id: D-HOM-3
    question: Bar with 3 or 5 tabs
    status: decided
    answer: No · + needs the middle · would be a redesign
  - id: D-HOM-4
    question: iOS widgets
    status: decided
    date: 2026-11-12
    answer: |
      - **after iOS is live** · store launch + New Year push first
      - WidgetKit phase 0 stays parked until then
      - planned (`plans/IOS_WIDGET_PLAN.md`) · icon assets port directly
  - id: D-HOM-5
    question: Where do locked pages sit in the Free drawer?
    status: decided
    date: 2026-10-21
    answer: |
      - Pro group at the very end · *Get Pro* in its header
      - Gerald: "a pro group on bottom, so that settings is still visible"
      - early-adopter window → header without button
    related: [R-HOM-13]
  - id: D-HOM-6
    question: Balance-check card on a book created this month?
    status: decided
    date: 2026-11-02
    answer: |
      - not shown until the book has lived through one full period
      - a book set up on Nov 2 first sees it at the next month start
      - source: iOS simulator round, IOS-3-5
  - id: D-HOM-7
    question: Tapping the open tab again — scroll to the top?
    status: decided
    date: 2026-11-03
    answer: |
      - **yes** · iOS + Material convention
      - every page that can sit in the bar · the tablet rail too
      - built 2026-11-03
      - source: iOS simulator round, IOS-3-3
    related: [R-HOM-14]
  - id: D-HOM-8
    question: Balance-check card right after starting balances are set?
    status: decided
    date: 2026-11-03
    answer: |
      - **no** · typing in starting balances is a count of its own
      - set on Nov 3 (or Oct 31) → no November card · Dec 1 asks again
      - starting balances still pending → no balance-check card (the checklist asks for them since 2026-11-11, D-HOM-11)
      - built 2026-11-03
      - source: Gerald's iOS test, book set up Oct 31
    related: [D-HOM-6, R-BC-09]
  - id: D-HOM-9
    question: "Android back on a tab other than Home: go to Home or offer to exit?"
    status: decided
    date: 2026-11-06
    answer: |
      - **b) keep the exit prompt on every tab** · no build · AND-3-2 closed
      - back on the Book tab → *Tap again to exit*
      - a) back goes to Home first, exits from Home (the Android convention)
      - b) keep the exit prompt on every tab
      - source: Android emulator round, AND-3-2
  - id: D-HOM-10
    question: Balance or budget widget tap while another page is open?
    status: decided
    date: 2026-11-06
    answer: |
      - **Home** · pop to the main route, select Home · built 2026-11-06
      - a form with unsaved changes stays open
      - before: the app resumed whatever page was open · source: Android emulator round, AND-26-4
  - id: D-HOM-11
    question: Starting balances, the widget item and the scan button on the checklist?
    status: decided
    date: 2026-11-11
    answer: |
      - **the separate *Set starting balance* card is retired** · *Set starting balances* becomes checklist item 2
      - **the widget item is dropped** · the cap stays at 5 · the widget stays in *Tips & features* and Settings
      - *Add the first entry* keeps one button · the scan item is the scan (was on the same card three times)
      - why: after *Quick start* the first expense turned the total negative and the balance card sat below the fold
      - source: new-user review on Android + iOS, 2026-11-11 · built the same day
    related: [R-HOM-40, R-HOM-41, D-HOM-8]
  - id: D-HOM-12
    question: "*Top expenses* with a single booking?"
    status: decided
    date: 2026-11-11
    answer: |
      - hidden until there are **4 bookings in 2 categories** · the editor says why
      - why: with one booking it repeated *Recent transactions* row for row · at 2 categories alone it still did, two rows each (re-test 2026-11-11)
      - 4 = one more than the card lists by default
    related: [R-HOM-41]
  - id: D-HOM-13
    question: More onboarding or helper dialogs for new users?
    status: decided
    date: 2026-11-11
    answer: |
      - **no** · no dialog or hint that explains a feature · users learn by using it
      - subtract instead: fewer doors to the same thing, one page before the first scan, a shorter setup
      - Gerald: "i definitly dont want annoying helper dialogs, that explain every feature"
    related: [D-HOM-11, D-SET-3, D-SCN-05, D-REC-2]

  - id: D-HOM-14
    question: "Starting balances in Home *Cash flow*?"
    status: decided
    date: 2026-11-11
    answer: |
      - **not income, not an expense** · a starting balance moves only the balance
      - Home now matches Stats and the Budget Book · the breakdown sheet has no *Initial balances* row
      - was: setup with bank 2,000 + card 150 owed showed income 2,000 and expenses 160 on day one (F-55)
    related: [D-HOM-11]

  - id: D-HOM-15
    question: "Forecast, its calendar and Investments as bottom-bar tabs?"
    status: decided
    date: 2026-11-14
    answer: |
      - **two forecast tabs** (Gerald): *Forecast* (Overview · Calendar under the title, as before) and *Forecast calendar* (the year calendar alone, no tabs under the title) · either or both in the bar
      - *Investments* can be a tab too
      - all three are Pro like their pages · picked in Settings › Navigation (editing the bar is Pro)
      - the drawer lists them like every page not in the bar · new row *Forecast calendar* after *Forecast* · Free: in the Pro group
      - **default bar unchanged** (Gerald): Pro still starts on Home · Book · + · Stats · Goals
      - plan ends with one in the bar: the page read-only with its records, the paywall without (as from the drawer)
      - why: the calendar shows the forecast and the bookings in one place (Gerald, 2026-11-14)
    related: [R-HOM-10, R-HOM-13, R-FC-50, R-FC-51]
