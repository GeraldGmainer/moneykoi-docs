items:
  - id: J-HOM-01
    group: Home
    title: Arranges Home
    from: Home → *Customize* · Pro
    steps:
      - drag · remove + Undo · add from gallery
      - gear → card settings
      - or *Start over* with a preset
    result: your Home, on every device
    tests:
      - file: test/features/home/bloc/home_edit_cubit_test.dart
        name: a preset replaces the whole body in one write
    checks: [C-HOM-001]
  - id: J-HOM-02
    group: Bar
    title: Configures the bottom bar
    from: Settings → Navigation (Pro)
    steps:
      - 1/2/4 tabs · order · start tab
      - Shopping slot → pin a list
    result: this book's bar · others keep theirs
    checks: [C-HOM-002]
  - id: J-HOM-03
    group: Widgets
    title: Places a category widget
    from: Android home screen → widgets → Money Koi
    steps:
      - pick a category
      - tap the widget
    result: booking form with that category
    checks: [C-HOM-003]
  - id: J-HOM-04
    group: New users
    title: First week with the checklist
    from: setup done → Home
    steps:
      - "*Getting started* leads Home · *Add entry* or *Scan a receipt*"
      - first booking → tick + confetti · next item opens
      - regular payment · budget · widget → each ticks from data
    result: "*All set* once, then the card is gone"
    note: |
      - × hides it at once · Undo in the snackbar
      - after 14 days it is gone whatever was done
    checks: [C-HOM-010, C-HOM-011]
    related: [R-HOM-40]
  - id: J-HOM-05
    group: New users
    title: First week hints
    from: setup done · entries typed by hand
    steps:
      - 3rd entry saved → bubble above **+** · *Try it* opens quick entry
      - rent booked → *Does this repeat every month?* → *Make recurring*
      - 5th typed entry, never scanned → scan line on the next form
      - 3rd Budget Book open with 7 entries → *See the month day by day*
    result: each hint once · gone for good after it showed or the feature was used
    note: |
      - a tap anywhere closes the bubble and still does what it was aimed at
      - the recurring question takes the place of the *saved* toast
    checks: [C-HOM-013, C-BKG-041]
    related: [R-HOM-42]
