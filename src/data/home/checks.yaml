# HOME_WIDGET §12 (manual QA the tests cannot cover); the rest derived from the context docs.
groups:
  - id: home
    title: Home & bar
    items:
      - id: C-HOM-001
        text: Remove → Undo · preset → Undo · 2nd *Recent transactions* · no-data card *hidden* · Free → editor locked
      - id: C-HOM-002
        text: Free bar Home · + · Book · buy Pro → 4 tabs · 1-tab = no bar · book switch keeps bars
      - id: C-HOM-009
        text: New book on Small_Phone, German → first-entry card button full width, *ERSTE BUCHUNG* not clipped
      - id: C-HOM-010
        text: Fresh setup → *Getting started* on Home, 5 items, no widget item · first booking → tick + confetti · *Set starting balances* → Card 500 → account −500, total down by 500 · recurring payment, budget tick · all done → *All set* once → gone on next open · × → Undo restores · no separate *Set starting balance* card
