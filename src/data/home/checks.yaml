        text: "Pro → Settings › Navigation → 4 tabs → *Forecast calendar* and *Investments* in the bar → each opens with the drawer button, no back arrow · *Forecast calendar*: year calendar, no *Overview · Calendar* row · drawer lists neither · bar without them → drawer has *Forecast*, never *Forecast calendar* (D-HOM-17) · Home forecast card → switches to the tab · simulator *Free* with planned payments → the calendar tab opens read-only (D-HOM-15)"
