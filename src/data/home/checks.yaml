        text: Existing account on a wiped phone → no checklist, no hints · Debug → *Re-arm new-user guidance* brings them back
      - id: C-HOM-012
        text: One booking → no trend, no timeline, no *Upcoming* · second day booked → trend + timeline appear · first rule → *Upcoming* appears
      - id: C-HOM-013
        text: Fresh setup → 3 typed entries → bubble above **+** on Home · tap elsewhere closes it, tap still lands · *Try it* opens quick entry · never again · a quick entry before the 3rd save → no bubble
      - id: C-HOM-014
        text: Budget Book opened 3× with 7 entries → *See the month day by day* above the tabs · tap → Calendar · × → gone for the visit · opening Calendar first → never
      - id: C-HOM-015
        text: "Small_Phone, Free → drawer: *Settings* on screen without scrolling · scroll → *Pro features* + *Get Pro*, 4 dimmed pages · German + Japanese: button not clipped"
      - id: C-HOM-016
        text: "Web, window ≤ 900 px tall (1440×900) → sidebar footer one row: *Add Booking* + 2 icon squares, keys in tooltips · taller → stacked · collapsed → rail · phone drawer stacked"
      - id: C-HOM-021
        text: "Web on an iPad (768 portrait, 1024 landscape) → icon rail, Home cards two columns, no title cut (*Cash fl…*) · arrow → full sidebar over the page, tap beside it closes · landscape: rail shows only **+** and every nav icon · iPhone: bottom bar Dashboard · Bookings · **+** · Analytics · Goals, current tab orange, sits above the home indicator, last row not under it · tap **+** → *Add*, hold → quick entry · *Add* and a booking's edit page: no bar · search icon opens ⌘K · accounts one row each · a sheet hides the page behind it · Analytics change chips and tables inside their cards, nothing scrolls sideways"
      - id: C-HOM-018
        text: "Web Home, month anchor ≠ 1 → *Cash flow* pill → menu under the pill, rows are names only, the line under the heading shows the hovered range's dates and they follow the anchor, current ticked · pick *Last 6 months* → figures reload, pill renamed · reload → kept · *Customize* shows it · *Forecast* pill → horizons · *More settings* → the card's sheet · phone width: menu on screen · arrow keys + Enter work"
      - id: C-HOM-017
        text: "*Getting started* → tap the circle of *Scan a receipt* → ticked, count goes up, next item expands · tap again → open · a data-ticked item's circle does nothing · restart → still ticked · tick the last open item → *All set* + Undo restores the list · row still opens its feature"
      - id: C-HOM-019
        text: Budget Book, Analytics, Goals on a phone → scroll down → header gone behind a plain strip · nothing under the clock
      - id: C-HOM-022
        text: Each tab in the bar (Home, Book, Stats, Goals, Shopping incl. a pinned list, Accounts, Categories, Recurring) → scroll down → tap its bar icon again → back to the top, nothing reloads · iPad landscape → same from the rail · tap another tab → switches as before
  - id: widgets
