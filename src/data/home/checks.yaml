        text: "Hold **+** → strong buzz, card above, page dimmed, + turns × · slide up to *Quick entry* and lift → quick-entry sheet · hold, lift without sliding → menu stays → *Add receipt* → by-hand receipt page · *Scan receipt* → camera · *New booking* → form · tap dimmed page, ×, Android back → closes, no *Press back again* · light + dark · German + Japanese labels fit · TalkBack: + says *double-tap and hold to show more ways to add* (R-HOM-15)"
