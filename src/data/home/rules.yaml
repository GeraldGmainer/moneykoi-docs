# Source: app HOME_CARDS, NAVIGATION, HOME_WIDGET context docs; web DASHBOARD_WEB, APP_SHELL_WEB.
items:
  # Home cards
  - id: R-HOM-01
    group: Home cards
    title: Your layout says what you want; the data decides what shows
    text: |
      Cards you removed stay removed; cards with nothing to show (no budgets this month) hide by themselves and the editor says so. The total balance header is always there.
    source: HOME_CARDS §1, §13 D1
  - id: R-HOM-02
    group: Home cards
    title: The editor and presets are Pro; the default Home is free
    text: |
      Reorder, add (repeatable cards: *Add another*), remove, configure, and four presets — *Everyday*, *Minimal*, *Planner*, *Investor*. The free default holds only free cards; Pro cards show locked in the gallery.
    source: HOME_CARDS §7, §13 D4
    tests:
      - file: test/features/home/ui/widgets/home_card_gallery_test.dart
        name: a card the plan does not cover wears the lock and says why
    related: [R-MON-12]
  - id: R-HOM-03
    group: Home cards
    title: Every change saves at once, with Undo
    text: |
      No Save button and no discard dialog; a remove or a preset offers Undo that restores the exact previous layout.
    source: HOME_CARDS §7
    tests:
      - file: test/features/home/bloc/home_edit_cubit_test.dart
        name: undo restores the exact prior layout, order included
  - id: R-HOM-04
    group: Home cards
    title: A new default card appears once
    text: |
      An update adds a new default card only to layouts written before it existed — never brings back one you removed.
    source: HOME_CARDS §2
    tests:
      - file: test/features/home/domain/home_layout_test.dart
        name: appends a default card introduced after the blob was written, once
  - id: R-HOM-05
    group: Home cards
    title: The layout is per person, synced
    text: |
      Stored on your profile, with a device copy for the first frame. The web has its own Home layout.
    source: HOME_CARDS §3, §13 D6
  - id: R-HOM-06
    group: Home cards
    title: One quick-entry row
    text: |
      Your chosen actions (scan, quick booking, search, shopping list, add investment…), then category tiles from favorites, most used or a hand-picked list. Pro destinations wear the lock.
    source: HOME_CARDS §8, MONETIZATION §3a
    tests:
      - file: test/features/home/ui/widgets/quick_actions_test.dart
        name: wears the lock; the free ones do not

  # Bottom bar & drawer
  - id: R-HOM-10
    group: Bottom bar & drawer
    title: Every destination is both a tab and a page
    text: |
      The bar holds 1, 2 or 4 tabs (the + needs the middle slot); everything else is in the drawer, and every deep link works whatever the bar holds. One tab = no bar.
    source: NAVIGATION §1–§2
    tests:
      - file: test/core/navigation/nav_layout_test.dart
        name: drops the last tab of a 3-tab list
      - file: test/core/navigation/nav_layout_test.dart
        name: one tab has no bar
  - id: R-HOM-11
    group: Bottom bar & drawer
    title: The default bar follows the plan
    text: |
      Free: Home · + · Budget Book. Pro / Cloud: Home · Book · + · Stats · Goals — at once on purchase. A saved bar always wins, on any plan. Editing the bar is Pro.
    source: NAVIGATION §6 (decided 2026-10-16)
  - id: R-HOM-12
    group: Bottom bar & drawer
    title: A bar per book, stored on your profile
    text: |
      Each member has their own bar for a shared book; you can run a different bar in each book. Nothing is written automatically.
    source: NAVIGATION §6
  - id: R-HOM-13
    group: Bottom bar & drawer
    title: Locked pages come last in the drawer
    text: |
      On Free, Analytics and Shopping list are listed with a lock, last, right above *Get Pro*.
    source: MONETIZATION §3a, §7
    tests:
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Free: the locked pages close the list, in their usual order, right above Get Pro'

  # Android widgets
  - id: R-HOM-20
    group: Android widgets
    title: Eight widgets
    text: |
      Category booking, new booking, quick booking, scan receipt, total balance, budget, goal / loan, shopping list. iOS widgets are planned.
    source: HOME_WIDGET §13
  - id: R-HOM-21
    group: Android widgets
    title: A tap opens the app, never saves in the background
    text: |
      A booking needs the whole app (sync, balances, validation), so the widget opens the real form. A category that is archived or gone shows a placeholder; its tap reconfigures.
    source: HOME_WIDGET §2, §12
  - id: R-HOM-22
    group: Android widgets
    title: Widgets follow privacy and sign-in
    text: |
      Amounts are masked when hiding is on; signed out, the balance widget reads *Open MoneyKoi to sign in*; the shopping widget keeps its list read-only after the plan ends.
    source: AMOUNT_PRIVACY §4, MONETIZATION §9a, HOME_WIDGET §13
    related: [R-PRIV-14]

  # Web
  - id: R-HOM-30
    group: Web shell
    title: Sidebar, ⌘K and the floating +
    text: |
      A fixed sidebar (a drawer on phones) with every page; ⌘K finds pages, actions and records; a long press on the mobile + opens quick entry. Dark only; no offline.
    source: APP_SHELL_WEB §1, web 02_FEATURES
  - id: R-HOM-31
    group: Web shell
    title: The web dashboard has all 17 card types
    text: |
      Its own layout, edited in *Customize* (settings from the editor only); no cash-flow breakdown sheet. Cash flow, month net and savings rate need a server migration.
    source: web 02_FEATURES (DASHBOARD)
