# Source: app HOME_CARDS, NAVIGATION, HOME_WIDGET context docs; web DASHBOARD_WEB, APP_SHELL_WEB.
items:
  # Home cards
  - id: R-HOM-01
    group: Home cards
    title: Layout = wish · data = what shows
    text: |
      - removed cards stay removed
      - cards without data hide · editor says so
      - total balance header always there
    source: HOME_CARDS §1, §13 D1
  - id: R-HOM-02
    group: Home cards
    title: "Editor + presets: Pro"
    text: |
      - reorder · add (*Add another*) · remove · configure
      - presets: *Everyday* · *Minimal* · *Planner* · *Investor*
      - free default: free cards only · Pro cards locked in gallery
    source: HOME_CARDS §7, §13 D4
    tests:
      - file: test/features/home/ui/widgets/home_card_gallery_test.dart
        name: a card the plan does not cover wears the lock and says why
    related: [R-MON-12]
  - id: R-HOM-03
    group: Home cards
    title: Saves at once, with Undo
    text: |
      - no Save, no discard dialog
      - remove or preset → Undo restores the exact layout
    source: HOME_CARDS §7
    tests:
      - file: test/features/home/bloc/home_edit_cubit_test.dart
        name: undo restores the exact prior layout, order included
  - id: R-HOM-04
    group: Home cards
    title: New default card appears once
    text: only on layouts older than the card · never revives a removed one
    source: HOME_CARDS §2
    tests:
      - file: test/features/home/domain/home_layout_test.dart
        name: appends a default card introduced after the blob was written, once
  - id: R-HOM-05
    group: Home cards
    title: Layout per person, synced
    text: |
      - on your profile + device copy for the first frame
      - web has its own layout
    source: HOME_CARDS §3, §13 D6
  - id: R-HOM-06
    group: Home cards
    title: One quick-entry row
    text: |
      - your actions: scan, quick booking, search, shopping, add investment
      - then category tiles: favorites · most used · hand-picked
      - Pro ones wear the lock
    source: HOME_CARDS §8, MONETIZATION §3a
    tests:
      - file: test/features/home/ui/widgets/quick_actions_test.dart
        name: wears the lock; the free ones do not

  # Bottom bar & drawer
  - id: R-HOM-10
    group: Bottom bar & drawer
    title: "Every page: tab or page"
    text: |
      - bar: 1, 2 or 4 tabs · + needs the middle
      - rest in the drawer · deep links always work
      - 1 tab = no bar
    source: NAVIGATION §1–§2
    tests:
      - file: test/core/navigation/nav_layout_test.dart
        name: drops the last tab of a 3-tab list
      - file: test/core/navigation/nav_layout_test.dart
        name: one tab has no bar
  - id: R-HOM-11
    group: Bottom bar & drawer
    title: Default bar follows the plan
    text: |
      - Free: Home · + · Budget Book
      - Pro/Cloud: Home · Book · + · Stats · Goals, at once
      - saved bar always wins · editing the bar = Pro
    source: NAVIGATION §6 (decided 2026-10-16)
  - id: R-HOM-12
    group: Bottom bar & drawer
    title: A bar per book
    text: |
      - on your profile · each member their own
      - nothing written automatically
    source: NAVIGATION §6
  - id: R-HOM-13
    group: Bottom bar & drawer
    title: Locked pages form a Pro group
    text: |
      - Free: Analytics, Shopping list, Investments, Forecast leave the page list
      - Pro group at the **very end**, after Settings, Tips, Feedback
      - header: crown, *Pro features*, *Get Pro* · rows dimmed, no padlock
      - tap → that feature's paywall · read-only page with records
    source: NAVIGATION §8, MONETIZATION §3a, §7 (decided 2026-10-21)
    tests:
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Free: the locked pages leave the list for the Pro group, last in the drawer, in their usual order'
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Free: listed dimmed in the Pro group, and a tap opens the paywall at Analytics'
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Pro: every page back in its place'
    related: [D-HOM-5, R-MON-45]

  # Android widgets
  - id: R-HOM-20
    group: Android widgets
    title: Eight Android widgets
    text: |
      - category booking · new booking · quick booking · scan
      - total balance · budget · goal/loan · shopping list
      - iOS planned
    source: HOME_WIDGET §13
  - id: R-HOM-21
    group: Android widgets
    title: Tap opens the app
    text: |
      - **never** saves in the background · needs sync, balances, validation
      - archived/gone category → placeholder · tap reconfigures
      - widget of another book keeps its last figures while that book is closed (2026-11-12) · refreshed when it is opened again
    source: HOME_WIDGET §2, §12
  - id: R-HOM-22
    group: Android widgets
    title: Widgets follow privacy + sign-in
    text: |
      - hide amounts → masked
      - signed out → *Open Money Koi to sign in*
      - shopping widget read-only after the plan
    source: AMOUNT_PRIVACY §4, MONETIZATION §9a, HOME_WIDGET §13
    related: [R-PRIV-14]

  # Web
  - id: R-HOM-30
    group: Web shell
    title: "Web: sidebar, ⌘K, +"
    text: |
      - sidebar (drawer on phones) · ⌘K: pages, actions, records
      - sidebar footer: *Add Booking* full width · *Quick entry* · *Enter Receipt*
      - window ≤ 900px tall: the three in one row · *Quick entry* and *Enter Receipt* as icons, label and key in the tooltip
      - keys **N** · **Q** · **R**, shown on the buttons and in ⌘K · not while typing
      - long press mobile + → quick entry
      - dark only · no offline
    source: APP_SHELL_WEB §1, §4.7, web 02_FEATURES
  - id: R-HOM-31
    group: Web shell
    title: "Web dashboard: 17 card types"
    text: |
      - own layout · *Customize* · every card's settings in the editor
      - a card's pill (its range · the forecast's horizon) opens a menu under it, no dialog · each range shows its dates · a pick is saved at once
      - the pill menu's *More settings* → that card's settings · cards without a pill: the editor only
      - summary tiles open *Balance* · *Analytics* for that month · all time
      - default = the app's without quick add · add it from *Customize* · it sits in a column
      - no cash-flow sheet · 3 cards need a server migration
    source: web 02_FEATURES (DASHBOARD §1, §4.11, §4.20)
    tests:
      - file: src/app/(main)/dashboard/components/card-pill-menu.test.tsx
        repo: web
        name: drops the ranges from the pill and writes the pick into the card's config
      - file: src/app/(main)/dashboard/components/card-pill-menu.test.tsx
        repo: web
        name: opens the card's settings from the menu, only when it has more than the range
      - file: e2e/dashboard.spec.ts
        repo: web
        name: a card's range pill switches its range in place and saves it
  # New-user layer
  - id: R-HOM-40
    group: New users
    title: Getting started card
    text: |
      - only after setup on *this* phone · gone after 14 days, when done, or on ×
      - 5 items: first entry · scan · regular payment · monthly budget · widget (Android) · ticked from data, also from the web
      - tap an open item's circle → ticked by hand (skip) · tap again → open · a tick from data cannot be taken back
      - next open item expanded with its button · *All set* once, then gone · × has Undo · hand-ticking the last item has Undo
      - never for a read-only member · an existing account on a new phone never sees it
    source: GETTING_STARTED §1–§3
    tests:
      - file: test/features/getting_started/service/new_user_progress_test.dart
        name: the layer switches off after the window, whatever was done
      - file: test/features/getting_started/use_cases/get_checklist_use_case_test.dart
        name: "ticks come from data: a booking, a scan, an active rule, an active budget, a placed widget"
      - file: test/features/getting_started/ui/getting_started_card_test.dart
        name: × dismisses with an undo
      - file: test/features/getting_started/bloc/getting_started_cubit_test.dart
        name: a hand tick skips an open item at once and records it; a second tap takes it back
      - file: test/features/getting_started/ui/getting_started_card_test.dart
        name: ticking the last open item by hand offers an undo
    related: [R-HOM-01, R-SET-12]
  - id: R-HOM-41
    group: New users
    title: Cards earn their place
    text: |
      - trend + timeline: only once bookings span 2 days
      - *Upcoming*: only once a recurring rule exists
      - zero bookings: *First entry* card (or the checklist) with *Add entry* + *Scan a receipt*
    source: GETTING_STARTED §3, HOME_CARDS §4
    tests:
      - file: test/features/home/use_cases/get_dashboard_layout_use_case_test.dart
        name: the trend and the timeline wait for a second booking day
    related: [R-HOM-01]
  - id: R-HOM-42
    group: New users
    title: Just-in-time hints
    text: |
      - one sentence + one action · shown once, never twice · each retired by using the feature
      - quick add: after the 3rd form entry, a bubble above **+** · hold + = quick entry
      - make recurring: a saved entry in a fixed-cost category (rent, insurance) → snackbar *Make recurring*
      - scan: 5 form entries and no scan → one line under the amount of a new entry
      - calendar: 3rd Budget Book open with ≥ 7 entries → chip above the tabs
      - second book joined or created → one line under the Home header, *Switch book* opens the switcher
      - only in the first 14 days after setup on this phone · at most one hint per screen visit
    source: GETTING_STARTED §4
    tests:
      - file: test/features/getting_started/use_cases/hint_triggers_use_case_test.dart
        name: is due from the third form save on
      - file: test/features/getting_started/use_cases/hint_triggers_use_case_test.dart
        name: a rule already in that category retires it; one elsewhere does not
      - file: test/main/ui/widgets/shell_create_button_test.dart
        name: never on the first frame; drawn above the + after a booking lands, and written as shown
    related: [R-HOM-40]
