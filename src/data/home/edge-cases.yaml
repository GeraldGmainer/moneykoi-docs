items:
  - id: E-HOM-01
    group: Home
    title: Layout from a newer build
    when: older app opens unknown cards/settings
    then: unknown cards hidden · unknown settings kept
    risk: medium
  - id: E-HOM-02
    group: Home
    title: Empty Home
    when: every card removed
    then: allowed · card invites back to the editor
    status: by-design
    risk: low
  - id: E-HOM-03
    group: Bar
    title: Free after Pro
    when: saved 4-tab bar, back on Free
    then: bar stays · locked pages + *See plans*
    risk: medium
    related: [R-MON-17]
  - id: E-HOM-04
    group: Widgets
    title: Widget tap + resume
    when: tap widget → background → resume
    then: page must **not** open again
    risk: medium
  - id: E-HOM-06
    group: Home
    title: First-entry card on a narrow phone
    when: 360–412 dp phone · German *Erste Buchung*
    then: button full width under the koi + bubble · label never clipped
    status: fixed
    risk: low
    tests:
      - file: test/features/home/ui/widgets/onboarding_cards_test.dart
        name: on a small phone the button runs the full card width under the koi and its bubble
  - id: E-HOM-05
    group: Web
    title: Web render error
    when: a page throws while rendering
    then: no error page · blank screen, no recovery
    status: known-issue
    risk: medium
  - id: E-HOM-07
    group: Widgets
    title: Widget pinned while the app runs
    when: balance, budget, goal or shopping widget placed with the app open · then tapped
    then: the tap resumes the app → the widget fills · before 2026-10-28 it kept *Tap to open the app once* until a cold start or a data change
    status: fixed
    risk: low
    tests:
      - file: test/features/home_widget/widget_snapshot_service_test.dart
        name: a resume refreshes the placed widgets, so one pinned while the app ran fills on its tap
  - id: E-HOM-08
    group: Bar
    title: Tab header under the status bar
    when: Budget Book, Analytics or Goals tab scrolled down on a phone
    then: the header scrolls away behind a plain status-bar strip · nothing shows under the clock · before 2026-10-28 the title and the menu button slid under it and the button could not be tapped
    status: fixed
    risk: low
  - id: E-HOM-09
    group: Bar
    title: Bottom bar under the quick-booking sheet on an Android tablet
    when: Android tablet (10", 800 dp) · long-press + · the quick-booking sheet is open
    then: the bottom bar overflows by 3.5–13 px behind the sheet · clipped in a release build · iPad and phones fine · found by the Play tablet screenshot run 2026-11-01 · open
    status: known-issue
    risk: low
    related: [E-SCN-10]
  - id: E-HOM-10
    group: Web
    title: "Web forecast card: a balance that doesn't move"
    when: Web Home · *Forecast* card · nothing planned or estimated changes the balance over the horizon
    then: a flat line across the chart, the closing under it and *$ 0 vs. today* · before 2026-11-03 the chart showed only a dot on the last day and read as broken (the line's colour gradient drew nothing on a flat line; Analytics' savings-rate line had the same trap)
    status: fixed
    risk: low
  - id: E-HOM-11
    group: Getting started
    title: Undo after × leaves the card gone
    when: "*Getting started* × → *Undo* (or the last item ticked → *All set* → *Undo*)"
    then: fixed 2026-11-03 · the card comes back at once · before it stayed gone until the next tab switch (IOS-3-2)
    status: fixed
    risk: medium
    related: [C-HOM-010]
    tests:
      - file: test/features/getting_started/ui/getting_started_card_test.dart
        name: × dismisses with an undo, and Undo has Home show the card again
  - id: E-HOM-12
    group: Getting started
    title: Balance-check card on a brand-new book
    when: Quick Start on Nov 2
    then: fixed 2026-11-03 · no *New month — do the balances match?* card · first asked at the next month start (D-HOM-6, IOS-3-5)
    status: fixed
    risk: medium
    related: [R-BC-09, D-HOM-6]
    tests:
      - file: test/features/reconciliation/balance_check_nudge_use_case_test.dart
        name: a book created this period is not asked about the last one
  - id: E-HOM-13
    group: Home
    title: Quick-add tile splits a word
    when: German category *Privatentnahme* on a quick-add tile
    then: |
      - a word too wide shrinks the label (down to 75 %) · past that it ends in … on one line · never broken mid-word · Japanese may still wrap between characters
      - before 2026-11-03 *Privatentnah / me* (iOS round, IOS-6-9)
    status: fixed
    risk: low
    tests:
      - file: test/features/home/ui/widgets/quick_tile_label_test.dart
        name: scales a long word down instead of splitting it
      - file: test/features/home/ui/widgets/quick_tile_label_test.dart
        name: ellipsizes a word that cannot fit on one line
  - id: E-HOM-14
    group: On the web
    title: Summary fails to load
    when: the dashboard's summary read fails with nothing cached
    then: every summary tile shows — and *Couldn't load* · before 2026-11-12 the tiles read 0 € and 0 % (review 14)
    status: fixed
    risk: medium
    tests:
      - file: src/app/(main)/dashboard/components/summary-cards.test.tsx
        repo: web
        name: prints a dash on every tile when the read failed, never a zero
  - id: E-HOM-15
    group: On the web
    title: Percentages ignored the number format
    when: German number format, investments card on the dashboard
    then: gains read *-1,3 %* and *+529,6 %* · before 2026-11-12 they printed with a dot (*-1.3 %*) beside *31,4 %* on the savings tile
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/investments/lib/format.test.ts
        repo: web
        name: takes the user's number format when handed one
  - id: E-HOM-16
    group: Android widgets
    title: Widgets after a book switch
    when: widgets placed in book A · switch to book B
    then: they keep A's last figures · refresh when A opens again · a deleted record → placeholder · fixed 2026-11-12 · before, all turned into *tap to reconfigure* (bug hunt 54)
    status: fixed
    risk: medium
    tests:
      - file: test/features/home_widget/widget_snapshot_service_test.dart
        name: a widget bound in another book keeps its last snapshot while this book is open
  - id: E-HOM-17
    group: Getting started
    title: A saved scan never ticked *Scan a receipt*
    when: new user · scans a receipt (camera or gallery) and saves it
    then: the checklist ticks *Scan a receipt*, *Tips & features* counts the scanner as used, the scan nudge stops · fixed 2026-11-13 (I5-4) · before, the scan counter was never raised, so all three waited forever
    status: fixed
    risk: medium
    tests:
      - file: test/features/booking/ui/pages/add_receipt_page_flow_test.dart
        name: a saved scan counts once for the checklist, Tips & features and the scan nudge (I5-4)
  - id: E-HOM-18
    group: Bar
    title: Tabs dead beside the read-only button
    when: read-only book (deleted on the server, or the owner's Cloud ended) · the + is the grey crossed-out cloud · tap *Home* or *Book* in the bar
    then: the tab opens · only the round button opens the notice · fixed 2026-11-14 · before, the button's long-press hint covered the whole bar width and swallowed every tab tap
    status: fixed
    risk: medium
    related: [E-MON-23]
    tests:
      - file: test/main/ui/main_bottom_navigation_bar_test.dart
        name: on a read-only book the notice button takes only its own circle, the tabs beside it still switch
  - id: E-HOM-19
    group: Widgets
    title: Shopping widget rows stuck after an update
    when: shopping widget placed · app updated over it
    then: rows show the items · fixed 2026-11-14 · before, the launcher could keep its old row list and every row stayed on *Loading…* (*読み込んでいます…* on a Japanese phone) while title and count were right · a phone still showing it heals on a reboot, or remove and re-add the widget
    status: fixed
    risk: low
    related: [C-HOM-025]
    tests:
      - file: android/app/src/test/kotlin/com/psyren/moneykoi/widget/ShoppingListWidgetProviderTest.kt
        name: the adapter intent carries the row layout id
  - id: E-HOM-20
    group: Home
    title: "Empty book opened from a full one"
    when: "switch from a book with bookings to a new or joined empty book"
    then: "Home counts the new book and opens on its empty-book start · fixed 2026-11-16 · before, the old book's count stayed, the empty-book start never showed and later bookings did not re-resolve Home (bug hunt 39)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/home/bloc/home_layout_cubit_test.dart
        name: "a switch to an empty book counts its bookings again instead of keeping the last book's"
