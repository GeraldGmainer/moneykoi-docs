items:
  - id: E-HOM-01
    group: Home
    title: Layout from a newer build
    when: older app opens unknown cards/settings
    then: unknown cards hidden · unknown settings kept
    risk: medium
  - id: E-HOM-02
    group: Home
    title: Empty Home
    when: every card removed
    then: allowed · card invites back to the editor
    status: by-design
    risk: low
  - id: E-HOM-03
    group: Bar
    title: Free after Pro
    when: saved 4-tab bar, back on Free
    then: bar stays · locked pages + *See plans*
    risk: medium
    related: [R-MON-17]
  - id: E-HOM-04
    group: Widgets
    title: Widget tap + resume
    when: tap widget → background → resume
    then: page must **not** open again
    risk: medium
  - id: E-HOM-06
    group: Home
    title: First-entry card on a narrow phone
    when: 360–412 dp phone · German *Erste Buchung*
    then: button full width under the koi + bubble · label never clipped
    status: fixed
    risk: low
    tests:
      - file: test/features/home/ui/widgets/onboarding_cards_test.dart
        name: on a small phone the button runs the full card width under the koi and its bubble
  - id: E-HOM-05
    group: Web
    title: Web render error
    when: a page throws while rendering
    then: no error page · blank screen, no recovery
    status: known-issue
    risk: medium
