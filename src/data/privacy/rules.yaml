# Source: APP_LOCK_AI_CONTEXT.md, AMOUNT_PRIVACY_AI_CONTEXT.md, USAGE_STATS_AI_CONTEXT.md,
# WEB_SIGN_IN_AI_CONTEXT.md, MONETIZATION_AI_CONTEXT.md §5, §8.
items:
  # App lock
  - id: R-PRIV-01
    group: App lock
    title: Locked from the first frame
    text: |
      - lock up before anything draws · no flash
      - overlay over every screen · can't navigate away
      - system back does nothing while locked
    source: APP_LOCK §1, §2
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: biometrics alone lock the app at frame one
      - file: test/features/app_lock/ui/widgets/app_lock_gate_test.dart
        name: locked puts the lock screen over everything, and takes it away on unlock
  - id: R-PRIV-02
    group: App lock
    title: PIN and biometrics are separate
    text: |
      - either or both
      - one off → other keeps it locked · last one off unlocks
    source: APP_LOCK §1
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: disablePin keeps the app locked while biometrics remain on
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: disableBiometrics turns the lock off when it was the only method
  - id: R-PRIV-03
    group: App lock
    title: Fails open, per method
    text: |
      - PIN hash gone (keystore wiped, new phone) → PIN off
      - sensor or enrollment gone → biometrics off
      - **never** a lock nothing can pass
    source: APP_LOCK §1
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: fails open when the PIN is enabled but secure storage lost it
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: fails open when biometrics are the only method and the sensor is gone
  - id: R-PRIV-04
    group: App lock
    title: 4-digit PIN · 5 misses → 30 s
    text: |
      - stored only as a PBKDF2 hash, secure storage
      - every 5th miss → 30 s cooldown, survives a kill
      - biometrics allowed during it
    source: APP_LOCK §1, §3
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: the fifth miss starts a cooldown and submissions are ignored during it
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: restores a persisted cooldown deadline
  - id: R-PRIV-05
    group: App lock
    title: Shade never locks · switcher shield
    text: |
      - notification shade, permission dialog → only covered
      - background past the timeout → locks
    source: APP_LOCK §2
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: inactive only obscures, it never locks
      - file: test/features/app_lock/ui/widgets/app_lock_gate_test.dart
        name: in the app switcher the content is covered by the shield
  - id: R-PRIV-06
    group: App lock
    title: Lock belongs to the phone
    text: |
      - logout keeps it · signed-out books stay
      - off only when the phone's last data is wiped
    source: APP_LOCK §1
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: keeps secure storage, which holds the app lock
    related: [R-ACC-04]
  - id: R-PRIV-08
    group: App lock
    title: Off or a new PIN · confirm first
    text: |
      - turning PIN or biometrics off, and *Change PIN*, first ask for the current PIN or Face ID / fingerprint
      - PIN on → the PIN pad, with the biometric key when biometrics are on · biometrics alone → their prompt
      - the PIN asked here spends the lock screen's tries: 5 misses → 30 s, shared
      - nothing left that could confirm (biometrics removed while the app ran) → goes off unasked, the lock fails open on the next start anyway
    source: APP_LOCK §2
    tests:
      - file: test/features/settings/ui/pages/app_lock_settings_page_test.dart
        name: turning the PIN off asks for the current PIN first
      - file: test/features/settings/ui/pages/app_lock_settings_page_test.dart
        name: turning biometrics off when it was the only lock asks for them first, then says so
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: a wrong current PIN spends the lock screen
      - file: test/features/app_lock/ui/pages/pin_setup_page_test.dart
        name: "change: biometrics stand in for the current PIN"
    related: [D-PRIV-10, R-PRIV-04]
  - id: R-PRIV-09
    group: App lock
    title: Biometrics by their own name
    text: |
      - the switch says what the phone has: *Face ID* · *Touch ID* (iPhone) · *Fingerprint unlock* (Android, fingerprint only) · else *Biometric unlock*
      - icon to match, on the lock screen too
      - Face ID or a fingerprint set up while the app runs is offered on return, no restart
    source: APP_LOCK §2
    tests:
      - file: test/features/app_lock/domain/service/biometric_service_test.dart
        name: an iPhone with Face ID says Face ID, one with a home button Touch ID
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: a resume offers biometrics enrolled in the background, with their kind
      - file: test/features/settings/ui/pages/app_lock_settings_page_test.dart
        name: the biometric row names what the phone has
  - id: R-PRIV-07
    group: App lock
    title: Not in v1
    text: screenshot block · widget hiding when locked · other PIN lengths · passcode fallback · wipe after N tries · translated Face ID reason
    source: APP_LOCK

  # Hide amounts
  - id: R-PRIV-10
    group: Hide amounts
    title: Three modes, per device
    text: |
      - *Off* · *Tap to reveal* · *Always*
      - Settings → App preferences only
      - per phone, **not** synced · read before the first frame
    source: AMOUNT_PRIVACY §1, §6
    tests:
      - file: test/features/amount_privacy/bloc/amount_privacy_cubit_test.dart
        name: is already hidden on the first frame when the pref says so
  - id: R-PRIV-11
    group: Hide amounts
    title: Blur, not mask
    text: |
      - figures keep their width → no reflow
      - cost: width shows the size
      - chart tooltips show `••••`
    source: AMOUNT_PRIVACY §2, §4
    tests:
      - file: test/features/amount_privacy/ui/private_amount_test.dart
        name: scales the blur with the figure it hides
      - file: test/features/amount_privacy/domain/enums/amount_privacy_test.dart
        name: a masked figure is a fixed-width stand-in that does not leak its magnitude
  - id: R-PRIV-12
    group: Hide amounts
    title: Peek shows all, briefly
    text: |
      - *Tap to reveal*: tap any figure → all visible a few seconds
      - leave the app → peek ends
    source: AMOUNT_PRIVACY §1, §7
    tests:
      - file: test/features/amount_privacy/bloc/amount_privacy_cubit_test.dart
        name: reveals in tapToReveal and expires on its own
      - file: test/features/amount_privacy/bloc/amount_privacy_cubit_test.dart
        name: ends when the app leaves the foreground
  - id: R-PRIV-13
    group: Hide amounts
    title: Never hidden
    text: |
      - what you type or review · calculator · receipt review
      - money-format preview · percentages · counts · exports
      - insight sentences: only the amount blurs
    source: AMOUNT_PRIVACY §5
    tests:
      - file: test/features/amount_privacy/ui/private_amount_test.dart
        name: stays sharp when privacyExempt — a form the user is typing into
      - file: test/features/amount_privacy/ui/private_amount_test.dart
        name: blurs only the amount, leaving the sentence readable
  - id: R-PRIV-14
    group: Hide amounts
    title: Screen readers + widgets hide too
    text: |
      - reads "hidden amount"
      - widgets masked · always in *Tap to reveal*
      - widgets refresh when the setting flips
    source: AMOUNT_PRIVACY §2, §7
    tests:
      - file: test/features/amount_privacy/ui/widgets/amount_privacy_scope_test.dart
        name: switching hiding on or off refreshes the home-screen widgets

  # Usage statistics
  - id: R-PRIV-20
    group: Usage statistics
    title: Opt-in, first-party, no SDK
    text: |
      - nothing sent before a **yes**
      - Money Koi's own server only · no Google, Firebase, third party
      - ≠ the Analytics tab
    source: USAGE_STATS §1
    tests:
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: a decline sends nothing and is remembered
  - id: R-PRIV-21
    group: Usage statistics
    title: A fair ask
    text: |
      - once · ≥ 3 bookings + 2 days (web: 2 days)
      - never over a form or a deep link
      - yes and no look the same · swipe = no · never re-asks
      - per device or browser
    source: USAGE_STATS §2, §3
    tests:
      - file: test/features/usage_stats/ui/usage_consent_sheet_test.dart
        name: shows the ask with both answers side by side, same widget, same size
      - file: test/features/usage_stats/ui/usage_consent_sheet_test.dart
        name: a swipe away answers nothing, which the prompt reads as no
      - file: test/features/usage_stats/domain/usage_prompt_policy_test.dart
        name: never asks again after an answer
  - id: R-PRIV-22
    group: Usage statistics
    title: Withdrawing erases
    text: |
      - off → every event of this install deleted, retried until done
      - new yes → new random install id · never profile or book id
    source: USAGE_STATS §2
    tests:
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: a withdrawal erases the install on the server
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: an erase that fails waits for the next launch
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: a new grant after a withdrawal gets a new install id
  - id: R-PRIV-23
    group: Usage statistics
    title: No money, names, ids or text
    text: |
      - events: consent · session · screen · booking created · paywall shown · scan saved · import done
      - scan: route, counts, parser kind, never the shop
      - import (`import_completed`): recognized yes/no + a row-count bucket · never a bank, name, IBAN or amount
      - event names never renamed or reused
    source: USAGE_STATS §4
    tests:
      - file: test/features/usage_stats/domain/usage_event_test.dart
        name: carry the names and props the server and the dashboard expect
      - file: test/features/usage_stats/domain/usage_event_test.dart
        name: a scan clamps its counts and carries only enums and flags
      - file: test/features/data_import/use_cases/import_extras_test.dart
        name: import_completed carries a flag and a bucket, never a count, a name or an id
    related: [R-DATA-84]
  - id: R-PRIV-24
    group: Usage statistics
    title: Stats never compete with sync
    text: |
      - batched · failed send dropped · offline: nothing
      - purged after 400 days
    source: USAGE_STATS §5, §6
    tests:
      - file: test/features/usage_stats/data/usage_tracker_test.dart
        name: a failed send is swallowed
  - id: R-PRIV-25
    group: Usage statistics
    title: Usage never linked to an account
    text: |
      - usage events **never** joined to a profile, a purchase or a plan
      - admin: paywall views of opted-in installs · beside all purchases
      - never a conversion rate from the two
      - scan quality: aggregates of opted-in installs
    source: USAGE_STATS §2, §7 · moneykoi-supabase `20261110150000_admin_sales.sql`
    related: [T-MON-27, T-SCN-03]

  # Web sign-in
  - id: R-PRIV-30
    group: Web sign-in
    title: No session token in a URL
    text: |
      - computer gets its own session
      - nothing of the phone's leaves the phone
      - computer logout ends only the computer
    source: WEB_SIGN_IN §1, §2, §4
  - id: R-PRIV-31
    group: Web sign-in
    title: Approve only inside the app
    text: |
      - QR = request id only · secret stays in the tab
      - camera app → web page saying where to scan
      - confirm names the browser + warns · **never** auto-approve
    source: WEB_SIGN_IN §4
  - id: R-PRIV-32
    group: Web sign-in
    title: Code lives 3 min · approval final
    text: |
      - back declines a request on screen
      - an approval on its way can't be undone
    source: WEB_SIGN_IN §2, §4
    tests:
      - file: test/features/web_sign_in/ui/web_sign_in_scan_page_test.dart
        name: back while a request is on screen declines it instead of just leaving
  - id: R-PRIV-33
    group: Web sign-in
    title: "Release builds: production only"
    text: |
      - release → only `https://my.moneykoi.com`
      - dev → only local hosts · production code → *expired*
    source: WEB_SIGN_IN §4 rule 7
    tests:
      - file: test/features/web_sign_in/domain/web_sign_in_link_test.dart
        name: accepts a local web app, over http too, only from the hosts a dev build passes

  # What leaves the phone
  - id: R-PRIV-40
    group: What leaves the phone
    title: "Crash reports: opt-out, scrubbed, EU"
    text: |
      - Sentry EU · no personal data, replay, screenshots
      - user content scrubbed
      - sent **during use**, not only on a crash: errors · info + warning log lines · start timings (traces 100 %) · session start/end with Sentry's random install id
      - switching off stops Sentry at once (`Sentry.close()`) · nothing more until switched on
      - opt-out = Gerald's risk call (2026-10-14)
    source: MONETIZATION §8 item 5a
    tests:
      - file: test/app/sentry/sentry_helper_test.dart
        name: points at the configured project and never sends personal data
      - file: test/app/sentry/sentry_helper_test.dart
        name: never records or captures the screen
    related: [D-PRIV-1]
  - id: R-PRIV-41
    group: What leaves the phone
    title: "Live prices: the only request"
    text: |
      - always the whole list, never only holdings
      - off: Settings → Privacy & Legal → *Live prices*
    source: MONETIZATION §5
    related: [R-MON-50, R-MON-51]
  - id: R-PRIV-42
    group: What leaves the phone
    title: Receipts read on the phone
    text: |
      - on-device OCR · no cloud AI
      - photos stay on the phone · Cloud book → book storage
    source: 01_OVERVIEW, OFFLINE_TIER §7
