# Source: APP_LOCK_AI_CONTEXT.md, AMOUNT_PRIVACY_AI_CONTEXT.md, USAGE_STATS_AI_CONTEXT.md,
# WEB_SIGN_IN_AI_CONTEXT.md, MONETIZATION_AI_CONTEXT.md §5, §8.
items:
  # App lock
  - id: R-PRIV-01
    group: App lock
    title: Locked from the first frame
    text: |
      An enabled lock is up before anything is drawn — no flash of content. The lock is an overlay over every screen; it cannot be navigated away from, and the system back gesture does nothing while locked.
    source: APP_LOCK §1, §2
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: biometrics alone lock the app at frame one
      - file: test/features/app_lock/ui/widgets/app_lock_gate_test.dart
        name: locked puts the lock screen over everything, and takes it away on unlock
  - id: R-PRIV-02
    group: App lock
    title: PIN and biometrics are independent
    text: |
      Either or both. Turning one off keeps the app locked while the other is on; only the last one off unlocks.
    source: APP_LOCK §1
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: disablePin keeps the app locked while biometrics remain on
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: disableBiometrics turns the lock off when it was the only method
  - id: R-PRIV-03
    group: App lock
    title: Fail open, per method
    text: |
      A PIN whose hash is gone (keystore wiped, backup restored onto a new phone) or biometrics whose sensor or enrollment is gone turn off. Never a lock screen nothing can pass.
    source: APP_LOCK §1
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: fails open when the PIN is enabled but secure storage lost it
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: fails open when biometrics are the only method and the sensor is gone
  - id: R-PRIV-04
    group: App lock
    title: 4-digit PIN, 5 misses → 30 s cooldown
    text: |
      The PIN is stored only as a PBKDF2 hash in secure storage. Every 5th miss starts a 30 s cooldown that survives a kill; biometrics stay allowed during it.
    source: APP_LOCK §1, §3
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: the fifth miss starts a cooldown and submissions are ignored during it
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: restores a persisted cooldown deadline
  - id: R-PRIV-05
    group: App lock
    title: The shade never locks; the app switcher shows a shield
    text: |
      Pulling the notification shade or a permission dialog only obscures. Backgrounding past the timeout locks.
    source: APP_LOCK §2
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: inactive only obscures, it never locks
      - file: test/features/app_lock/ui/widgets/app_lock_gate_test.dart
        name: in the app switcher the content is covered by the shield
  - id: R-PRIV-06
    group: App lock
    title: The lock belongs to the phone
    text: |
      A logout keeps it, because the phone keeps the signed-out account's books. Only wiping the phone's last data (*Delete account* or *Delete all data* with nothing else here) turns it off.
    source: APP_LOCK §1
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: keeps secure storage, which holds the app lock
    related: [R-ACC-04]
  - id: R-PRIV-07
    group: App lock
    title: Not in v1
    text: |
      Screenshot blocking, hiding widget amounts while locked, PIN lengths other than 4, a device-passcode fallback, wipe after N attempts, a translated Face ID reason.
    source: APP_LOCK

  # Hide amounts
  - id: R-PRIV-10
    group: Hide amounts
    title: Three modes, per device
    text: |
      *Off* · *Tap to reveal* · *Always*, in Settings → App preferences only. Stored on the phone, not synced — the tablet on the desk and the phone on the train want different answers — and read before the first frame.
    source: AMOUNT_PRIVACY §1, §6
    tests:
      - file: test/features/amount_privacy/bloc/amount_privacy_cubit_test.dart
        name: is already hidden on the first frame when the pref says so
  - id: R-PRIV-11
    group: Hide amounts
    title: Blur, not mask
    text: |
      Figures keep their width, so nothing reflows. Accepted cost: the width still shows the magnitude. Chart tooltips, which can only take text, show `••••`.
    source: AMOUNT_PRIVACY §2, §4
    tests:
      - file: test/features/amount_privacy/ui/private_amount_test.dart
        name: scales the blur with the figure it hides
      - file: test/features/amount_privacy/domain/enums/amount_privacy_test.dart
        name: a masked figure is a fixed-width stand-in that does not leak its magnitude
  - id: R-PRIV-12
    group: Hide amounts
    title: A peek shows everything briefly, and ends in the background
    text: |
      In *Tap to reveal*, tapping any figure reveals all of them for a few seconds; leaving the app ends it, so a phone handed over mid-peek shows nothing.
    source: AMOUNT_PRIVACY §1, §7
    tests:
      - file: test/features/amount_privacy/bloc/amount_privacy_cubit_test.dart
        name: reveals in tapToReveal and expires on its own
      - file: test/features/amount_privacy/bloc/amount_privacy_cubit_test.dart
        name: ends when the app leaves the foreground
  - id: R-PRIV-13
    group: Hide amounts
    title: What is never hidden
    text: |
      What you type or review (amount fields, the calculator, receipt review), the money-format preview, percentages and counts, CSV and archive exports. Insight sentences blur only the amount.
    source: AMOUNT_PRIVACY §5
    tests:
      - file: test/features/amount_privacy/ui/private_amount_test.dart
        name: stays sharp when privacyExempt — a form the user is typing into
      - file: test/features/amount_privacy/ui/private_amount_test.dart
        name: blurs only the amount, leaving the sentence readable
  - id: R-PRIV-14
    group: Hide amounts
    title: Screen readers and widgets hide them too
    text: |
      A hidden figure reads as "hidden amount". Android widgets are masked — permanently in *Tap to reveal*, since a widget cannot peek — and refresh when the setting flips.
    source: AMOUNT_PRIVACY §2, §7
    tests:
      - file: test/features/amount_privacy/ui/widgets/amount_privacy_scope_test.dart
        name: switching hiding on or off refreshes the home-screen widgets

  # Usage statistics
  - id: R-PRIV-20
    group: Usage statistics
    title: Opt-in, first-party, no SDK
    text: |
      Nothing is sent before a yes. Events go to MoneyKoi's own server only — no Google, no Firebase, no third party. Not the Analytics tab, which is the user's own money.
    source: USAGE_STATS §1
    tests:
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: a decline sends nothing and is remembered
  - id: R-PRIV-21
    group: Usage statistics
    title: A fair ask
    text: |
      Asked once, ≥ 3 bookings and 2 days in (web: 2 days after the first visit), never over a form or a deep link. Both answers are the same widget, same size; swiping away is a no; it never comes back by itself. Per device or browser, not per account.
    source: USAGE_STATS §2, §3
    tests:
      - file: test/features/usage_stats/ui/usage_consent_sheet_test.dart
        name: shows the ask with both answers side by side, same widget, same size
      - file: test/features/usage_stats/ui/usage_consent_sheet_test.dart
        name: a swipe away answers nothing, which the prompt reads as no
      - file: test/features/usage_stats/domain/usage_prompt_policy_test.dart
        name: never asks again after an answer
  - id: R-PRIV-22
    group: Usage statistics
    title: Withdrawing erases
    text: |
      Switching off deletes every event of that install on the server (retried on the next launch until it works). A new yes gets a new random install id, never the profile or book id.
    source: USAGE_STATS §2
    tests:
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: a withdrawal erases the install on the server
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: an erase that fails waits for the next launch
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: a new grant after a withdrawal gets a new install id
  - id: R-PRIV-23
    group: Usage statistics
    title: An event never carries money, names, ids or text
    text: |
      Consent, session, screen (ids stripped), booking created (how and which type), paywall shown (which feature), scan saved (route, lock, clamped counts). Names are never renamed or reused.
    source: USAGE_STATS §4
    tests:
      - file: test/features/usage_stats/domain/usage_event_test.dart
        name: carry the names and props the server and the dashboard expect
  - id: R-PRIV-24
    group: Usage statistics
    title: Statistics never compete with sync
    text: |
      Batched, a failed send is dropped, offline nothing is tried. Events older than 400 days are purged.
    source: USAGE_STATS §5, §6
    tests:
      - file: test/features/usage_stats/data/usage_tracker_test.dart
        name: a failed send is swallowed

  # Web sign-in
  - id: R-PRIV-30
    group: Web sign-in
    title: Never a session token in a URL
    text: |
      The computer gets a session of its own; nothing of the phone's leaves the phone. Logging out on the computer ends only the computer's session.
    source: WEB_SIGN_IN §1, §2, §4
  - id: R-PRIV-31
    group: Web sign-in
    title: Approve only from inside the app
    text: |
      The QR holds only a request id; the secret stays in the browser tab. The QR's address is not an app link — a camera app opens a web page that says where to scan. The confirm step names the browser ("Chrome · macOS") and warns; never auto-approve.
    source: WEB_SIGN_IN §4
  - id: R-PRIV-32
    group: Web sign-in
    title: A code lives 3 minutes; an approval cannot be taken back
    text: |
      Back declines a request on screen, but does nothing while an approval is on its way.
    source: WEB_SIGN_IN §2, §4
    tests:
      - file: test/features/web_sign_in/ui/web_sign_in_scan_page_test.dart
        name: back while a request is on screen declines it instead of just leaving
  - id: R-PRIV-33
    group: Web sign-in
    title: Release builds approve only the production site
    text: |
      A release build accepts only `https://my.moneykoi.app`; a dev build only local hosts over http — scanning the production code with a dev build answers "expired".
    source: WEB_SIGN_IN §4 rule 7
    tests:
      - file: test/features/web_sign_in/domain/web_sign_in_link_test.dart
        name: accepts a local web app, over http too, only from the hosts a dev build passes

  # What leaves the phone
  - id: R-PRIV-40
    group: What leaves the phone
    title: Crash reports are opt-out, scrubbed, EU
    text: |
      Sentry in the EU region, no personal data, no session replay, screenshots or view hierarchy, user content scrubbed from logs. Opt-out by Gerald's risk call (2026-10-14).
    source: MONETIZATION §8 item 5a
    tests:
      - file: test/app/sentry/sentry_helper_test.dart
        name: points at the configured project and never sends personal data
      - file: test/app/sentry/sentry_helper_test.dart
        name: never records or captures the screen
    related: [D-PRIV-1]
  - id: R-PRIV-41
    group: What leaves the phone
    title: Live prices is the one request a book without an account makes
    text: |
      Always the whole price list, never only what the user holds. Off in Settings → Privacy & Legal → *Live prices*.
    source: MONETIZATION §5
    related: [R-MON-50, R-MON-51]
  - id: R-PRIV-42
    group: What leaves the phone
    title: Receipts are read on the phone
    text: |
      On-device OCR, no cloud AI. Photos stay on the phone unless the book syncs (Cloud) — then they go to the book's storage.
    source: 01_OVERVIEW, OFFLINE_TIER §7
