# Source: Trello release notes 1.17.0 (item 20). The other groups are derived from the
# APP_LOCK / AMOUNT_PRIVACY / WEB_SIGN_IN context docs, not from an earlier checklist.
groups:
  - id: app-lock
    title: App lock
    items:
      - id: C-PRIV-001
        text: PIN on → kill → reopen → locked from the first frame, no flash
      - id: C-PRIV-002
        text: Biometrics only → *Unlock* · cancel prompt → *Unlock* asks again
      - id: C-PRIV-003
        text: Shade, permission dialog → no lock · app switcher → shield
      - id: C-PRIV-004
        text: 5 wrong PINs → 30 s countdown · kill → still counting · biometrics work
      - id: C-PRIV-005
        text: Logout → lock stays · *Delete all data* (nothing else) → lock off
      - id: C-PRIV-006
        text: TalkBack on → PIN gate up → swipe through → only the lock is read, no balances · app switcher shield same · unlock → app readable again

  - id: hide-amounts
    title: Hide amounts
    items:
      - id: C-PRIV-010
        text: "*Always* → Home, Budget Book, analytics, widget hidden · booking form amount readable"
      - id: C-PRIV-011
        text: "*Tap to reveal* → tap → all visible briefly · background → hidden"
      - id: C-PRIV-012
        text: TalkBack / VoiceOver read *hidden*, not the number

  - id: usage
    title: Usage statistics
    setup: "Prompt again: Debug → Prefs → reset `usage_stats_consent` + `usage_stats_eligible_since` → date +2 days"
    items:
      - id: C-PRIV-020
        text: ≥ 3 bookings + 2 days → sheet once · *No* or swipe → never again
      - id: C-PRIV-021
        text: On → events in admin `/dashboard/usage` · off → this install's rows deleted
      - id: C-PRIV-022
        text: "Event props: no amounts, names or ids"

  - id: web-sign-in
    title: Use on computer
    items:
      - id: C-PRIV-030
        text: "Release + prod web: web *Sign in with the app* · app *Use on computer* → *Scan code* → *Sign in* → dashboard · web logout → phone still in"
      - id: C-PRIV-031
        text: "*Cancel* → browser *declined* · wait 3 min → *Expired*"
      - id: C-PRIV-032
        text: Camera app scan → web page saying where to scan
