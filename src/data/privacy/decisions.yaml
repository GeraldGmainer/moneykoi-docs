items:
  - id: D-PRIV-1
    question: "Crash reports: opt-in or opt-out?"
    status: decided
    date: 2026-10-14
    answer: |
      - **opt-out**, Gerald's risk call
      - risk lowered: EU, no PII, no replay, scrubbing
      - open: DPA, policy, lawyer (T-PRIV-04)
  - id: D-PRIV-2
    question: "Usage stats: opt-in or default on?"
    status: decided
    date: 2026-10-14
    answer: |
      - **opt-in**
      - EU Digital Omnibus may allow default-on later (Art. 88a, not law yet)
      - never before that
  - id: D-PRIV-3
    question: An analytics SDK?
    status: decided
    answer: None · store listing promises no SDKs · Exodus shows Sentry only
    related: [X7]
  - id: D-PRIV-4
    question: "Hide amounts: synced or per device?"
    status: decided
    answer: Per device · read before the first frame
  - id: D-PRIV-5
    question: Quick toggle outside Settings?
    status: decided
    date: 2026-09-14
    answer: |
      - removed (Home eye button)
      - comeback needs a "last mode" memo
  - id: D-PRIV-6
    question: Re-ask consent when its text changes?
    status: decided
    answer: Text has version 1 · re-asking is a decision each time
  - id: D-PRIV-7
    question: May the store listing say "your data stays on your phone"?
    status: decided
    date: 2026-10-17
    answer: |
      - yes · for a book without an account only
      - Cloud books sync to Supabase (EU) · never claim it there
  - id: D-PRIV-8
    question: "Self-hosting: your data, your server?"
    status: open
    answer: |
      - idea from the Trello board
      - no plan yet · decide if it is worth one
