# Source: APP_LOCK, AMOUNT_PRIVACY, USAGE_STATS, WEB_SIGN_IN context docs; moneykoi-web
# AUTH_PROFILE_WEB §8, DATA_EXPORT_WEB §9.
items:
  # App lock
  - id: E-PRIV-01
    group: App lock
    title: Biometric prompt backgrounds the app
    when: OS face/fingerprint sheet opens over the app
    then: ignored · else it re-locks in a loop
    risk: high
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: ignores lifecycle events while a biometric prompt is up
  - id: E-PRIV-02
    group: App lock
    title: One method fails open
    when: PIN + biometrics on · fingerprint removed
    then: biometrics off · PIN keeps it locked
    risk: medium
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: keeps the lock on when only one of the two methods fails open
  - id: E-PRIV-03
    group: App lock
    title: Prompt cancelled, biometrics only
    when: prompt cancelled, no PIN
    then: "*Unlock* button asks again"
    risk: low
    tests:
      - file: test/features/app_lock/ui/screens/lock_screen_test.dart
        name: the fingerprint key only shows when biometrics can be used, and retries them
  - id: E-PRIV-04
    group: App lock
    title: Kill during the cooldown
    when: app killed to skip the 30 s
    then: cooldown still running
    risk: medium
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: restores a persisted cooldown deadline

  # Hide amounts
  - id: E-PRIV-10
    group: Hide amounts
    title: Handed over mid-peek
    when: peek → background → hand over
    then: peek ended · all hidden
    risk: medium
    tests:
      - file: test/features/amount_privacy/bloc/amount_privacy_cubit_test.dart
        name: ends when the app leaves the foreground
  - id: E-PRIV-11
    group: Hide amounts
    title: Width shows the size
    when: blurred balance next to a short one
    then: 8 vs 4 characters visible · accepted for a still layout
    status: by-design
    risk: low
  - id: E-PRIV-12
    group: Hide amounts
    title: "*Always* and row taps"
    when: "*Always* · tap a row on its amount"
    then: row opens · no tap handler on figures
    risk: low

  # Usage statistics
  - id: E-PRIV-20
    group: Usage statistics
    title: Erase while offline
    when: stats switched off without connection
    then: erase retried each launch until done
    risk: medium
    tests:
      - file: test/features/usage_stats/use_cases/usage_consent_use_case_test.dart
        name: an erase that fails waits for the next launch
  - id: E-PRIV-21
    group: Usage statistics
    title: Prompt never showed · fixed
    when: "before 2026-10-14: count stuck at 1"
    then: real count now · shows after 3 bookings
    status: fixed
    risk: low
    tests:
      - file: test/features/usage_stats/domain/usage_prompt_policy_real_count_test.dart
        name: asks once three stored bookings and the waiting days are there

  # Web sign-in
  - id: E-PRIV-30
    group: Web sign-in
    title: Phishing page relays a real code
    when: fake site shows a real Money Koi QR
    then: confirm names the browser + warns · user's only cue
    status: by-design
    risk: high
  - id: E-PRIV-31
    group: Web sign-in
    title: Camera denied
    when: camera denied, back to the scanner
    then: never re-asked on resume · only re-read
    risk: low
    tests:
      - file: test/features/web_sign_in/ui/qr_camera_view_test.dart
        name: a denied camera is never asked for again on resume, only re-read
  - id: E-PRIV-32
    group: Web sign-in
    title: Code ran out
    when: "> 3 min before *Sign in*"
    then: "*Expired* + *Scan again*"
    risk: low
    tests:
      - file: test/features/web_sign_in/ui/web_sign_in_scan_page_test.dart
        name: an expired code offers to scan again
  - id: E-PRIV-33
    group: Web sign-in
    title: Unused magic link replaced
    when: login email asked, then QR sign-in
    then: QR replaces the email link · accepted
    status: by-design
    risk: low
  - id: E-PRIV-34
    group: Web sign-in
    title: Old app, new address
    when: app before the moneykoi.com release scans the QR on `my.moneykoi.com`
    then: read as a foreign code · update the app
    status: known-issue
    risk: medium
    related: [T-PLAT-02]

  # Web
  - id: E-PRIV-40
    group: Web security issues
    title: Web open redirect
    when: "`/login?next=/\\evil.example`"
    then: dashboard · `?next=` is parsed, not prefix-matched · only a path on this site is followed (review 5, fixed 2026-10-24)
    status: fixed
    risk: high
    tests:
      - file: src/app/login/page.test.tsx
        repo: web
        name: ignores a backslash-prefixed ?next= that browsers resolve off-origin
      - file: src/app/login/lib/next-path.test.ts
        repo: web
    related: [T-PRIV-05, E-ACC-50]
  - id: E-PRIV-41
    group: Web security issues
    title: "Any URL as avatar (tracking pixel)"
    when: a member writes a foreign URL to their `profile.avatar_url` · co-members open a shared book
    then: |
      - web: the photo only from our `avatars` bucket, else the initial · the foreign URL is never requested (review 21, fixed 2026-11-02)
      - server: `profile_avatar_url_chk` refuses any other URL · stored ones reset to no photo · live after T-PRIV-06
      - app: shows any URL until then (`member_avatar.dart`)
    status: fixed
    risk: medium
    tests:
      - file: src/lib/profile/avatar-url.test.ts
        repo: web
      - file: src/components/shared/member-attribution.test.tsx
        repo: web
        name: never requests an avatar from outside our avatars bucket
      - file: src/app/(main)/shopping/components/item-row.test.tsx
        repo: web
        name: never requests a creator's avatar from outside our avatars bucket
    related: [T-PRIV-05, T-PRIV-06, E-ACC-52, E-PRIV-45]
  - id: E-PRIV-42
    group: Web security issues
    title: Web dev logins in code
    when: "`DEV_USERS` with one shared password committed in `login/page.tsx`"
    then: |
      - out of the source · read from `.env.development.local` under `npm run dev` only · without it no dev buttons (review 20, fixed 2026-11-02)
      - a production build carries none, even when set
      - the old password stays in git history · rotated by T-PRIV-06
    status: fixed
    risk: medium
    tests:
      - file: src/app/login/page.test.tsx
        repo: web
        name: offers none outside development, even with accounts in the env
      - file: src/app/login/lib/dev-logins.test.ts
        repo: web
    related: [T-PRIV-05, T-PRIV-06, E-ACC-53]
  - id: E-PRIV-45
    group: Web security issues
    title: Any URL as a book picture
    when: a book owner writes a foreign URL to `tenant.avatar_url`
    then: the app loads it for every member (book card, switcher) · no server check yet · the web shows no book pictures
    status: known-issue
    risk: low
    related: [E-PRIV-41]
  - id: E-PRIV-43
    group: Web security issues
    title: CSV formula injection
    when: text starts with `=` `+` `-` `@`, tab or CR · exported
    then: "leading `'` → a spreadsheet shows it, never runs it · amounts stay bare · import strips the `'` · app + web (review 10, fixed 2026-11-02)"
    status: fixed
    risk: high
    tests:
      - file: test/shared/export/service/csv_encoder_test.dart
        name: a text cell starting with = + - @, a tab or a CR gets a leading quote
      - file: test/shared/export/service/csv_encoder_test.dart
        name: a numeric column is written raw, so a negative amount stays a number
      - file: src/lib/export/csv.test.ts
        name: quotes a text cell starting with = + - @, a tab or a CR
        repo: web
    related: [T-DATA-03, R-DATA-52]
  - id: E-PRIV-44
    group: App lock
    title: Screen reader behind the lock
    when: PIN gate or app-switcher shield up · TalkBack on
    then: the app behind it is hidden from the screen reader · before 2026-10-23 balances were readable
    status: fixed
    risk: high
    tests:
      - file: test/features/app_lock/ui/widgets/app_lock_gate_test.dart
        name: a screen reader reaches the app only while it is unlocked and in front
  - id: E-PRIV-46
    group: App lock
    title: Lock turned off by whoever holds the open app
    when: app unlocked · Settings → App lock → *PIN unlock* off (or *Change PIN*)
    then: asks for the current PIN or biometrics first · before 2026-11-03 nothing was asked · found by the iOS simulator round (IOS-8-3)
    status: fixed
    risk: high
    related: [R-PRIV-08, D-PRIV-10]
    tests:
      - file: test/features/settings/ui/pages/app_lock_settings_page_test.dart
        name: a cancelled PIN check leaves the lock on
  - id: E-PRIV-47
    group: App lock
    title: Face ID set up while the app runs
    when: Face ID enrolled in iOS Settings with the app open · back to Settings → App lock
    then: the biometric switch is offered on return · before 2026-11-03 only after a restart (IOS-8-2)
    status: fixed
    risk: low
    related: [R-PRIV-09]
    tests:
      - file: test/features/app_lock/bloc/app_lock_cubit_test.dart
        name: a resume offers biometrics enrolled in the background, with their kind
