items:
  - id: E-REC-01
    group: Rules
    title: Sparse rule looked ended
    when: '"every 3 years", no date in the 730-day scan'
    then: scan widens with the interval · not *Ended*
    status: fixed
    risk: medium
  - id: E-REC-02
    group: Rules
    title: Other client rewrites the rule
    when: rule with unknown constructs opened + saved
    then: rewritten to what the editor knows
    status: by-design
    risk: low
  - id: E-REC-03
    group: Rules
    title: Daylight saving
    when: daily/weekly rule across DST
    then: steps by calendar day · never wrong day
    risk: high
  - id: E-REC-04
    group: Web
    title: "Web: moved start date"
    when: web *Make recurring*, start date moved
    then: fixed 2026-10-28 · the cursor is the booking's own date, as the app pins it · a later start no longer skips its first occurrence
    status: fixed
    risk: high
  - id: E-REC-05
    group: Web
    title: Web amount separators
    when: "`1,250.00` or German `1.500`"
    then: rejected or 1.5 · open · the 3rd decimal is kept since 2026-10-28 (rounds to the book's currency, as the app)
    status: known-issue
    risk: medium
  - id: E-REC-06
    group: Web
    title: Web rule time zone
    when: rule created on the web
    then: browser's zone · app uses Europe/Vienna
    status: by-design
    risk: low
  - id: E-REC-07
    group: Web
    title: Web projects a broken rule
    when: rule's category/account deleted
    then: still in Upcoming + 30-day stat until paused
    status: known-issue
    risk: low
  - id: E-REC-08
    group: List
    title: Numeric *Next* date on a rule
    when: rules list · next run Dec 1
    then: "*Next: Dec 1* · year only when it differs · before 2026-11-03 *12/1/2026* · IOS-12-3"
    status: fixed
    risk: low
    tests:
      - file: test/features/recurring_booking/ui/widgets/recurring_booking_tile_test.dart
        name: a next date in another year names the year
  - id: E-REC-09
    group: Editor
    title: "*day(s)* beside the interval"
    when: custom interval 1 or more
    then: "*1 month* · *3 months* · de *Monat / Monate* · IOS-19-2"
    status: fixed
    risk: low
    tests:
      - file: test/app/i18n/pseudo_plurals_test.dart
        name: no English string fakes a plural
  - id: E-REC-10
    group: Make recurring
    title: Prefilled rule could not be saved
    when: a booking › ⋮ › *Make recurring*, or the *Does this repeat?* snackbar · nothing changed
    then: |
      - fixed 2026-11-06 · *Save* is on for the complete prefilled rule · backing out asks before discarding it
      - before: *Save* stayed grey until a field was changed (AND-12-2, in 1.19.0 too)
    status: fixed
    risk: high
    tests:
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: backing out of an untouched prefilled rule asks before discarding it
  - id: E-REC-11
    group: Form
    title: "Type switched, old category kept"
    when: "recurring rule · Expense ↔ Income switched in the form"
    then: "category cleared · *Save* waits for one of the new type · fixed 2026-11-12 · before, an income rule booked expenses (bug hunt 20)"
    status: fixed
    risk: high
    tests:
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: "switching the type in the picker drops the category of the old type"
  - id: E-REC-12
    group: Rules and bookings
    title: Rule whose account or category was deleted
    when: Cloud book · an account or category a recurring rule uses is deleted
    then: rule kept, paused, listed as *Account missing* / *Category missing* · choosing one resumes it · account asked first · fixed 2026-11-12/13 · before, in no list (bug hunt 19, EC-TRASH-6)
    status: fixed
    risk: medium
    related: [E-ACC-40]
    tests:
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: a rule whose account was deleted asks for another account, and picking one resumes it
  - id: E-REC-13
    group: Rules and bookings
    title: Rule starting more than two years ahead
    when: start date more than two years from today (e.g. a yearly rule moved from Feb 29 to Feb 28, 2029)
    then: list and editor show its next dates · fixed 2026-11-13 · before, *No upcoming occurrences* (the two-year window opened today, not at the start)
    status: fixed
    risk: low
    tests:
      - file: test/features/recurring_booking/domain/recurrence/recurrence_projector_test.dart
        name: a rule that starts more than two years ahead still has a next date (A5-12)
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: a rule starting more than two years ahead still previews its dates (A5-12)
