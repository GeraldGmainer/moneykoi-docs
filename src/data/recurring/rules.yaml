# Source: app RECURRING_BOOKINGS_AI_CONTEXT.md, OFFLINE_TIER §4; web RECURRING_WEB_AI_CONTEXT.md.
items:
  - id: R-REC-01
    group: Rules and bookings
    title: A rule · the server books
    text: |
      - phone stores + edits the rule
      - server generator: hourly + every app resume → real bookings sync down
      - book without account → the phone generates, same rules
    source: RECURRING §1, OFFLINE_TIER §4
    related: [R-ACC-22]
  - id: R-REC-02
    group: Rules and bookings
    title: Future = projection, not booking
    text: |
      - Upcoming, Home, forecast: computed live
      - never stored, never in balances · corrects itself at today
    source: RECURRING §1, §4
    tests:
      - file: test/features/recurring_booking/domain/recurrence/recurrence_projector_test.dart
        name: excludes exdates
  - id: R-REC-03
    group: Rules and bookings
    title: "App + server: same dates"
    text: |
      - daily · weekly (weekdays) · monthly (days or *last day*) · yearly · every N
      - ends: never · on a date · after N
      - shared test vectors · editor offers only what both expand
    source: RECURRING §3
    tests:
      - file: test/features/recurring_booking/domain/recurrence/recurrence_parity_test.dart
        name: fixture vectors are loaded
  - id: R-REC-04
    group: Rules and bookings
    title: '*Last day*, never "31"'
    text: |
      - "31" skips Feb, Apr, Jun, Sep, Nov
      - bare monthly rule gets an explicit day first
    source: RECURRING §3
    tests:
      - file: test/features/recurring_booking/ui/widgets/recurrence_sheet_test.dart
        name: a bare monthly rule is given an explicit day before it can be applied
  - id: R-REC-05
    group: Rules and bookings
    title: Categorized or transfer, for good
    text: |
      - expense · income · transfer (From ≠ To, no category)
      - kind fixed after creation · transfer nets 0 in Upcoming
    source: RECURRING §6
    tests:
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: a transfer rule drops the category, needs two different accounts and saves the destination
  - id: R-REC-06
    group: Rules and bookings
    title: Missing account/category → paused
    text: |
      - generator pauses it
      - app list drops it · web: *Needs attention*
    source: RECURRING §6, OFFLINE_TIER §4, RECURRING_WEB §7
    tests:
      - file: test/features/recurring_booking/data/mappers/recurring_booking_mapper_test.dart
        name: skips rule when category is missing
  - id: R-REC-07
    group: Rules and bookings
    title: Deleted occurrence never returns
    text: |
      - each booking holds its date slot
      - delete = permanent skip · edit keeps the link
    source: RECURRING §5, BOOKINGS_WEB §4.8
    related: [R-BKG-52, R-BKG-31]
  - id: R-REC-08
    group: Rules and bookings
    title: "*Make recurring* never doubles"
    text: |
      - saved booking → rule starts after its date
      - unsaved → server makes the first
      - not on rule bookings · owners + admins
    source: RECURRING §5
  - id: R-REC-09
    group: Rules and bookings
    title: Owners + admins write rules
    text: members open + read
    source: RECURRING §8
    tests:
      - file: test/features/recurring_booking/ui/pages/recurring_booking_list_page_test.dart
        name: a read-only member gets the role hint and no way to add
  - id: R-REC-10
    group: Screens
    title: Rules + Upcoming
    text: |
      - **Rules**: cadence · next date · active / paused / ended
      - **Upcoming**: this month + 12 · month cards + signed net
    source: RECURRING §8
    tests:
      - file: test/features/recurring_booking/ui/screens/recurring_rules_view_test.dart
        name: a live rule gets its next date and an exhausted one reads as ended
  - id: R-REC-14
    group: Screens
    title: New monthly rule runs on the start date's day
    text: |
      - created on the 2nd → *Every month on day 2* · *Make recurring* → the booking's day
      - start date moved before the day is touched → the day follows · a picked day stays
      - start-date ‹ › step by the rule's period: a week · a month · a year (a day for daily)
    source: RECURRING §3, §8
    tests:
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: an untouched rule's day follows a new start date
      - file: test/features/recurring_booking/domain/recurrence/recurrence_config_test.dart
        name: a month or year step clamps to the last day of a shorter month
    related: [D-REC-1]
  - id: R-REC-15
    group: Screens
    title: Paused shows on the form at once
    text: |
      - ⋮ → *Pause* → *Paused* banner with *Resume* · next dates dimmed
      - still saved with *Save* · × asks to discard
    source: RECURRING §8
    tests:
      - file: test/features/recurring_booking/ui/pages/recurring_booking_save_page_test.dart
        name: pause shows the paused state at once and dims the next dates; resume on the banner undoes it
  - id: R-REC-11
    group: Screens
    title: Only future skips removable
    text: past skips = history
    source: RECURRING §8
  - id: R-REC-12
    group: Screens
    title: End mode needs its value
    text: "*On date* without date / *after N* without N → Save blocked"
    source: RECURRING §8
    tests:
      - file: test/features/recurring_booking/ui/widgets/ends_sheet_test.dart
        name: clearing or zeroing the count drops the stale value so save can block it
  - id: R-REC-13
    group: Reminders
    title: Reminder lead per rule
    text: |
      - *Use the default* (Bill reminders lead, not off) · 1/2/3/7 days
      - phone sends · web edits
    source: RECURRING §8, RECURRING_WEB §1
    tests:
      - file: test/features/recurring_booking/recurring_due_schedule_test.dart
        name: falls back to the global default when the rule has none
    related: [R-NTF-10]
