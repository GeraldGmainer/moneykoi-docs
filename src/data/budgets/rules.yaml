# Source: app BUDGET_GOALS_AI_CONTEXT.md; web BUDGETS_WEB, GOALS_WEB, LOANS_WEB; Trello item 15.
items:
  # The model
  - id: R-BUD-20
    group: The model
    title: One tab, three kinds
    text: |
      - **Goals** (savings, deadline) → grow with deposits
      - **Budgets** (caps, income goals) → measure bookings per period
      - **Loans** (borrowed, lent) → shrink with payments
    source: BUDGET_GOALS §1
  - id: R-BUD-21
    group: The model
    title: Deposit ≠ booking
    text: |
      - deposit/payment moves the goal or loan
      - *also record a booking* moves the account
      - linked account → transfer · booking written first
    source: BUDGET_GOALS §7a
  - id: R-BUD-22
    group: The model
    title: Reached + settled show at once
    text: |
      - reached: saved ≥ target · settled: paid off
      - read on the phone → badge at once, offline too
    source: BUDGET_GOALS §3
    tests:
      - file: test/features/budget_goals/domain/entities/goal_test.dart
        name: isReached needs a positive target and saved at or above it
      - file: test/features/budget_goals/domain/entities/loan_test.dart
        name: isSettled reads the paid-off status OR the local fold
  - id: R-BUD-23
    group: The model
    title: Owners + admins plan · members read
    text: goals, budgets, loans, deposits = structure → members read-only
    source: FAMILY_ACCOUNTS §2
    related: [R-BOOK-10]

  # Budgets
  - id: R-BUD-30
    group: Budgets
    title: A budget is its scope
    text: |
      - type × category or whole book × week/month/year
      - no name · title = category, *Whole book*, or *Category not available yet*
    source: BUDGET_GOALS §3
  - id: R-BUD-31
    group: Budgets
    title: No two budgets on one scope
    text: |
      - same type + category + period → refused, reason shown
      - other period ok · archived = history · paused still counts
      - reason waits until a scope is picked (or *Save*)
      - web the same since 2026-10-28
    source: BUDGET_GOALS §3, BUDGETS_WEB §1
    tests:
      - file: test/features/budget_goals/budget_duplicate_rule_test.dart
        name: same type, category and period is a duplicate
      - file: test/features/budget_goals/budget_duplicate_rule_test.dart
        name: an archived budget is history, not a duplicate
      - file: src/app/(main)/budgets/components/budget-form-sheet.test.tsx
        repo: web
        name: says so once the scope is picked, and refuses to save
      - file: src/app/(main)/budgets/lib/budget-duplicate.test.ts
        repo: web
        name: ignores the budget being edited and archived ones, never paused ones
  - id: R-BUD-32
    group: Budgets
    title: One number for every screen
    text: |
      - Budgets tab · Home card · Analytics · widget read the same
      - parent counts subs · whole book counts all
      - transfers → whole book only
    source: BUDGET_GOALS §5
    tests:
      - file: test/features/budget_goals/budget_progress_test.dart
        name: a transfer counts toward the whole-book budget only, never a category budget
  - id: R-BUD-33
    group: Budgets
    title: Nested caps
    text: |
      - whole book → group → sub, same period
      - container shows assigned + unassigned
      - different periods never nest
    source: BUDGET_GOALS §5
    tests:
      - file: test/features/budget_goals/budget_nesting_test.dart
        name: whole book, a group and a subcategory nest three deep, each inside the nearest container
  - id: R-BUD-34
    group: Budgets
    title: Suggested amount from history
    text: |
      - median of last 6 full periods, rounded up
      - none without history
      - new budget: tap to use · edit: muted, never overwrites
    source: BUDGET_GOALS §5a
    tests:
      - file: test/features/budget_goals/budget_suggestion_test.dart
        name: rounds up in magnitude-appropriate steps

  # Goals
  - id: R-BUD-40
    group: Goals
    title: Pace, milestones, streaks
    text: |
      - 25/50/75/100 % milestones · celebrated once per device
      - ahead/behind · per month needed · projected finish
      - monthly streak from 2 · a withdrawal re-arms quietly
    source: BUDGET_GOALS §4, §7b
    tests:
      - file: test/features/budget_goals/claim_goal_milestone_test.dart
        name: hands out a crossed milestone exactly once
      - file: test/features/budget_goals/goal_streak_test.dart
        name: two contributions inside one anchored period count once
  - id: R-BUD-41
    group: Goals
    title: Round-ups → one goal
    text: |
      - new expense rounds up · units 1, 5, 10…
      - only the creating device · never on edit → no doubles
    source: BUDGET_GOALS §7a
    tests:
      - file: test/features/budget_goals/round_up_test.dart
        name: is zero on a boundary, so a round expense contributes nothing
  - id: R-BUD-42
    group: Goals
    title: Auto-deposits from a rule · app
    text: |
      - linked goal gets a deposit per rule booking, from link date
      - filled in when a screen shows the goal
      - web: link read-only
    source: BUDGET_GOALS §7a, GOALS_WEB §7
  - id: R-BUD-43
    group: Goals
    title: Goal settings per person
    text: |
      - round-up target, rule links, celebrations, reminders → profile
      - goal id from another book → off
    source: BUDGET_GOALS §7a

  # Loans
  - id: R-BUD-50
    group: Loans
    title: "Payment: principal + interest"
    text: |
      - split → principal reduces the balance
      - no split → whole amount · over-payment = settled
    source: BUDGET_GOALS §3
    tests:
      - file: test/features/budget_goals/domain/entities/loan_payment_test.dart
        name: 'the hybrid rule: the principal portion reduces the balance when entered, the full amount otherwise'
  - id: R-BUD-51
    group: Loans
    title: Payoff + debt strategy
    text: |
      - borrowed loan → payoff simulator
      - several debts → strategy: avalanche (default) or snowball
    source: BUDGET_GOALS §7b, LOANS_WEB
    tests:
      - file: test/features/budget_goals/loan_math_test.dart
        name: uses the OUTSTANDING balance for snowball, not the principal
      - file: test/features/budget_goals/loan_math_test.dart
        name: drops receivables and settled debts

  # Budget calculator
  - id: R-BUD-01
    group: Budget calculator
    title: Calculator = the website's
    text: |
      - same income → same month, web + app
      - *Balanced* (50/30/20) · *Saver* · per adult + child
      - rounds to 10, drift into savings · per day ÷ 30.4
      - change one side → change both
    source: BUDGET_GOALS §5b
    tests:
      - file: test/features/budget_goals/budget_plan_math_test.dart
        name: a plan that fits adds up to the income exactly, the rounding drift landing in savings
  - id: R-BUD-02
    group: Budget calculator
    title: Eight rows → top-level categories
    text: |
      - exact names first (EN/DE/JA + synonyms), then a guess for empty rows
      - unmatched → *No matching category* + top-level picker
      - two rows, one category → Save blocked · savings never a budget
    source: BUDGET_GOALS §5b
    tests:
      - file: test/features/budget_goals/budget_plan_category_matcher_test.dart
        name: the German and Japanese starter sets match through the synonym table
      - file: test/features/budget_goals/budget_plan_category_matcher_test.dart
        name: a whole-name hit is never stolen by an earlier row
      - file: test/features/budget_goals/ui/pages/budget_planner_page_test.dart
        name: a category picked for two rows blocks Save until one is changed
  - id: R-BUD-03
    group: Budget calculator
    title: "Income: goal → history → empty"
    text: |
      - active monthly income goal wins · else typical month
      - a line says which
    source: BUDGET_GOALS §5b
    tests:
      - file: test/features/budget_goals/use_cases/budget_plan_use_cases_test.dart
        name: an active monthly whole-book income goal is the income, without a history lookup
  - id: R-BUD-04
    group: Budget calculator
    title: Archived = history · paused = back on
    text: |
      - archived cap: never touched · row makes a new cap
      - paused cap: prefilled, active after Save
      - row says *Turns your paused budget back on*
      - web: same since 2026-10-28 (it used to prefill from an archived cap and turn it back on)
    source: BUDGET_GOALS §5b (2026-10-16), BUDGETS_WEB §4.15
    tests:
      - file: test/features/budget_goals/budget_plan_changes_test.dart
        name: 'an archived cap is history: it is neither brought back nor counted, so the row creates a new cap'
      - file: test/features/budget_goals/budget_plan_changes_test.dart
        name: a paused monthly cap is turned back on even at the planned amount, and the update says so
      - file: src/app/(main)/budgets/planner/lib/budget-plan.test.ts
        repo: web
        name: 'an archived cap is history: never prefilled, updated or deleted, so the plan creates a new one'
      - file: src/app/(main)/budgets/planner/page.test.tsx
        repo: web
        name: no budget to remove, no switch; a paused cap the plan rewrites says it turns back on
  - id: R-BUD-05
    group: Budget calculator
    title: Replace keeps ids
    text: |
      - rewritten cap keeps its id · Home + widget hold ids
      - deletes only live caps no row keeps
      - never archived caps or income goals · writes first, deletes last
      - web: same since 2026-10-28 (it used to delete every cap first, archived ones too, and recreate them)
    source: BUDGET_GOALS §5b, BUDGETS_WEB §4.15
    tests:
      - file: test/features/budget_goals/budget_plan_changes_test.dart
        name: replacing updates the cap on a planned category in place and deletes only what the plan does not keep
      - file: test/features/budget_goals/use_cases/budget_plan_use_cases_test.dart
        name: a failed write deletes nothing
      - file: src/app/(main)/budgets/planner/lib/budget-plan.test.ts
        repo: web
        name: replacing keeps the cap a row rewrites and deletes the other spending caps, never an income target
      - file: src/app/(main)/budgets/planner/services/budget-planner.service.test.ts
        repo: web
        name: updates, then inserts every new cap at sparse positions, and deletes last
  - id: R-BUD-06
    group: Budget calculator
    title: Free
    text: No gate · decided 2026-10-16 (D13)
    source: BUDGET_GOALS §5b, MONETIZATION §4

  # Savings-goal calculator
  - id: R-BUD-07
    group: Savings-goal calculator
    title: Target date ↔ monthly amount
    text: |
      - deadline goals only · under *Target date*
      - date set → *Per month* + *Per week* + 4 milestone dates
      - amount typed → target date moves · date edited → amount dropped
      - same figure as *Needed per month* on the goal page · nothing new is stored
    source: BUDGET_GOALS §5c
    tests:
      - file: test/features/budget_goals/ui/pages/goal_save_page_test.dart
        name: a typed monthly amount sets the target date, and Save writes it
      - file: test/features/budget_goals/ui/pages/goal_save_page_test.dart
        name: a typed amount follows a new target, and editing the date drops it
  - id: R-BUD-08
    group: Savings-goal calculator
    title: Days, not months · no interest
    text: |
      - site: whole months · app: days ÷ 30.4375 → a few cents or days apart
      - 0, or slower than 1200 months → *Not reachable at this amount* · Save blocked
      - no interest · a goal stores no rate
    source: BUDGET_GOALS §5c
    tests:
      - file: test/features/budget_goals/savings_plan_math_test.dart
        name: the monthly rate counts days like the goal header, where the site divides by 12 months (183.33)
      - file: test/features/budget_goals/ui/pages/goal_save_page_test.dart
        name: an amount that never gets there is an error and blocks Save
  - id: R-BUD-09
    group: Savings-goal calculator
    title: Christmas preset
    text: |
      - new goal only · *Start from* → *Christmas*
      - name, gift icon, deadline, Dec 24
      - from Dec 24 on → next year · no gift checklist (a shopping list does that)
    source: BUDGET_GOALS §5c
    tests:
      - file: test/features/budget_goals/goal_preset_test.dart
        name: from the Eve on it aims at next year, where the site waits for the 27th
      - file: test/features/budget_goals/ui/pages/goal_save_page_test.dart
        name: a new goal can start from the Christmas preset
