  - id: D-BUD-16
    question: "Budget calculator: the *50/30/20* start lands on 48/25/28"
    status: decided
    date: 2026-11-06
    answer: |
      - **b) rename the start to *Balanced*** · 50/30/20 only as the comparison · app + website · built 2026-11-06
      - before: the per-adult food and transport guides and the rest-to-savings push a single adult to 48/25/28 under a label that says 50/30/20 · the website does the same
      - a) scale the needs and wants rows to hit 50/30/20 · app and website together (the parity table)
      - b) rename the start to *Balanced* and keep 50/30/20 only as the comparison
      - c) keep
      - source: Android emulator round, AND-13-4 · an app-only change was built and taken back on 2026-11-06 because it broke site parity
  - id: D-BUD-17
    question: Goal *Projected finish* after the first deposit?
    status: decided
    date: 2026-11-06
    answer: |
      - **wait for a history** · 30 days since the start or deposits in 2 months · as built 2026-11-06
      - source: Android emulator round, AND-13-1
    related: [E-BUD-44]
  - id: D-BUD-18
    question: What do the drawer and the page call budgets and goals?
    status: decided
    date: 2026-11-11
    answer: |
      - **Budgets & goals** · de *Budgets & Ziele* · ja *予算と目標* · drawer entry and page title · built 2026-11-11
      - before: Welcome *Budgets & goals*, drawer *Budget goals*, page *Goals*, Tips *Budgets* + *Savings goals* · four names for one page
      - the page keeps its *Budgets · Goals · Loans* tabs · the bottom-bar label stays *Goals* · Tips keeps its two rows
      - web not changed
      - source: new-user re-test on the iPhone simulator, 2026-11-11
    related: [D-REC-2]
  - id: D-BUD-19
    question: Which payments count toward a loan installment?
    status: decided
    date: 2026-11-17
    answer: |
      - **every payment since the installment before fell due** · paying early is paying
      - a payment on that earlier due date belongs to the earlier installment
      - built 2026-11-17 · before, only payments on or after the due date counted, so an early payer got *missed*
      - source: bug hunt 60
    related: [E-BUD-54]
