items:
  - id: J-BUD-01
    group: Budget calculator
    title: Plans budgets with the calculator
    from: Goals & Budgets → Budgets
    steps:
      - "*Plan with the budget calculator*"
      - income, adults, kids → preset
      - check 8 rows + categories
      - "*Save as budgets* · or *Replace*"
    result: monthly caps created or updated
    tests:
      - file: test/features/budget_goals/ui/pages/budget_planner_page_test.dart
        name: a preset fills the plan and Save writes caps for the matched rows only, then closes
    checks: [C-BUD-001, C-BUD-004, C-BUD-007]
  - id: J-BUD-10
    group: Budgets
    title: Caps groceries
    from: Budgets → *Add budget*
    steps:
      - "scope: category or *Whole book*"
      - suggestion, or type an amount
      - period → *Save*
    result: cap + progress · identical one refused
    checks: [C-BUD-020]
  - id: J-BUD-20
    group: Goals
    title: Saves toward a goal
    from: Goals → +
    steps:
      - name, target, deadline, account
      - deposit · *also record a booking*
      - milestones, streak
    result: progress, pace, finish date
    checks: [C-BUD-030, C-BUD-031]
  - id: J-BUD-21
    group: Goals
    title: Rounds up spare change
    from: goal → round-ups on, unit 1
    steps:
      - book a 4.30 expense
    result: 0.70 to the goal · edits add nothing
    checks: [C-BUD-032]
  - id: J-BUD-30
    group: Loans
    title: Tracks a loan
    from: Loans → +
    steps:
      - borrowed/lent, principal, schedule
      - log payments · split, booking
      - payoff simulator · strategy page
    result: balance + debt-free date
    checks: [C-BUD-040]
