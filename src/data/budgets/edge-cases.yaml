# Release-note risks (Trello item 15) with their status per BUDGET_GOALS §5b; the rest from
# BUDGET_GOALS and the web docs.
items:
  - id: E-BUD-20
    group: Budgets
    title: Budget category not synced yet
    when: web budget points at a category not on this phone
    then: "*Category not available yet* · never *Whole book* · edit keeps it"
    risk: high
  - id: E-BUD-21
    group: Budgets
    title: Old duplicates
    when: two whole-book caps, same period, before the guard
    then: counted once · lower cap wins
    risk: low
    tests:
      - file: test/features/budget_goals/budgets_overview_test.dart
        name: two legacy whole-book caps on the same period are counted once
  - id: E-BUD-22
    group: Budgets
    title: Web budgets use server time
    when: Vienna user on the web, 1st before 01:00/02:00
    then: still last month's window · open (review 15a)
    status: known-issue
    risk: medium
  - id: E-BUD-30
    group: Goals
    title: Offline deposit hits the target
    when: offline deposit crosses the target
    then: reached at once · server catches up on sync
    risk: low
  - id: E-BUD-31
    group: Goals
    title: Two phones auto-deposit at once
    when: both open the goal right after a rule booking
    then: may duplicate a deposit · server unique index not built
    status: known-issue
    risk: medium
  - id: E-BUD-32
    group: Goals
    title: Linking an old rule
    when: goal linked to a 5-year-old rule
    then: only bookings from the link date
    risk: medium
  - id: E-BUD-33
    group: Goals
    title: Celebrations switch
    when: "*celebrations* off"
    then: web honors it · app never reads it · open
    status: known-issue
    risk: low
  - id: E-BUD-40
    group: Loans
    title: Debt-free date a month late
    when: 290.29 left at 10.01 a month
    then: float math → 30 months, both clients · open (review 23)
    status: known-issue
    risk: low
  - id: E-BUD-42
    group: Loans
    title: Split loses part of a payment
    when: $250 payment · split on · principal 20, interest left empty
    then: fixed 2026-11-03 · interest filled with 230 at once · principal + interest always = payment (IOS-13-2)
    status: fixed
    risk: high
    tests:
      - file: test/features/budget_goals/ui/view_models/payment_split_draft_test.dart
        name: keying one portion fills the other with the rest of the payment
  - id: E-BUD-43
    group: Budgets
    title: Header says 100 % at 153 %
    when: $100 cap, $153.45 spent
    then: fixed 2026-11-03 · header and Home card say 153 % like the row · bar stays full (IOS-13-1)
    status: fixed
    risk: medium
    tests:
      - file: test/features/budget_goals/budgets_overview_test.dart
        name: an overspent total keeps its real ratio; only the bar clamps
  - id: E-BUD-41
    group: Web
    title: German thousands on web forms
    when: "`1.500` typed in a web goal/loan/budget/account sheet, German number format"
    then: saved as 1500 · `1.500,25` and `1,500.25` both 1500.25 · `12,5` and `12.50` stay decimals · before 2026-11-12 saved as 1.5 (review 15b) · `/add`, receipt, edit, quick entry, recurring, forecast, the investment forms, the budget planner and the forecast settings follow since the same day · only the bank import's row editor still takes a lone mark as the decimal point
    status: fixed
    risk: high
    tests:
      - file: src/lib/display-settings/parse-amount.test.ts
        repo: web
        name: "reads the user's thousand mark before three digits as thousands: a German 1.500 is fifteen hundred"
  - id: E-BUD-01
    group: Budget calculator
    title: Replace and held ids
    when: "*Replace existing budgets* rewrites caps"
    then: fixed · cap keeps its id → Home card + widget keep it
    status: fixed
    risk: high
  - id: E-BUD-02
    group: Budget calculator
    title: Save fails part-way
