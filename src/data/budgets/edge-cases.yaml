# Release-note risks (Trello item 15) with their status per BUDGET_GOALS §5b; the rest from
# BUDGET_GOALS and the web docs.
items:
  - id: E-BUD-20
    group: Budgets
    title: Budget category not synced yet
    when: web budget points at a category not on this phone
    then: "*Category not available yet* · never *Whole book* · edit keeps it"
    risk: high
  - id: E-BUD-21
    group: Budgets
    title: Old duplicates
    when: two whole-book caps, same period, before the guard
    then: counted once · lower cap wins
    risk: low
    tests:
      - file: test/features/budget_goals/budgets_overview_test.dart
        name: two legacy whole-book caps on the same period are counted once
  - id: E-BUD-22
    group: Budgets
    title: Web budgets use server time
    when: Vienna user on the web, 1st before 01:00/02:00
    then: still last month's window · open (review 15a)
    status: known-issue
    risk: medium
  - id: E-BUD-30
    group: Goals
    title: Offline deposit hits the target
    when: offline deposit crosses the target
    then: reached at once · server catches up on sync
    risk: low
  - id: E-BUD-31
    group: Goals
    title: Two phones auto-deposit at once
    when: both open the goal right after a rule booking
    then: may duplicate a deposit · server unique index not built
    status: known-issue
    risk: medium
  - id: E-BUD-32
    group: Goals
    title: Linking an old rule
    when: goal linked to a 5-year-old rule
    then: only bookings from the link date
    risk: medium
  - id: E-BUD-33
    group: Goals
    title: Celebrations switch
    when: "*celebrations* off"
    then: web honors it · app never reads it · open
    status: known-issue
    risk: low
  - id: E-BUD-40
    group: Loans
    title: Debt-free date a month late
    when: 290.29 left at 10.01 a month
    then: float math → 30 months, both clients · open (review 23)
    status: known-issue
    risk: low
  - id: E-BUD-41
    group: Web
    title: German thousands on web forms
    when: "`1.500` typed in a web goal/loan/budget sheet"
    then: saved as 1.5 · open in every web sheet (review 15b)
    status: known-issue
    risk: high
  - id: E-BUD-01
    group: Budget calculator
    title: Replace and held ids
    when: "*Replace existing budgets* rewrites caps"
    then: fixed · cap keeps its id → Home card + widget keep it
    status: fixed
    risk: high
  - id: E-BUD-02
    group: Budget calculator
    title: Save fails part-way
    when: a write fails while replacing
    then: fixed · writes first, deletes last → at worst one cap too many
    status: fixed
    risk: high
    tests:
      - file: test/features/budget_goals/use_cases/budget_plan_use_cases_test.dart
        name: writes updates and monthly caps in one batch first, deletes last
  - id: E-BUD-03
    group: Budget calculator
    title: Archived cap revived silently
    when: row lands on an archived monthly cap
    then: changed · archived untouched → new cap · **paused** cap turns on + says so
    status: fixed
    risk: medium
  - id: E-BUD-04
    group: Budget calculator
    title: Loose name guesses
    when: '"Car" vs "Childcare" · "Haus" vs "Haushalt" · "Fun" vs "Funds"'
    then: guess only for still-empty rows · re-test (C-BUD-010)
    risk: medium
  - id: E-BUD-05
    group: Budget calculator
    title: No undo
    when: plan saved, then regretted
    then: no undo · goals have no trash · Replace asks with the count
    status: known-issue
    risk: medium
  - id: E-BUD-06
    group: Budget calculator
    title: Plan below nested caps
    when: parent below its subs, or whole book below the plan
    then: shown before Save
    risk: low
