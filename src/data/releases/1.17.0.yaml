      When the owner loses Cloud or deletes the book, members keep a read-only copy. The + becomes a grey cloud-slash button. Notifications *no longer syncs* / *syncs again* / *was deleted*. New Settings row *Books that stopped syncing*.
    checks: [C-BOOK-003, C-BOOK-004, C-BOOK-006]
    related: [R-BOOK-34, R-BOOK-35]
    screens: [shell_create_button.dart, read_only_book_button.dart, main_navigation_rail.dart, read_only_book_sheet.dart, cloud_sync_tiles.dart, lapse_review_sections.dart, notification inbox]
