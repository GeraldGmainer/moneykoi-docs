# Gerald's Trello release notes for app 1.17.0, pasted 2026-10-17. Every test step is a check in its
# area (ticks are shared with the area's *What to test* page). A note whose `now` says "fixed since"
# or "changed since" was outdated by later work — the source is named in it.
version: 1.17.0
status: testing
source: From the Trello release notes (pasted 2026-10-17). Items 5, 6, 8, 14 and 28–30 were not in the paste. Ticks are shared with each area's *What to test* page.
items:
  - n: 1
    title: Cloud per book
    area: accounts
    what: |
      A book syncs while its owner has Cloud. A free member syncs a shared Cloud book; their own book stays on the phone. Local and Cloud books sit side by side.
    checks: [C-BOOK-020, C-BOOK-001, C-ACC-024, C-BOOK-021, C-ACC-025]
    related: [R-MON-02, R-ACC-15, R-ACC-45]
    screens: [Book switcher, Budget Book, Settings → Sync paused (lapse_review_page.dart)]
    notes:
      - text: Sync-paused timestamps are now stored per book — test on a device whose sync was paused before the update.
        status: open
  - n: 2
    title: Join a shared book without uploading + *Keep it on this phone*
    area: books
    what: |
      An invite link on a phone with a book and no account opens *Join {book}*. The own book uploads only if the account has Cloud. *Back up & sync* into a free account offers *Keep it on this phone*.
    checks: [C-BOOK-001, C-BOOK-005, C-ACC-014, C-ACC-015]
    related: [J-BOOK-13, Q-BOOK-1]
    screens: [join_book_page.dart, claim_progress_page.dart, claim_intro_page.dart, lapse_review_page.dart]
    notes:
      - text: '"The Join page is not behind developer mode, but the claim it runs on is."'
        status: changed
        now: Since 2026-10-16 the Join page sits behind the same switch as the claim (developer mode); with it closed an invite opens the claim intro (OFFLINE_TIER §9).
      - text: How an https invite link reaches the app on such a phone is unclear — the app does not claim `/invite`.
        status: open
        now: Q-BOOK-1, task T-BOOK-01.
  - n: 3
