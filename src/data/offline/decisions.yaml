items:
  - id: D-ACC-1
    question: Fix the late-commit cursor gap?
    status: open
    answer: |
      - fix: cap `sync_all`'s cursor below the oldest open transaction
      - or a few seconds behind `statement_timestamp()`
      - no decision yet
    related: [E-ACC-32]
  - id: D-ACC-2
    question: Deliver a peer's edit of a just-pushed row? (O4)
    status: open
    answer: |
      - needs `(id, updated_at)` pairs in the exclude list
      - no decision yet
    related: [E-ACC-31]
  - id: D-OFF-1
    question: How does a user get rid of a change the server keeps refusing?
    status: decided
    answer: |
      - decided 2026-11-12
      - shown on the record's own page **and** in a Settings list
      - *Discard change* makes the phone match the server again (new record → gone · edit → server version · delete → record back)
      - records under a discarded new record are left for the user, never dropped silently
    related: [E-OFF-34, R-OFF-16]
