# Derived from the context docs, not from an earlier checklist.
groups:
  - id: analytics
    title: Analytics
    items:
      - id: C-ANL-001
        text: Month with transfer + correction → neither income nor expense · waterfall *Untracked* bar
      - id: C-ANL-002
        text: "*All time* → comparisons quiet · month start 25 → bars run 25 → 24"
      - id: C-ANL-003
        text: "Export: image · CSV · PDF · iPad too"
      - id: C-ANL-004
        text: "With investments: *incl. investments* · depot buy not doubled"
      - id: C-ANL-005
        text: Free → whole tab locked + paywall
      - id: C-ANL-006
        text: New book → every Analytics segment = koi + *Add entry* + *Scan a receipt* · one entry → KPI, breakdown, heatmap drawn · Merchants + Receipts headings gone, their cards named in *Unlocks as you record* with *Scan a receipt*
      - id: C-ANL-007
        text: Young book on *This week* vs *This year* → the same cards unlock (period never matters) · a card unlocked with nothing in the window says *nothing in this period*, not the unlock reason
      - id: C-ANL-008
        text: "Web: book with investments → net worth *incl. investments* · leaderboard or treemap row → category activity, same period"
      - id: C-ANL-009
        text: English app + money format `1.234,56 €` → insights, chart legends, Home budget card, quick-booking chip follow the format · quick-booking date follows the date format
      - id: C-ANL-010
        text: Salary booked on the 1st of last month and this month · on the 2nd → *This month* income shows no change (not +1000 %) · *Last month* compares the whole month before · month start 25 → periods run 25 → 24 on both sides
      - id: C-ANL-013
        text: "iPhone: Analytics → switch to *Spending* → the first drag scrolls the tab, not only the second (IOS-15-4)"
  - id: release-2-0-0
    title: 2.0.0 · 2026-11-08
    items:
      - id: C-ANL-011
        text: "*This month* on the 5th → *Avg. per day* = spend ÷ 5 · *Avg. expense* leaves the salary out · *Same period last year* = Nov 1–5 last year · October counts 31 days over the clock change · Home *Cash flow* card: this month against last month to the same day"
      - id: C-ANL-012
        text: "Web, same book as the app → *This month* on the 2nd compares with the 1st–2nd of last month, *Last month* with the whole month before · forecast: a salary booked on the 1st is not added on top of the month's income estimate · figures match the app"
