items:
  - id: E-ANL-01
    group: Numbers
    title: All-time averages · app
    when: average over *All*
    then: "app divides by days since 1970 (bug) · web: since first booking"
    status: known-issue
    risk: medium
  - id: E-ANL-02
    group: Numbers
    title: Leap day in the baseline
    when: window ends on 29 Feb
    then: spills into 1 Mar · web failing test · Dart same · fix both
    status: known-issue
    risk: low
  - id: E-ANL-03
    group: Numbers
    title: No income, no ratio
    when: expenses, no income
    then: "*record your income*, not 0 %"
    risk: low
  - id: E-ANL-04
    group: Web
    title: "Web *All*: fixed/variable = this month"
    when: "`range=all` on the web"
    then: those 4 cards show this month only · from reading code
    status: known-issue
    risk: medium
  - id: E-ANL-05
    group: Web
    title: Web waits for migrations
    when: anchor + corrections migrations not applied
    then: calendar months · server day · no *Untracked* bar
    status: known-issue
    risk: medium
    related: [T-ANL-01]
  - id: E-ANL-06
    group: Numbers
    title: Amounts in sentences and labels
    when: money format differs from the app language · e.g. English app, `1.234,56 €`
    then: insights, chart centres and legends, the Home budget card, the quick-booking chip and the balance-check snackbar follow the money format, like every other amount · the quick-booking date chip follows the date format · before 2026-10-28 they followed the app language
    status: fixed
    risk: low
    tests:
      - file: test/features/currency/extensions/currency_formatting_extension_test.dart
        name: follows the money format, not the app language
  - id: E-ANL-07
    group: Numbers
    title: Salary on the 1st, early in a month
    when: salary on Oct 1 and Nov 1 · *This month* opened on Nov 2
    then: "*Income ↑ 1018 %* before 2026-11-03 (Oct 2–31 vs Nov) · now Nov 1–2 vs Oct 1–2 → no change · a finished month vs the whole month before it · web the same since 2026-11-05 · iOS round IOS-15-1 · Home's *Cash flow* card the same since 2026-11-06 (it compared Nov 1–5 with Oct 2–6, AND-3-1)"
    status: fixed
    risk: high
    tests:
      - file: test/features/analytics/use_cases/get_analytics_kpi_use_case_test.dart
        name: this month on Nov 2 with a salary on Oct 1 and Nov 1 reads no change, not +1018 %
      - file: test/features/home/service/date_range_service_test.dart
        name: a day February does not have is clamped to its last day
    related: [R-ANL-05]
  - id: E-ANL-08
    group: Export
    title: Share card net without a sign
    when: "*Share or export* · positive net"
    then: "*+$3,531.06* like the Overview · zero bare and uncoloured · IOS-15-2"
    status: fixed
    risk: low
    tests:
      - file: test/features/analytics/ui/widgets/analytics_summary_card_test.dart
        name: a zero net stays bare and uncoloured
  - id: E-ANL-09
    group: Export
    title: PDF read like a spreadsheet
    when: "*Share or export* → *PDF*"
    then: money format · no *Section* / *Currency* column · dates in the date format · *Private book* · IOS-15-3
    status: fixed
    risk: medium
    tests:
      - file: test/features/analytics/analytics_csv_builder_test.dart
        name: has no Section or Currency column
      - file: test/shared/export/pdf_encoder_test.dart
        name: a person reads dates in the date-format setting
  - id: E-ANL-10
    group: Numbers
    title: Uneven axis steps and two rates
    when: "*In & out by account* · savings rate 61.94 %"
    then: ticks *2k · 4k* · rate *62%* in Overview and PDF · CSV keeps 61.9 · IOS-15-4
    status: fixed
    risk: low
    tests:
      - file: test/shared/ui/chart/nice_axis_test.dart
        name: steps are round numbers
      - file: test/features/analytics/analytics_csv_builder_test.dart
        name: rounds the savings rate the way the Overview does
  - id: E-ANL-11
    group: Numbers
    title: To-date window labelled as a month
    when: "*This month* on Nov 2 · comparison card"
    then: columns *Nov 1 – Nov 2* vs *Oct 1 – Oct 2* · whole months stay *Oct 2026*
    status: fixed
    risk: low
    tests:
      - file: test/features/analytics/ui/widgets/period_comparison_card_test.dart
        name: a to-date window is labelled by its days
    related: [E-ANL-07]
  - id: E-ANL-12
    group: Numbers
    title: Chart axis with a dot beside comma amounts
    when: "a money format with a decimal comma (de) · *Income vs expenses*, *Fixed vs variable*, *Account flow*, *Burn rate*, the trend bars"
    then: |
      - fixed 2026-11-11 · axis labels and tooltips write *7,5k*, like the amounts beside them
      - was: *7.5k* · the forecast chart was fixed the same day (E-FC-33)
    status: fixed
    risk: low
    tests:
      - file: test/shared/ui/chart/nice_axis_test.dart
        name: "the analytics cards' compact values carry the money format's decimal separator"
    related: [E-FC-33]
  - id: E-ANL-13
    group: Web
    title: "Web balance page: first day left out of the change"
    when: a salary booked on the first day of the window on `/balance`
    then: "*Starting balance* is the balance before that day · *Net change* counts the salary · before 2026-11-12 both skipped day one"
    status: fixed
    risk: medium
    tests:
      - file: src/app/(main)/balance/page.test.tsx
        repo: web
        name: "counts a booking on the first day of the window in the net change: the window starts on day one's opening balance"
  - id: E-ANL-14
    group: Web
    title: "Web balance page: Custom lit without a range"
    when: "*Custom* opened but no range picked, or the page reopened after a custom range"
    then: the chosen preset stays lit and charted · a custom range is not remembered · before 2026-11-12 *Custom* was lit over a 30-day chart
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/balance/page.test.tsx
        repo: web
        name: "does not reopen on \"Custom\" without its range: only presets are remembered"
  - id: E-ANL-15
    group: Web
    title: "Web balance page: load fails"
    when: "`/balance` opens while the read fails"
    then: "*Couldn't load the bookings* with *Try again* · a skeleton while loading · before 2026-11-12 an empty chart from 0 to 1000"
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/balance/page.test.tsx
        repo: web
        name: says the load failed and offers a retry, instead of a flat zero line
  - id: E-ANL-16
    group: Web
    title: "Web balance page: history before a balance check"
    when: "`/balance` over a window that holds a balance check's correction, or the day an account was opened"
    then: the days before the correction no longer carry it · an account's starting balance steps in on its start date, as on the Home card · a deleted account's bookings stay out · before 2026-11-12 every earlier day was off by the correction
    status: fixed
    risk: high
    tests:
      - file: src/app/(main)/balance/hooks/use-balance-timeline.test.tsx
        repo: web
        name: backs a balance correction out on its day
  - id: E-ANL-17
    group: Web
    title: Fixed vs. variable on *All* showed one month
    when: web · Analytics · period *All* · the fixed / variable cards
    then: all time · fixed 2026-11-12 in `20261112140000_variability_all_time.sql`, live once pushed (T-BOOK-06) · until then the cards show the current budget month
    status: fixed
    risk: medium
    related: [T-BOOK-06]
  - id: E-ANL-18
    group: Numbers
    title: "Category trend dropped days"
    when: "Category Activity · month starting mid-month · or *Last N months*"
    then: "bars add up to the total · one bar per month on long ranges · fixed 2026-11-12 (bug hunt 14)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/category_activity/service/category_activity_data_generator_test.dart
        name: "an anchored month charts every day of its range, across the month change"
  - id: E-ANL-19
    group: Numbers
    title: "*Shrink by −353.89*"
    when: Stats › Overview › *Balance forecast* · a balance that falls over the horizon
    then: "*On track to shrink over 12 months by 353.89* in the adverse colour · the words carry the direction, the figure no sign · *Negative from …* keeps the signed change · fixed 2026-11-13 (I5-5)"
    status: fixed
    risk: low
    tests:
      - file: test/features/analytics/ui/widgets/forecast_card_test.dart
        name: '"grow by" / "shrink by" state the direction, so the change carries no sign, only the colour (I5-5)'
