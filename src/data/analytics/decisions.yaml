items:
  - id: D-ANL-1
    question: What does a period compare with?
    status: decided
    date: 2026-11-03
    answer: |
      - **calendar + to date**
      - a finished period → the calendar period before it, anchor day to anchor day
      - a running period (this month, this year…) → the same span of the previous period to date · Nov 1–2 vs Oct 1–2 · end clamped in shorter months (Mar 1–30 vs Feb 1–28)
      - a custom range keeps the equal window before
      - *Last 2/3/6/12 months* end with this month, so they count as running → to date (Sep 1–Nov 2 vs Jun 1–Aug 2) · confirmed 2026-11-06
      - built 2026-11-03 · web ported 2026-11-05
      - source: iOS simulator round, IOS-15-1
    related: [R-ANL-05, E-ANL-07]
  - id: D-ANL-2
    question: '*Same period last year* for a running period: whole month or to date?'
    status: decided
    date: 2026-11-06
    answer: |
      - **a) to date** · built 2026-11-06 · web not yet
      - today: *This month* on Nov 2 vs the **whole** November last year · reads as a drop until month end
      - a) to date as well (Nov 1–2 vs Nov 1–2 last year) · same rule as the previous period
      - b) keep the whole month
      - *This year* already compares to date
    related: [R-ANL-05]
  - id: D-ANL-3
    question: "*Avg. per day* in a running period: divide by the days so far or by the whole period?"
    status: decided
    date: 2026-11-06
    answer: |
      - **a) days so far, everywhere** · `FeatureConstants.analyticsAverageDivisor` flipped 2026-11-06 · web not yet
      - before: *This month* on Nov 5 divides by 30 · *This week* by the days so far · the "at this pace" line by 5 · weekday averages count Sundays still to come
      - October divided by 32 days (the DST change counted a day twice) · fixed 2026-11-06 (AND-15-2)
      - built so the answer is one constant: `FeatureConstants.analyticsAverageDivisor` · today b)
      - a) days so far, everywhere (matches *month to date*, D-ANL-1)
      - b) the whole period, everywhere
      - source: Android emulator round, AND-15-1, AND-15-2
    related: [D-ANL-1]
  - id: D-ANL-4
    question: "*Avg. booking*: leave income out?"
    status: decided
    date: 2026-11-06
    answer: |
      - **a) expenses only** · tile renamed *Avg. expense* · built 2026-11-06 · web not yet
      - before: the salary and the coffees go into one average
      - source: Android emulator round, AND-15-4
  - id: D-ANL-5
    question: "Analytics ‹ ›: step the period or cycle the presets?"
    status: decided
    date: 2026-11-06
    answer: |
      - **arrows removed** · decided again 2026-11-09, built the same day · the label opens the range sheet · R-ANL-01
      - was: step in time · Nov → Oct → Sep · week → previous week · like the Budget Book · build: 2.0.1
      - moved from 2.0.0: the period needs an offset across ~40 cards + labels · not a 2-day change
      - before: ‹ › walk the preset list · *This month* → *This week*
      - source: Android emulator round, AND-15-5
  - id: D-ANL-6
    question: Price changes · Free or Pro?
    status: open
    answer: |
      - Analytics is **Pro** → the card is Pro by default
      - recommended: Pro · quantities saved for everyone from phase 0
      - plan: `plan_later/PERSONAL_INFLATION_PLAN.md` §9 D1
  - id: D-ANL-7
    question: Merged receipt lines · keep the products?
    status: open
    answer: |
      - *Merge by category* loses the products today
      - recommended: keep them as `parts` · bookings unchanged
  - id: D-ANL-8
    question: Receipts scanned before quantities existed?
    status: open
    answer: |
      - a) leave out · b) product history only, marked ≈ · c) in the index too
      - recommended: **b**
  - id: D-ANL-9
    question: Personal index · minimum to show it?
    status: open
    answer: |
      - recommended: ≥ 10 matched products + ≥ 25 % of item spend
      - revisit with real books
  - id: D-ANL-10
    question: Official comparison · HICP or VPI?
    status: open
    answer: |
      - HICP: one Eurostat source for AT + DE · VPI: the number Austrians know
      - recommended: HICP for both · labelled · country from the locale
  - id: D-ANL-11
    question: Export quantity + unit price in CSV?
    status: open
    answer: |
      - app + web archive must change together
      - recommended: not in v1
  - id: D-ANL-12
    question: Editing a line that has a quantity?
    status: open
    answer: |
      - the user changes the line total
      - recommended: scale the unit price · keep the quantity
  - id: D-ANL-13
    question: Quantity accuracy before the card ships?
    status: open
    answer: |
      - share of multiplier + weight lines read right on the corpus
      - recommended: ≥ 85 % on the four chains with fixtures
  - id: D-ANL-14
    question: Personal index · row or its own card?
    status: open
    answer: |
      - recommended: a row on *Price changes* in v1
      - own card / Home card only if people open it
