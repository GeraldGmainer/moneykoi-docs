  - id: R-ANL-05
    group: Numbers
    title: Comparisons go quiet
    text: |
      - previous = the calendar period before · *Last month* vs the whole month before it, anchor day to anchor day
      - a running period → the same span to date · *This month* on Nov 2 = Nov 1–2 vs Oct 1–2 · on Mar 30 vs Feb 1–28 · *This year* vs last year to the same day · *This week* vs last week to the same weekday
      - last year = same calendar dates · a running period to date too · *This month* on Nov 2 = Nov 1–2 vs Nov 1–2 last year (D-ANL-2) · web not yet
      - *All time* → no comparison
      - from zero → no percent, never "+∞ %"
      - web: the same windows since 2026-11-05 (`previousRange`)
    source: ANALYTICS §4 Period math rules · web `analytics/lib/period.ts` previousRange
    tests:
      - file: test/features/home/service/date_range_service_test.dart
        name: this month on Nov 2 compares with Oct 1–2, so a salary on both 1sts lines up
      - file: test/features/home/service/date_range_service_test.dart
        name: last month is the whole calendar month before it, not an equal-length window
      - file: test/features/analytics/use_cases/get_analytics_kpi_use_case_test.dart
        name: this month on Nov 2 with a salary on Oct 1 and Nov 1 reads no change, not +1018 %
      - file: test/features/analytics/analytics_period_math_test.dart
        name: has no baseline, for either mode
      - file: test/features/analytics/analytics_period_math_test.dart
        name: is null rather than infinite when the base was zero or absent
      - file: src/app/(main)/analytics/lib/period.test.ts
        name: this month on Nov 2 compares with Oct 1–2, so a salary on both 1sts lines up
        repo: web
      - file: src/app/(main)/analytics/lib/period.test.ts
        name: the running multi-month options compare the same span to date
        repo: web
    related: [D-ANL-1, E-ANL-07]
  - id: R-ANL-13
