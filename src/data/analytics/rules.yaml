items:
  - id: R-ANL-01
    group: What it is
    title: A deep-dive, not a 2nd Home
    text: |
      - **Pro** · 44 cards in 4 tabs
      - **Overview** · **Spending** · **Habits** · **Accounts**
      - Home = how am I now · Analytics = compare periods
      - the period: tap the label → every range with its dates · no ‹ › since 2026-11-09 (D-ANL-5)
    source: ANALYTICS §1, §8, §9
    tests:
      - file: test/features/analytics/ui/widgets/analytics_period_selector_test.dart
        name: portrait shows the range as one chip, without chevrons (D-ANL-5)
    related: [R-MON-11, D-ANL-5]
  - id: R-ANL-02
