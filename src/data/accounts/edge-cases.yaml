# Source: OFFLINE_FIRST_AI_CONTEXT.md §3a, §6, §12; OFFLINE_TIER_AI_CONTEXT.md §6, §9, §10, §13;
# MONETIZATION_AI_CONTEXT.md §9, §9b traps.
items:
  # Claim
  - id: E-ACC-01
    group: Claim
    title: Other account signs in mid-claim
    when: claim started with A · B signs in after rows moved
    then: |
      - mismatch screen, only log out
      - pending claim → logout doesn't wipe · local book stays
    risk: high
    tests:
      - file: test/features/cloud_tier/claim_progress_page_test.dart
        name: a different account than the one that started the claim can only log out
  - id: E-ACC-02
    group: Claim
    title: Google sign-in never starts
    when: Google tapped offline or without a browser
    then: error · page stays · leaving drops the unstarted claim
    risk: low
    tests:
      - file: test/features/cloud_tier/claim_intro_page_test.dart
        name: a Google sign-in that never started shows why, and leaving then drops the claim
  - id: E-ACC-03
    group: Claim
    title: Email link arrives later
    when: email sign-in started, page left, link tapped later
    then: claim kept → session lands in the claim, not an empty book (W4)
    risk: high
    tests:
      - file: test/features/cloud_tier/claim_intro_page_test.dart
        name: after an email sign-in started, leaving keeps the claim for the link that may still arrive
  - id: E-ACC-04
    group: Claim
    title: Account at its book limit
    when: account already owns 3 books
    then: own message + *Try again*, *Log out* · nothing uploaded
    risk: medium
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: an account at its book limit gets its own refusal, and nothing is moved or stored
      - file: test/features/cloud_tier/claim_progress_page_test.dart
        name: an account at its book limit is told so, with Try again and Log out
  - id: E-ACC-05
    group: Claim
    title: Kept account book is never claimed
    when: signed-out account's book on the phone · it signs in
    then: |
      - continues from kept rows + cursors
      - a claim would upload it twice
    risk: high
  - id: E-ACC-06
    group: Claim
    title: Free account with a book already
    when: local book signs into a free account that owns a server book
    then: |
      - phone's book stays open
      - older one *Locked until Cloud* · swap in Settings
    risk: medium
  - id: E-ACC-07
    group: Claim
    title: Rows whose parent is gone
    when: old book has rows without their parent
    then: repaired by the server's rules before the first push · no invented parent
    status: fixed
    risk: high
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: repairs the orphans an older build left behind before the first row is pushed
  - id: E-ACC-08
    group: Claim
    title: Claimed rows keep creation time
    when: book with years of history uploads
    then: each row keeps its `created_at`, not the upload time (H6)
    status: fixed
    risk: low

  # Pause & renewal
  - id: E-ACC-20
    group: Pause & renewal
    title: One account, two phones, paused
    when: both phones generate while paused · account renews
    then: no duplicates · meet on server ids (H4)
    status: fixed
    risk: high
  - id: E-ACC-21
    group: Pause & renewal
    title: Re-grant races the server generator
    when: Cloud back · server generates before the phone resumes
    then: |
      - phone copies take the server ids, no collision
      - generator skips unentitled books
    status: fixed
    risk: medium
  - id: E-ACC-22
    group: Pause & renewal
    title: Pause marker across a logout
    when: paused user logs out and in again
    then: |
      - marker parked with the account, given back
      - cleared → changes in between lost for good
    risk: high
  - id: E-ACC-23
    group: Pause & renewal
    title: Revoke noticed days late
    when: phone learns of the pause long after
    then: |
      - pause starts at the earlier of now and term end
      - renewal fetches from the earliest pushed date (L1)
    risk: medium
    tests:
      - file: test/features/cloud_tier/occurrence_reconciler_test.dart
        name: asks the server from the earliest occurrence the push will send, however long before the lapse (L1)
  - id: E-ACC-24
    group: Pause & renewal
    title: Teardown fails first time
    when: first pause attempt fails · offline
    then: start time kept → earlier writes still pushed on renewal (L2)
    risk: medium
    tests:
      - file: test/features/cloud_tier/lapse_test.dart
        name: a failed attempt keeps its start, so the writes made before a later success are still pushed (L2)
  - id: E-ACC-25
    group: Pause & renewal
    title: New sign-up without a grant
    when: account created from Nov 8 on
    then: |
      - paused right after onboarding
      - onboarding's pull still runs, else the book is server-only
    status: by-design
    risk: medium
  - id: E-ACC-26
    group: Pause & renewal
    title: Unconfirmed account
    when: phone updates offline, never heard the server
    then: counts as entitled · only a confirmed lapse pauses
    status: by-design
    risk: high
    tests:
      - file: test/features/cloud_tier/server_sync_entitlement_test.dart
        name: a cached verdict that cannot be read counts as unconfirmed, not as a lapse

  # Local books
  - id: E-ACC-40
    group: Local books
    title: Delete a bank account, no sync
    when: account with recurring rules deleted in a local book
    then: |
      - its rules deleted too
      - with sync: account soft-deleted, rules paused
      - kept by Gerald 2026-10-07
    status: by-design
    risk: medium
  - id: E-ACC-41
    group: Local books
    title: Android OS backup
    when: phone restored from Google backup
    then: |
      - database + prefs come back
      - photos + secure storage don't → app-lock PIN fails open
    status: by-design
    risk: medium
    related: [R-PRIV-03]
  - id: E-ACC-42
    group: Local books
    title: Signed out · widgets, reminders
    when: signed out with books kept
    then: |
      - reminders cancelled, re-armed on sign-in
      - balance widget: *Open Money Koi to sign in*
    risk: low
    tests:
      - file: test/app/lifecycle/session_life_cycle_manager_test.dart
        name: a sign-in after a sign-out re-arms the account
  - id: E-ACC-50
    group: On the web
    title: Open redirect after sign-in
    when: "`?next=/\\evil.example` in a sign-in link"
    then: dashboard · the path is parsed, not prefix-matched (review 5, fixed 2026-10-24)
    status: fixed
    risk: high
    tests:
      - file: src/app/login/page.test.tsx
        repo: web
        name: ignores a backslash-prefixed ?next= that browsers resolve off-origin
  - id: E-ACC-51
    group: On the web
    title: Profile without a name
    when: user without display name opens `/profile`
    then: the card shows the email · the editor refuses an empty name (review 26, fixed 2026-10-23)
    status: fixed
    risk: low
    tests:
      - file: src/app/(main)/profile/page.test.tsx
        repo: web
        name: shows the email in place of a missing name, and refuses to save an empty one
  - id: E-ACC-52
    group: On the web
    title: Any URL as an avatar
    when: a client writes any URL to `profile.avatar_url`
    then: web shows a co-member's photo only from our `avatars` bucket, else the initial · server refuses other URLs once T-PRIV-06 is done · details E-PRIV-41 (review 21, fixed 2026-11-02)
    status: fixed
    risk: medium
    tests:
      - file: src/components/shared/member-attribution.test.tsx
        repo: web
        name: never requests an avatar from outside our avatars bucket
    related: [E-PRIV-41]
  - id: E-ACC-53
    group: On the web
    title: Dev logins in source
    when: always
    then: dev buttons only under `npm run dev`, from `.env.development.local`, none without it · details E-PRIV-42 (review 20, fixed 2026-11-02)
    status: fixed
    risk: medium
    tests:
      - file: src/app/login/page.test.tsx
        repo: web
        name: offers none outside development, even with accounts in the env
    related: [E-PRIV-42]
  - id: E-ACC-60
    group: Small screens
    title: Welcome on a small phone
    when: 360×640 dp phone, or a large system font
    then: |
      - key points dropped first
      - *Get started*, *Sign in* and the terms stay on screen, no scrolling
    status: fixed
    risk: medium
    tests:
      - file: test/features/auth/ui/pages/welcome_page_test.dart
        name: drops the key points so every action and the terms stay on screen without scrolling
  - id: E-ACC-61
    group: Small screens
    title: Returning user on a small phone
    when: signed-out account remembered · 360×640 dp phone
    then: koi shrinks (down to 72 dp) · *Sign back in*, *New here?* and the terms on screen
    status: fixed
    risk: medium
    tests:
      - file: test/features/auth/ui/pages/welcome_page_test.dart
        name: a short phone shrinks the koi so the terms stay on screen without scrolling
  - id: E-ACC-62
    group: Small screens
    title: Onboarding steps 1–2 on a small phone
    when: 360×640 dp phone
    then: |
      - koi shrinks, then is dropped
      - step 1: language + currency above *Continue* · step 2: both setup choices on screen
    status: fixed
    risk: medium
    tests:
      - file: test/features/onboarding/ui/screens/onboarding_basic_screen_test.dart
        name: a short phone shrinks the koi, then drops it, before the fields would scroll
      - file: test/features/onboarding/ui/screens/onboarding_method_screen_test.dart
        name: a short phone shrinks the koi, then drops it, before the second choice would scroll
  - id: E-ACC-63
    group: Small screens
    title: Still scrolls on 360×640 dp
    when: German step 2 · *Welcome back*
    then: |
      - step 2: second choice half visible, rest one scroll away
      - *Welcome back*: koi dropped, terms (de: *Restore Pro purchase* too) below the fold · since 2026-11-06 one *Restore* button instead of two, re-check (C-ACC-083)
    status: known-issue
    risk: low
  - id: E-ACC-64
    group: Small screens
    title: German greeting drops the name
    when: returning user · German · 360 dp wide
    then: "*Willkommen zurück,* fills both lines · name cut off · open"
    status: known-issue
    risk: low
  - id: E-ACC-70
    group: Store review
    title: Review account gets no mail
    when: "`google-review@moneykoi.app` on *Sign in with email* · typed, or the remembered address"
    then: |
      - form switches to *Password* · no link sent
      - *Send email link* after switching back → back to *Password*, still no link
      - before: every link bounced to the SMTP sender for 48 h
      - list: `FeatureConstants.passwordOnlyEmails`
    status: fixed
    risk: medium
    tests:
      - file: test/features/auth/ui/pages/email_signin_page_test.dart
        name: typing it switches to the password form
      - file: test/features/auth/ui/pages/email_signin_page_test.dart
        name: never sends a link, even after switching back to the link form
      - file: test/features/auth/ui/pages/email_signin_page_test.dart
        name: as the remembered address it opens on the password form
  - id: E-ACC-71
    group: Sign-in
    title: Password sign-in flashes *Check inbox*
    when: "*Sign in with Email* → *Password* → *Login*, profile slow to load"
    then: fixed 2026-11-03 · the password form stays, its button spins until Home opens · before, *Check inbox · We sent an email link…* showed for a second though no link was sent (IOS-6-1)
    status: fixed
    risk: medium
    tests:
      - file: test/features/auth/ui/pages/email_signin_page_test.dart
        name: a password sign-in keeps the password form and spins until the route changes
  - id: E-ACC-72
    group: Sign-in
    title: Half a koi under the keyboard
    when: "*Sign in with Email* · keyboard up"
    then: |
      - the illustration folds away while the keyboard is up · title and form in view · back when it closes
      - before 2026-11-03 art and title were cut off under the back button (iOS round, IOS-6-8)
    status: fixed
    risk: low
    tests:
      - file: test/features/auth/ui/widgets/sign_in_layout_test.dart
        name: the email sign-in art folds away while the keyboard is up
  - id: E-ACC-73
    group: Sign-in
    title: "*Continue with Apple* in bigger letters"
    when: iPhone · Welcome back, purchase restored, *Back up & sync*, join a book
    then: |
      - Apple, Google and email buttons share one height (44 pt) and one label size · Apple's 43 % title ratio kept
      - before 2026-11-03 Apple's label was ~23 pt next to 16 pt on the others (iOS round, IOS-6-8)
    status: fixed
    risk: low
    tests:
      - file: test/features/auth/ui/widgets/sign_in_layout_test.dart
        name: "Apple, Google and email read as one group: same height, same label size"
