# Source: MONETIZATION_AI_CONTEXT.md §9b journeys, OFFLINE_TIER_AI_CONTEXT.md §2, §9, §10.
items:
  # Start
  - id: J-ACC-01
    group: Start
    title: First run, no account
    from: fresh install
    steps:
      - Welcome → **Get started**
      - onboarding offline · all currencies
    result: Local Free book
    tests:
      - file: test/features/auth/ui/pages/welcome_page_test.dart
        name: mints the local book, then pushes onboarding over the welcome screen
      - file: test/app/navigation/app_entry_gate_test.dart
        name: a local book that finished onboarding opens straight into the app
    checks: [C-ACC-001]
    related: [J-MON-01]
  - id: J-ACC-42
    group: Start
    title: Finds Money Koi on the web first
    from: no app · my.moneykoi.com, from Nov 8
    steps:
      - login → Google or email → an account + an empty book
      - "*Get the app* · Google Play / QR"
      - app → *Get started* → local book → *Get Cloud* → sign in with the same account
      - claim moves the phone's book into the empty one
      - web → *Check again*
    result: the web opens the book
    note: |
      - the web sets nothing up for an account without Cloud (R-ACC-66)
      - iPhone: no app yet · *The iPhone app is on its way*
    tests:
      - file: e2e/onboarding.spec.ts
        repo: web
        name: a fresh account without Cloud is sent to the app, and nothing is set up
    checks: [C-ACC-074]
    related: [J-MON-11, J-ACC-01]
  - id: J-ACC-02
    group: Start
    title: Backs out of onboarding
    from: Welcome → *Get started*
    steps:
      - back on the first step
    result: Welcome again, nothing kept
    note: |
      - Android back never closes the app there
      - after onboarding: not undoable this way
    tests:
      - file: test/features/auth/ui/pages/welcome_page_test.dart
        name: coming back from onboarding leaves Get started ready again
  - id: J-ACC-03
    group: Start
    title: Logs out of a new account's setup
    from: Welcome → *I already use Money Koi* → sign in with a new account
    steps:
      - "*Log out* in the first step's app bar (no back there)"
    result: Welcome, signed out · nothing created
    note: |
      - later steps have back, not *Log out*
      - an invitee's automatic Quick Start has neither
    tests:
      - file: test/features/onboarding/ui/pages/onboarding_page_test.dart
        name: a signed-in account has nothing to go back to on the first step, so it logs out instead
    checks: [C-ACC-007]

  # Into an account
  - id: J-ACC-10
    group: Into an account
    title: Back up & sync · Cloud account
    from: Local book
    steps:
      - Settings → *Back up & sync* → *Back up this book*
      - Google or email sign-in
      - progress with counts
    result: book syncs · web shows all
    status: waiting
    note: open on every install since 2026-10-21 (T-MON-20) · device test T-MON-07 still open
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: a full run checks the plan, adopts by currency code, re-tenants, pushes, then hands over to sync
      - file: test/features/cloud_tier/claim_progress_page_test.dart
        name: a finished claim confirms it and opens the app on a fresh stack
    checks: [C-ACC-010, C-ACC-011]
    related: [J-MON-11, J-MON-12]
  - id: J-ACC-11
    group: Into an account
    title: Back up & sync · free account
    from: Local book
    steps:
      - "*Back up & sync* → sign in"
      - "*This account doesn't have a Cloud plan yet*"
      - "*See plans* · *Keep it on this phone* · *Try again*"
    result: Cloud after buying, or local under the account
    status: waiting
    tests:
      - file: test/features/cloud_tier/claim_progress_page_test.dart
        name: an account without a Cloud plan is offered the plans, keeping the book on the phone and Try again
    checks: [C-ACC-014]
    related: [J-MON-14]
  - id: J-ACC-12
    group: Into an account
    title: Claim interrupted
    from: claim uploading
    steps:
      - airplane mode or kill
      - "*Try again* · or *Continue offline* → *Finish backup*"
    result: done, no duplicates
    tests:
      - file: test/features/cloud_tier/claim_progress_page_test.dart
        name: Continue offline after the re-tenant defers the claim and opens the app
    checks: [C-ACC-012]
  - id: J-ACC-13
    group: Into an account
    title: Cloud later uploads a kept book
    from: kept book, free account
    steps:
      - Cloud bought or granted
      - relaunch
    result: upload starts by itself
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: Cloud later uploads a moved book from `retenanted`, and its local stretch ends with it
    checks: [C-ACC-015]
  - id: J-ACC-14
    group: Into an account
    title: Profile sign-in · not a claim
    from: Local book
    steps:
      - Profile → *Sign in*
      - local book set aside, hidden
      - "*Log out* → *Continue without an account*"
    result: local book back, untouched
    note: Changed since 1.16.1 · book used to come back by itself
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: is set aside without a row deleted
    checks: [C-ACC-033, C-ACC-044]

  # Accounts on the phone
  - id: J-ACC-20
    group: Accounts on the phone
    title: Logs out, logs back in
    from: Cloud or free account
    steps:
      - "*Log out* → Welcome + *Sign back in*"
      - "*Sign back in* · fresh sign-in"
    result: same books · delta sync
    tests:
      - file: test/app/lifecycle/session_life_cycle_manager_test.dart
        name: a logout detaches the account under its id and silences its reminders, deleting nothing
      - file: test/app/lifecycle/session_life_cycle_manager_test.dart
        name: a sign-in restores that account and remembers it for Sign back in
    checks: [C-ACC-030]
  - id: J-ACC-21
    group: Accounts on the phone
    title: Another person signs in
    from: phone with A's books, signed out
    steps:
      - "*Use another account*"
      - B signs in
    result: only B's books visible
    checks: [C-ACC-030]
  - id: J-ACC-22
    group: Accounts on the phone
    title: Session lost
    from: signed in
    steps:
      - token revoked or password changed elsewhere
      - = a logout → Welcome
    result: nothing deleted · unsent changes wait
    checks: [C-ACC-040]
  - id: J-ACC-23
    group: Accounts on the phone
    title: Cloud user on a new phone
    from: new phone
    steps:
      - '*I already use Money Koi*'
      - sign in
      - books download
    result: Cloud
  - id: J-ACC-24
    group: Accounts on the phone
    title: Free account on a second phone
    from: free account, second phone
    steps:
      - "*I already use Money Koi* → sign in"
      - own book doesn't sync
    result: "Home: *Your book is on your other phone*"
    note: |
      - card gone after the first booking or with Cloud
      - copies from both phones merge on upgrade · phone wins per row
    checks: [C-ACC-023, C-ACC-026]

  # Pause & renewal
  - id: J-ACC-30
    group: Pause & renewal
    title: Sync pauses
    from: Cloud
    steps:
      - grant ends · store, admin, simulator
      - next start/sign-in/resume asks the server
      - outbox drains · last pull · realtime off
      - review page opens once
    result: "*Sync paused* · all stays, all works"
    tests:
      - file: test/features/cloud_tier/lapse_test.dart
        name: drains the outbox first, then marks the open book and stops realtime — no wipe, no sign-out
      - file: test/app/ui/supabase_container_test.dart
        name: a teardown opens the lapse review on top of the app
    checks: [C-ACC-020, C-ACC-021]
    related: [J-MON-50]
  - id: J-ACC-31
    group: Pause & renewal
    title: Sync resumes
    from: Paused
    steps:
      - grant back
      - phone generates, then meets server bookings
      - pushes · replays deletes
    result: syncing · nothing lost or doubled
    tests:
      - file: test/features/cloud_tier/occurrence_reconciler_test.dart
        name: 'server first: an untouched device copy takes the server id and the server version, its tags follow'
      - file: test/features/cloud_tier/lapse_delete_replay_test.dart
        name: deletes in two books survive Empty trash, and each reaches the server under its own book
    checks: [C-ACC-020, C-ACC-022]
    related: [J-MON-15]
  - id: J-ACC-32
    group: Pause & renewal
    title: Lost a book while paused
    from: paused, removed from a shared book
    steps:
      - renewal finds the book gone
      - "*Books you lost access to* · *Export* · *Remove*"
      - "*Done*"
    result: resume goes on · rows stay on the phone
    tests:
      - file: test/features/cloud_tier/lapse_review_page_test.dart
        name: a book lost while lapsed gets its own section, out of the shared one
      - file: test/features/cloud_tier/lapse_review_page_test.dart
        name: Done marks the lost books reviewed and lets the resume go on
    checks: [C-ACC-022]

  # Leaving
  - id: J-ACC-40
    group: Leaving
    title: Deletes the account
    from: account
    steps:
      - Profile → *Delete account*
      - names shared books · store keeps billing
    result: "server: all · phone: wiped or only own books"
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: removes the books the account owned, its rows and cursors, and drops its prefs instead of parking them
    checks: [C-ACC-031, C-ACC-032, C-ACC-042]
    related: [J-BOOK-32]
  - id: J-ACC-41
    group: Leaving
    title: Deletes the local book
    from: Local book
    steps:
      - Profile → *Delete all data* / *Delete this book*
    result: "Welcome · with kept books: only the local book goes"
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: removes the local book
    checks: [C-ACC-005, C-ACC-043]
