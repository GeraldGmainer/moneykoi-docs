# Source: OFFLINE_FIRST_AI_CONTEXT.md, OFFLINE_TIER_AI_CONTEXT.md, MONETIZATION_AI_CONTEXT.md §9a/§9b.
items:
  # Identity & the phone
  - id: R-ACC-01
    group: Identity & the phone
    title: Every new user starts local
    text: |
      - Welcome: **no sign-up**
      - *Get started* → book on the phone · no account, no email, no server
      - account later: Cloud · invite · web
    source: MONETIZATION §9a
    tests:
      - file: test/features/auth/ui/pages/welcome_page_test.dart
        name: 'offers no sign-in of its own: new users start local'
      - file: test/features/auth/ui/pages/welcome_page_test.dart
        name: mints the local book, then pushes onboarding over the welcome screen
    related: [R-MON-04]
  - id: R-ACC-02
    group: Identity & the phone
    title: Session alone decides local or cloud
    text: |
      - signed in → always cloud, even with an odd token
      - else a paying user could drop to local, stop syncing
    source: OFFLINE_TIER §2
    tests:
      - file: test/core/identity/identity_resolver_test.dart
        name: a session missing its claims still counts as cloud, never as local mode
      - file: test/core/identity/identity_resolver_test.dart
        name: a session wins over a local pair, so an existing user resolves exactly as before
  - id: R-ACC-03
    group: Identity & the phone
    title: The phone caches books
    text: |
      - ≤ 1 book without account + any accounts' books
      - **who is signed in** decides what is visible
      - hidden by membership, **never** deleted
    source: MONETIZATION §9b rule 2
    tests:
      - file: test/core/identity/identity_resolver_test.dart
        name: the local pair stays readable under a session, for the book set aside while signed in
      - file: test/core/offline_first/wiper_test.dart
        name: 'deletes no row: the outbox is detached, caches dropped, the cursors kept for the delta sync back'
  - id: R-ACC-04
    group: Identity & the phone
    title: Only four things delete data
    text: |
      - *Delete account* · *Delete all data* · uninstall · *Remove from this phone*
      - **never**: logout, lost session, account switch, lapse, membership change
    source: MONETIZATION §9b rule 1
    tests:
      - file: test/app/lifecycle/session_life_cycle_manager_test.dart
        name: a logout detaches the account under its id and silences its reminders, deleting nothing
  - id: R-ACC-05
    group: Identity & the phone
    title: Same account = same profile id
    text: |
      - **never** the same email · emails can be reused
      - Welcome greeting reads the profile id too
    source: MONETIZATION §9b rule 5
  - id: R-ACC-06
    group: Identity & the phone
    title: "*Sign back in* = fresh sign-in"
    text: |
      - old refresh token **not** kept
      - a logout that keeps the session isn't a logout
    source: MONETIZATION §9b traps
  - id: R-ACC-07
    group: Identity & the phone
    title: Profile *Sign in* ≠ claim
    text: |
      - local book set aside · hidden while signed in
      - logout → Welcome · book stays **closed**
      - *Continue without an account* → opens it again
      - move book into account = *Back up & sync*
    source: MONETIZATION §9a, OFFLINE_FIRST §9
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: is set aside without a row deleted
      - file: test/core/identity/identity_resolver_test.dart
        name: 'stays closed after the sign-out: no identity resolves, the pair is still there'

  # Books without an account
  - id: R-ACC-20
    group: Books without an account
    title: Local book sends nothing
    text: |
      - rows written finished · no outbox · no pull
      - with an account: only books, members, invites pulled
    source: OFFLINE_TIER §1, §5
    tests:
      - file: test/core/offline_first/writer_local_mode_test.dart
        name: persists the row as synced and never touches the outbox
      - file: test/core/offline_first/sync_gate_test.dart
        name: 'pullsMembershipOnly: an account in a local book, never a book without one, never mid-claim'
  - id: R-ACC-21
    group: Books without an account
    title: Local deletes cascade like the server
    text: |
      - goal → its contributions · category → subs + bookings
      - one transaction · else a later claim fails forever (H1)
    source: OFFLINE_TIER §5
    tests:
      - file: test/core/offline_first/delete/local_delete_cascade_test.dart
        name: 'the whole cascade is one transaction: a failure part-way leaves every row as it was'
      - file: test/core/offline_first/delete/local_delete_rule_test.dart
        name: a rule covers everything its RPC cascades
  - id: R-ACC-22
    group: Books without an account
    title: One generator per book
    text: |
      - Cloud book → server makes recurring bookings
      - local book → the phone · **never** both
      - account: only books it owns · signed out: none
    source: OFFLINE_TIER §4, §5; MONETIZATION §9b rule 7
    tests:
      - file: test/core/offline_first/sync_gate_test.dart
        name: a book without an account generates its own occurrences
      - file: test/core/offline_first/sync_gate_test.dart
        name: 'a syncing account never does: the server materializes'
  - id: R-ACC-23
    group: Books without an account
    title: What a local book hides
    text: |
      - Books page · book switcher · *Use on computer* · profile photo
      - book currency: shown, not tappable
      - logout · set password · delete account → *Delete all data* / *Delete this book*
    source: OFFLINE_TIER §7

  # Claim — moving a local book into an account
  - id: R-ACC-30
    group: Claim — moving a local book into an account
    title: Claim never re-uploads a known book
    text: "- server knows the book + you're a member → delta sync or resume"
    source: MONETIZATION §9b rule 4
  - id: R-ACC-31
    group: Claim — moving a local book into an account
    title: No Cloud → nothing uploaded
    text: |
      - book moves under the account, stays on the phone
      - Cloud later → upload starts by itself
    source: OFFLINE_TIER §9
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: an account without Cloud gets the book moved under it, and nothing uploaded
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: Cloud later uploads a moved book from `retenanted`, and its local stretch ends with it
  - id: R-ACC-32
    group: Claim — moving a local book into an account
    title: Claim resumes, never wipes
    text: |
      - every step retryable · re-sent chunks are no-ops
      - *Try again* · *Continue offline* → *Finish backup* later
      - **never** a half book, never a logout
    source: OFFLINE_TIER §9 (W1–W2)
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: 'W1: a final pull that fails keeps the claim, so Try again finishes it and nothing is wiped'
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: a push that dies mid-way keeps the claim, and the retry skips adopt and re-tenant
  - id: R-ACC-33
    group: Claim — moving a local book into an account
    title: Account with books → one more
    text: |
      - no discard option
      - at the 3-book limit → own message, nothing uploaded
    source: MONETIZATION §9a
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: an account that already keeps a book gets the device book as a new one
  - id: R-ACC-34
    group: Claim — moving a local book into an account
    title: Moved → other accounts refused
    text: |
      - other account signs in → mismatch screen, only log out
      - pending claim keeps that logout from wiping
    source: OFFLINE_TIER §9
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: once re-tenanted, a different account is refused instead of receiving the book
  - id: R-ACC-35
    group: Claim — moving a local book into an account
    title: Leaving the intro cancels only unstarted
    text: |
      - no sign-in started → claim dropped
      - Google or email started → claim **stays** (W4)
    source: OFFLINE_TIER §9
    tests:
      - file: test/features/cloud_tier/claim_book_use_case_test.dart
        name: a claim abandoned before the sign-in is cancelled, one that started is not
      - file: test/features/cloud_tier/claim_intro_page_test.dart
        name: 'W4: after a Google sign-in started, leaving keeps the claim for the session still on its way'
  - id: R-ACC-36
    group: Claim — moving a local book into an account
    title: Claim open on every install
    text: |
      - *Back up & sync* · *Get Cloud free* · Profile *Sign in* · *Join {book}* — no switch left
      - developer mode only 2026-10-08 → 2026-10-21 · opened ahead of the device test (T-MON-07)
    source: OFFLINE_TIER §7, §9
    tests:
      - file: test/features/cloud_tier/claim_entry_test.dart
        name: a local book is offered Cloud free until the cutover, on every install
      - file: test/features/cloud_tier/cloud_sync_tiles_test.dart
        name: a device without an account is offered Back up & sync, which opens the claim intro
    related: [T-MON-20, D5]

  # Pause & renewal
  - id: R-ACC-40
    group: Pause & renewal
    title: Only the server's word pauses sync
    text: |
      - not confirmed yet → still entitled
      - failed refresh → cached verdict stays · no guessing
      - grant/revoke reaches the phone on start, sign-in or resume
    source: OFFLINE_TIER §12
    tests:
      - file: test/features/cloud_tier/server_sync_entitlement_test.dart
        name: an account the server has not confirmed yet is entitled
      - file: test/features/cloud_tier/server_sync_entitlement_test.dart
        name: a failed refresh keeps the cached verdict
  - id: R-ACC-41
    group: Pause & renewal
    title: Pause never deletes, never signs out
    text: |
      - outbox drains → last pull → realtime stops
      - phone keeps working locally · *Sync paused*
    source: OFFLINE_TIER §10
    tests:
      - file: test/features/cloud_tier/lapse_test.dart
        name: drains the outbox first, then marks the open book and stops realtime — no wipe, no sign-out
  - id: R-ACC-42
    group: Pause & renewal
    title: Nothing generates before the last pull
    text: |
      - last pull didn't run → no pause marker → retried
      - phone never doubles server-made recurring bookings
    source: OFFLINE_TIER §10
    tests:
      - file: test/features/cloud_tier/lapse_test.dart
        name: a last pull that did not run leaves no lapse marker, so nothing generates and the next reconcile retries
  - id: R-ACC-43
    group: Pause & renewal
    title: Paused deletes survive to renewal
    text: |
      - even *Empty trash* keeps a hidden delete record
      - replayed on renewal, each in its own book
    source: OFFLINE_TIER §5 (H2), §10
    tests:
      - file: test/features/cloud_tier/lapse_delete_replay_test.dart
        name: deletes in two books survive Empty trash, and each reaches the server under its own book
  - id: R-ACC-44
    group: Pause & renewal
    title: "Renewal: phone wins per row"
    text: |
      - double recurring bookings meet on the server's ids
      - user-edited one keeps its content (D-H2)
      - no keep-device / keep-cloud prompt
    source: OFFLINE_TIER §10 step 4
    tests:
      - file: test/features/cloud_tier/occurrence_reconciler_test.dart
        name: 'server first, but edited here: the device wins on the server id (D-H2)'
    related: [X4]
  - id: R-ACC-45
    group: Pause & renewal
    title: Pause markers per book
    text: |
      - free member's own book paused · shared Cloud book syncs
      - old 1.16.1 marker covers all books until known
    source: OFFLINE_TIER §5
    tests:
      - file: test/core/offline_first/sync_gate/lapse_markers_test.dart
        name: moves onto every book of the account on the first read, joined ones included
      - file: test/core/offline_first/sync_gate_test.dart
        name: a pause written before B1, one timestamp for the account, now pauses every book of the account, a shared one too
  - id: R-ACC-46
    group: Pause & renewal
    title: Paused server copy kept
    text: |
      - as long as the account exists
      - no cleanup job, no 7/30/60-day warnings
    source: MONETIZATION §9a (D-C6)
    related: [D-C6]

  # Deleting
  - id: R-ACC-50
    group: Deleting
    title: "*Delete account* takes only its own"
    text: |
      - server: everything + every **owned** book, for all members
      - purchases: identifiers stripped from our purchase events (product, date, price, country stay 7 years) · the RevenueCat customer deleted (D15)
      - phone: wiped · or, with other accounts, only its own books and data
      - joined books stay for the others
    source: OFFLINE_FIRST §9
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: removes the books the account owned, its rows and cursors, and drops its prefs instead of parking them
      - file: test/core/offline_first/wiper_test.dart
        name: keeps the other accounts
  - id: R-ACC-68
    group: Deleting
    title: "*Delete account* revokes the Apple sign-in"
    text: |
      - an Apple account: Money Koi leaves the Apple ID's *Sign in with Apple* list (iPhone Settings) · the next Apple sign-in starts fresh
      - app and web alike · runs before the account is deleted
      - Apple unreachable or refusing → the account is deleted anyway
      - the Apple token never reaches the phone · kept only on the server, gone with the account
      - a failed token handover at sign-in never blocks the sign-in · that account is then deleted without a revoke
    source: 03_TECHNICAL_ARCHITECTURE.md › Sign in with Apple; moneykoi-supabase CLAUDE.md §11 (`account`, `deno test` in `supabase/functions/account/`), 20261102200000_apple_sign_in_token.sql
    tests:
      - file: test/features/auth/data/user_remote_source_apple_test.dart
        name: the authorization code goes to the server with the bundle id the identity token names, never further
      - file: test/features/auth/data/user_remote_source_apple_test.dart
        name: a failed exchange never fails the sign-in, and the name still lands
      - file: test/features/auth/data/remote_sources/user_remote_source_test.dart
        name: deleting the account goes through the account function, which revokes Apple before it deletes
      - file: src/app/(main)/delete-account/page.test.tsx
        repo: web
        name: deletes only after the confirmation word is typed
    related: [R-ACC-50, R-ACC-67, T-PLAT-11, T-PLAT-13]
  - id: R-ACC-51
    group: Deleting
    title: "*Delete this book* next to kept books"
    text: |
      - only the local book goes
      - other accounts' books, unsent writes, app lock stay
      - nothing else on the phone → full wipe
    source: OFFLINE_TIER §6
    tests:
      - file: test/core/offline_first/wiper_test.dart
        name: removes the local book
      - file: test/core/offline_first/wiper_test.dart
        name: keeps every signed-out account
  - id: R-ACC-52
    group: Deleting
    title: No "remove all data" on Welcome
    text: |
      - uninstall clears the phone
      - Android reinstall may restore from Google backup: database + prefs only
    source: MONETIZATION §9a, OFFLINE_TIER §11

  # On the web
  - id: R-ACC-60
    group: On the web
    title: "Web: same sign-in, no sign-up page"
    text: |
      - magic link (default) · email code signs in at the 6th digit
      - password · Google · new address → an account (can't be blocked per client; invites need it)
      - onboarding only with a Cloud book · else → *Get the app* (R-ACC-66)
      - ≥ 1024 px: *Sign in with the app* → QR page, the phone approves
      - under the card: *New to Money Koi?* → Google Play · QR from 1024 px
    source: AUTH_PROFILE_WEB §1, §5
    tests:
      - file: src/app/login/page.test.tsx
        repo: web
        name: signs in with the six-digit code as soon as it is complete and honours ?next=
      - file: src/app/login/page.test.tsx
        repo: web
        name: links to the QR page without starting a request
      - file: src/app/login/app/page.test.tsx
        repo: web
        name: lands on the ?next= path once the app approves the code
      - file: src/app/login/page.test.tsx
        repo: web
        name: points a newcomer to the app on Google Play, with a code a phone can scan
    related: [J-PRIV-30]
  - id: R-ACC-66
    group: On the web
    title: "Web: a new account without Cloud goes to the app"
    text: |
      - unfinished setup + no Cloud book (own Cloud or a shared Cloud book) → *Get the app*, not onboarding
      - steps: install · set up the book in the app · get Cloud there, sign in with **this** address
      - Google Play button · QR from 1024 px · *The iPhone app is on its way*
      - **writes nothing**: the empty book lets the app's claim move the phone's book in (a filled one → `BOOK_NOT_EMPTY`, two books)
      - *Check again* asks the server fresh → Cloud → setup · *Log out*
      - no verdict / failed read → setup as before
      - before Nov 8 every new account has Cloud → nobody lands here
    source: ONBOARDING_WEB §1a · BOOKS_WEB §4.11
    tests:
      - file: src/app/onboarding/page.test.tsx
        repo: web
        name: sends an account without a Cloud book to the app instead, setting nothing up
      - file: src/app/get-app/page.test.tsx
        repo: web
        name: asks the server again and moves on once the account has Cloud
      - file: e2e/onboarding.spec.ts
        repo: web
        name: a fresh account without Cloud is sent to the app, and nothing is set up
    related: [J-ACC-42, D13, R-MON-02]
  - id: R-ACC-61
    group: On the web
    title: Web logout keeps the phone signed in
    text: |
      - computer has its own session
      - web logout **never** revokes the phone's
    source: AUTH_PROFILE_WEB §4.4
  - id: R-ACC-62
    group: On the web
    title: "`?next=` returns to the invite"
    text: |
      - only same-origin paths · else → dashboard
      - backslash and tab tricks → dashboard too (E-ACC-50)
    source: AUTH_PROFILE_WEB §4.2
    tests:
      - file: src/app/login/page.test.tsx
        repo: web
        name: lets the emailed link return to the invite that sent the user here
  - id: R-ACC-63
    group: On the web
    title: Web delete account = app's
    text: |
      - says what goes · owned shared books + members named
      - store subscription warning · both store links
      - typed confirmation word
    source: AUTH_PROFILE_WEB §1, §6
    tests:
      - file: src/app/(main)/delete-account/page.test.tsx
        repo: web
        name: deletes only after the confirmation word is typed
      - file: src/app/(main)/delete-account/page.test.tsx
        repo: web
        name: names the shared books the account owns, with their members
    related: [R-ACC-50]
  - id: R-ACC-64
    group: On the web
    title: "Web: no offline, no local book"
    text: |
      - always account + connection
      - local book · claim · pause · outbox → phone only
    source: web 01_OVERVIEW, catalog
  - id: R-ACC-65
    group: On the web
    title: "Web profile: edit in a side panel"
    text: |
      - name and email shown as text · *Edit* → panel from the right · *Cancel* / *Save changes* (off until something changed)
      - leaving with an edit pending (X, Esc, outside, *Cancel*) → *Discard changes?* · *Keep editing* / *Discard*
      - new email → confirmation mail · applies once confirmed · *Confirmation pending for …* until then · app has no email change
      - empty name refused · language picker on the page too (same row as Settings, shared with the app)
    source: AUTH_PROFILE_WEB §1, §4.6, §4.9, §5
    tests:
      - file: src/app/(main)/profile/components/profile-edit-sheet.test.tsx
        repo: web
        name: asks before closing with an edit pending, and Keep editing returns to it
      - file: src/app/(main)/profile/page.test.tsx
        repo: web
        name: asks GoTrue to move the account to a new email and shows it as pending
      - file: src/app/(main)/profile/page.test.tsx
        repo: web
        name: changes the interface language right here and saves it in my settings row
  - id: R-ACC-67
    group: account
    title: Sign in with Apple · iPhone only
    text: |
      - iPhone: *Continue with Apple* above Google and email on every sign-in surface (welcome back, restore, claim, join) · Android: Google and email
      - Apple's sheet decides: real or relay address · the name arrives once, the server fills the profile name a moment later
      - *Sign back in* remembers the provider: an Apple account goes straight to the Apple sheet
      - closing the sheet = nothing happens · no error
      - the web keeps Google and email; an Apple account signs in there with the magic link to its (relay) address
    source: 03_TECHNICAL_ARCHITECTURE.md › Flavors, bundle ids and the iOS target; moneykoi-supabase 20261029120000_profile_name_after_apple_sign_in.sql
    tests:
      - file: test/features/auth/data/user_remote_source_apple_test.dart
      - file: test/features/auth/bloc/auth_cubit_test.dart
        name: a dismissed Apple sheet goes back to the initial state without an error
      - file: test/features/auth/ui/pages/welcome_back_page_test.dart
        name: on an iPhone Apple comes first and signs in with Apple
      - file: test/features/auth/ui/pages/welcome_page_test.dart
        name: an Apple account signs back in with Apple
    related: [D-PLAT-6, T-PLAT-10]
