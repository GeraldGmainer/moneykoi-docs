# Source: OFFLINE_TIER_AI_CONTEXT.md §14 (device checklist), MONETIZATION §12 (not device-tested),
# Trello release notes for 1.17.0 (items 1, 2, 4, 10, 11, 12).
groups:
  - id: setup
    title: Before you start
    setup: |
      - dev flavor · one device with a cloud account, one fresh
      - plan simulator: [Monetization → What to test](/monetization/testing/)
    items:
      - id: C-ACC-000
        text: Offline-tier, early-adopter, cloud-tenants migrations on dev (T-MON-01)

  - id: fresh
    title: Fresh install, no account
    items:
      - id: C-ACC-001
        text: Welcome *Get started* → onboarding offline, all currencies → kill + relaunch → main
      - id: C-ACC-002
        text: Add · edit · delete bookings · trash + restore · no pending badge
      - id: C-ACC-003
        text: Rule 2 months back → past bookings at once · relaunch → no doubles · future one on its day · delete category → rule paused
      - id: C-ACC-004
        text: "Investments: locked without Pro · prices arrive online · *Live prices* off → request stops"
      - id: C-ACC-005
        text: Budget-over + reminders fire · widgets configure · *Delete all data* → Welcome
      - id: C-ACC-006
        text: New book's **first** booking → onboarding card gone at once
      - id: C-ACC-007
        text: "*Sign in* → new account → setup step 1 → *Log out* → Welcome · sign in again → setup from step 1"
      - id: C-ACC-084
        text: "Welcome, regular phone → koi in a soft glow · three key points in one row · only *Get started* orange, *Free, no account needed* under it · *Try demo mode* and *Sign in* as white links · in de / ja a key point that wraps stays centred under its icon"

  - id: claim
    title: Back up & sync (the claim)
    items:
      - id: C-ACC-010
        text: "*Back up & sync* → sign in → progress → main · web shows all"
      - id: C-ACC-011
        text: New account adopts the book · account with a book → added as new · 3-book cap → message, nothing uploaded
      - id: C-ACC-012
        text: Airplane mid-upload → *Try again*, no doubles · *Continue offline* → *Finish backup* · kill → resumes
      - id: C-ACC-013
        text: Start as A, interrupt, sign in as B → mismatch → sign out → local book still there
      - id: C-ACC-014
        text: Free account → *See plans* → buy → claim continues · *Keep it on this phone* → local · old book *Locked*
      - id: C-ACC-015
        text: Kept book without Cloud → grant → relaunch → upload starts
      - id: C-ACC-016
        text: "*Back up this book*: koi top, buttons bottom · airplane + Google → error, page stays"
      - id: C-ACC-017
        text: "Drawer before Nov 8: *Get Free Cloud* row above Settings"

  - id: per-book
    title: Cloud per book
    items:
      - id: C-ACC-024
        text: A → *Simulate an ended subscription* → own books local · shared paid book keeps syncing
      - id: C-ACC-025
        text: "**Risk**: paused under 1.16.1 → update → still paused · renew → pushes all changes"

  - id: lapse
    title: Grant, revoke, pause, renew
    items:
      - id: C-ACC-020
        text: Grant → upload · revoke → *Sync paused*, review once, phone works, web gets nothing · re-grant → edits arrive
      - id: C-ACC-021
        text: "*Simulate an ended subscription* → sync stops · review: own + shared books · off → edits + deletes pushed"
      - id: C-ACC-022
        text: "Paused: delete + *Empty trash* → renew → gone on web · daily rule on 2nd phone → no duplicate · removed member → *Export* works"

  - id: accounts
    title: Accounts on the phone
    items:
      - id: C-ACC-030
        text: Logout keeps books · *Sign back in* → delta · other account → own books only · reminders off/on · widget *Open Money Koi to sign in*
      - id: C-ACC-031
        text: "*Delete account* → wipes, or only its books next to others · names shared books"
      - id: C-ACC-032
        text: Test-buy Cloud → *Delete account* → "keeps billing" + *Manage subscription* (real keys only)
      - id: C-ACC-033
        text: Local book → *Sign in* → only account books · *Log out* → *Continue without an account* → book back
      - id: C-ACC-023
        text: "Free account, 2nd phone → sign in → Home: *Your book is on your other phone* + *Get Cloud*"
      - id: C-ACC-026
        text: That card goes after the first booking, or with Cloud

  - id: untested
    title: Never run on a device yet
    setup: MONETIZATION §12 · everything above is untested since 2026-10-13 too
    items:
      - id: C-ACC-040
        text: Lost session (server revoke) → Welcome · nothing deleted
      - id: C-ACC-041
        text: No *Sign back in* right after deleting that account
      - id: C-ACC-042
        text: "*Delete account* next to other books → only its own"
      - id: C-ACC-043
        text: "*Delete this book* next to kept books → only the local book"
      - id: C-ACC-044
        text: Profile *Sign in* → book aside · logout → closed until *Continue without an account*

  - id: web
    title: On the web
    items:
      - id: C-ACC-070
        text: Magic link + 6-digit code both sign in · password · Google · new address → onboarding
      - id: C-ACC-071
        text: Web logout → phone stays signed in
      - id: C-ACC-072
        text: Set password on web → works in app · delete account on web → app shows Welcome next start
      - id: C-ACC-073
        text: Profile *Edit* → new email → *Save changes* → *Confirmation pending for …* · mail(s) arrive · follow → header + Profile show the new address, pending line gone · app signs in with it
      - id: C-ACC-074
        text: "After the cutover: fresh Google account on the web → *Get the app*, no setup · scan the QR → Play listing · app: *Get started* → get Cloud → sign in with that account → book uploads · web *Check again* → the book opens, no second book"

  - id: small
    title: Small phone (Small_Phone AVD, 360×640 dp)
    items:
      - id: C-ACC-080
        text: Welcome → no key points · *Get started*, *Sign in*, terms visible without scrolling · tall phone keeps key points
      - id: C-ACC-081
        text: Signed out, account remembered → small koi · *Sign back in*, *Use another account*, *New here?*, terms on screen
      - id: C-ACC-082
        text: Onboarding step 1 → language + currency above *Continue* · step 2 → both choices (en) · largest system font → scrolls, nothing clipped
      - id: C-ACC-083
        text: "German · *Welcome back* → *Wiederherstellen* → *Sicherung wiederherstellen* + *Pro-Kauf wiederherstellen* on one line each, not clipped · *Welcome back* itself: terms on screen · also on a ~5\" phone · E-ACC-63 still true?"
