        text: 'Transaction on a gram position: type in oz → saved in g · total ↔ price · gift *Value when received*'
      - id: C-INV-045
        text: 'Edit a position: Save stays off until something changes'

  - id: guards
    title: Oversell + transfers (app and web)
    items:
      - id: C-INV-050
        text: 'Sell dated before the first buy → "Only 0 … held" on the quantity, nothing saved'
      - id: C-INV-051
        text: 'Transfer 10 g onto an ounce position → arrives as 0.32 oz t · a counted position is not offered'
      - id: C-INV-052
        text: 'Tap a transfer leg → read-only, no Save · delete → both legs gone, both positions recalculated'

  - id: wizard
    title: Investment wizard steps
    items:
