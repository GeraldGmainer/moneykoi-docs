        text: "> 9 assets → 8 + *Show more · N more* · search shows all"
      - id: C-INV-011
        text: Pick from the hidden tail → back → group still expanded

  - id: web
    title: On the web
    items:
      - id: C-INV-040
        text: 'List: *Holdings* / *Performance* / *Allocation* tabs · *Returns* card · *Movers* opens on 1M, its tabs leave the chart alone'
      - id: C-INV-041
        text: 'Detail: chart opens on 1M · row 1M 3M 1Y 5Y All · a 2nd buy at a flat price reads 0 %'
