items:
  - id: J-INV-01
    group: Positions
    title: Adds a position
    from: Investments → + (Pro)
    steps:
      - "Step 1: asset · > 9 → 8 + *Show more*"
      - opening buy · price prefilled for that day
      - details → *Save*
    result: position at today's price
    checks: [C-INV-010, C-INV-020]
  - id: J-INV-02
    group: Positions
    title: Records a buy, sell or transfer
    from: a position → *Add transaction*
    steps:
      - kind, date, quantity, price, fee
      - optionally book the cash
    result: quantity + cost update · sell shows realized first
    tests:
      - file: test/features/investment/domain/services/investment_math_test.dart
        name: reports what a sell would realize before it is saved
    checks: [C-INV-030]
  - id: J-INV-03
    group: Positions
    title: Holds foreign cash
    from: Investments → + → *Currencies*
    steps:
      - pick JPY · book currency hidden
      - amount + rate, prefilled
    result: '"100,000 JPY" · "1 EUR = 175.42 JPY"'
    note: Switched on in prod 2026-11-16 · app ≥ 1.17.1 (T-INV-01)
    checks: [C-INV-001, C-INV-003]
  - id: J-INV-04
    group: Portfolio
    title: Reads the portfolio
    from: Investments
    steps:
      - value vs cost · allocation · movers · holdings
      - position → chart, XIRR, yield, ledger
    result: worth + performance
    checks: [C-INV-031]
