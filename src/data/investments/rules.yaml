  # What it's worth
  - id: R-INV-20
    group: What it's worth
    title: "Prices: server, once a day"
    text: |
      - fetched server-side · no keys in the app
      - converted at read time · "as of" shown
      - metals: gold-api.com · currencies: ECB · crypto: CoinGecko
    source: INVESTMENTS §1 (D1, D4), supabase §13.1
  - id: R-INV-21
    group: What it's worth
    title: Feed > manual > nothing
    text: |
      - manual price only while no feed prices it · app says when ignored
      - missing FX → *no price*, never parity
      - cost **never** shown as market value
    source: INVESTMENTS §0.2, §3.5
    tests:
      - file: test/features/investment/domain/entities/investment_test.dart
        name: the feed wins over a stale manual price, and the ignored price is flagged
      - file: test/features/investment/domain/entities/investment_test.dart
        name: no price at all is the no-price state, never cost dressed up as value
      - file: test/features/investment/domain/services/fx_service_test.dart
        name: an unknown source currency yields null, not parity
  - id: R-INV-22
    group: What it's worth
    title: Returns net of money in/out
    text: |
      - gain · realized · XIRR · yield · ROI
      - 2nd buy ≠ "+48 %" · a sell keeps its realized gain
    source: INVESTMENTS §3.3
    tests:
      - file: test/features/investment/domain/services/period_change_test.dart
        name: a price rise is measured on the capital at work, a buy weighted by how long it was invested
      - file: test/features/investment/domain/services/period_change_test.dart
        name: a sell inside the period keeps its realized gain instead of reading as a loss
  - id: R-INV-23
    group: What it's worth
    title: Price history kept on the phone
    text: |
      - downloaded once, newest first, then new days only
      - screens read only from it
      - no account → today's price, no chart (D6)
    source: SERIES_REPLICA, MONETIZATION §5
    related: [R-MON-52]
  - id: R-INV-24
    group: What it's worth
    title: Allocation + rebalancing
    text: |
      - by class, asset, place
      - target → drift + what to buy · needn't sum to 100 %
    source: INVESTMENTS §3.3, §3.5

