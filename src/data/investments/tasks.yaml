  - id: T-INV-16
    title: ECB cron twice a weekday
    owner: gerald
    detail: |
      - ECB publishes one rate a day · the app uses one rate per currency per day
      - 2026-11-09: 15:00 stored the day, the next 8 half-hourly runs re-read it unchanged
      - new: 15:30 UTC + the 20:00 final (unchanged) · a late day lands at 20:00 at worst
      - done when the check shows `30 15 * * 1-5` + `0 20 * * 1-5`, both active · next weekday 2 `ecb` runs
    command: |
      select cron.alter_job((select jobid from cron.job where jobname = 'fetch-prices-ecb'), schedule := '30 15 * * 1-5');
      select jobname, schedule, active from cron.job where jobname like 'fetch-prices-ecb%';
