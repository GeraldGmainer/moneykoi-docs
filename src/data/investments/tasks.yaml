  - id: T-INV-01
    title: Turn currency positions on
    owner: gerald
    detail: |
      - after CI applied `20261014120000_currency_assets.sql`: 29 rows, USD = 1, EUR > 1
      - after the app + web release with currencies → switch the catalog on
      - older builds would list them under "other"
    command: |
      select a.symbol, q.price, q.source from public.asset_quote q join public.asset a on a.id = q.asset_id where a.asset_class = 'currency' order by a.sort_order;
      update public.asset set is_active = true where asset_class = 'currency';
