    title: FX cutover to the ECB · ≈ 2026-10-19
    owner: gerald
    detail: |
      - when most users run ≥ 1.15.0 (admin Versions)
      - last query: 29 live `ecb` rows · rollback `rollback_fx.sql`
      - next morning: log shows `coingecko` only
      - after 3 days: purge metals.dev + Frankfurter (dry run) · unset secrets
