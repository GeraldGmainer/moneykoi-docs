items:
  - id: D-INV-1
    question: Currency → non-currency transfer (JPY → BTC)?
    status: open
    answer: Allowed today · no decision yet
  - id: D-INV-2
    question: Which currencies can be held?
    status: decided
    date: 2026-10-14
    answer: The ECB's 29 · other 18 lose their rate at the ECB cutover
  - id: D-INV-3
    question: How does a currency price read?
    status: decided
    date: 2026-10-14
    answer: As an exchange rate everywhere · web same
  - id: D-INV-4
    question: Everyone sees everyone's investments?
    status: open
    answer: |
      - writes: owner/admin (2026-08-10)
      - all members see all positions
      - only a *private* flag would fix it · not decided
  - id: D-INV-5
    question: '"Refresh prices now" button?'
    status: open
    answer: |
      - none for now · "as of" is shown
      - later maybe a throttled server refresh · shared quota
  - id: D-INV-6
    question: Price alerts, portfolio digest
    status: decided
    answer: Not built · needs push
  - id: D-INV-7
    question: Tax reporting
    status: open
    answer: Out of scope so far
  - id: D-INV-8
    question: Deleting a position — Undo and Trash?
    status: decided
    date: 2026-11-06
    answer: |
      - **a) Undo snack + Trash like bookings** · built 2026-11-09 · R-INV-42 · web not yet
      - before: delete is final · no Undo snack · not in Trash
      - source: Android emulator round, AND-19-4
  - id: D-INV-9
    question: Which source for crypto prices?
    status: decided
    date: 2026-11-07
    answer: |
      - Coinranking · **written OK** 2026-11-10 · Free plan · paying users too
      - history via Startup trial · trial → Free keeps it · daily on Free
      - CoinGecko out · Demo not commercial · Basic is monthly
  - id: D-INV-10
    question: Coinranking's off days in old crypto history — filter them?
    status: decided
    date: 2026-11-07
    answer: |
      - no · Coinranking's values served as they are
      - mean gap to exchange closes < 0.45 % · recent closes match
      - known off days: XLM 2018-09-21 −15 % · XMR 2018-02-03 −10 % · USDC 2020-08-20 at 1.08
  - id: D-INV-11
    question: How does the asset picker show a long group?
    status: decided
    date: 2026-11-16
    answer: |
      - 9 tiles · 3 × 3 · count in the header
      - text toggle under the grid · *Alle 23 anzeigen* / *Weniger anzeigen*
      - the old 9th *Show more* tile read as one more coin · missed on the phone
      - app + web
  - id: D-INV-12
    question: New position wizard · one gutter for the step titles?
    status: open
    answer: |
      - today: step 1 *Asset* sits on the page gutter (above the search and list), steps 2 and 3 line up with the text inside the cards · the title moves ~16 dp between steps (device test B-U9)
      - a) keep · each title lines up with its own step's content
      - b) one inset for all three · the title stops moving, step 1's no longer lines up with the search field
  - id: D-INV-13
    question: Annualized return (XIRR) · from what holding span on?
    status: open
    answer: |
      - today: shown from the second day · a short span blows a small gain up to an absurd rate (E-INV-31)
      - a) only from one year on · below it the simple return (the usual reporting rule, GIPS)
      - b) from 30 days on
      - c) always, but a rate past a cap (e.g. ±1000 %) reads *—*
      - the row also needs to survive a long figure: the label should keep its width
