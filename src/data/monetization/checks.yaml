# What Gerald runs on a phone before a release that touches tiers.
# Source: OFFLINE_TIER_AI_CONTEXT.md §14, MONETIZATION_AI_CONTEXT.md §3a, §7, §11 step 7, §12;
# Trello release notes 1.17.0 (items 7, 31). Account, claim and sharing checks moved to accounts/ and books/.
groups:
  - id: setup
    title: Before you start
    setup: |
      - **dev** flavor · one device with a cloud account, one fresh
      - developer mode: About → tap the version 7×
      - *Plan simulator*: *Plan* · *Test purchases succeed* · *Forget test purchases* · *Simulate an ended subscription*
      - after switching a plan → *Reopen the app*
      - plans enforced in every build from 2.0.0 · no flag, no *Enforce plans* switch
      - developer mode on = the app after Nov 8: no *Get Cloud free*
      - before Nov 8 every new account has Cloud → free account = *Simulate an ended subscription* or `admin_set_cloud_entitlement`
    items:
      - id: C-MON-001
        text: Dev build on both devices · developer mode on
      - id: C-MON-002
        text: Dev Supabase has the T-MON-01 server files
      - id: C-MON-003
        text: "`.env.dev` has `REVENUECAT_API_KEY_ANDROID` / `_IOS` · empty = fake store, needs *Test purchases succeed*"

  - id: locks
    title: Locks & paywall · Free
    items:
      - id: C-MON-009
        text: "*Free* → *Reopen the app* → locked: Analytics · Home edit · card gallery · Forecast · Investments · exports · *Create backup* · with account: Books"
      - id: C-MON-010
        text: "Drawer: **Analytics**, **Shopping list**, **Investments**, **Forecast** dimmed in the Pro group, last, no padlock → tap opens that feature's paywall"
      - id: C-MON-011
        text: Saved bar with Analytics → locked page + *See plans*
      - id: C-MON-012
        text: Quick actions *Shopping list*, *Add investment* → lock → paywall
      - id: C-MON-013
        text: "*Edit home* locked · Pro cards locked in editor · default Home only free cards"
      - id: C-MON-014
        text: Budget Book ⋮ → *Export* → paywall, never the export sheet
      - id: C-MON-015
        text: "*Create a backup* → paywall · *Restore from a backup* → free"
      - id: C-MON-016
        text: "No planned payments: Forecast → paywall · with account: *Use on computer* locked → paywall"
      - id: C-MON-017
        text: Home nudge once → *Not now* hides it · simulator *Show the Pro nudge again* brings it back
      - id: C-MON-018
        text: Buy from a lock → paywall closes → feature opens · back → stays put
      - id: C-MON-019
        text: "Settings → *Account* → plan row under *Profile* follows: *Get Money Koi Pro* · *Pro is active* · *Cloud is active* · *Cloud through {book}* · *Early adopter* · *Cloud ended* · no restore row"
      - id: C-MON-021
        text: Simulator *Pro* → drawer *Get Cloud* → Cloud overview · buy → lock clears in place
      - id: C-MON-022
        text: "Paywall: Free · Pro · Cloud cards · Cloud monthly/yearly/lifetime · from a lock → that feature's details"
      - id: C-MON-020
        text: "Pro owner: no Pro price, Cloud **upgrade** · Cloud owner: *Manage subscription*, no buy button"
      - id: C-MON-023
        text: "Free → drawer *Get Pro* → paywall top: Pro disc, *Money Koi Pro*, *Paid once, kept for good. Works offline.*, two columns of Pro features · no scroll"
      - id: C-MON-074
        text: "Free → drawer, tap the *Pro features* row itself → same paywall top as *Get Pro* · also with *Get Cloud free* showing and no button in the row"
      - id: C-MON-024
        text: "Pro → drawer *Get Cloud* → *Money Koi Cloud* overview starts with *Everything in Pro* · a lock still opens on its feature"
      - id: C-MON-025
        text: "Paywall: pick Cloud monthly or yearly → *Cloud renews automatically…* note · pick Pro or Cloud lifetime → note gone"
      - id: C-MON-026
        text: "Free → *Restore purchases* under the plans · simulator *Pro* or *Cloud* → button gone · tap twice fast → one restore"
      - id: C-MON-061
        text: "Paywall look: Free a slim row · color only on the picked plan's ring, radio and button · feature rows grey · no glow under the card · button text dark on orange and blue"

  - id: lapse-readable
    title: Readable after the plan ends · D9
    setup: Investments + a shopping list on Pro or Cloud → simulator *Free*
    items:
      - id: C-MON-030
        text: Investments **read-only** + banner + *See plans* · no add, no FAB, no menu
      - id: C-MON-031
        text: Shopping read-only · *Edit list*, *Remove all* → paywall · quick add hidden
      - id: C-MON-032
        text: Android shopping widget opens its list read-only · its picker → locked panel
      - id: C-MON-033
        text: No lists at all → locked panel, not an empty state
      - id: C-MON-034
        text: "Pro forecast on Free: page read-only + banner · *confirm* · *it didn't happen* · *book it now* work · *move* → paywall (D7, D18)"

  - id: store
    title: Store sandbox · real products
    setup: |
      - needs T-MON-03 + T-MON-04 · Android: `./publish.sh internal` · install from the internal track, never a local build
      - the phone's Play account = license tester · test cards in the purchase sheet: *always approves* · *always declines* · *slow card*
      - renewals sped up: monthly ~5 min · yearly ~30 min · trial ~3 min · ends after 6 renewals
      - the yearly trial only on a Google account that never had a subscription → test it first
      - start over: Pro → Play Console order → **Refund + remove entitlement**, reinstall · Cloud → `admin_set_cloud_entitlement('<email>', false)`
    items:
      - id: C-MON-050
        text: "Buy each product on each store: `pro.lifetime` · `cloud.monthly` · `cloud.yearly` (trial) · `cloud.lifetime` · `cloud.lifetime.upgrade`"
      - id: C-MON-051
        text: Fresh install → restore finds the purchase
      - id: C-MON-052
        text: "*Sign in* → *Restore* → *Restore Pro purchase* → *Pro restored* → Pro, no login"
      - id: C-MON-053
        text: Local book → claim → sign in → *See plans* → buy → upload continues by itself
      - id: C-MON-054
        text: Cancelled subscription → lapses after grace · renewal → sync back
      - id: C-MON-055
        text: Pending purchase → *waiting for the store* · cancelled → stays on paywall, no message
      - id: C-MON-062
        text: "RevenueCat offering metadata `{\"min_app_version\": \"99.0.0\"}` → reopen the app → paywall: *New version needed*, no plans · *Update app* opens Play · *Restore purchases* works · metadata removed → plans back"
      - id: C-MON-063
        text: "Remove `cloud.monthly` from the offering → its row gone, the others pickable · put it back"
      - id: C-MON-065
        text: "*Always declines* → error · nothing unlocked"
      - id: C-MON-066
        text: Paywall prices match the store's regional price (Austria €24.99 · US $24.99) · yearly shows the trial only before any subscription
      - id: C-MON-067
        text: "Pro owner → *Cloud lifetime upgrade* offered, plain *Cloud lifetime* not"
      - id: C-MON-068
        text: "Cloud purchase → `public.store_event` has the event · `public.entitlement` the expiry · sync starts"
      - id: C-MON-075
        text: "Signed-in free account buys Cloud → *Cloud is active* at once · *Sync starts soon* → sync starts · note the seconds (E-MON-54)"
      - id: C-MON-076
        text: "Pro bought → refund → next day reopen → Pro locks · airplane mode → Pro stays · note the seconds (E-MON-55)"

  - id: welcome-back
    title: Welcome back › Restore · Restore Pro purchase
    setup: |
      - fresh install or *Delete all data* · *Sign in* → *Restore*
      - store sandbox (C-MON-050 bought), or dev flavor with *Test purchases succeed*
    items:
      - id: C-MON-070
        text: Store account without a purchase → *Restore Pro purchase* → snackbar · stays on *Restore*
      - id: C-MON-071
        text: "Pro bought → *Pro restored* · *Start a new book* → setup · back → *Restore a backup* → file restores · Pro unlocked"
      - id: C-MON-072
        text: "Cloud bought → *Cloud found* · Google and email sign-in only · sign in → books download"
      - id: C-MON-073
        text: "Local book closed by a sign-out + Pro → *Pro restored* offers *Continue without an account* → that book opens"

  - id: launch
    title: Launch price
    setup: "Store price change running + offering metadata `launch_until` and `regular_prices` (T-MON-04) · reopen the app after a metadata change"
    items:
      - id: C-MON-060
        text: Metadata set → *Launch price until {date}* + *then €69.99* on lifetime and the upgrade · day after → gone
      - id: C-MON-064
        text: "After the window: phone date set back → plain €69.99, no launch line · a currency missing in `regular_prices` → plain price"
