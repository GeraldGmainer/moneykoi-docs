# What Gerald runs on a phone before a release that touches tiers.
# Source: OFFLINE_TIER_AI_CONTEXT.md §14, MONETIZATION_AI_CONTEXT.md §3a, §7, §11 step 7, §12;
# Trello release notes 1.17.0 (items 7, 31). Account, claim and sharing checks moved to accounts/ and books/.
groups:
  - id: setup
    title: Before you start
    setup: |
      Run the **dev** flavor. Keep one device with an existing cloud account and one fresh.

      Developer mode: About → tap the version 7 times. Its *Plan simulator* has *Enforce plans*, a fake *Plan* (Real · Free · Pro · Cloud), *Test purchases succeed*, *Forget test purchases* and *Simulate an ended subscription*. After switching a plan, use *Reopen the app*.

      Before Jan 17 every new account is an early adopter with Cloud, so a **free account** needs *Simulate an ended subscription* or a manual revoke (`admin_set_cloud_entitlement`).
    items:
      - id: C-MON-001
        text: Dev build installed on both devices, developer mode on, *Enforce plans* on
      - id: C-MON-002
        text: Dev Supabase has the server files of task T-MON-01 applied
      - id: C-MON-003
        text: '`.env.dev` has `REVENUECAT_API_KEY_ANDROID` / `_IOS` for real store tests — empty means the fake store, where *Buy* fails unless *Test purchases succeed* is on'

  - id: locks
    title: Locks & paywall (plan simulator, Free)
    items:
      - id: C-MON-009
        text: '*Enforce plans* + *Free* → *Reopen the app* → locks on: Analytics cards, Home edit and the card gallery, the Home cards and Navigation settings chevrons, Forecast (read-only), Investments, export icons, *Create backup* and *Export bookings*, Books'
      - id: C-MON-010
        text: Drawer lists **Analytics** and **Shopping list** with a lock, last, right above *Get Pro*; a tap opens the paywall with that feature's details
      - id: C-MON-011
        text: A saved bottom bar that still holds Analytics shows the locked page with *See plans* instead of the tab
      - id: C-MON-012
        text: Home quick actions *Shopping list* and *Add investment* wear the lock and open the paywall
      - id: C-MON-013
        text: '*Edit home* wears the lock; the editor lists Pro cards locked; the free default Home shows only free cards'
      - id: C-MON-014
        text: Budget Book ⋮ → *Export* wears the lock and opens the paywall, never the export sheet
      - id: C-MON-015
        text: '*Create backup* opens the paywall; *Restore from a backup file* works without paying'
      - id: C-MON-016
        text: Forecast page and Home card open the paywall; with an account, *Use on computer* is listed locked and opens the paywall at the web dashboard
      - id: C-MON-017
        text: The Home nudge appears once (after the booking or age threshold), *Not now* hides it for good; plan simulator → *Show the Pro nudge again* brings it back
      - id: C-MON-018
        text: Buying from a locked feature (test purchases on) closes the paywall and continues to the feature; backing out stays put
      - id: C-MON-019
        text: Settings → *Your plan* reads Free · Pro · Cloud · *Cloud through {book}* · *Early adopter* · *Cloud ended, sync is paused* as the state changes
      - id: C-MON-021
        text: Plan simulator *Pro* → the drawer shows *Get Cloud*; *Test purchases succeed* → buy → the lock clears in place, without leaving the screen; *Restore purchases* reports what the store holds
      - id: C-MON-022
        text: Paywall — Free · Pro · Cloud cards, the monthly / yearly / lifetime picker on Cloud; opened from a locked feature it starts with that feature's details
      - id: C-MON-020
        text: Paywall as Pro owner — no Pro price, Cloud card shows the lifetime **upgrade**; as Cloud owner — *Manage subscription*, no buy button, no bottom bar

  - id: lapse-readable
    title: Records stay readable after the plan ends (D9)
    setup: |
      Make investments and a shopping list on Pro or Cloud, then switch the plan simulator to Free.
    items:
      - id: C-MON-030
        text: Investments open **read-only** with the banner and *See plans*; no add card, no FAB, no per-position menu
      - id: C-MON-031
        text: Shopping lists open read-only; ⋮ → *Edit list* / *Remove all* open the paywall; quick add is hidden
      - id: C-MON-032
        text: The Android shopping widget still opens its list, read-only; its list picker shows the locked panel
      - id: C-MON-033
        text: With no lists at all, the shopping page shows the locked panel instead of an empty state
      - id: C-MON-034
        text: A forecast made with Pro — the overdue review's *confirm* / *it didn't happen* / *book it now* still work; *move* opens the paywall (D7)

  - id: store
    title: Store sandbox (real products)
    setup: |
      Needs tasks T-MON-02 … T-MON-04 (Apple, Google, RevenueCat) done and a build with the RevenueCat keys.
    items:
      - id: C-MON-050
        text: Sandbox purchase of every product on each store — `pro.lifetime`, `cloud.monthly`, `cloud.yearly` (1-month trial), `cloud.lifetime`, `cloud.lifetime.upgrade`
      - id: C-MON-051
        text: Restore on a fresh install finds the purchase
      - id: C-MON-052
        text: '*I already use MoneyKoi* → *Restore Pro purchase* on Welcome back restores Pro with no MoneyKoi login'
      - id: C-MON-053
        text: Cloud purchase from a local book — claim intro → sign in → *See plans* → purchase → the upload continues by itself
      - id: C-MON-054
        text: A cancelled subscription lapses after the store's grace (webhook expires the grant), and a renewal brings sync back
      - id: C-MON-055
        text: A pending purchase says the store still has to confirm it; a cancelled one stays on the paywall without a message

  - id: launch
    title: Launch price
    setup: |
      No visible change until `launchWindowEnd` is set (T-MON-21, D4).
    items:
      - id: C-MON-060
        text: With the date set — Cloud lifetime and the upgrade show *Launch price until {date}* and *then {regular}* (when the store reports it) until the last day; the day after both are gone
