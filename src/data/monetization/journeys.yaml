# Source: MONETIZATION_AI_CONTEXT.md §9 (transitions), §9a, §9b (journeys).
items:
  # Start
  - id: J-MON-01
    group: Start
    title: New user
    from: fresh install
    steps:
      - Welcome → **Get started**
      - setup on the phone, no sign-up
    result: Local Free
    tests:
      - file: test/app/navigation/app_entry_gate_test.dart
        name: a first ever launch lands on welcome
    checks: [C-ACC-001]
    related: [J-ACC-01]
  - id: J-MON-02
    group: Start
    title: Opens a locked feature
    from: Local Free
    steps:
      - taps a lock
      - "paywall: that feature, its plan picked"
      - buys
    result: lands on the feature
    note: Back → stays where you were
    tests:
      - file: test/app/navigation/destination_navigator_widget_test.dart
        name: goes on to it once the paywall closes on a purchase
      - file: test/features/monetization/ui/paywall_launcher_test.dart
        name: require on a locked feature opens the paywall naming it and stays locked when the user backs out
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: opening from a locked feature explains it and preselects its tier
    checks: [C-MON-010, C-MON-012, C-MON-018]

  # Buy
  - id: J-MON-10
    group: Buy
    title: Buys Pro
    from: Local Free
    steps:
      - lock · *Get Pro* · paywall
      - store purchase
    result: Local Pro, no account
    note: Bottom bar → 4 tabs at once
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a completed purchase closes the paywall and reports success to its opener
    checks: [C-MON-050]
  - id: J-MON-11
    group: Buy
    title: Buys Cloud from Nov 8
    from: Local Free or Local Pro
    steps:
      - "drawer *Get Cloud* · Free: *Get Pro*"
      - claim intro → sign in
      - paywall · yearly has 1-month trial
      - purchase → webhook grants
      - local book uploads
    result: Cloud
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: buying Cloud without an account goes to the claim first
    checks: [C-MON-053, C-ACC-010]
    related: [J-ACC-10]
  - id: J-MON-12
    group: Buy
    title: Early adopter until Nov 8
    from: Local book, before Nov 8
    steps:
      - drawer *Get Cloud free*
      - sign in
      - local book uploads
    result: Cloud for life
    status: waiting
    note: |
      - counts: **account created** before cutover, not install date
      - cutover Nov 8 (D13) · its migration on prod before then (T-MON-01)
      - server grant written · Gerald applies it (T-MON-01)
  - id: J-MON-13
    group: Buy
    title: Pro → Cloud lifetime upgrade
    from: Local Pro
    steps:
      - opens the paywall
      - "Cloud card: **upgrade** €44.99 · launch €24.99"
      - purchase
    result: Cloud · Pro not paid twice
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a Pro owner is offered the lifetime upgrade instead of paying for Pro twice
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a Pro owner cannot buy the full Cloud lifetime the page no longer shows
    checks: [C-MON-020, C-MON-050]
  - id: J-MON-14
    group: Buy
    title: Free account hits the claim
    from: Local book, signs in with a free account
    steps:
      - "*This account doesn't have a Cloud plan yet*"
      - "*See plans* → buy Cloud"
      - claim continues
    result: Cloud
    note: |
      - or *Keep it on this device* → book stays local
      - account with a book already → that one *Locked* until Cloud
    checks: [C-ACC-014]
    related: [J-ACC-11, J-ACC-13]
  - id: J-MON-15
    group: Buy
    title: Paused account renews
    from: Paused (former subscriber)
    steps:
      - purchase
      - grant
      - pushes what changed while paused
    result: Cloud again
    checks: [C-ACC-020, C-ACC-022]
    related: [J-ACC-31]

  # Restore & move
  - id: J-MON-20
    group: Restore & move
    title: Pro on a new phone
    from: new phone
    steps:
      - "*Sign in* → *Restore*"
      - "*Restore Pro purchase* · store account is proof"
      - "*Pro restored* → *Restore a backup*"
      - or *Start a new book*
    result: Local Pro + data
    note: Nothing found → snackbar, stays on *Restore*
    tests:
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: a Pro purchase goes on to the page that offers a book
      - file: test/features/auth/ui/pages/purchase_restored_page_test.dart
        name: says Pro is back and offers a new book or a backup file
    checks: [C-MON-052, C-MON-071]
    related: [J-DATA-04, R-MON-58]
  - id: J-MON-22
    group: Restore & move
    title: Cloud found on Welcome back › Restore
    from: new phone · Cloud bought
    steps:
      - "*Sign in* → *Restore* → *Restore Pro purchase*"
      - "*Cloud found* · Cloud lives in an account"
      - Google or email sign-in
    result: account's books download
    tests:
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: a Cloud purchase goes on to the page that asks for its account
      - file: test/features/auth/ui/pages/purchase_restored_page_test.dart
        name: says Cloud lives in an account and offers its sign-in, nothing local
    checks: [C-MON-072]
    related: [J-ACC-23, R-MON-58]
  - id: J-MON-21
    group: Restore & move
    title: Pro to the other platform
    from: Pro on iPhone (or Android)
    steps:
      - backup file moves the data
      - Pro not carried over
    result: buy Pro again, or Cloud
    status: by-design
    note: Decided 2026-10-10 (D-C1)
  # Accounts
  - id: J-MON-33
    group: Accounts
    title: Two accounts, one store account
    from: account A bought Cloud
    steps:
      - account B signs in, same store account
    result: purchase stays with A
    status: waiting
    note: "RevenueCat: keep original App User ID (T-MON-04)"
  # Sharing
  - id: J-MON-43
    group: Sharing
    title: Family
    from: household
    steps:
      - Pro → store family sharing on
      - Cloud → shared books · store sharing off
    result: everyone covered · one payer per book
    status: by-design

  # Lapse & downgrade
  - id: J-MON-50
    group: Lapse & downgrade
    title: Cloud ends
    from: Cloud
    steps:
      - cancel · failed payment · trial end · refund
      - grace ends → webhook expires grant
      - next check stops sync
      - lapse review opens
    result: Paused · everything stays, works at Free or Pro
    note: Renew → pushes what changed meanwhile
    tests:
      - file: test/app/ui/supabase_container_test.dart
        name: a teardown opens the lapse review on top of the app
    checks: [C-ACC-020, C-ACC-021]
    related: [J-ACC-30]
  - id: J-MON-51
    group: Lapse & downgrade
    title: Cloud ends · records stay readable
    from: Cloud with investments and shopping lists
    steps:
      - plan ends
      - investments, shopping, forecast → read-only + *See plans*
      - add, edit → paywall
    result: nothing hidden, nothing new
    note: Decided 2026-10-17 (D9) · no records → paywall as before
    tests:
      - file: test/features/investment/ui/pages/investments_page_test.dart
        name: after the plan ends the positions stay readable
      - file: test/app/ui/supabase_container_widget_launch_test.dart
        name: after the plan ends, a list widget still opens its list
    checks: [C-MON-030, C-MON-031, C-MON-032, C-MON-033]
  - id: J-MON-52
    group: Lapse & downgrade
    title: Shared book's owner stops paying
    from: member of a Cloud book
    steps:
      - owner's Cloud ends
      - notice *{book} no longer syncs*
      - book read-only + *Export*
    result: reopens when the owner renews
    note: "*Export* needs Pro since 2026-10-21 (E-MON-23)"
    checks: [C-BOOK-003]
    related: [J-BOOK-30]
  - id: J-MON-53
    group: Lapse & downgrade
    title: Pro refunded
    from: Local Pro
    steps:
      - store revokes it
      - daily store read finds it gone · same customer
    result: new Pro records lock · old ones readable
    note: Decided 2026-11-01 (D17) · no real refund run yet (C-MON-076)
  - id: J-MON-55
    group: Lapse & downgrade
    title: Long lapse
    from: Paused
    steps:
      - days pass
    result: server copy kept while the account exists
    status: by-design
    note: No cleanup job · no 7/30/60-day warnings (D-C6)
