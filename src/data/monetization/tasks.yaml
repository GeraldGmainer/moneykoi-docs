# Source: MONETIZATION_AI_CONTEXT.md §11 "Gerald's steps" and §12 "For an AI, once Gerald's input exists".
items:
  - id: T-MON-01
    title: Server files, dev first
    owner: gerald
    detail: |
      - push to `develop` → dev · `main` → prod (`db push` + `functions deploy`)
      - files, in order:
        - `20261005120000_offline_tier.sql` + `20261007120000_early_adopter_grant.sql` (dev has both)
        - `20261011120000_delete_account_deletes_owned_books.sql`
        - `20261012120000_store_entitlement.sql` + `functions/revenuecat-webhook/`
        - `20261013120000_cloud_tenants.sql`
        - `20261013140000_profile_setting.sql`
        - `20261013160000_public_price_read.sql`
        - `20261023120000_early_adopter_cutover_nov_8.sql` · **prod before Nov 8 00:00 Vienna**, or new accounts in between keep Cloud for life (D13)
      - ⚠️ **prod + `profile_setting`**: older app builds fail to sync → push in the same hour as the app release, web + admin too
      - dev needs them before testing a dev build
    command: |
      cd moneykoi-supabase
      for t in early_adopter_grant store_entitlement cloud_tenants profile_setting early_adopter_cutover_nov_8; do
        psql "$DEV_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/manual/$t.sql
      done
      SECRET="$(openssl rand -hex 32)" && echo "$SECRET"   # the same value goes into RevenueCat's webhook Authorization header
      supabase secrets set REVENUECAT_WEBHOOK_SECRET="$SECRET" --project-ref dpmemqshhdnanywcvsod
      # prod: the same with $PROD_DATABASE_URL and --project-ref cwheprirreyscppmbybp
