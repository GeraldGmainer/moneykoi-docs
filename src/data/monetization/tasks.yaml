  - id: T-MON-25
    title: Purchase data leaves with the account · server
    owner: gerald
    detail: |
      - `moneykoi-supabase` `20261028140000_account_delete_purchase_data.sql` · dev first (push `develop`), prod before Nov 8
      - Vault, per project: RevenueCat → Project settings → API keys → new **secret** key (V1, `sk_…`) · never the `goog_…` key
      - then the daily purge (cron) and the hand-run check (rolls back, prints PASS)
      - check once on dev: delete a test account that opened the plans → RevenueCat dashboard no longer finds the customer
      - check once: Pro bought, account deleted, *Restore Pro purchase* on a fresh install still brings Pro back
      - until the key is in Vault, a deletion only warns and skips RevenueCat · the stripping works without it (D15)
    command: |
      -- SQL editor, dev then prod
      select vault.create_secret('sk_…', 'revenuecat_secret_key');
      select cron.schedule('store-event-purge-daily', '27 3 * * *', 'select internal.store_event_purge()');
      # then
      cd moneykoi-supabase
      psql "$DEV_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/manual/account_delete_purchase_data.sql
    related: [D15]
