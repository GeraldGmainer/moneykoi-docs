# Source: moneykoi-app/.agents/references/MONETIZATION_AI_CONTEXT.md (§ in each rule's source).
items:
  # Tiers & books
  - id: R-MON-01
    group: Tiers & books
    title: Each tier includes the one below
    text: |
      - Free ⊂ Pro ⊂ Cloud
      - **every** Cloud plan includes Pro, subscriptions too
      - Cloud monthly · yearly · lifetime unlock the same
    source: §1
    tests:
      - file: test/features/monetization/service/feature_access_test.dart
        name: every plan unlocks Pro
  - id: R-MON-02
    group: Tiers & books
    title: Cloud belongs to the book
    text: |
      - open book = my plan or the **owner's**, the higher one
      - owner pays → members get every feature in that book
      - own book → own plan again
    source: §2
    tests:
      - file: test/features/monetization/service/feature_access_test.dart
        name: a free member of a Cloud book has every live feature inside it
      - file: test/features/monetization/service/feature_access_test.dart
        name: back in their own book the same member is free again
      - file: test/features/monetization/ui/tiles/tier_settings_tile_test.dart
        name: a free member inside a Cloud book reads Cloud through that book
  - id: R-MON-03
    group: Tiers & books
    title: Pro never travels through a book
    text: |
      - sharing + more books = Cloud anyway
      - local install = one book, no invites
    source: §2
  - id: R-MON-04
    group: Tiers & books
    title: An account is not a plan
    text: |
      - Free and Pro **never** need an account
      - account = for Cloud, joining a shared book, the web
      - account without a plan = **free account**
    source: §9a

  # Gates
  - id: R-MON-10
    group: Gates
    title: Locks are visible
    text: |
      - locked Analytics, *Edit home*, exports, quick actions
      - drawer: Pro pages dimmed in the Pro group (R-HOM-13)
      - they are the paywall's marketing
    source: §3 rule 1
    tests:
      - file: test/app/navigation/destination_builder_test.dart
        name: a locked tab shows what its feature includes
      - file: test/features/home/ui/widgets/quick_actions_test.dart
        name: wears the lock; the free ones do not
      - file: test/features/budget_book/ui/screens/budget_book_tab_test.dart
        name: export on a plan without filtered export wears the lock and opens the paywall
      - file: test/features/home/ui/widgets/home_card_gallery_test.dart
        name: a card the plan does not cover wears the lock and says why
  - id: R-MON-11
    group: Gates
    title: Gate screens and use cases only
    text: |
      - **never** in a repo, data source or calculation
      - Analytics locks the tab; numbers are the same for all
    source: §3 rule 2
    tests:
      - file: test/features/monetization/gate_placement_test.dart
        name: no fold, repo or data source reads entitlement
  - id: R-MON-12
    group: Gates
    title: Free Home has only free cards
    text: |
      - Pro cards locked in the editor
      - a locked card is dropped from Home
    source: §3 rule 3
    tests:
      - file: test/features/home/domain/home_card_catalog_test.dart
        name: a locked one stays listed but is never resolved onto Home
  - id: R-MON-13
    group: Gates
    title: Paywall lists only built features
    text: |
      - `isLive: false` → off everywhere
      - joins the paywall in its release
      - every paid feature: paywall text in en · de · ja
    source: §3 rule 4
    tests:
      - file: test/features/monetization/service/feature_access_test.dart
        name: only built features are live
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: lists every live paid feature, nothing free and nothing that has not shipped
      - file: test/features/monetization/monetization_copy_test.dart
        name: every live paid Feature has its details in all three locales
  - id: R-MON-14
    group: Gates
    title: feature.dart decides
    text: |
      - one line per feature: plan · `needs` · `isLive`
      - code asks `Feature.x.isActive`
      - **never** a tier, the store flag or `SyncGate.isLocalMode`
      - move a feature = edit one line
    source: §3a
    tests:
      - file: test/features/monetization/feature_gate_rules_test.dart
        name: no code outside monetization decides by plan
      - file: test/features/monetization/feature_gate_rules_test.dart
        name: no code outside monetization reads the store flag
      - file: test/features/monetization/feature_gate_rules_test.dart
        name: features and shared widgets ask the feature, not the sync mode
  - id: R-MON-15
    group: Gates
    title: The matrix is code, not server data
    text: |
      - each version keeps its own matrix
      - Pro purchase works **offline**
    source: §3a, decided 2026-10-07
  - id: R-MON-16
    group: Gates
    title: Unmet needs → absent, not locked
    text: |
      - no upgrade fixes a missing account or sync
      - e.g. *Use on computer*: absent without account, locked on Free · Pro
    source: §3a
    tests:
      - file: test/features/monetization/service/feature_access_test.dart
        name: without an account nothing that needs one is on, and nothing shows a lock it cannot keep
  - id: R-MON-17
    group: Gates
    title: Locked page → paywall first
    text: |
      - `DestinationNavigator.open` shows the paywall
      - after purchase → goes on to the page
      - covers drawer, quick actions, every way in
      - back → stays put
    source: §3a
    tests:
      - file: test/app/navigation/destination_navigator_widget_test.dart
        name: opens the paywall at its feature instead
      - file: test/app/navigation/destination_navigator_widget_test.dart
        name: goes on to it once the paywall closes on a purchase
      - file: test/app/navigation/destination_navigator_widget_test.dart
        name: stays put when the paywall closes without one
      - file: test/features/monetization/ui/paywall_launcher_test.dart
        name: require goes ahead when the user buys while the paywall is open
  - id: R-MON-18
    group: Gates
    title: "After launch: features only move down"
    text: |
      - before launch: may move up (Analytics, shopping on 2026-10-17)
      - after launch: only **down**, Cloud → Pro → Free
    source: §3 rule 6

  # Data stays yours
  - id: R-MON-20
    group: Data stays yours
    title: Your data is never hidden
    text: |
      - plan ends → records stay **readable**
      - only create + edit lock
      - investments, shopping lists → read-only + banner + *See plans* (D9)
    source: §3 rule 5, §3a
    tests:
      - file: test/features/investment/ui/pages/investments_page_test.dart
        name: after the plan ends the positions stay readable, with a banner and no add card
      - file: test/features/investment/ui/pages/investment_detail_page_test.dart
        name: after the plan ends the position stays readable, but cannot be changed
      - file: test/app/ui/supabase_container_widget_launch_test.dart
        name: after the plan ends, a list widget still opens its list
  - id: R-MON-21
    group: Data stays yours
    title: Import free · export Pro
    text: |
      - free: CSV import · restoring a backup file
      - **Pro**: every export · ZIP · *Download all data* · CSV · PDF · backup file
      - exports: one gate `Feature.exportFiltered` · paywall *Data export*
      - decided 2026-10-21 · reverses 2026-10-16's free export (D-DATA-12)
    source: §3 rule 5, §8 item 6, §9b rule 6
    tests:
      - file: test/features/data_export/export_book_archive_use_case_test.dart
        name: without Pro the export is refused before the book is read
      - file: test/features/backup/use_cases/export_all_data_use_case_test.dart
        name: without Pro nothing is read or saved
    related: [D-DATA-12, D-DATA-13, R-DATA-02, R-DATA-20, R-DATA-22]
  # Store & purchases
  - id: R-MON-30
    group: Store & purchases
    title: Subscriptions never set Pro
    text: |
      - only a one-time purchase sets `Entitlement.pro`
      - RevenueCat says `pro` for every Cloud subscriber
      - mapper: only non-expiring `pro` · webhook: only one-time products
    source: §11
    tests:
      - file: test/features/monetization/data/revenue_cat_mapper_test.dart
        name: a Cloud subscription unlocks Cloud but never sets the sticky Pro
      - file: test/features/monetization/service/feature_access_test.dart
        name: only a one-time purchase owns Pro outright
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a Cloud subscription that lapses takes Pro with it
  - id: R-MON-31
    group: Store & purchases
    title: Server beats the receipt for Cloud
    text: |
      - server confirmed a lapse → wins over cached store term
      - after a Cloud purchase → app refreshes once
    source: §3a, §11
  - id: R-MON-32
    group: Store & purchases
    title: Restore = what the store holds
    text: |
      - *Restored* when the store grants Pro or live Cloud, even if already owned
      - *No purchase found* only when the store has nothing (B6)
    source: §11
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a purchase this phone already holds is still found
  - id: R-MON-33
    group: Store & purchases
    title: Prices only from the store
    text: |
      - `StoreProduct.priceString`
      - **never** a translation or a constant
    source: §7, §11
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: every price comes from the store, never from a translation file
  - id: R-MON-34
    group: Store & purchases
    title: Product ids are permanent
    text: |
      - `pro.lifetime` · `cloud.monthly` · `cloud.yearly` · `cloud.lifetime` · `cloud.lifetime.upgrade`
      - one offering · entitlements `pro` + `cloud`
      - every Cloud product grants both
    source: §11
    tests:
      - file: test/features/monetization/data/revenue_cat_mapper_test.dart
        name: every permanent product id maps to its plan
      - file: test/features/monetization/service/feature_access_test.dart
        name: every plan maps to its permanent product id
  - id: R-MON-35
    group: Store & purchases
    title: Free install → no RevenueCat call
    text: |
      - SDK starts on first paywall open or restore
      - **never** at app start
    source: §11
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a fresh install is free and asks the store nothing
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: the store SDK is configured lazily, once, and only on demand
  - id: R-MON-36
    group: Store & purchases
    title: Store user id = profile id
    text: |
      - signed-in purchase → booked under the profile
      - *Restore Behavior*: keep original App User ID
      - second account on the same store account can't take Cloud
    source: §9a, §11
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: sign-in and sign-out hand the profile id to the store
  - id: R-MON-37
    group: Store & purchases
    title: Only the gateway touches the SDK
    text: |
      - `PurchaseGateway` is the only import of `purchases_flutter`
      - no RevenueCat key → fake gateway
    source: §11
    tests:
      - file: test/features/monetization/gate_placement_test.dart
        name: the store SDK is reached through the one gateway and its mapper only
  - id: R-MON-38
    group: Store & purchases
    title: Pro stays on one platform
    text: |
      - a purchase belongs to one store
      - iPhone ↔ Android with Pro → Cloud, or buy Pro again (D-C1)
    source: §9, §9a
  - id: R-MON-39
    group: Store & purchases
    title: "Family sharing: Pro on · Cloud off"
    text: |
      - Cloud is shared through books (D-C7)
      - Apple's switch is one-way
    source: §9a
  - id: R-MON-58
    group: Store & purchases
    title: Welcome back restore leads on
    text: |
      - *Restore Pro purchase* → nothing → snackbar, stays on *Welcome back*
      - Pro → *Pro restored*: *Start a new book* · *Restore a backup*
      - Cloud → *Cloud found*: Google + email sign-in · Cloud wins over Pro
      - closed local book → *Continue without an account* instead of a new one
    source: §9a (decided 2026-10-21, D12)
    tests:
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: nothing in the store says so and stays on Welcome back
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: a Pro purchase goes on to the page that offers a book
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: a Cloud purchase goes on to the page that asks for its account
      - file: test/features/auth/ui/pages/purchase_restored_page_test.dart
        name: a book without an account, closed by a sign-out, is opened instead of starting another
    related: [D12, J-MON-20, J-MON-22]

  # Paywall
  - id: R-MON-40
    group: Paywall
    title: Never sell what is owned
    text: |
      - owned plan: not selected, no price
      - Pro owner → **upgrade** €44.99 instead of Cloud lifetime
      - Cloud owner → *Manage subscription*, no buy button
    source: §7
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a Pro owner sees no Pro price and cannot pick Pro again
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a Pro owner is offered the lifetime upgrade instead of paying for Pro twice
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a Cloud subscriber sees Manage subscription instead of the prices, and buys nothing
  - id: R-MON-41
    group: Paywall
    title: Copy promises budgeting
    text: |
      - subtitle: *Budgeting stays free. Always.*
      - Free card: *The full budgeting app on this phone. Forever, at no cost.*
      - **never** "every feature"
    source: §7, 2026-10-17
  - id: R-MON-42
    group: Paywall
    title: Launch price wording is legal
    text: |
      - *Launch price €49.99 until {date}, then €69.99*
      - **never** strikethrough, "was €69.99", "€20 off" — €69.99 was never charged before
      - date + regular price: RevenueCat offering metadata `launch_until`, `regular_prices`
      - shown only while the store charges **less** than the regular price → a phone clock set back changes nothing
      - caption gone the day after its last day, or once the store is back at €69.99
      - currency missing in `regular_prices` → plain price, no caption
    source: §7, §8 item 1, §11
    tests:
      - file: test/features/monetization/domain/launch_window_test.dart
        name: the day after the last day closes it, so no pill or launch line outlives the price
      - file: test/features/monetization/data/revenue_cat_mapper_test.dart
        name: once the store charges the regular price again there is none, whatever the phone clock says
      - file: test/features/monetization/ui/widgets/paywall_price_option_test.dart
        name: inside the window but without a regular price above the store price, the lifetime row is a plain price
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: while the store charges the launch price, the lifetime row names its last day and the price after it
  - id: R-MON-43
    group: Paywall
    title: App Review needs on the paywall
    text: |
      - name · length · price per period
      - trial price afterwards
      - Terms + Privacy links
      - *Restore purchases* without buying · while nothing is held (R-MON-56)
    source: §8 item 4
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: shows restore and the legal links App Review requires
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: the yearly plan says what the trial costs afterwards
  - id: R-MON-44
    group: Paywall
    title: Cloud purchase needs an account
    text: |
      - no account → claim intro (sign in) first
      - receipt is booked under the profile id
    source: §7
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: buying Cloud without an account goes to the claim first
  - id: R-MON-45
    group: Paywall
    title: Drawer upgrade entry follows the book
    text: |
      - Free → *Get Pro* in the Pro group, last in the drawer
      - Pro, only sync locked → *Get Cloud* row · Cloud or Cloud book → none
      - until Nov 8: *Get Cloud free* row · Pro group without button
      - simulator *Enforce plans* = from Nov 8 → no *Get Cloud free*
    source: §3b, §7, §9a · NAVIGATION §8
    tests:
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Free: the Pro group carries Get Pro, which opens the paywall on the Pro overview'
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: the early-adopter offer takes the place of Get Pro and Get Cloud
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'enforced plans simulate the store after the cutover: Free gets Get Pro, not Cloud free'
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Pro: only sync is locked, so Get Cloud'
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Cloud, or a Cloud book someone else pays for: nothing locked, no entry'
    related: [R-HOM-13, D-HOM-5]
  - id: R-MON-46
    group: Paywall
    title: Home nudge threshold is latched
    text: |
      - once crossed → stays crossed, even after deletes
      - dismissed → hidden forever
    source: §11 (B11)
    tests:
      - file: test/features/monetization/service/pro_nudge_service_test.dart
        name: a crossed booking threshold survives a relaunch, in a smaller book or after deleting rows
      - file: test/features/monetization/service/pro_nudge_service_test.dart
        name: stays hidden forever once dismissed
  - id: R-MON-47
    group: Paywall
    title: Buy button names what you get
    text: |
      - one-time → plan + price: *Get Pro for €24.99*, *Get Cloud for €69.99*
      - subscription → plan + price + period: *Get Cloud for €24.99/year*, *€2.99/month*
      - yearly with a trial → *Try free for 1 month* · price after the trial on the row
      - button wears the picked plan's color: Pro orange, Cloud blue
      - too long (German) → label shrinks onto one line
    source: §7
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: the buy button names the plan and what it charges, per period for a subscription, in the plan tint
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a yearly trial is what the buy button offers
  - id: R-MON-48
    group: Paywall
    title: Old builds can be stopped from selling
    text: |
      - RevenueCat offering metadata `min_app_version`, a string: `"1.20.0"`
      - build below it → *New version needed* + *Update app* · no plans, no prices, no buy
      - *Restore purchases* still works · everything bought stays unlocked
      - Cloud owner → page unchanged, *Manage subscription*
      - no floor, or one that does not read as a version → sells as before
      - only builds that carry the check obey it → must ship before the first paywall release
      - raise it only when an old build would sell something wrong, never per release
    source: §7, §11
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a build below the floor asks for an update and buys nothing
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: the paywall asks for an update instead of showing plans, and still restores
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a Cloud subscriber, who buys nothing, keeps Manage subscription
      - file: test/features/monetization/domain/store_catalog_test.dart
        name: a build below the floor needs an update, one at or above it does not
  - id: R-MON-49
    group: Paywall
    title: A plan the store leaves out has no row
    text: |
      - product removed from the offering → its row is gone
      - Pro removed → Pro card keeps its features, no price, can't be picked
      - picked plan missing → pick moves on: opening pick, Pro, Cloud yearly
      - store not answering → rows stay, price *—*, plus the error line
    source: §7
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a plan the store leaves out has no row
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: without Pro in the store, the Pro card shows its features but no price and cannot be picked
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: "a plan the store leaves out is never the pick: without Pro the page opens on Cloud yearly"
  - id: R-MON-54
    group: Paywall
    title: Upgrade entry opens on the plan
    text: |
      - drawer *Get Pro* / *Get Cloud* → plan overview on top
      - drawer *Pro features* row → same Pro overview · also while *Get Cloud free* hides the button
      - disc · *Money Koi Pro* / *Money Koi Cloud* · one-line promise
      - 2 columns: every live feature · Cloud starts with *Everything in Pro*
      - stays at the top · no scroll · from a lock → that feature instead
    source: §7 (decided 2026-10-21, D10; *Pro features* row 2026-10-31) · NAVIGATION §8
    tests:
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: 'Free: tapping the Pro features row itself opens the paywall on the Pro overview'
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: during the early-adopter offer the Pro features row has no button but still opens the Pro overview
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: 'Get Pro opens on an overview of Pro: its name, its promise and every Pro feature'
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: Get Cloud opens on an overview of Cloud that starts with Everything in Pro
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: on a phone, an upgrade entry stays at the top, where its overview is
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a locked feature explains itself instead of the plan overview
    related: [D10]
  - id: R-MON-55
    group: Paywall
    title: Renewal note only for subscriptions
    text: |
      - *Cloud renews automatically…* while monthly or yearly is picked
      - Pro or Cloud lifetime picked → **no** note
    source: §7 (2026-10-21)
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: the renewal note shows only while a subscription is picked
  - id: R-MON-56
    group: Paywall
    title: Restore only while nothing is held
    text: |
      - phone holds Pro or Cloud → *Restore purchases* **gone**
      - Cloud comes back by signing in
      - one restore at a time · button off while it runs
    source: §7 (decided 2026-10-21, D11)
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a phone that holds Pro or Cloud has nothing to restore, so the button is gone
    related: [D11, R-MON-43]
  - id: R-MON-57
    group: Paywall
    title: Plan row in the Account card
    text: |
      - Settings → *Account*, under *Profile*
      - *Get Money Koi Pro* · *Pro is active* · *Cloud through {book}* · …
      - **no** restore row · restore: paywall + *Welcome back*
      - separate plan card dropped 2026-10-21
    source: §7
    tests:
      - file: test/features/settings/ui/pages/settings_page_test.dart
        name: shows the current plan in the account card, without a restore row, once monetization is on
      - file: test/features/monetization/ui/tiles/tier_settings_tile_test.dart
        name: a free member inside a Cloud book reads Cloud through that book

  # Privacy & server
  - id: R-MON-50
    group: Privacy & server
    title: Pro reads the server, never writes
    text: |
      - no account → prices + FX fetched anonymously
      - **always the whole list**
      - never only held assets → would reveal holdings
    source: §5
  - id: R-MON-51
    group: Privacy & server
    title: "Live prices: the only request"
    text: |
      - Settings → Privacy & Legal → *Live prices*, on by default
      - only the request leaves the phone · server sees the IP
      - purchases → store + RevenueCat, **never** Supabase
    source: §5
  - id: R-MON-52
    group: Privacy & server
    title: Price history needs an account
    text: |
      - no account → today's quote, no chart
      - past buy date prefills nothing (D6)
    source: §5
  - id: R-MON-53
    group: Privacy & server
    title: No raised plan in store builds
    text: |
      - developer mode unlocks in any release
      - simulator *Plan* + test purchases → debug + dev flavor only
      - enforcing and lapse only **take away**
    source: §3b
    tests:
      - file: test/features/monetization/service/plan_simulator_test.dart
        name: a store build never raises a plan or lets the test store grant, but may still enforce
