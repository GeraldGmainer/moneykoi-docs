# Source: MONETIZATION_AI_CONTEXT.md §3a, §5, §7, §9 (cross-cutting traps), §9b (traps), §11, §12;
# OFFLINE_TIER_AI_CONTEXT.md §13 (hardening H1–H6).
items:
  # Paywall & store
  - id: E-MON-01
    group: Paywall & store
    title: Restore finds Pro, Pro card picked
    when: "*Restore purchases* with Pro picked · store holds Pro"
    then: |
      - pick moves to **Cloud yearly**
      - the buy button stays usable
      - never buys a plan not on screen
    risk: medium
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a restore that finds Pro while Pro was picked moves the pick to Cloud yearly
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a restore that finds Pro while Pro was picked picks Cloud yearly, and Continue stays usable
  - id: E-MON-02
    group: Paywall & store
    title: Pro arrives while paywall is open
    when: plan arrives from the store or another device
    then: shown at once · pick moves like a restore
    risk: low
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: Pro that lands while the paywall is open moves the pick the same way
  - id: E-MON-03
    group: Paywall & store
    title: Store does not answer
    when: products don't load · offline, store down
    then: error + retry, never an empty list · own plan still shown
    risk: medium
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a store that will not answer reports an error instead of an empty list
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a store that will not answer still shows the tier the user owns
  - id: E-MON-04
    group: Paywall & store
    title: Store drops mid-purchase
    when: connection fails during a purchase
    then: "*store unavailable* · buy button usable again"
    risk: medium
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a store that drops out mid-purchase reports it unavailable and frees the buy button
  - id: E-MON-05
    group: Paywall & store
    title: Pending purchase
    when: store must still confirm · parent approval, slow payment
    then: |
      - paywall stays open, says *waiting for the store*
      - nothing granted yet · not an error
    risk: medium
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a pending purchase stays on the paywall and says the store still has to confirm it
      - file: test/features/monetization/domain/purchase_result_test.dart
        name: a pending purchase grants nothing yet and is not an error
  - id: E-MON-06
    group: Paywall & store
    title: Cancelled purchase
    when: store sheet cancelled
    then: stays on the paywall · no message
    risk: low
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a cancelled purchase stays on the paywall without a message
  - id: E-MON-07
    group: Paywall & store
    title: Buying what is owned
    when: store answers *already owned*
    then: treated as a restore, not a failure
    risk: low
    tests:
      - file: test/features/monetization/data/revenue_cat_purchase_gateway_test.dart
        name: a product the account already owns is restored, not failed
  - id: E-MON-08
    group: Paywall & store
    title: Restore finds nothing
    when: store holds nothing for this store account
    then: |
      - *No purchase found* · Pro on the phone **stays**
      - on *Welcome back*: snackbar, page stays (D12)
    risk: high
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a restore that finds nothing never takes Pro away
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a restore that finds nothing says so
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: nothing in the store says so and stays on Welcome back
  - id: E-MON-09
    group: Paywall & store
    title: Launch window edges
    when: last day of the launch price, and the day after
    then: |
      - last day counts to its last minute
      - day after → window closed
      - no `launch_until` in the offering → no window
    risk: medium
    tests:
      - file: test/features/monetization/domain/launch_window_test.dart
        name: the last day is still inside the window, to its final minute
      - file: test/features/monetization/domain/launch_window_test.dart
        name: no launch date in the store offering means no window
  - id: E-MON-14
    group: Paywall & store
    title: Version floor typed as a number
    when: "`min_app_version` entered as a number (`1.10`) instead of a string"
    then: |
      - ignored → no floor, every build sells
      - a number would turn `1.10` into `1.1`
    risk: medium
    tests:
      - file: test/features/monetization/data/revenue_cat_purchase_gateway_test.dart
        name: no floor, or a floor typed as a number, is no floor
  - id: E-MON-15
    group: Paywall & store
    title: iPhone below the version floor
    when: an iOS build below `min_app_version`
    then: |
      - *New version needed* shows, **no** *Update app* button
      - button needs the App Store id (T-MON-02)
    status: known-issue
    risk: low
  - id: E-MON-16
    group: Paywall & store
    title: Phone clock set back after the launch
    when: launch window over · phone date set back into it
    then: |
      - store charges €69.99 — its server, its clock
      - no launch line: it needs a store price below the regular one
    status: by-design
    risk: low
    tests:
      - file: test/features/monetization/data/revenue_cat_mapper_test.dart
        name: once the store charges the regular price again there is none, whatever the phone clock says

  # Entitlement cache
  - id: E-MON-10
    group: Entitlement cache
    title: Billing issue · grace window
    when: Cloud payment fails, store grants grace
    then: entitled while grace is open · lapsed after
    risk: high
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a Cloud grace window that is still open stays entitled
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a Cloud grace window that has closed reads as lapsed
  - id: E-MON-11
    group: Entitlement cache
    title: Stale check timestamp
    when: app hasn't reached the store for long
    then: "**never** takes a plan away · Pro works offline"
    risk: high
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a stale check timestamp alone never takes an entitlement away
  - id: E-MON-12
    group: Entitlement cache
    title: Unreadable cache
    when: cached plan JSON corrupt or unknown version
    then: falls back to Free, no crash · unknown value → default
    risk: low
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: unreadable cached JSON degrades to free rather than throwing
  - id: E-MON-13
    group: Entitlement cache
    title: Cache from Plus → Pro rename
    when: phone cached Pro as `plus`
    then: Pro kept · cache rewritten once as `pro`
    risk: low
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: keeps Pro bought under its old name, and is rewritten once as pro

  # Downgrade & lapse
  - id: E-MON-20
    group: Downgrade & lapse
    title: Paid data after a downgrade
    when: plan ends · investments, forecast items, custom Home exist
    then: all stay visible · only create + edit lock
    risk: high
    tests:
      - file: test/features/investment/ui/pages/investment_detail_page_test.dart
        name: after the plan ends the position stays readable, but cannot be changed
  - id: E-MON-21
    group: Downgrade & lapse
    title: Forecast review on Free
    when: overdue review asks about a planned item
    then: |
      - *Confirm* · *it didn't happen* · *book it now* still work
      - only *move* opens the paywall (D7)
    status: by-design
    risk: low
  - id: E-MON-22
    group: Downgrade & lapse
    title: No lists after the plan ends
    when: plan ended, user never made a list
    then: locked panel, not an empty state
    risk: low
  - id: E-MON-23
    group: Downgrade & lapse
    title: Read-only shared book on Free
    when: owner stopped paying or deleted the account · free member
    then: |
      - *Export* → paywall · no free copy out
      - *Remove from this phone* → the rows are gone
      - accepted with every export Pro (legal note 6)
    status: known-issue
    risk: medium
    related: [J-MON-52, D-DATA-13, R-MON-21]
  # Accounts & claim
  - id: E-MON-35
    group: Accounts & claim
    title: Delete account, store subscription active
    when: Cloud subscriber deletes the account
    then: |
      - store **keeps billing** until cancelled there
      - delete screen says so + *Manage subscription*
    risk: high
  - id: E-MON-37
    group: Accounts & claim
    title: Free accounts before Jan 17
    when: you need a free account to test
    then: |
      - every new account = early adopter with Cloud
      - use *Simulate an ended subscription* or `admin_set_cloud_entitlement`
    status: by-design
    risk: low

  # Prices & privacy
  - id: E-MON-40
    group: Prices & privacy
    title: No account · price history
    when: Pro user without account opens an investment
    then: today's quote, no chart · past buy date prefills nothing (D6)
    status: by-design
    risk: low
  - id: E-MON-41
    group: Prices & privacy
    title: Two currency id sets
    when: local book (bundled ids) + shared Cloud book (server ids)
    then: matched by ISO code → both books price (B2)
    risk: medium
  - id: E-MON-42
    group: Prices & privacy
    title: Live prices off
    when: "*Live prices* switched off"
    then: request stops · last prices kept
    risk: low

  # Gates
  - id: E-MON-50
    group: Gates
    title: Gate read only at build
    when: "`Feature.x.isActive` in `build` without `FeatureGateBuilder`"
    then: |
      - goes stale when plan, sign-in or book changes (B9)
      - every gated surface → `FeatureGateBuilder`
    status: fixed
    risk: medium
  - id: E-MON-51
    group: Gates
    title: Developer mode in a store build
    when: version tapped 7 times in a release build
    then: opens · *Plan* + test purchases can't raise a plan
    risk: high
    tests:
      - file: test/features/monetization/service/plan_simulator_test.dart
        name: a store build never raises a plan or lets the test store grant, but may still enforce
  - id: E-MON-52
    group: Paywall & store
    title: Store build sells through the test store
    when: build with the RevenueCat key · `.env` loaded after the store was set up at startup
    then: |
      - paywall shows the test store's prices (`€24.99`), not Play's (`24,99 €`)
      - every purchase fails with *store unavailable* · no Play sheet, no log
      - happened in internal build `1.17.1+32` · fixed 2026-10-19: `.env` loads first
    status: fixed
    risk: high
