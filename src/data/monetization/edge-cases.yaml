# Source: MONETIZATION_AI_CONTEXT.md §3a, §5, §7, §9 (cross-cutting traps), §9b (traps), §11, §12;
# OFFLINE_TIER_AI_CONTEXT.md §13 (hardening H1–H6).
items:
  # Paywall & store
  - id: E-MON-01
    group: Paywall & store
    title: Restore finds Pro, Pro card picked
    when: "*Restore purchases* with Pro picked · store holds Pro"
    then: |
      - pick moves to **Cloud yearly**
      - the buy button stays usable
      - never buys a plan not on screen
    risk: medium
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a restore that finds Pro while Pro was picked moves the pick to Cloud yearly
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a restore that finds Pro while Pro was picked picks Cloud yearly, and Continue stays usable
  - id: E-MON-02
    group: Paywall & store
    title: Pro arrives while paywall is open
    when: plan arrives from the store or another device
    then: shown at once · pick moves like a restore
    risk: low
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: Pro that lands while the paywall is open moves the pick the same way
  - id: E-MON-03
    group: Paywall & store
    title: Store does not answer
    when: products don't load · offline, store down
    then: error + retry, never an empty list · own plan still shown
    risk: medium
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a store that will not answer reports an error instead of an empty list
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a store that will not answer still shows the tier the user owns
  - id: E-MON-04
    group: Paywall & store
    title: Store drops mid-purchase
    when: connection fails during a purchase
    then: "*store unavailable* · buy button usable again"
    risk: medium
    tests:
      - file: test/features/monetization/bloc/paywall_cubit_test.dart
        name: a store that drops out mid-purchase reports it unavailable and frees the buy button
  - id: E-MON-05
    group: Paywall & store
    title: Pending purchase
    when: store must still confirm · parent approval, slow payment
    then: |
      - paywall stays open, says *waiting for the store*
      - nothing granted yet · not an error
    risk: medium
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a pending purchase stays on the paywall and says the store still has to confirm it
      - file: test/features/monetization/domain/purchase_result_test.dart
        name: a pending purchase grants nothing yet and is not an error
  - id: E-MON-06
    group: Paywall & store
    title: Cancelled purchase
    when: store sheet cancelled
    then: stays on the paywall · no message
    risk: low
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a cancelled purchase stays on the paywall without a message
  - id: E-MON-07
    group: Paywall & store
    title: Buying what is owned
    when: store answers *already owned*
    then: treated as a restore, not a failure
    risk: low
    tests:
      - file: test/features/monetization/data/revenue_cat_purchase_gateway_test.dart
        name: a product the account already owns is restored, not failed
  - id: E-MON-08
    group: Paywall & store
    title: Restore finds nothing
    when: store holds nothing for this store account
    then: |
      - *No purchase found* + which store account to sign in · Pro on the phone **stays**
      - the title was missing until 2026-11-11
      - on *Welcome back* › *Restore*: snackbar, page stays (D12)
    risk: high
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a restore that finds nothing never takes Pro away
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a restore that finds nothing says so
      - file: test/features/auth/ui/widgets/welcome_restore_section_test.dart
        name: nothing in the store says so and stays on the restore page
  - id: E-MON-09
    group: Paywall & store
    title: Launch window edges
    when: last day of the launch price, and the day after
    then: |
      - last day counts to its last minute
      - day after → window closed
      - no `launch_until` in the offering → no window
    risk: medium
    tests:
      - file: test/features/monetization/domain/launch_window_test.dart
        name: the last day is still inside the window, to its final minute
      - file: test/features/monetization/domain/launch_window_test.dart
        name: no launch date in the store offering means no window
  - id: E-MON-14
    group: Paywall & store
    title: Version floor typed as a number
    when: "`min_app_version` entered as a number (`1.10`) instead of a string"
    then: |
      - ignored → no floor, every build sells
      - a number would turn `1.10` into `1.1`
    risk: medium
    tests:
      - file: test/features/monetization/data/revenue_cat_purchase_gateway_test.dart
        name: no floor, or a floor typed as a number, is no floor
  - id: E-MON-15
    group: Paywall & store
    title: iPhone below the version floor
    when: an iOS build below `min_app_version`
    then: |
      - *New version needed* shows · *Update app* opens the App Store page
      - the button arrived with the App Store id, 2026-10-31
    status: fixed
    risk: low
  - id: E-MON-16
    group: Paywall & store
    title: Phone clock set back after the launch
    when: launch window over · phone date set back into it
    then: |
      - store charges €69.99 — its server, its clock
      - no launch line: it needs a store price below the regular one
    status: by-design
    risk: low
    tests:
      - file: test/features/monetization/data/revenue_cat_mapper_test.dart
        name: once the store charges the regular price again there is none, whatever the phone clock says

  # Entitlement cache
  - id: E-MON-10
    group: Entitlement cache
    title: Billing issue · grace window
    when: Cloud payment fails, store grants grace
    then: entitled while grace is open · lapsed after
    risk: high
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a Cloud grace window that is still open stays entitled
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a Cloud grace window that has closed reads as lapsed
  - id: E-MON-11
    group: Entitlement cache
    title: Stale check timestamp
    when: app hasn't reached the store for long
    then: "**never** takes a plan away · Pro works offline"
    risk: high
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a stale check timestamp alone never takes an entitlement away
  - id: E-MON-12
    group: Entitlement cache
    title: Unreadable cache
    when: cached plan JSON corrupt or unknown version
    then: falls back to Free, no crash · unknown value → default
    risk: low
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: unreadable cached JSON degrades to free rather than throwing
  - id: E-MON-13
    group: Entitlement cache
    title: Cache from Plus → Pro rename
    when: phone cached Pro as `plus`
    then: Pro kept · cache rewritten once as `pro`
    risk: low
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: keeps Pro bought under its old name, and is rewritten once as pro

  # Downgrade & lapse
  - id: E-MON-20
    group: Downgrade & lapse
    title: Paid data after a downgrade
    when: plan ends · investments, forecast items, custom Home exist
    then: all stay visible · only create + edit lock
    risk: high
    tests:
      - file: test/features/investment/ui/pages/investment_detail_page_test.dart
        name: after the plan ends the position stays readable, but cannot be changed
  - id: E-MON-21
    group: Downgrade & lapse
    title: Forecast review on Free
    when: overdue review asks about a planned item
    then: |
      - *Confirm* · *it didn't happen* · *book it now* still work
      - only *move* opens the paywall (D7)
    status: by-design
    risk: low
  - id: E-MON-22
    group: Downgrade & lapse
    title: No lists after the plan ends
    when: plan ended, user never made a list
    then: locked panel, not an empty state
    risk: low
  - id: E-MON-23
    group: Downgrade & lapse
    title: Read-only shared book on Free
    when: owner stopped paying or deleted the account · free member
    then: |
      - *Export* → paywall · no free copy out
      - *Remove from this device* → the rows are gone
      - accepted with every export Pro (legal note 6)
    status: known-issue
    risk: medium
    related: [J-MON-52, D-DATA-13, R-MON-21]
  # Accounts & claim
  - id: E-MON-35
    group: Accounts & claim
    title: Delete account, store subscription active
    when: Cloud subscriber deletes the account
    then: |
      - store **keeps billing** until cancelled there
      - delete screen says so + *Manage subscription*
    risk: high
  - id: E-MON-37
    group: Accounts & claim
    title: Free accounts before Nov 8
    when: you need a free account to test
    then: |
      - every new account = early adopter with Cloud
      - use *Simulate an ended subscription* or `admin_set_cloud_entitlement`
    status: by-design
    risk: low

  # Prices & privacy
  - id: E-MON-40
    group: Prices & privacy
    title: No account · price history
    when: Pro user without account opens an investment
    then: today's quote, no chart · past buy date prefills nothing (D6)
    status: by-design
    risk: low
  - id: E-MON-41
    group: Prices & privacy
    title: Two currency id sets
    when: local book (bundled ids) + shared Cloud book (server ids)
    then: matched by ISO code → both books price (B2)
    risk: medium
  - id: E-MON-42
    group: Prices & privacy
    title: Live prices off
    when: "*Live prices* switched off"
    then: request stops · last prices kept
    risk: low

  # Gates
  - id: E-MON-50
    group: Gates
    title: Gate read only at build
    when: "`Feature.x.isActive` in `build` without `FeatureGateBuilder`"
    then: |
      - goes stale when plan, sign-in or book changes (B9)
      - every gated surface → `FeatureGateBuilder`
    status: fixed
    risk: medium
  - id: E-MON-51
    group: Gates
    title: Developer mode in a store build
    when: version tapped 7 times in a release build
    then: opens · *Plan* + test purchases can't raise a plan
    risk: high
    tests:
      - file: test/features/monetization/service/plan_simulator_test.dart
        name: a store build never raises a plan or lets the test store grant
  - id: E-MON-52
    group: Paywall & store
    title: Store build sells through the test store
    when: build with the RevenueCat key · `.env` loaded after the store was set up at startup
    then: |
      - paywall shows the test store's prices (`€24.99`), not Play's (`24,99 €`)
      - every purchase fails with *store unavailable* · no Play sheet, no log
      - happened in internal build `1.17.1+32` · fixed 2026-10-19: `.env` loads first
    status: fixed
    risk: high
  - id: E-MON-53
    group: Paywall & store
    title: Phone without Play billing
    when: paywall on an emulator, a phone without a Google account, or purchases barred
    then: |
      - *store unavailable* + retry · Free, Pro and Cloud cards still shown
      - no crash report · before 2026-10-31 each open sent one
    status: fixed
    risk: low
    tests:
      - file: test/features/monetization/data/revenue_cat_purchase_gateway_test.dart
        name: a device without billing is the store unavailable, a warning kept out of the crash reports
  - id: E-MON-54
    group: Paywall & store
    title: Cloud bought, nothing unlocked
    when: signed-in free account buys Cloud · webhook not there yet
    then: |
      - was: paywall closes silently · plan row + locks stay
      - fixed 2026-11-01: features on at once for 10 minutes
      - sync waits for the server · *Sync starts soon*
      - real webhook delay not measured (C-MON-075)
    status: fixed
    risk: high
    related: [D16, C-MON-075, T-MON-26]
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: unlocks at once, announces it, and leaves sync to the server
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: asks the server again until the webhook has landed, then stops
  - id: E-MON-55
    group: Downgrade & lapse
    title: Refunded Pro stayed
    when: Pro or Cloud lifetime refunded by the store
    then: |
      - was: Pro never left the phone
      - fixed 2026-11-01: same store customer without Pro → Pro off
      - other customer or failed read → Pro stays
      - no real refund run yet (C-MON-076)
    status: fixed
    risk: high
    related: [D17, C-MON-076, T-MON-26]
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: from the customer who held it is a refund
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: from another customer keeps Pro
  - id: E-MON-56
    group: Downgrade & lapse
    title: Forecast items out of reach
    when: planned payments made on Pro · plan ends
    then: |
      - was: paywall only · no way to the items
      - fixed 2026-11-01: page opens read-only · D7's actions reachable
    status: fixed
    risk: medium
    related: [D7, D18, C-MON-034]
    tests:
      - file: test/shared/ui/drawer/app_drawer_test.dart
        name: after the plan ends, planned payments open read-only instead of the paywall
      - file: test/features/forecast/ui/forecast_pages_test.dart
        name: after the plan ends the page stays readable
  - id: E-MON-57
    group: Gates
    title: Tips skipped read-only
    when: Free with records · *Tips & features* → that tip
    then: was paywall · fixed 2026-11-01 → read-only, as the drawer
    status: fixed
    risk: medium
    tests:
      - file: test/features/getting_started/ui/tips_page_test.dart
        name: a locked row with records opens the page read-only
  - id: E-MON-58
    group: Downgrade & lapse
    title: Former subscriber read *Cloud ended*
    when: own Cloud ended · active book is Cloud through its owner
    then: was *Cloud ended, sync is paused* · fixed 2026-11-01 → *Cloud through {book}*
    status: fixed
    risk: medium
    tests:
      - file: test/features/monetization/data/entitlement_service_test.dart
        name: a former subscriber standing in a Cloud book reads it through the book
  - id: E-MON-59
    group: Paywall & store
    title: Back from the claim lost the paywall
    when: no account · Cloud plan picked · buy → claim intro → back
    then: was Home, pick gone · fixed 2026-11-01 → paywall, pick kept
    status: fixed
    risk: low
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: buying Cloud without an account goes to the claim first
  - id: E-MON-60
    group: Paywall & store
    title: Trial hid when billing starts
    when: yearly with a trial picked
    then: |
      - was: renewal note only · App Review asks for it
      - fixed 2026-11-01: *then €24.99 per year · billing starts when the trial ends*
    status: fixed
    risk: medium
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a trial says when billing starts
  - id: E-MON-61
    group: Paywall & store
    title: Simulated lapse wider than a real one
    when: developer mode · *Simulate an ended subscription* in a shared Cloud book
    then: |
      - features lock · book keeps syncing
      - a real lapse keeps the features there
      - dev tool only · left as is
    status: by-design
    risk: low
  - id: E-MON-62
    group: Store
    title: "*Restore purchases* finds nothing"
    when: paywall › *Restore purchases* · no purchase on the store account
    then: the answer stays 8 s with an *OK* · before 2026-11-06 it vanished after 3 s (AND-23-1) · until 2026-11-11 it never left without a tap
    status: fixed
    risk: low
  - id: E-MON-63
    group: Store
    title: Stale restore answer
    when: "*Restore purchases* finds nothing · a second restore or a purchase follows within 8 s"
    then: |
      - was: *nothing found* stayed next to *Pro restored*, or followed the purchase back to the screen before
      - fixed 2026-11-07: a new restore or purchase clears the last answer
    status: fixed
    risk: low
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a second restore replaces the first answer instead of queueing behind it
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: a purchase after a restore that found nothing leaves that answer behind
  - id: E-MON-64
    group: Paywall & store
    title: Locked export, bought on the paywall
    when: Free · Budget Book ⋮ › *Export* or a page's export icon → buy
    then: |
      - fixed 2026-11-11 · the export sheet opens after the purchase
      - was: back on the page · *Export* had to be tapped again
    status: fixed
    risk: medium
    tests:
      - file: test/shared/export/export_action_test.dart
        name: a menu row goes on to the export sheet after the purchase
  - id: E-MON-65
    group: Downgrades
    title: Plan falls while an editor is open
    when: refund lands · *Customize* Home, *Navigation* or a new position is open
    then: |
      - fixed 2026-11-11 · both editors show the lock · the position form opens the paywall, draft kept
      - was: nothing happened, or a generic error and a lost draft
    status: fixed
    risk: low
    tests:
      - file: test/features/home/ui/pages/home_edit_page_test.dart
        name: a plan that fell while the editor is open shows the lock instead of rows that fail
      - file: test/features/settings/ui/pages/navigation_settings_page_test.dart
        name: a plan that fell while the editor is open shows the lock instead of a save that fails
      - file: test/features/investment/ui/pages/investment_save_page_test.dart
        name: a plan that fell while the form was open keeps the draft and opens the paywall
    related: [E-MON-50]
  - id: E-MON-66
    group: Paywall & store
    title: Paywall at 200 % font
    when: system font above 130 % · paywall, German worst
    then: |
      - fixed 2026-11-11 · the plan overview is one column · a price sits under its option · *Current plan* under the plan name
      - was: *Einkaufsliste/n*, *Einführun/gspreis* broken mid-word · the Free tagline squeezed into a six-line column beside the pill
    status: fixed
    risk: low
    tests:
      - file: test/features/monetization/ui/paywall_page_test.dart
        name: at twice the font size the overview is one column
