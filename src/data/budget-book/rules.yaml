# Source: app BUDGET_BOOK_AI_CONTEXT.md, BUDGET_CALENDAR_AI_CONTEXT.md; web BOOKINGS_WEB §4.11, §4.13.
items:
  - id: R-BB-01
    group: Scope
    title: Filter + period
    text: |
      - **filter**: account, category, member, tag, type, fixed/variable, search
      - **period**: all · year · month · week · day · custom
      - period mode remembered · filter not
    source: BUDGET_BOOK §3
  - id: R-BB-02
    group: Scope
    title: Counts name their scope
    text: |
      - count = matches in this period
      - *Search all time* only when matches exist elsewhere
    source: BUDGET_BOOK §4
    tests:
      - file: test/features/budget_book/ui/modal/booking_count_test.dart
        name: a whole-book count is never shown bare while a period is paged
      - file: test/features/budget_book/ui/modal/booking_count_test.dart
        name: offers no widen action when every match is already on screen
  - id: R-BB-03
    group: Scope
    title: "*Search all time* is temporary"
    text: |
      - tomorrow opens as before
      - *Back to June 2026* · *Reset* · clear last filter → back
    source: BUDGET_BOOK §5
    tests:
      - file: test/features/budget_book/ui/modal/booking_count_test.dart
        name: tapping the widen action switches to all time without persisting it
      - file: test/features/budget_book/ui/widgets/active_filter_bar_test.dart
        name: offers a return chip only while a temporary widen is active
  - id: R-BB-04
    group: Scope
    title: Switching keeps your place
    text: |
      - June → year → June
      - custom range never remembered
    source: BUDGET_BOOK §6, §8
  - id: R-BB-05
    group: Scope
    title: Month starts any day 1–28
    text: |
      - *My month starts on the 25th* moves every month period
      - Budget Book · budgets · analytics · widget · streaks
      - weeks follow start of week
    source: BUDGET_BOOK §6.1
    tests:
      - file: test/features/budget_book/service/budget_book_initial_state_factory_test.dart
        name: 'PeriodMode.week: calculates week based on StartOfWeek preference (Sunday)'
    related: [R-SET-03]
  - id: R-BB-06
    group: Scope
    title: "Search: description or merchant"
    text: booking description + scanned receipt merchant · search page same
    source: BUDGET_BOOK §1
    related: [R-BKG-40]
  - id: R-BB-07
    group: Scope
    title: Parent filter covers subs
    source: BUDGET_BOOK §1
    text: |
      - sub = exact
      - *Transfer* clears the category filter
  - id: R-BB-10
    group: Views
    title: "Summary: categorized money only"
    text: |
      - no transfers (net 0) · no corrections
      - both still in Transactions + balances
    source: BUDGET_BOOK §9 (decided 2026-10-04)
    related: [R-BC-04]
  - id: R-BB-11
    group: Views
    title: Summary card
    text: |
      - donut + ranked categories · grouped or flat
      - tap row → category activity · balance = the one signed figure
    source: BUDGET_BOOK §9
    tests:
      - file: test/features/budget_book/ui/summary/category_summary_tile_test.dart
        name: a sub tap hands the sub summary to onOpen, not its parent
  - id: R-BB-12
    group: Views
    title: "Transactions: newest first"
    source: BUDGET_BOOK §9
    text: |
      - by day · by month for year/all/custom
      - just-edited booking floats to the top of its day
  - id: R-BB-13
    group: Views
    title: "Calendar: net per day"
    text: |
      - green above 0 · salmon below · scaled to the 90th percentile
      - future outlined · today ringed
      - day · week · month · year · all years
      - anchored month = two partial grids
    source: BUDGET_CALENDAR §4, §5
    tests:
      - file: test/features/budget_book/service/calendar_data_generator_test.dart
        name: marks days after today as future
      - file: test/features/budget_book/service/calendar_data_generator_test.dart
        name: steps across a DST boundary without skipping or repeating a day
  - id: R-BB-20
    group: Export
    title: Export what you see
    text: |
      - ⋮ → *Export*: summary (CSV/PDF) · period · all matches
      - **Pro** · Free: lock
      - file = screen · no network needed
    source: BUDGET_BOOK §14
    tests:
      - file: test/features/budget_book/ui/screens/budget_book_tab_test.dart
        name: export on a plan without filtered export wears the lock and opens the paywall
      - file: test/features/budget_book/ui/widgets/budget_book_export_run_test.dart
        name: the all-matches option exports the whole book
  - id: R-BB-30
    group: Category activity
    title: Category activity
    text: |
      - from a summary row or search
      - breakdown/trend + bookings · inherits the tab's filter
      - web: own presets
    source: 02_FEATURES, CATEGORIES_WEB §7
