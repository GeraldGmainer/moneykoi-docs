items:
  - id: E-BB-01
    group: Periods
    title: Weeks across DST
    when: Sunday-start week over the autumn change
    then: steps by calendar day · no gaps (fixed 2026-10-14)
    status: fixed
    risk: high
  - id: E-BB-02
    group: Periods
    title: Anchored month grouping
    when: month starts on the 25th
    then: grouped by the period's start · old key lost bookings
    status: fixed
    risk: high
  - id: E-BB-03
    group: Periods
    title: Midnight with the tab open
    when: today's page open past midnight
    then: moves to the new today · paged-to page stays
    risk: low
    tests:
      - file: test/features/budget_book/bloc/budget_book_bloc_test.dart
        name: moves a page that showed today onto the week holding the new today
  - id: E-BB-08
    group: Periods
    title: Fresh book shows a one-day month
    when: book with no bookings · Month
    then: header *October 2026* · was *Oct 18 – Oct 18* until a period switch (fixed 2026-10-18)
    status: fixed
    risk: medium
    tests:
      - file: test/shared/filtered_bookings/booking_page_data_service_test.dart
        name: month spans the whole current month, not the instant "now"
  - id: E-BB-04
    group: Counts
    title: Counts differ between tabs
    when: Summary ≠ Transactions count
    then: "expected · Summary: no transfers, no corrections"
    status: by-design
    risk: low
  - id: E-BB-05
    group: Export
    title: Export on Free
    when: Free taps ⋮ → *Export*
    then: lock → paywall · used to fail silently (B5)
    status: fixed
    risk: medium
  - id: E-BB-09
    group: Small screens
    title: Empty book on a small phone
    when: no bookings · 360×640 dp phone
    then: |
      - koi shrinks (down to 72 dp), then is dropped · *Add transaction* above the bottom bar
      - was a 12 px overflow stripe (fixed 2026-10-18) · every full-page empty state does the same
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/common/koi_empty_state_test.dart
        name: shrinks the koi on a short screen so the action stays on it
  - id: E-BB-06
    group: Web
    title: Web calendar + list gaps
    when: ledger on the web
    then: |
      - no day/week calendar · outcome total tinted (open)
      - no day grouping: fixed 2026-11-02, the list has day headers with each day's total
    status: known-issue
    risk: low
  - id: E-BB-10
    group: Counts
    title: Opening balance counted as income
    when: account has a starting balance in the period · Summary or calendar
    then: |
      - fixed 2026-11-06 · the opening balance is listed but counted as neither income nor expense · Summary, calendar, filters and analytics agree with the web (D-BKG-6)
      - before: every *Personalize* book with starting balances showed November income 5.350 € instead of 3.200 € (Android emulator round, AND-2-2)
    status: fixed
    risk: high
    tests:
      - file: test/features/booking/domain/booking_test.dart
        name: an opening balance is a level
      - file: test/features/booking_export/ui/booking_export_page_test.dart
        name: an opening balance is listed but counted apart from the bookings
  - id: E-BB-11
    group: Filters
    title: Account filter misses incoming transfers
    when: filter by Savings · a transfer Checking → Savings
    then: app hides it (source account only) · web shows it · app to change (D-BKG-8)
    status: known-issue
    risk: low
  - id: E-BB-07
    group: Web
    title: Web dates west of UTC
    when: browser west of UTC asks for a range
    then: "`toISOString()` shifts a day · only dashboard shows it"
    status: known-issue
    risk: medium
  - id: E-BB-12
    group: Small screens
    title: "*Custom* off the right edge"
    when: Budget Book → period (*October ▾*) or *Filters* → the *View* chips · iPhone SE (375 pt), German
    then: |
      - the chips wrap onto a second line · *Custom* on screen without swiping
      - before 2026-11-03 one row scrolled sideways and *Custom* sat past the edge (iOS round, IOS-5-3)
    status: fixed
    risk: low
    tests:
      - file: test/features/budget_book/ui/modal/facet_filters_test.dart
        name: wraps instead of scrolling, so Custom is on screen at SE width in German
  - id: E-BB-13
    group: Calendar
    title: Light number on a light tint
    when: a day's tint near half strength
    then: ink with the better contrast · ≥ 3.5:1 · amounts larger · IOS-5-5
    status: fixed
    risk: low
    tests:
      - file: test/features/budget_book/ui/calendar/calendar_shading_test.dart
        name: every tint step gets the ink with the better WCAG contrast
  - id: E-BB-14
    group: Calendar
    title: Year page opened at January
    when: period *Year* · data only Aug–Nov
    then: opens scrolled to this month · else the last month with bookings · IOS-5-6
    status: fixed
    risk: low
    tests:
      - file: test/features/budget_book/ui/calendar/calendar_view_test.dart
        name: scrolls past the empty months instead of opening at January
  - id: E-BB-15
    group: Charts
    title: '"30" and "31" collided'
    when: category trend chart · 31-day month
    then: axis *5 … 25 30* · last day only with room · IOS-5-1
    status: fixed
    risk: low
    tests:
      - file: test/shared/ui/chart/trend_bar_chart_labels_test.dart
        name: a 31-day month does not print 31 against 30
  - id: E-BB-16
    group: Export
    title: Export counts disagreed
    when: Budget Book ⋮ *Export* · a period holding starting balances or transfers
    then: the period line and *All matches* count the rows the file writes, starting balances and transfers included · *All matches* shows only when a match lies outside the period · fixed 2026-11-13 (I5-1) · before, *November · 1 row* beside *all time · 3 rows* in a book with one booking
    status: fixed
    risk: low
    related: [R-BB-20]
    tests:
      - file: test/features/budget_book/ui/widgets/budget_book_export_options_test.dart
        name: the period line counts the rows its file holds, opening balances included, as the all-time line does (I5-1)
  - id: E-BB-17
    group: Periods
    title: "Tab switched during the first load"
    when: "Budget Book opens · *Transactions* tapped before the first load lands, or a sync reload overlaps a period tap"
    then: "the chosen tab shows its own rows · fixed 2026-11-16 · before, skeletons or a summary page under the Transactions tab until the next load (bug hunt 34)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/budget_book/bloc/budget_book_bloc_test.dart
        name: "a tab switched while the first load runs ends on that tab with its own data, not the old tab's"
  - id: E-BB-18
    group: Filters
    title: "Filter kept across a book switch"
    when: "Budget Book filtered by an account, category, member or tag · another book opened"
    then: "the filter clears, a widen it made returns to its period · fixed 2026-11-16 · before, the new book looked empty under the old book's chip (bug hunt 35)"
    status: fixed
    risk: medium
    tests:
      - file: test/features/budget_book/bloc/budget_book_bloc_test.dart
        name: "a book switch clears the filter of the book left behind"
