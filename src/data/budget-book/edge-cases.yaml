items:
  - id: E-BB-01
    group: Periods
    title: Weeks across DST
    when: Sunday-start week over the autumn change
    then: steps by calendar day · no gaps (fixed 2026-10-14)
    status: fixed
    risk: high
  - id: E-BB-02
    group: Periods
    title: Anchored month grouping
    when: month starts on the 25th
    then: grouped by the period's start · old key lost bookings
    status: fixed
    risk: high
  - id: E-BB-03
    group: Periods
    title: Midnight with the tab open
    when: today's page open past midnight
    then: moves to the new today · paged-to page stays
    risk: low
    tests:
      - file: test/features/budget_book/bloc/budget_book_bloc_test.dart
        name: moves a page that showed today onto the week holding the new today
  - id: E-BB-08
    group: Periods
    title: Fresh book shows a one-day month
    when: book with no bookings · Month
    then: header *October 2026* · was *Oct 18 – Oct 18* until a period switch (fixed 2026-10-18)
    status: fixed
    risk: medium
    tests:
      - file: test/shared/filtered_bookings/booking_page_data_service_test.dart
        name: month spans the whole current month, not the instant "now"
  - id: E-BB-04
    group: Counts
    title: Counts differ between tabs
    when: Summary ≠ Transactions count
    then: "expected · Summary: no transfers, no corrections"
    status: by-design
    risk: low
  - id: E-BB-05
    group: Export
    title: Export on Free
    when: Free taps ⋮ → *Export*
    then: lock → paywall · used to fail silently (B5)
    status: fixed
    risk: medium
  - id: E-BB-09
    group: Small screens
    title: Empty book on a small phone
    when: no bookings · 360×640 dp phone
    then: |
      - koi shrinks (down to 72 dp), then is dropped · *Add transaction* above the bottom bar
      - was a 12 px overflow stripe (fixed 2026-10-18) · every full-page empty state does the same
    status: fixed
    risk: medium
    tests:
      - file: test/shared/ui/common/koi_empty_state_test.dart
        name: shrinks the koi on a short screen so the action stays on it
  - id: E-BB-06
    group: Web
    title: Web calendar + list gaps
    when: ledger on the web
    then: no day grouping · no day/week calendar · outcome total tinted (open)
    status: known-issue
    risk: low
  - id: E-BB-10
    group: Counts
    title: Opening balance counted as income
    when: account has a starting balance in the period · Summary or calendar
    then: |
      - app adds it to income · analytics doesn't · web lists it, counts neither (D-BKG-6)
      - app to change: the virtual row carries an income category
    status: known-issue
    risk: medium
  - id: E-BB-11
    group: Filters
    title: Account filter misses incoming transfers
    when: filter by Savings · a transfer Checking → Savings
    then: app hides it (source account only) · web shows it · app to change (D-BKG-8)
    status: known-issue
    risk: low
  - id: E-BB-07
    group: Web
    title: Web dates west of UTC
    when: browser west of UTC asks for a range
    then: "`toISOString()` shifts a day · only dashboard shows it"
    status: known-issue
    risk: medium
