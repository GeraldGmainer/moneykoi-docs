items:
  - id: D-DEMO-1
    question: One book or several?
    status: decided
    date: 2026-10-19
    answer: |
      - **several** · Gerald's brief
      - first opens · Home avatar switches
  - id: D-DEMO-2
    question: Investments in the demo?
    status: decided
    date: 2026-10-19
    answer: |
      - **yes** · loading quotes is fine
      - listed assets live · custom ones by hand
  - id: D-DEMO-3
    question: Which features does a demo show?
    status: decided
    date: 2026-10-19
    answer: |
      - every **Pro** + **Cloud** feature without a server
      - no badge on them
  - id: D-DEMO-4
    question: Turn the demo into a real book?
    status: decided
    date: 2026-10-19
    answer: |
      - **no** · leaving deletes it
      - normal setup afterwards
  - id: D-DEMO-5
    question: Where is the demo offered?
    status: decided
    date: 2026-10-19
    answer: |
      - first-run Welcome only
      - never next to a book or an account
  - id: D-DEMO-6
    question: Where does the sample data live?
    status: decided
    date: 2026-10-19
    answer: |
      - on the phone · `assets/demo/*.yaml`
      - YAML · easy to edit · works on old versions without a server
  - id: D-DEMO-7
    question: Regenerate a demo opened weeks later?
    status: decided
    date: 2026-10-20
    answer: |
      - **yes**, on cold start when made ≥ 7 days ago · built
      - in place: same book, settings, PIN · demo edits gone
    related: [E-DEMO-04, R-DEMO-13]
  - id: D-DEMO-8
    question: Mark Pro and Cloud features inside the demo?
    status: decided
    date: 2026-10-20
    answer: |
      - **no**
      - the paywall shows the plans after leaving
  - id: D-DEMO-9
    question: Early in a month the demo opens on an almost empty month — what then?
    status: decided
    date: 2026-11-03
    answer: |
      - **fill the current month** · not: open on the last complete month
      - the generator always puts a salary and typical bookings before today in this month
      - built 2026-11-03 · a generator rule, the YAML files unchanged
      - source: iOS simulator round, IOS-21-1
    related: [R-DEMO-14, E-DEMO-10]
  - id: D-DEMO-10
    question: English demo in the red for half the month?
    status: decided
    date: 2026-11-13
    answer: |
      - **left as it is** · Gerald: not worth worrying about · no change to `demo_en.yaml`, the paycheck stays 2,150 every 2 weeks
      - the English book is paid every 2 weeks · from about the 12th to the 27th one paycheck is in the month · rent and spending outrun it
      - red days out of 120 (Nov, Feb, May, Aug): every 2 weeks 2,150 (today) **41** · 2,400 **37** · 1st + 15th, 2,330 each **12** · monthly 4,660 on the 1st **0**
      - recommended: monthly on the 1st, like the German and Japanese books
      - also: the German book is in the red on the 25th–27th · Markus's salary moves back to the 28th once Lena's of the 25th is in
      - a raise alone (decided first, 2026-11-11) does not do it · asked again
